<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" fill="#1F1E1C" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1px" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" font-size="16px" font-weight="400" text-anchor="start" dominant-baseline="auto" stop-color="#1F1E1C" stop-opacity="1" width="1000" height="500"><!-- From diagram-design by Cathryn Lavery, MIT licence (LICENSE beside this file), recoloured: https://github.com/cathrynlavery/diagram-design/blob/f6db0decea96de66b901331a0f79a8d4b147ebae/skills/diagram-design/assets/example-waterfall.html -->
      <title id="waterfall-title">Cloud budget bridge · FY25 → FY26</title>
      <desc id="waterfall-desc">Waterfall chart bridging the FY25 cloud budget of 240 thousand dollars a month to the FY26 plan of 236, through headcount growth, reserved-instance savings, new ML workloads, and storage tiering — the largest saving.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(31,30,28,0.1)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#E9E6E0"/>
      <rect width="100%" height="100%" fill="url(&quot;#dots&quot;)" opacity="0.55"/>

      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#5C5A55" font-size="7px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="0.98px" text-anchor="middle">CLOUD SPEND · $K / MO</text>

      <!-- Horizontal gridlines (drawn before bars). Domain 0–400, y = 420 − 0.95·v -->
      <line x1="80" y1="325" x2="960" y2="325" stroke="rgba(31,30,28,0.08)" stroke-width="0.8px"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(31,30,28,0.08)" stroke-width="0.8px"/>
      <line x1="80" y1="135" x2="960" y2="135" stroke="rgba(31,30,28,0.08)" stroke-width="0.8px"/>
      <line x1="80" y1="40" x2="960" y2="40" stroke="rgba(31,30,28,0.06)" stroke-width="0.8px"/>

      <!-- Y-axis line and X-axis baseline (the domain floor: totals anchor here) -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(31,30,28,0.25)" stroke-width="1px"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(31,30,28,0.25)" stroke-width="1px"/>

      <!-- Y-axis tick labels -->
      <text x="72" y="329" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end">100</text>
      <text x="72" y="234" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end">200</text>
      <text x="72" y="139" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end">300</text>
      <text x="72" y="44" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end">400</text>

      <!-- ─── CARRIES (drawn before bars; each transports the running total across a gap at its own level) ─── -->
      <line x1="208" y1="192" x2="256" y2="192" stroke="rgba(31,30,28,0.55)" stroke-width="1px" data-carry="240"/>
      <line x1="352" y1="131" x2="400" y2="131" stroke="rgba(31,30,28,0.55)" stroke-width="1px" data-carry="304"/>
      <line x1="496" y1="167" x2="544" y2="167" stroke="rgba(31,30,28,0.55)" stroke-width="1px" data-carry="266"/>
      <line x1="640" y1="146" x2="688" y2="146" stroke="rgba(31,30,28,0.55)" stroke-width="1px" data-carry="288"/>
      <line x1="784" y1="196" x2="832" y2="196" stroke="rgba(31,30,28,0.55)" stroke-width="1px" data-carry="236"/>

      <!-- ─── BARS (width=96, pitch=144). Running total: 240 → 304 → 266 → 288 → 236 → 236 ─── -->
      <!-- FY25 base: total 240, anchored at the floor. y(240)=192, h=228 -->
      <rect x="112" y="192" width="96" height="228" fill="#E9E6E0"/>
      <rect x="112" y="192" width="96" height="228" fill="rgba(31,30,28,0.08)" stroke="#1F1E1C" stroke-width="1px" data-role="total" data-value="240" data-name="FY25 base"/>
      <text x="160" y="184" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">240</text>

      <!-- Headcount: +64 rises 240 → 304. y(304)=131, h=61 -->
      <rect x="256" y="131" width="96" height="61" fill="#E9E6E0"/>
      <rect x="256" y="131" width="96" height="61" fill="rgba(92,90,85,0.15)" stroke="#5C5A55" stroke-width="1px" data-role="delta" data-value="+64" data-name="Headcount"/>
      <text x="304" y="123" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">+64</text>

      <!-- Reserved instances: −38 falls 304 → 266. Hollow = decrease. y=131, h=36 -->
      <rect x="400" y="131" width="96" height="36" fill="#E9E6E0"/>
      <rect x="400" y="131" width="96" height="36" fill="#E9E6E0" stroke="#5C5A55" stroke-width="1px" data-role="delta" data-value="-38" data-name="Reserved inst."/>
      <text x="448" y="179" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">−38</text>

      <!-- ML workloads: +22 rises 266 → 288. y(288)=146, h=21 -->
      <rect x="544" y="146" width="96" height="21" fill="#E9E6E0"/>
      <rect x="544" y="146" width="96" height="21" fill="rgba(92,90,85,0.15)" stroke="#5C5A55" stroke-width="1px" data-role="delta" data-value="+22" data-name="ML workloads"/>
      <text x="592" y="138" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">+22</text>

      <!-- Storage tiering FOCAL: −52 falls 288 → 236 — the largest saving, the story. y=146, h=50 -->
      <rect x="688" y="146" width="96" height="50" fill="#E9E6E0"/>
      <rect x="688" y="146" width="96" height="50" fill="rgba(194,65,12,0.12)" stroke="#C2410C" stroke-width="1px" data-role="delta" data-value="-52" data-name="Storage tiering"/>
      <text x="736" y="208" fill="#1F1E1C" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" font-weight="600">−52</text>

      <!-- FY26 plan: total 236 = 240 + 64 − 38 + 22 − 52, anchored at the floor. y(236)=196, h=224 -->
      <rect x="832" y="196" width="96" height="224" fill="#E9E6E0"/>
      <rect x="832" y="196" width="96" height="224" fill="rgba(31,30,28,0.08)" stroke="#1F1E1C" stroke-width="1px" data-role="total" data-value="236" data-name="FY26 plan"/>
      <text x="880" y="188" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">236</text>

      <!-- X-axis category labels -->
      <text x="160" y="440" fill="#1F1E1C" font-size="11px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">FY25 base</text>
      <text x="304" y="440" fill="#1F1E1C" font-size="11px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Headcount</text>
      <text x="448" y="440" fill="#1F1E1C" font-size="11px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Reserved inst.</text>
      <text x="592" y="440" fill="#1F1E1C" font-size="11px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">ML workloads</text>
      <text x="736" y="440" fill="#1F1E1C" font-size="11px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Storage tiering</text>
      <text x="880" y="440" fill="#1F1E1C" font-size="11px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">FY26 plan</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(31,30,28,0.1)" stroke-width="0.8px"/>
      <text x="40" y="478" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.44px">LEGEND</text>

      <rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(31,30,28,0.08)" stroke="#1F1E1C" stroke-width="1px"/>
      <text x="64" y="497" fill="#5C5A55" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Start / end total</text>

      <rect x="200" y="488" width="16" height="10" rx="2" fill="rgba(92,90,85,0.15)" stroke="#5C5A55" stroke-width="1px"/>
      <text x="224" y="497" fill="#5C5A55" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Cost added</text>

      <rect x="340" y="488" width="16" height="10" rx="2" fill="#E9E6E0" stroke="#5C5A55" stroke-width="1px"/>
      <text x="364" y="497" fill="#5C5A55" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Cost removed</text>

      <rect x="480" y="488" width="16" height="10" rx="2" fill="rgba(194,65,12,0.12)" stroke="#C2410C" stroke-width="1px"/>
      <text x="504" y="497" fill="#5C5A55" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Storage tiering · largest saving</text>
    </svg>