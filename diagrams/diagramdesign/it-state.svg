        <rect x="36" y="44" width="92" height="16" fill="#E9E6E0"/>
        <text x="40" y="56" fill="rgba(31,30,28,0.4)" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="1.12px">COLLECTION</text>
        <rect x="292" y="52" width="360" height="360" rx="8" fill="rgba(31,30,28,0.02)" stroke="rgba(31,30,28,0.1)" stroke-width="0.8px"/>
        <rect x="312" y="44" width="92" height="16" fill="#E9E6E0"/>
        <text x="316" y="56" fill="rgba(31,30,28,0.4)" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="1.12px">PROCESSING</text>
        <rect x="672" y="52" width="272" height="360" rx="8" fill="rgba(31,30,28,0.02)" stroke="rgba(31,30,28,0.1)" stroke-width="0.8px"/>
