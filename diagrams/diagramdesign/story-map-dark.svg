<svg viewBox="0 0 1032 540" xmlns="http://www.w3.org/2000/svg" fill="#E8E6DC" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1px" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" font-size="16px" font-weight="400" text-anchor="start" dominant-baseline="auto" stop-color="#E8E6DC" stop-opacity="1" width="1032" height="540"><!-- From diagram-design by Cathryn Lavery, MIT licence (LICENSE beside this file), recoloured: https://github.com/cathrynlavery/diagram-design/blob/f6db0decea96de66b901331a0f79a8d4b147ebae/skills/diagram-design/assets/example-story-map-dark.html -->
      <title id="story-map-dark-title">Reporting, first release · User story map</title>
      <desc id="story-map-dark-desc">User story map for a reporting tool's first release: four narrative activities from finding data to trusting it, walking-skeleton steps beneath each, and three release slices sliced by an MVP release-cut line, with the row-level-permissions story flagged as the riskiest bet in Release 2.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(232,230,220,0.1)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#1E1D21"/>
      <rect width="100%" height="100%" fill="url(&quot;#dots&quot;)" opacity="0.55"/>

      <!-- Release slice bands (alternating fill) -->
      <rect x="32" y="216" width="968" height="80" fill="rgba(232,230,220,0.02)"/>
      <rect x="32" y="376" width="968" height="80" fill="rgba(232,230,220,0.02)"/>

      <text x="48" y="260" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">MVP</text>
      <text x="48" y="340" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">RELEASE 2</text>
      <text x="48" y="420" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">LATER</text>

      <!-- Column separators: tie each card row to its activity column -->
      <line x1="116" y1="108" x2="116" y2="456" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px" stroke-dasharray="4px, 4px"/>
      <line x1="340" y1="108" x2="340" y2="456" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px" stroke-dasharray="4px, 4px"/>
      <line x1="564" y1="108" x2="564" y2="456" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px" stroke-dasharray="4px, 4px"/>
      <line x1="788" y1="108" x2="788" y2="456" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px" stroke-dasharray="4px, 4px"/>
      <line x1="1012" y1="108" x2="1012" y2="456" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px" stroke-dasharray="4px, 4px"/>

      <!-- Backbone: 4 activities, narrative left-to-right order -->
      <rect x="128" y="40" width="200" height="64" rx="6" fill="rgba(232,230,220,0.05)" stroke="#BAB8AB" stroke-width="1px"/>
      <text x="228" y="68" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Find the data</text>
      <text x="228" y="88" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">ACTIVITY 1</text>

      <rect x="352" y="40" width="200" height="64" rx="6" fill="rgba(232,230,220,0.05)" stroke="#BAB8AB" stroke-width="1px"/>
      <text x="452" y="68" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Build the report</text>
      <text x="452" y="88" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">ACTIVITY 2</text>

      <rect x="576" y="40" width="200" height="64" rx="6" fill="rgba(232,230,220,0.05)" stroke="#BAB8AB" stroke-width="1px"/>
      <text x="676" y="68" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Share it</text>
      <text x="676" y="88" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">ACTIVITY 3</text>

      <rect x="800" y="40" width="200" height="64" rx="6" fill="rgba(232,230,220,0.05)" stroke="#BAB8AB" stroke-width="1px"/>
      <text x="900" y="68" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Trust it</text>
      <text x="900" y="88" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">ACTIVITY 4</text>

      <!-- Walking skeleton: user steps under each activity -->
      <rect x="144" y="120" width="168" height="32" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="0.8px"/>
      <text x="156" y="140" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Search datasets</text>
      <rect x="144" y="160" width="168" height="32" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="0.8px"/>
      <text x="156" y="180" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Preview rows</text>

      <rect x="368" y="120" width="168" height="32" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="0.8px"/>
      <text x="380" y="140" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Pick columns</text>
      <rect x="368" y="160" width="168" height="32" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="0.8px"/>
      <text x="380" y="180" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Add a chart</text>

      <rect x="592" y="120" width="168" height="32" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="0.8px"/>
      <text x="604" y="140" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Send a link</text>

      <rect x="816" y="120" width="168" height="32" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="0.8px"/>
      <text x="828" y="140" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Check freshness</text>

      <!-- MVP row story cards -->
      <rect x="144" y="232" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="156" y="250" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Keyword search</text>
      <text x="156" y="266" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-101 · 3pt</text>

      <rect x="368" y="232" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="380" y="250" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Table + one chart</text>
      <text x="380" y="266" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-102 · 5pt</text>

      <rect x="592" y="232" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="604" y="250" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Public link</text>
      <text x="604" y="266" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-103 · 2pt</text>

      <rect x="816" y="232" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="828" y="250" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Last-updated stamp</text>
      <text x="828" y="266" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-104 · 1pt</text>

      <!-- Release cut line — accent element 1 -->
      <line x1="32" y1="296" x2="1000" y2="296" stroke="#F08C4A" stroke-width="1.5px"/>
      <rect x="736" y="280" width="104" height="8" rx="2" fill="#1E1D21"/>
      <text x="788" y="285" fill="#F08C4A" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.8px">RELEASE CUT</text>

      <!-- Release 2 row story cards -->
      <rect x="144" y="312" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="156" y="330" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Saved filters</text>
      <text x="156" y="346" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-110 · 3pt</text>

      <rect x="592" y="312" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="604" y="330" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Scheduled email</text>
      <text x="604" y="346" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-112 · 5pt</text>

      <!-- Riskiest story — accent element 2 -->
      <rect x="816" y="312" width="168" height="48" rx="4" fill="rgba(240,140,74,0.1)" stroke="#F08C4A" stroke-width="1px" stroke-dasharray="4px, 4px"/>
      <text x="828" y="330" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Row-level permissions</text>
      <text x="828" y="346" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-114 · 3pt</text>
      <rect x="936" y="336" width="40" height="12" rx="2" fill="none" stroke="#F08C4A" stroke-width="0.8px"/>
      <text x="956" y="345" fill="#F08C4A" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.64px">RISK</text>

      <!-- Later row story cards -->
      <rect x="144" y="392" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="156" y="410" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Natural-language query</text>
      <text x="156" y="426" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-120 · 8pt</text>

      <rect x="816" y="392" width="168" height="48" rx="4" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="828" y="410" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Alerting on anomalies</text>
      <text x="828" y="426" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">RPT-121 · 5pt</text>

      <!-- Legend -->
      <line x1="32" y1="480" x2="1000" y2="480" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>
      <text x="32" y="496" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.44px">LEGEND</text>

      <rect x="32" y="508" width="16" height="8" fill="#1E2A4A" stroke="#E8E6DC" stroke-width="1px"/>
      <text x="56" y="516" fill="#BAB8AB" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Story card</text>

      <rect x="232" y="508" width="16" height="8" fill="rgba(240,140,74,0.1)" stroke="#F08C4A" stroke-width="1px" stroke-dasharray="4px, 4px"/>
      <text x="256" y="516" fill="#BAB8AB" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Highest risk</text>

      <line x1="432" y1="512" x2="464" y2="512" stroke="#F08C4A" stroke-width="1.5px"/>
      <text x="480" y="516" fill="#BAB8AB" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Release cut</text>
    </svg>