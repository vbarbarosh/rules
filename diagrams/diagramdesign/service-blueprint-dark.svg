<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" fill="#E8E6DC" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1px" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" font-size="16px" font-weight="400" text-anchor="start" dominant-baseline="auto" stop-color="#E8E6DC" stop-opacity="1" width="1280" height="720"><!-- From diagram-design by Cathryn Lavery, MIT licence (LICENSE beside this file), recoloured: https://github.com/cathrynlavery/diagram-design/blob/f6db0decea96de66b901331a0f79a8d4b147ebae/skills/diagram-design/assets/example-service-blueprint-dark.html -->
      <title id="service-blueprint-dark-title">Trial to paid — what the customer never sees</title>
      <desc id="service-blueprint-dark-desc">Service blueprint of a trial-to-paid path across five stages, with customer and frontstage actions above a line of visibility and a focal backstage dunning-job timeout under Hit the limit.</desc>
