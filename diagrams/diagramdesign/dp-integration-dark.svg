<svg viewBox="0 0 1200 664" xmlns="http://www.w3.org/2000/svg" fill="#E8E6DC" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1px" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" font-size="16px" font-weight="400" text-anchor="start" dominant-baseline="auto" stop-color="#E8E6DC" stop-opacity="1" width="1200" height="664"><!-- From diagram-design by Cathryn Lavery, MIT licence (LICENSE beside this file), recoloured: https://github.com/cathrynlavery/diagram-design/blob/f6db0decea96de66b901331a0f79a8d4b147ebae/skills/diagram-design/assets/example-dp-integration-dark.html -->
      <title id="dp-integration-dark-title">Generic data platform integration topology</title>
      <desc id="dp-integration-dark-desc">Integration topology showing CRM, POS exports, and an event stream landing in object storage for query, notebooks, dashboards, and a partner API.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(232,230,220,0.1)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#BAB8AB"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F08C4A"/></marker>
        <marker id="arrow-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F08C4A"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6E9BF5"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0,6 2.5,0 5" fill="#BAB8AB"/></marker>
        <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#A9A79B"/></marker>
        <g id="ico-db" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><ellipse cx="0" cy="-5" rx="7" ry="3"/><path d="M-7-5V5c0 2 14 2 14 0V-5M-7 0c0 2 14 2 14 0"/></g>
        <g id="ico-file" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><path d="M-6-8H2l4 4V8H-6ZM2-8v4h4"/></g>
        <g id="ico-stream" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><path d="M-8-5H2M-4 0H8M-8 5H2"/><path d="m0-8 3 3-3 3M6-3l3 3-3 3M0 2l3 3-3 3"/></g>
        <g id="ico-chart" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><path d="M-8 8H8M-6 6V0H-2V6M0 6V-7H4V6M6 6V-3H9"/></g>
        <g id="ico-notebook" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><rect x="-7" y="-8" width="14" height="16" rx="2"/><path d="M-3-8V8M0-3h4M0 1h4"/></g>
        <g id="ico-api" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><path d="M-3-8c-3 0-3 2-3 4v2c0 2-1 2-3 2 2 0 3 0 3 2v2c0 2 0 4 3 4M3-8c3 0 3 2 3 4v2c0 2 1 2 3 2-2 0-3 0-3 2v2c0 2 0 4-3 4"/></g>
        <g id="ico-key" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><circle cx="-4" cy="0" r="4"/><path d="M0 0H9M6 0v3M3 0v2"/></g>
        <g id="ico-log" fill="none" stroke="#E8E6DC" stroke-width="1.2px"><path d="M-8 6h16M-6 3l3-4 3 2 4-7 3 2"/></g>
      </defs>
      <rect width="1200" height="664" fill="#1E1D21"/><rect width="1200" height="664" fill="url(&quot;#dots&quot;)" opacity="0.55"/>
      <rect x="260" y="72" width="696" height="336" rx="8" stroke-width="1px" fill="rgba(232,230,220,0.024)" stroke="rgba(232,230,220,0.32)"/>
      <!-- Connectors are emitted before all node rectangles. -->
      <path d="M200 124 H360 Q368 124 368 132 V180 Q368 188 376 188 H400" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <line x1="200" y1="212" x2="400" y2="212" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <path d="M200 300 H360 Q368 300 368 292 V244 Q368 236 376 236 H400" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <line x1="560" y1="212" x2="656" y2="212" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <path d="M816 188 H960 Q968 188 968 180 V132 Q968 124 976 124 H1000" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <line x1="816" y1="212" x2="1000" y2="212" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <path d="M816 236 H960 Q968 236 968 244 V292 Q968 300 976 300 H1000" marker-end="url(#arrow-focal)" fill="none" stroke="#F08C4A" stroke-width="1.4px"/>
      <line x1="480" y1="160" x2="480" y2="176" marker-end="url(#arrow)" fill="none" stroke="#BAB8AB" stroke-dasharray="4px, 3px"/><line x1="736" y1="160" x2="736" y2="176" marker-end="url(#arrow)" fill="none" stroke="#BAB8AB" stroke-dasharray="4px, 3px"/>
      <line x1="592" y1="460" x2="592" y2="408" marker-end="url(#arrow-accent)" fill="none" stroke="#F08C4A" stroke-width="1.2px" stroke-dasharray="5px, 4px"/>
      <!-- Dashed transit crosses the identity footer without treating it as an endpoint. -->
      <line x1="624" y1="524" x2="624" y2="408" marker-end="url(#arrow-accent)" fill="none" stroke="#F08C4A" stroke-width="1.2px" stroke-dasharray="5px, 4px"/>
      <!-- Protocol labels retain an 8px gap from their connector segment. -->
      <g text-anchor="middle"><rect x="252" y="104" width="44" height="12" rx="2" fill="#1E1D21"/><text x="274" y="113" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">REST</text><rect x="272" y="192" width="48" height="12" rx="2" fill="#1E1D21"/><text x="296" y="201" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">CSV</text><rect x="248" y="280" width="56" height="12" rx="2" fill="#1E1D21"/><text x="276" y="289" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">EVENTS</text><rect x="584" y="192" width="48" height="12" rx="2" fill="#1E1D21"/><text x="608" y="201" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">READ</text><rect x="856" y="168" width="48" height="12" rx="2" fill="#1E1D21"/><text x="880" y="177" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">JDBC</text><rect x="872" y="192" width="56" height="12" rx="2" fill="#1E1D21"/><text x="900" y="201" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">KERNEL</text><rect x="856" y="216" width="56" height="12" rx="2" fill="#1E1D21"/><text x="884" y="225" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">HTTPS</text></g>
      <g><rect x="548" y="420" width="32" height="12" rx="2" fill="#1E1D21"/><text x="564" y="429" text-anchor="middle" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">AUTH</text><rect x="636" y="420" width="32" height="12" rx="2" fill="#1E1D21"/><text x="652" y="429" text-anchor="middle" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" letter-spacing="0.48px">AUTH</text></g>
      <!-- Zone label -->
      <rect x="548" y="68" width="120" height="16" rx="2" fill="#1E1D21"/><text x="608" y="79" text-anchor="middle" fill="#A9A79B" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" font-weight="500" letter-spacing="1.44px">DATA PLATFORM</text>
      <!-- Sources -->
      <g text-anchor="middle">
        <g><rect x="40" y="92" width="160" height="64" rx="6" fill="#1E1D21"/><rect x="40" y="92" width="160" height="64" rx="6" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><use href="#ico-db" transform="translate(64 124)"/><text x="120" y="120" fill="#E8E6DC" font-size="12px" font-weight="600">CRM</text><text x="120" y="140" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">customer records</text></g>
        <g><rect x="40" y="180" width="160" height="64" rx="6" fill="#1E1D21"/><rect x="40" y="180" width="160" height="64" rx="6" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><use href="#ico-file" transform="translate(64 212)"/><text x="120" y="208" fill="#E8E6DC" font-size="12px" font-weight="600">POS exports</text><text x="120" y="228" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">daily CSV batches</text></g>
        <g><rect x="40" y="268" width="160" height="64" rx="6" fill="#1E1D21"/><rect x="40" y="268" width="160" height="64" rx="6" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><use href="#ico-stream" transform="translate(64 300)"/><text x="120" y="296" fill="#E8E6DC" font-size="12px" font-weight="600">Event stream</text><text x="120" y="316" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">near-real-time events</text></g>
      </g>
      <!-- Core: fixed 160px nodes keep clean connector corridors; centers remain evenly spaced. -->
      <g text-anchor="middle"><rect x="276" y="116" width="664" height="44" rx="6" fill="#1E1D21"/><rect x="276" y="116" width="664" height="44" rx="6" fill="rgba(232,230,220,0.05)" stroke="rgba(232,230,220,0.32)"/><rect x="288" y="128" width="32" height="12" rx="2" fill="none" stroke="#A9A79B" stroke-opacity="0.5"/><text x="304" y="137" fill="#A9A79B" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="7px" font-weight="500" letter-spacing="0.56px">DAG</text><text x="608" y="136" fill="#E8E6DC" font-size="12px" font-weight="600">Orchestrator</text><text x="608" y="151" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">schedules · retries · lineage</text>
        <rect x="400" y="176" width="160" height="72" rx="6" fill="#1E1D21"/><rect x="400" y="176" width="160" height="72" rx="6" fill="rgba(240,140,74,0.08)" stroke="#F08C4A"/><rect x="408" y="184" width="44" height="12" rx="2" fill="none" stroke="#F08C4A" stroke-opacity="0.5"/><text x="430" y="193" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="7px" font-weight="500" letter-spacing="0.56px">STORE</text><text x="480" y="214" fill="#E8E6DC" font-size="12px" font-weight="600">Object storage</text><text x="480" y="232" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">versioned data objects</text>
        <rect x="656" y="176" width="160" height="72" rx="6" fill="#1E1D21"/><rect x="656" y="176" width="160" height="72" rx="6" fill="rgba(240,140,74,0.08)" stroke="#F08C4A"/><rect x="664" y="184" width="32" height="12" rx="2" fill="none" stroke="#F08C4A" stroke-opacity="0.5"/><text x="680" y="193" fill="#F08C4A" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="7px" font-weight="500" letter-spacing="0.56px">SQL</text><text x="736" y="214" fill="#E8E6DC" font-size="12px" font-weight="600">Query engine</text><text x="736" y="232" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">federated SQL access</text></g>
      <!-- Consumers -->
      <g text-anchor="middle">
        <g><rect x="1000" y="92" width="160" height="64" rx="6" fill="#1E1D21"/><rect x="1000" y="92" width="160" height="64" rx="6" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><use href="#ico-chart" transform="translate(1024 124)"/><text x="1080" y="120" fill="#E8E6DC" font-size="12px" font-weight="600">BI tool</text><text x="1080" y="140" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">dashboards · reports</text></g>
        <g><rect x="1000" y="180" width="160" height="64" rx="6" fill="#1E1D21"/><rect x="1000" y="180" width="160" height="64" rx="6" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><use href="#ico-notebook" transform="translate(1024 212)"/><text x="1080" y="208" fill="#E8E6DC" font-size="12px" font-weight="600">Notebooks</text><text x="1080" y="228" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">Python · exploration</text></g>
        <g><rect x="1000" y="268" width="160" height="64" rx="6" fill="#1E1D21"/><rect x="1000" y="268" width="160" height="64" rx="6" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><use href="#ico-api" transform="translate(1024 300)"/><text x="1080" y="296" fill="#E8E6DC" font-size="12px" font-weight="600">Partner API</text><text x="1080" y="316" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">scoped data products</text></g>
      </g>
      <!-- Layer-wide footer services -->
      <g><rect x="40" y="460" width="1120" height="56" rx="6" fill="#1E1D21"/><rect x="40" y="460" width="1120" height="56" rx="6" fill="rgba(240,106,98,0.06)" stroke="rgba(240,106,98,0.35)"/><use href="#ico-key" transform="translate(72 488)"/><text x="96" y="486" fill="#F06A62" font-size="12px" font-weight="600">Identity provider</text><text x="96" y="502" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">SSO · service identities · policy groups</text>
        <rect x="40" y="524" width="1120" height="56" rx="6" fill="#1E1D21"/><rect x="40" y="524" width="1120" height="56" rx="6" fill="rgba(110,155,245,0.06)" stroke="rgba(110,155,245,0.35)"/><use href="#ico-log" transform="translate(72 552)"/><text x="96" y="550" fill="#6E9BF5" font-size="12px" font-weight="600">Centralized logging</text><text x="96" y="566" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="9px">platform events · audit trail · retention</text></g>
      <!-- Legend -->
      <line x1="40" y1="608" x2="1160" y2="608" stroke="rgba(232,230,220,0.12)" stroke-width="0.8px"/><text x="40" y="628" fill="#BAB8AB" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" font-size="8px" font-weight="500" letter-spacing="1.12px">TYPE KEY</text><rect x="128" y="620" width="16" height="12" rx="2" fill="rgba(186,184,171,0.06)" stroke="#A9A79B"/><text x="152" y="630" fill="#BAB8AB" font-size="8px">Source / consumer</text><rect x="296" y="620" width="16" height="12" rx="2" fill="rgba(240,140,74,0.08)" stroke="#F08C4A"/><text x="320" y="630" fill="#BAB8AB" font-size="8px">Focal platform surface</text><rect x="492" y="620" width="16" height="12" rx="2" fill="rgba(232,230,220,0.05)" stroke="rgba(232,230,220,0.32)"/><text x="516" y="630" fill="#BAB8AB" font-size="8px">Orchestration</text><line x1="640" y1="626" x2="672" y2="626" stroke="#F08C4A" stroke-width="1.4px" marker-end="url(#arrow-accent)"/><text x="684" y="630" fill="#BAB8AB" font-size="8px">Primary data path</text><line x1="824" y1="626" x2="856" y2="626" stroke="#F08C4A" stroke-dasharray="5px, 4px" marker-end="url(#arrow-accent)"/><text x="868" y="630" fill="#BAB8AB" font-size="8px">Layer-wide service</text>
    </svg>