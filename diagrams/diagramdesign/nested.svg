<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" fill="#1F1E1C" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1px" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" font-size="16px" font-weight="400" text-anchor="start" dominant-baseline="auto" stop-color="#1F1E1C" stop-opacity="1" width="1000" height="500"><!-- From diagram-design by Cathryn Lavery, MIT licence (LICENSE beside this file), recoloured: https://github.com/cathrynlavery/diagram-design/blob/f6db0decea96de66b901331a0f79a8d4b147ebae/skills/diagram-design/assets/example-nested.html -->
      <title id="nested-title">The Project Guidance Hierarchy</title>
      <desc id="nested-desc">Nested diagram showing how project guidance inherits broader scopes from the global, vault, business, and marketing levels.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(31,30,28,0.1)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#E9E6E0"/>
        <rect width="100%" height="100%" fill="url(&quot;#dots&quot;)" opacity="0.55"/>

        <!-- Level 1: ~/.claude/ (global) — outermost -->
        <rect x="40" y="60" width="920" height="380" rx="8" fill="rgba(31,30,28,0.016)" stroke="rgba(31,30,28,0.3)" stroke-width="1px"/>
        <!-- Level 2: ~/vault/ -->
        <rect x="72" y="96" width="856" height="308" rx="8" fill="rgba(31,30,28,0.02)" stroke="rgba(31,30,28,0.35)" stroke-width="1px"/>
        <!-- Level 3: /business -->
        <rect x="104" y="132" width="792" height="236" rx="8" fill="rgba(31,30,28,0.024)" stroke="rgba(31,30,28,0.45)" stroke-width="1px"/>
        <!-- Level 4: /marketing -->
        <rect x="136" y="168" width="728" height="164" rx="8" fill="rgba(31,30,28,0.03)" stroke="#5C5A55" stroke-width="1px"/>
        <!-- Level 5: /project — innermost, coral focal -->
        <rect x="168" y="204" width="664" height="92" rx="8" fill="rgba(194,65,12,0.06)" stroke="#C2410C" stroke-width="1px"/>

        <!-- Level labels on paper-colored masks -->
        <rect x="56" y="52" width="188" height="16" fill="#E9E6E0"/>
        <text x="64" y="64" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">~/.claude/ (global)</text>

        <rect x="88" y="88" width="148" height="16" fill="#E9E6E0"/>
        <text x="96" y="100" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">~/vault/ (notes)</text>

        <rect x="120" y="124" width="96" height="16" fill="#E9E6E0"/>
        <text x="128" y="136" fill="#5C5A55" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">/business</text>

        <rect x="152" y="160" width="108" height="16" fill="#E9E6E0"/>
        <text x="160" y="172" fill="#1F1E1C" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px">/marketing</text>

        <rect x="184" y="196" width="88" height="16" fill="#E9E6E0"/>
        <text x="192" y="208" fill="#C2410C" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.12px" font-weight="600">/project</text>

        <!-- File-icon glyphs (simple rect with folded corner) inside each level -->
        <!-- Glyph in level 1 (bottom-right area of outer ring) -->
        <g transform="translate(908, 408)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#E9E6E0" stroke="rgba(31,30,28,0.35)" stroke-width="1px"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(31,30,28,0.35)" stroke-width="1px"/>
        </g>
        <!-- Glyph in level 2 ring -->
        <g transform="translate(876, 372)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#E9E6E0" stroke="rgba(31,30,28,0.4)" stroke-width="1px"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(31,30,28,0.4)" stroke-width="1px"/>
        </g>
        <!-- Glyph in level 3 ring -->
        <g transform="translate(844, 336)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#E9E6E0" stroke="rgba(31,30,28,0.5)" stroke-width="1px"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(31,30,28,0.5)" stroke-width="1px"/>
        </g>
        <!-- Glyph in level 4 ring -->
        <g transform="translate(812, 300)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#E9E6E0" stroke="#5C5A55" stroke-width="1px"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="#5C5A55" stroke-width="1px"/>
        </g>

        <!-- Innermost label — human readable -->
        <text x="500" y="248" fill="#1F1E1C" font-size="16px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">PROJECT GUIDANCE</text>
        <text x="500" y="272" fill="#5C5A55" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.72px">inherits every level above</text>

        <!-- Annotation top-right: italic callout with curved arrow -->
        <text x="904" y="36" fill="#1F1E1C" font-size="14px" font-style="italic" font-family="Noto Serif, Georgia, serif" text-anchor="end">no imports, no configuration</text>
        <path d="M 820 44 Q 700 84 520 216" fill="none" stroke="rgba(31,30,28,0.4)" stroke-width="1px" stroke-dasharray="4px, 3px"/>
        <circle cx="520" cy="216" r="2" fill="#1F1E1C"/>

        <!-- Annotation bottom-left: italic callout -->
        <text x="40" y="484" fill="#5C5A55" font-size="14px" font-style="italic" font-family="Noto Serif, Georgia, serif">structure IS the index</text>
      </svg>