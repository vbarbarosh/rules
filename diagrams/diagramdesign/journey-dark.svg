<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" fill="#E8E6DC" fill-opacity="1" fill-rule="nonzero" stroke="none" stroke-width="1px" stroke-opacity="1" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" font-size="16px" font-weight="400" text-anchor="start" dominant-baseline="auto" stop-color="#E8E6DC" stop-opacity="1" width="1200" height="520"><!-- From diagram-design by Cathryn Lavery, MIT licence (LICENSE beside this file), recoloured: https://github.com/cathrynlavery/diagram-design/blob/f6db0decea96de66b901331a0f79a8d4b147ebae/skills/diagram-design/assets/example-journey-dark.html -->
      <title id="journey-dark-title">Trial to paid: the first week</title>
      <desc id="journey-dark-desc">User journey map of a new trial user across five stages, showing actions, touchpoints, and a sentiment curve that dips at the usage-limit stage before recovering at upgrade.</desc>

      <rect width="100%" height="100%" fill="#1E1D21"/>

      <!-- Stage headers -->
      <text x="164" y="40" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">STAGE 1</text>
      <text x="164" y="60" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Sign up</text>

      <text x="388" y="40" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">STAGE 2</text>
      <text x="388" y="60" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">First run</text>

      <text x="612" y="40" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">STAGE 3</text>
      <text x="612" y="60" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Invite team</text>

      <text x="836" y="40" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">STAGE 4</text>
      <text x="836" y="60" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Hit the limit</text>

      <text x="1060" y="40" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1.12px">STAGE 5</text>
      <text x="1060" y="60" fill="#E8E6DC" font-size="12px" font-weight="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Upgrade</text>

      <!-- Sentiment band: reference hairlines -->
      <line x1="64" y1="100" x2="1160" y2="100" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>
      <line x1="64" y1="180" x2="1160" y2="180" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>
      <line x1="64" y1="260" x2="1160" y2="260" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>
      <text x="56" y="104" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end" letter-spacing="0.8px">HIGH</text>
      <text x="56" y="184" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end" letter-spacing="0.8px">NEUTRAL</text>
      <text x="56" y="264" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end" letter-spacing="0.8px">LOW</text>

      <!-- Sentiment curve (data curve — not a connector, §6 rule 1 exempt) -->
      <polyline points="164,100 388,180 612,100" fill="none" stroke="#BAB8AB" stroke-width="1.5px" stroke-linejoin="round"/>
      <polyline points="612,100 836,260" fill="none" stroke="#F08C4A" stroke-width="1.5px" stroke-linejoin="round"/>
      <polyline points="836,260 1060,180" fill="none" stroke="#BAB8AB" stroke-width="1.5px" stroke-linejoin="round"/>

      <circle cx="164" cy="100" r="5" fill="#BAB8AB"/>
      <circle cx="388" cy="180" r="5" fill="#BAB8AB"/>
      <circle cx="612" cy="100" r="5" fill="#BAB8AB"/>
      <circle cx="836" cy="260" r="5" fill="#F08C4A"/>
      <circle cx="1060" cy="180" r="5" fill="#BAB8AB"/>

      <!-- Row separators (full plot width) -->
      <line x1="64" y1="280" x2="1160" y2="280" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>
      <line x1="64" y1="376" x2="1160" y2="376" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>

      <!-- Row labels -->
      <text x="56" y="328" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end" letter-spacing="1.12px">ACTIONS</text>
      <text x="72" y="408" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="end" letter-spacing="1.12px">TOUCHPOINTS</text>

      <!-- Actions -->
      <text x="164" y="300" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Create workspace</text>
      <text x="388" y="300" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Import first dataset</text>
      <text x="612" y="300" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Add 3 teammates</text>
      <text x="836" y="300" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Export blocked mid-report</text>
      <text x="1060" y="300" fill="#E8E6DC" font-size="12px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif" text-anchor="middle">Pick annual plan</text>

      <!-- Pain markers (Hit the limit only) -->
      <rect x="744" y="312" width="184" height="16" rx="2" fill="rgba(240,140,74,0.1)" stroke="rgba(240,140,74,0.5)" stroke-width="0.8px" stroke-dasharray="3px, 3px"/>
      <text x="836" y="324" fill="#F08C4A" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.32px">NO WARNING AT 80%</text>

      <rect x="744" y="332" width="184" height="16" rx="2" fill="rgba(240,140,74,0.1)" stroke="rgba(240,140,74,0.5)" stroke-width="0.8px" stroke-dasharray="3px, 3px"/>
      <text x="836" y="344" fill="#F08C4A" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.16px">PRICING PAGE IS 3 CLICKS AWAY</text>

      <!-- Touchpoints -->
      <text x="164" y="412" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">signup form</text>
      <text x="388" y="412" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">onboarding wizard</text>
      <text x="612" y="412" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">email invite</text>
      <text x="836" y="412" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">in-app modal</text>
      <text x="1060" y="412" fill="#BAB8AB" font-size="9px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" text-anchor="middle">billing page</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="1160" y2="464" stroke="rgba(232,230,220,0.1)" stroke-width="0.8px"/>
      <text x="40" y="480" fill="#BAB8AB" font-size="8px" font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace" letter-spacing="1.44px">LEGEND</text>

      <line x1="40" y1="496" x2="56" y2="496" stroke="#BAB8AB" stroke-width="1.5px"/>
      <circle cx="48" cy="496" r="3" fill="#BAB8AB"/>
      <text x="64" y="500" fill="#BAB8AB" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Sentiment curve</text>

      <line x1="220" y1="496" x2="236" y2="496" stroke="#F08C4A" stroke-width="1.5px"/>
      <circle cx="228" cy="496" r="3" fill="#F08C4A"/>
      <text x="244" y="500" fill="#BAB8AB" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Trough stage</text>

      <rect x="384" y="492" width="16" height="8" rx="2" fill="rgba(240,140,74,0.1)" stroke="rgba(240,140,74,0.5)" stroke-width="0.8px" stroke-dasharray="3px, 3px"/>
      <text x="408" y="500" fill="#BAB8AB" font-size="8.5px" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">Pain marker</text>
    </svg>