<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll anchoring</title>
<style>
:root {
    --bg: #f3f0e8;
    --paper: #fffdf7;
    --ink: #172019;
    --muted: #687168;
    --line: #c9cec4;
    --card: #eeebe2;
    --summary: #e4e9ff;
    --mark: #e5484d;
    --accent: #3d62ff;
}

:root[data-theme="dark"] {
    --bg: #0f1713;
    --paper: #14201a;
    --ink: #f4f6ed;
    --muted: #91a196;
    --line: #2c3c33;
    --card: #1e2d25;
    --summary: #1f2a4d;
    --mark: #ff6b6b;
    --accent: #82a0ff;
}

* { box-sizing: border-box; }

html,
body { margin: 0; }

body {
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
}

.head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.title { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; }

.spacer { flex: 1; }

button {
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
}

.theme { display: flex; }

.theme-icon { display: block; width: 24px; height: 24px; flex: none; }

.theme-icon.theme-dark { display: none; }

:root[data-theme="dark"] .theme-icon.theme-light { display: none; }

:root[data-theme="dark"] .theme-icon.theme-dark { display: block; }

.panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}

.pane-title { margin-bottom: 8px; font-size: 16px; font-weight: 800; }

.pane-note { font-weight: 400; color: var(--muted); }

.frame { position: relative; }

.scroller {
    height: 420px;
    overflow-y: auto;
    border: 2px solid var(--ink);
    background: var(--paper);
}

.line {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 0;
    border-top: 2px dashed var(--mark);
    pointer-events: none;
}

.feed { display: flex; flex-direction: column; gap: 10px; padding: 12px; }

.summary {
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--summary);
    font-size: 14px;
    line-height: 1.5;
}

.message {
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--card);
    font-size: 14px;
    line-height: 1.5;
}

.message b { display: block; margin-bottom: 2px; }

.message.is-new { outline: 2px solid var(--accent); }
</style>
<script>
document.documentElement.dataset.theme = theme_read();

function theme_read()
{
    try {
        const out = localStorage.getItem('theme');
        if (out === 'light' || out === 'dark') {
            return out;
        }
    }
    catch (error) {
        console.warn(error);
    }
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
</script>
</head>
<body>
<div class="head">
    <div class="title">Content changes above, the reading line stays</div>
    <div class="spacer"></div>
    <button id="add" type="button">Add above</button>
    <button id="grow" type="button">Grow the summary</button>
    <button id="rerender" type="button">Grow by a re-render</button>
    <div class="theme">
        <button type="button" aria-label="Light theme. Switch to dark theme."><!-- theme-icons --><!-- Docusaurus icons: MIT, Copyright Facebook, Inc. and its affiliates. See img/theme-icons.LICENSE. --><svg class="theme-icon theme-light" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12,9c1.65,0,3,1.35,3,3s-1.35,3-3,3s-3-1.35-3-3S10.35,9,12,9 M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5 S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1 s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1C11.45,19,11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0 c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95 c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41 L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41 s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06 c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"/></svg><svg class="theme-icon theme-dark" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M9.37,5.51C9.19,6.15,9.1,6.82,9.1,7.5c0,4.08,3.32,7.4,7.4,7.4c0.68,0,1.35-0.09,1.99-0.27C17.45,17.19,14.93,19,12,19 c-3.86,0-7-3.14-7-7C5,9.07,6.81,6.55,9.37,5.51z M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36 c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z"/></svg><!-- /theme-icons --></button>
    </div>
</div>
<div class="panes">
    <div>
        <div class="pane-title">Browser only <span class="pane-note">overflow-anchor: auto</span></div>
        <div class="frame">
            <div class="scroller" id="plain"><div class="feed"></div></div>
            <div class="line"></div>
        </div>
    </div>
    <div>
        <div class="pane-title">Kept in place <span class="pane-note">scroll_keep()</span></div>
        <div class="frame">
            <div class="scroller" id="kept"><div class="feed"></div></div>
            <div class="line"></div>
        </div>
    </div>
</div>
<script>
const SUMMARY_SHORT = 'Summing up…';
const SUMMARY_LONG = 'Author asked how the work is going. The agent says everything sent since 14:32 is built, and the full test run is on now. Done: Settings, AI spending, Incidents, Goal and Plans now match their frames. The message box keeps Voice, Screen recording, Files and Template. The broken layouts are fixed, with a narrow-window test that fails on the old layout.';

const state = {summary: SUMMARY_SHORT, messages: []};
for (let i = 1; i <= 24; ++i) {
    state.messages.push({uid: `m${i}`, title: `Message ${i}`, text: 'Everything you sent is built; the full test run is on now, about four minutes. A reply to each message follows once it passes.', is_new: false});
}

const scroller_plain = document.getElementById('plain');
const scroller_kept = document.getElementById('kept');
const keep = scroll_keep(scroller_kept);

render(scroller_plain);
render(scroller_kept);
scroller_plain.scrollTop = 120;
scroller_kept.scrollTop = 120;

document.getElementById('add').addEventListener('click', function () {
    const n = state.messages.length + 1;
    const message = {uid: `m${n}`, title: `Message ${n}, new`, text: 'Added above while you read.', is_new: true};
    state.messages.unshift(message);
    update(function (scroller) {
        const summary = scroller.querySelector('[data-uid="summary"]');
        summary.after(message_render(message));
    });
});
document.getElementById('grow').addEventListener('click', function () {
    state.summary = (state.summary === SUMMARY_SHORT) ? SUMMARY_LONG : SUMMARY_SHORT;
    update(function (scroller) {
        scroller.querySelector('[data-uid="summary"]').textContent = state.summary;
    });
});
document.getElementById('rerender').addEventListener('click', function () {
    state.summary = (state.summary === SUMMARY_SHORT) ? SUMMARY_LONG : SUMMARY_SHORT;
    update(render);
});
for (const button of document.querySelectorAll('.theme button')) {
    button.addEventListener('click', function () {
        theme_write(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
}
theme_buttons_refresh();

// Applies one change to both feeds; only the right one is kept in place.
function update(change)
{
    change(scroller_plain);
    keep(function () {
        change(scroller_kept);
    });
}

// Builds the feed from scratch, as a template engine re-rendering a list does.
function render(scroller)
{
    const feed = scroller.querySelector('.feed');
    feed.replaceChildren();
    const summary = document.createElement('div');
    summary.className = 'summary';
    summary.dataset.uid = 'summary';
    summary.textContent = state.summary;
    feed.append(summary);
    for (const message of state.messages) {
        feed.append(message_render(message));
    }
}

function message_render(message)
{
    const out = document.createElement('div');
    out.className = message.is_new ? 'message is-new' : 'message';
    out.dataset.uid = message.uid;
    const b = document.createElement('b');
    b.textContent = message.title;
    out.append(b, message.text);
    return out;
}

// Returns keep(update): runs update() and moves the scroll position so
// the element on the middle line of the scroller stays where it was.
// update() may be async: with Vue it ends with `await this.$nextTick()`.
function scroll_keep(scroller)
{
    return async function (update) {
        const anchor0 = scroll_anchor_find(scroller);
        await update();
        if (!anchor0) {
            return;
        }
        const anchor = scroller.querySelector(`[data-uid="${anchor0.uid}"]`);
        if (anchor) {
            scroller.scrollTop += anchor.getBoundingClientRect().top - anchor0.top;
        }
    };
}

// The first element with a data-uid that reaches below the middle line.
function scroll_anchor_find(scroller)
{
    const rect = scroller.getBoundingClientRect();
    const middle = rect.top + rect.height/2;
    for (const element of scroller.querySelectorAll('[data-uid]')) {
        const element_rect = element.getBoundingClientRect();
        if (element_rect.bottom > middle) {
            return {uid: element.dataset.uid, top: element_rect.top};
        }
    }
    return null;
}

function theme_write(theme)
{
    document.documentElement.dataset.theme = theme;
    try {
        localStorage.setItem('theme', theme);
    }
    catch (error) {
        console.warn(error);
    }
    theme_buttons_refresh();
}

function theme_buttons_refresh()
{
    for (const button of document.querySelectorAll('.theme button')) {
        const theme = document.documentElement.dataset.theme;
        const label = `${theme === 'dark' ? 'Dark' : 'Light'} theme. Switch to ${theme === 'dark' ? 'light' : 'dark'} theme.`;
        button.setAttribute('aria-label', label);
        button.title = label;
    }
}
</script>
</body>
</html>
