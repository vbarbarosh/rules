<text x="560" y="716" fill="#d3d1c9" font-size="20">when the plan changes</text>
<text x="870" y="716" fill="#d3d1c9" font-size="20">once: when reached</text>
<line x1="48" y1="736" x2="1152" y2="736" stroke="#2c3035"/>
<text x="64" y="766" fill="#92958c" font-size="20" font-weight="700">Here</text>
<text x="250" y="766" fill="#d3d1c9" font-size="20">agentdir › commondir ›</text>
<text x="560" y="766" fill="#d3d1c9" font-size="20">roadmaps/…-plan.md,</text>
<text x="870" y="766" fill="#d3d1c9" font-size="20">the steps under the</text>
<text x="64" y="796" fill="#92958c" font-size="20" font-weight="700"></text>
<text x="250" y="796" fill="#d3d1c9" font-size="20">Terms; a chain of Re:</text>
