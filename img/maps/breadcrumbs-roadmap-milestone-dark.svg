<text x="250" y="666" fill="#d3d1c9" font-size="20">a path, root to here</text>
<text x="560" y="666" fill="#d3d1c9" font-size="20">the whole way, in order</text>
<text x="870" y="666" fill="#d3d1c9" font-size="20">a point, reached or not</text>
<line x1="48" y1="686" x2="1152" y2="686" stroke="#2c3035"/>
<text x="64" y="716" fill="#92958c" font-size="20" font-weight="700">Changes</text>
