<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="700" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Milestone</text>
<text x="48" y="108" fill="#686a61" font-size="22">a point on the way that says how far we are: it takes no time, it is reached or not</text>
<!-- the road with a roman milestone -->
<rect x="0" y="300" width="1200" height="70" fill="#e8e5d9"/>
<line x1="0" y1="335" x2="1200" y2="335" stroke="#a19f93" stroke-width="3" stroke-dasharray="20 16"/>
<g transform="translate(130 150)">
<path d="M0 150 V40 Q0 0 50 0 Q100 0 100 40 V150 Z" fill="#a19f93" stroke="#686a61" stroke-width="3"/>
<text x="50" y="62" fill="#191a17" font-size="26" font-weight="700" text-anchor="middle">ROMA</text>
<text x="50" y="104" fill="#191a17" font-size="34" font-weight="700" text-anchor="middle">XII</text>
</g>
<text x="260" y="200" fill="#191a17" font-size="24">the Roman stone: 12 miles from Rome</text>
<text x="260" y="234" fill="#686a61" font-size="22">in a project: "Rendered", "Sent", "Released"</text>
<!-- the app's milestone strip -->
<text x="48" y="440" fill="#191a17" font-size="26" font-weight="700">In this note: the goal's steps, drawn under the cover</text>
<g font-size="21">
<rect x="48" y="470" width="250" height="110" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<path d="M70 512 l9 9 16 -18" fill="none" stroke="#1a7443" stroke-width="5"/><text x="106" y="520" fill="#191a17" font-weight="700">Rendered</text>
<text x="70" y="556" fill="#686a61">done · 10-10 06:23</text>
<rect x="318" y="470" width="250" height="110" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<path d="M340 512 l9 9 16 -18" fill="none" stroke="#1a7443" stroke-width="5"/><text x="376" y="520" fill="#191a17" font-weight="700">Sent</text>
<text x="340" y="556" fill="#686a61">done · 10-10 06:24</text>
<rect x="588" y="470" width="290" height="110" rx="12" fill="#fbeedb" stroke="#b8650a" stroke-width="3"/>
<circle cx="618" cy="512" r="12" fill="none" stroke="#b8650a" stroke-width="4" stroke-dasharray="40 36"/>
<text x="642" y="520" fill="#191a17" font-weight="700">Looked at by you</text>
<text x="610" y="556" fill="#b8650a">now · waits on you</text>
<rect x="898" y="470" width="254" height="110" rx="12" fill="#efece2" stroke="#d9d5c7" stroke-width="2"/>
<text x="920" y="520" fill="#191a17" font-weight="700">Done: nothing left,</text>
<text x="920" y="552" fill="#191a17" font-weight="700">to the archive</text>
</g>
<text x="48" y="636" fill="#686a61" font-size="21">Named as it stands: "Testing" while now, "Tested" once done. Now waits on me while I work, on you after my reply.</text>
<text x="48" y="666" fill="#686a61" font-size="21">It moves with every reply, the short "on it" too.</text>
</svg>
