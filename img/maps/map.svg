<text x="213" y="470" fill="#686a61" font-size="20" text-anchor="middle">the place: everything</text>
<line x1="384" y1="315" x2="452" y2="315" stroke="#686a61" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="460" y="230" width="170" height="170" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<path d="M468 380 C 500 340, 520 360, 545 320 S 600 270, 622 255" fill="none" stroke="#2743b8" stroke-width="5"/>
