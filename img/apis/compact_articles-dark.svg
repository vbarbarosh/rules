size="18" fill="#E8E6DC"><tspan font-weight="700" fill="#F06A62">Not there: </tspan><tspan font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="17">GET, PUT, PATCH or DELETE /articles/9</tspan> → 404 Not Found.   Fields that are wrong → 422.</text><rect x="20" y="776" width="22" height="22" rx="4" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.75"/><text x="52" y="794" font-size="18" fill="#E8E6DC">reads</text><rect x="160" y="776" width="22" height="22" rx="4" fill="#1E3A24" stroke="#5CC26A" stroke-width="1.75"/><text x="192" y="794" font-size="18" fill="#E8E6DC">adds</text><rect x="300" y="776" width="22" height="22" rx="4" fill="#3D2A1D" stroke="#F08C4A" stroke-width="1.75"/><text x="332" y="794" font-size="18" fill="#E8E6DC">changes</text><rect x="440" y="776" width="22" height="22" rx="4" fill="#3D2224" stroke="#F06A62" stroke-width="1.75"/><text x="472" y="794" font-size="18" fill="#E8E6DC">removes</text><text x="600" y="794" font-size="18" fill="#BAB8AB">Sent twice: same means the second changes nothing more.</text></svg>
