<text x="20" y="44" font-size="26" font-weight="700" fill="#E8E6DC">The articles API: one resource, six requests</text><text x="20" y="78" font-size="18" fill="#BAB8AB">Sent one after another, top to bottom; the right side shows the articles the server keeps after each.</text><text x="20" y="128" font-size="18" font-weight="700" fill="#BAB8AB">Request</text><text x="330" y="128" font-size="18" font-weight="700" fill="#BAB8AB">Sends</text><text x="600" y="128" font-size="18" font-weight="700" fill="#BAB8AB">Gets back</text><text x="840" y="128" font-size="18" font-weight="700" fill="#BAB8AB">Stored after it</text><text x="1090" y="128" font-size="18" font-weight="700" fill="#BAB8AB">Sent twice</text><rect x="10" y="144" width="1180" height="84" rx="10" fill="#26252A" stroke="#45443A"/><rect x="20" y="168" width="92" height="36" rx="6" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.75"/><text x="66" y="192" font-size="17" font-weight="700" text-anchor="middle" fill="#6E9BF5">GET</text><text x="124" y="193" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="19" fill="#E8E6DC">/articles</text><text x="330" y="192" font-size="18" font-style="italic" fill="#BAB8AB">nothing</text><text x="600" y="182" font-size="19" font-weight="700" fill="#5CC26A">200 OK</text><text x="600" y="208" font-size="17" fill="#BAB8AB">the list: #1, #2</text><rect x="840" y="150" width="54" height="36" rx="5" fill="#2E2D33" stroke="#5E5C4E" stroke-width="1.75"/><text x="867" y="174" font-size="17" font-weight="700" text-anchor="middle" fill="#E8E6DC">#1</text><rect x="902" y="150" width="54" height="36" rx="5" fill="#2E2D33" stroke="#5E5C4E" stroke-width="1.75"/><text x="929" y="174" font-size="17" font-weight="700" text-anchor="middle" fill="#E8E6DC">#2</text><text x="840" y="212" font-size="17" fill="#BAB8AB">nothing changes</text><text x="1090" y="193" font-size="18" font-weight="700" fill="#E8E6DC">same</text><rect x="10" y="236" width="1180" height="84" rx="10" fill="#26252A" stroke="#45443A"/><rect x="20" y="260" width="92" height="36" rx="6" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.75"/><text x="66" y="284" font-size="17" font-weight="700" text-anchor="middle" fill="#6E9BF5">GET</text><text x="124" y="285" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="19" fill="#E8E6DC">/articles/2</text><text x="330" y="284" font-size="18" font-style="italic" fill="#BAB8AB">nothing</text><text x="600" y="274" font-size="19" font-weight="700" fill="#5CC26A">200 OK</text><text x="600" y="300" font-size="17" fill="#BAB8AB">article #2</text><rect x="840" y="242" width="54" height="36" rx="5" fill="#2E2D33" stroke="#5E5C4E" stroke-width="1.75"/><text x="867" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#E8E6DC">#1</text><rect x="902" y="242" width="54" height="36" rx="5" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.75"/><text x="929" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#6E9BF5">#2</text><text x="840" y="304" font-size="17" fill="#BAB8AB">#2 read</text><text x="1090" y="285" font-size="18" font-weight="700" fill="#E8E6DC">same</text><rect x="10" y="328" width="1180" height="84" rx="10" fill="#26252A" stroke="#45443A"/><rect x="20" y="352" width="92" height="36" rx="6" fill="#1E3A24" stroke="#5CC26A" stroke-width="1.75"/><text x="66" y="376" font-size="17" font-weight="700" text-anchor="middle" fill="#5CC26A">POST</text><text x="124" y="377" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="19" fill="#E8E6DC">/articles</text><rect x="330" y="338" width="244" height="64" rx="6" fill="#2E2D33" stroke="#45443A"/><text x="342" y="366" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#E8E6DC" xml:space="preserve">{"title": "News",</text><text x="342" y="390" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#E8E6DC" xml:space="preserve"> "body": "Short"}</text><text x="60