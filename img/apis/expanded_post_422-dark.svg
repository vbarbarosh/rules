<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" width="1000" height="688" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">
<rect width="1000" height="688" fill="#1E1D21"/>
<text x="20" y="44" font-size="26" font-weight="700" fill="#E8E6DC">One request, taken apart: when it fails</text><text x="20" y="78" font-size="18" fill="#BAB8AB">A POST with no title, and the answer that says which field is wrong and why.</text><text x="20" y="130" font-size="20" font-weight="700" fill="#E8E6DC">The request</text><rect x="20" y="144" width="560" height="192" rx="10" fill="#26252A" stroke="#45443A"/><text x="40" y="182" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" xml:space="preserve"><tspan font-weight="700" fill="#5CC26A">POST</tspan><tspan fill="#E8E6DC"> /articles</tspan></text><rect x="610" y="151" width="4" height="50" rx="2" fill="#5CC26A"/><path d="M586 176 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="171" font-size="19" font-weight="700" fill="#5CC26A">Method and address</text><text x="628" y="197" font-size="18" fill="#BAB8AB">add an article to the list</text><line x1="20" y1="208" x2="580" y2="208" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="246" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">Content-Type: application/json</text><rect x="610" y="215" width="4" height="50" rx="2" fill="#BAB8AB"/><path d="M586 240 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="235" font-size="19" font-weight="700" fill="#BAB8AB">Headers</text><text x="628" y="261" font-size="18" fill="#BAB8AB">the body is JSON</text><line x1="20" y1="272" x2="580" y2="272" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="310" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">{"body": "Short"}</text><rect x="610" y="279" width="4" height="50" rx="2" fill="#6E9BF5"/><path d="M586 304 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="299" font-size="19" font-weight="700" fill="#6E9BF5">Body</text><text x="628" y="325" font-size="18" fill="#BAB8AB">the new article; its title missing</text><text x="20" y="378" font-size="20" font-weight="700" fill="#E8E6DC">The answer</text><rect x="20" y="392" width="560" height="252" rx="10" fill="#26252A" stroke="#45443A"/><text x="40" y="442" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#F06A62" font-weight="700" xml:space="preserve">422 Unprocessable Content</text><rect x="610" y="399" width="4" height="74" rx="2" fill="#F06A62"/><path d="M586 436 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="419" font-size="19" font-weight="700" fill="#F06A62">Status</text><text x="628" y="445" font-size="18" fill="#BAB8AB">refused: the fields are wrong,</text><text x="628" y="469" font-size="18" fill="#BAB8AB">nothing is stored</text><line x1="20" y1="480" x2="580" y2="480" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="518" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">Content-Type: application/json</text><rect x="610" y="487" width="4" height="50" rx="2" fill="#BAB8AB"/><path d="M586 512 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="507" font-size="19" font-weight="700" fill="#BAB8AB">Headers</text><text x="628" y="533" font-size="18" fill="#BAB8AB">the answer is JSON too</text><line x1="20" y1="544" x2="580" y2="544" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="574" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">{"errors": {</text><text x="40" y="600" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">  "title": ["is required"]</text><text x="40" y="626" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">}}</text><rect x="610" y="557" width="4" height="74" rx="2" fill="#F06A62"/><path d="M586 594 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="577" font-size="19" font-weight="700" fill="#F06A62">Body</text><text x="628" y="603" font-size="18" fill="#BAB8AB">each wrong field, and why:</text><text x="628" y="627" font-size="18" fill="#BAB8AB">enough to mark it in the form</text></svg>
