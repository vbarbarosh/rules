size="18" fill="#1F1E1C"><tspan font-weight="700" fill="#C92A2A">Not there: </tspan><tspan font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="17">GET, PUT, PATCH or DELETE /articles/9</tspan> → 404 Not Found.   Fields that are wrong → 422.</text><rect x="20" y="776" width="22" height="22" rx="4" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="1.75"/><text x="52" y="794" font-size="18" fill="#1F1E1C">reads</text><rect x="160" y="776" width="22" height="22" rx="4" fill="#DDF0E0" stroke="#2B8A3E" stroke-width="1.75"/><text x="192" y="794" font-size="18" fill="#1F1E1C">adds</text><rect x="300" y="776" width="22" height="22" rx="4" fill="#FCE4D6" stroke="#C2410C" stroke-width="1.75"/><text x="332" y="794" font-size="18" fill="#1F1E1C">changes</text><rect x="440" y="776" width="22" height="22" rx="4" fill="#F6DCDA" stroke="#C92A2A" stroke-width="1.75"/><text x="472" y="794" font-size="18" fill="#1F1E1C">removes</text><text x="600" y="794" font-size="18" fill="#5C5A55">Sent twice: same means the second changes nothing more.</text></svg>
