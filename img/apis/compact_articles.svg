<text x="20" y="44" font-size="26" font-weight="700" fill="#1F1E1C">The articles API: one resource, six requests</text><text x="20" y="78" font-size="18" fill="#5C5A55">Sent one after another, top to bottom; the right side shows the articles the server keeps after each.</text><text x="20" y="128" font-size="18" font-weight="700" fill="#5C5A55">Request</text><text x="330" y="128" font-size="18" font-weight="700" fill="#5C5A55">Sends</text><text x="600" y="128" font-size="18" font-weight="700" fill="#5C5A55">Gets back</text><text x="840" y="128" font-size="18" font-weight="700" fill="#5C5A55">Stored after it</text><text x="1090" y="128" font-size="18" font-weight="700" fill="#5C5A55">Sent twice</text><rect x="10" y="144" width="1180" height="84" rx="10" fill="#F1EFEB" stroke="#D3CFC7"/><rect x="20" y="168" width="92" height="36" rx="6" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="1.75"/><text x="66" y="192" font-size="17" font-weight="700" text-anchor="middle" fill="#2B3FBF">GET</text><text x="124" y="193" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="19" fill="#1F1E1C">/articles</text><text x="330" y="192" font-size="18" font-style="italic" fill="#5C5A55">nothing</text><text x="600" y="182" font-size="19" font-weight="700" fill="#2B8A3E">200 OK</text><text x="600" y="208" font-size="17" fill="#5C5A55">the list: #1, #2</text><rect x="840" y="150" width="54" height="36" rx="5" fill="#FBFAF8" stroke="#BDB9B1" stroke-width="1.75"/><text x="867" y="174" font-size="17" font-weight="700" text-anchor="middle" fill="#1F1E1C">#1</text><rect x="902" y="150" width="54" height="36" rx="5" fill="#FBFAF8" stroke="#BDB9B1" stroke-width="1.75"/><text x="929" y="174" font-size="17" font-weight="700" text-anchor="middle" fill="#1F1E1C">#2</text><text x="840" y="212" font-size="17" fill="#5C5A55">nothing changes</text><text x="1090" y="193" font-size="18" font-weight="700" fill="#1F1E1C">same</text><rect x="10" y="236" width="1180" height="84" rx="10" fill="#F1EFEB" stroke="#D3CFC7"/><rect x="20" y="260" width="92" height="36" rx="6" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="1.75"/><text x="66" y="284" font-size="17" font-weight="700" text-anchor="middle" fill="#2B3FBF">GET</text><text x="124" y="285" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="19" fill="#1F1E1C">/articles/2</text><text x="330" y="284" font-size="18" font-style="italic" fill="#5C5A55">nothing</text><text x="600" y="274" font-size="19" font-weight="700" fill="#2B8A3E">200 OK</text><text x="600" y="300" font-size="17" fill="#5C5A55">article #2</text><rect x="840" y="242" width="54" height="36" rx="5" fill="#FBFAF8" stroke="#BDB9B1" stroke-width="1.75"/><text x="867" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#1F1E1C">#1</text><rect x="902" y="242" width="54" height="36" rx="5" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="1.75"/><text x="929" y="266" font-size="17" font-weight="700" text-anchor="middle" fill="#2B3FBF">#2</text><text x="840" y="304" font-size="17" fill="#5C5A55">#2 read</text><text x="1090" y="285" font-size="18" font-weight="700" fill="#1F1E1C">same</text><rect x="10" y="328" width="1180" height="84" rx="10" fill="#F1EFEB" stroke="#D3CFC7"/><rect x="20" y="352" width="92" height="36" rx="6" fill="#DDF0E0" stroke="#2B8A3E" stroke-width="1.75"/><text x="66" y="376" font-size="17" font-weight="700" text-anchor="middle" fill="#2B8A3E">POST</text><text x="124" y="377" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="19" fill="#1F1E1C">/articles</text><rect x="330" y="338" width="244" height="64" rx="6" fill="#FBFAF8" stroke="#D3CFC7"/><text x="342" y="366" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#1F1E1C" xml:space="preserve">{"title": "News",</text><text x="342" y="390" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#1F1E1C" xml:space="preserve"> "body": "Short"}</text><text x="60