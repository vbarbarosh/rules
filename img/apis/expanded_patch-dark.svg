<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" width="1000" height="724" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">
<rect width="1000" height="724" fill="#1E1D21"/>
<text x="20" y="44" font-size="26" font-weight="700" fill="#E8E6DC">One request, taken apart</text><text x="20" y="78" font-size="18" fill="#BAB8AB">A PATCH to article 3 and the server's answer, each part named.</text><text x="20" y="130" font-size="20" font-weight="700" fill="#E8E6DC">The request</text><rect x="20" y="144" width="560" height="202" rx="10" fill="#26252A" stroke="#45443A"/><text x="40" y="182" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" xml:space="preserve"><tspan font-weight="700" fill="#F08C4A">PATCH</tspan><tspan fill="#E8E6DC"> /articles/3</tspan></text><rect x="610" y="151" width="4" height="50" rx="2" fill="#F08C4A"/><path d="M586 176 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="171" font-size="19" font-weight="700" fill="#F08C4A">Method and address</text><text x="628" y="197" font-size="18" fill="#BAB8AB">what to do, and to which article</text><line x1="20" y1="208" x2="580" y2="208" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="238" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">Content-Type: application/json</text><text x="40" y="264" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">Authorization: Bearer eyJhbGci…</text><rect x="610" y="220" width="4" height="50" rx="2" fill="#BAB8AB"/><path d="M586 245 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="240" font-size="19" font-weight="700" fill="#BAB8AB">Headers</text><text x="628" y="266" font-size="18" fill="#BAB8AB">the body is JSON; who is asking</text><line x1="20" y1="282" x2="580" y2="282" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="320" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">{"title": "Breaking"}</text><rect x="610" y="289" width="4" height="50" rx="2" fill="#6E9BF5"/><path d="M586 314 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="309" font-size="19" font-weight="700" fill="#6E9BF5">Body</text><text x="628" y="335" font-size="18" fill="#BAB8AB">only the fields to change</text><text x="20" y="388" font-size="20" font-weight="700" fill="#E8E6DC">The answer</text><rect x="20" y="402" width="560" height="278" rx="10" fill="#26252A" stroke="#45443A"/><text x="40" y="452" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#5CC26A" font-weight="700" xml:space="preserve">200 OK</text><rect x="610" y="409" width="4" height="74" rx="2" fill="#5CC26A"/><path d="M586 446 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="429" font-size="19" font-weight="700" fill="#5CC26A">Status</text><text x="628" y="455" font-size="18" fill="#BAB8AB">it worked; 404 if there is no #3,</text><text x="628" y="479" font-size="18" fill="#BAB8AB">422 if the title is wrong</text><line x1="20" y1="490" x2="580" y2="490" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="528" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">Content-Type: application/json</text><rect x="610" y="497" width="4" height="50" rx="2" fill="#BAB8AB"/><path d="M586 522 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="517" font-size="19" font-weight="700" fill="#BAB8AB">Headers</text><text x="628" y="543" font-size="18" fill="#BAB8AB">the answer is JSON too</text><line x1="20" y1="554" x2="580" y2="554" stroke="#45443A" stroke-dasharray="5 4"/><text x="40" y="584" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve">{"id": 3,</text><text x="40" y="610" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve"> "title": "Breaking",</text><text x="40" y="636" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve"> "body": "Full text",</text><text x="40" y="662" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#E8E6DC" xml:space="preserve"> "tags": ["ai"]}</text><rect x="610" y="580" width="4" height="74" rx="2" fill="#6E9BF5"/><path d="M586 617 H602" stroke="#5E5C4E" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="600" font-size="19" font-weight="700" fill="#6E9BF5">Body</text><text x="628" y="626" font-size="18" fill="#BAB8AB">the whole article as it is now:</text><text x="628" y="650" font-size="18" fill="#BAB8AB">what was not sent is kept</text></svg>
