<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" width="1000" height="688" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">
<rect width="1000" height="688" fill="#E9E6E0"/>
<text x="20" y="44" font-size="26" font-weight="700" fill="#1F1E1C">One request, taken apart: when it fails</text><text x="20" y="78" font-size="18" fill="#5C5A55">A POST with no title, and the answer that says which field is wrong and why.</text><text x="20" y="130" font-size="20" font-weight="700" fill="#1F1E1C">The request</text><rect x="20" y="144" width="560" height="192" rx="10" fill="#F1EFEB" stroke="#D3CFC7"/><text x="40" y="182" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" xml:space="preserve"><tspan font-weight="700" fill="#2B8A3E">POST</tspan><tspan fill="#1F1E1C"> /articles</tspan></text><rect x="610" y="151" width="4" height="50" rx="2" fill="#2B8A3E"/><path d="M586 176 H602" stroke="#BDB9B1" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="171" font-size="19" font-weight="700" fill="#2B8A3E">Method and address</text><text x="628" y="197" font-size="18" fill="#5C5A55">add an article to the list</text><line x1="20" y1="208" x2="580" y2="208" stroke="#D3CFC7" stroke-dasharray="5 4"/><text x="40" y="246" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1F1E1C" xml:space="preserve">Content-Type: application/json</text><rect x="610" y="215" width="4" height="50" rx="2" fill="#5C5A55"/><path d="M586 240 H602" stroke="#BDB9B1" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="235" font-size="19" font-weight="700" fill="#5C5A55">Headers</text><text x="628" y="261" font-size="18" fill="#5C5A55">the body is JSON</text><line x1="20" y1="272" x2="580" y2="272" stroke="#D3CFC7" stroke-dasharray="5 4"/><text x="40" y="310" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1F1E1C" xml:space="preserve">{"body": "Short"}</text><rect x="610" y="279" width="4" height="50" rx="2" fill="#2B3FBF"/><path d="M586 304 H602" stroke="#BDB9B1" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="299" font-size="19" font-weight="700" fill="#2B3FBF">Body</text><text x="628" y="325" font-size="18" fill="#5C5A55">the new article; its title missing</text><text x="20" y="378" font-size="20" font-weight="700" fill="#1F1E1C">The answer</text><rect x="20" y="392" width="560" height="252" rx="10" fill="#F1EFEB" stroke="#D3CFC7"/><text x="40" y="442" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#C92A2A" font-weight="700" xml:space="preserve">422 Unprocessable Content</text><rect x="610" y="399" width="4" height="74" rx="2" fill="#C92A2A"/><path d="M586 436 H602" stroke="#BDB9B1" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="419" font-size="19" font-weight="700" fill="#C92A2A">Status</text><text x="628" y="445" font-size="18" fill="#5C5A55">refused: the fields are wrong,</text><text x="628" y="469" font-size="18" fill="#5C5A55">nothing is stored</text><line x1="20" y1="480" x2="580" y2="480" stroke="#D3CFC7" stroke-dasharray="5 4"/><text x="40" y="518" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1F1E1C" xml:space="preserve">Content-Type: application/json</text><rect x="610" y="487" width="4" height="50" rx="2" fill="#5C5A55"/><path d="M586 512 H602" stroke="#BDB9B1" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="507" font-size="19" font-weight="700" fill="#5C5A55">Headers</text><text x="628" y="533" font-size="18" fill="#5C5A55">the answer is JSON too</text><line x1="20" y1="544" x2="580" y2="544" stroke="#D3CFC7" stroke-dasharray="5 4"/><text x="40" y="574" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1F1E1C" xml:space="preserve">{"errors": {</text><text x="40" y="600" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1F1E1C" xml:space="preserve">  "title": ["is required"]</text><text x="40" y="626" font-family="DejaVu Sans Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1F1E1C" xml:space="preserve">}}</text><rect x="610" y="557" width="4" height="74" rx="2" fill="#C92A2A"/><path d="M586 594 H602" stroke="#BDB9B1" stroke-width="1.5" stroke-dasharray="3 4"/><text x="628" y="577" font-size="19" font-weight="700" fill="#C92A2A">Body</text><text x="628" y="603" font-size="18" fill="#5C5A55">each wrong field, and why:</text><text x="628" y="627" font-size="18" fill="#5C5A55">enough to mark it in the form</text></svg>
