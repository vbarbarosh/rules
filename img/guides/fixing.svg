<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Fixing: reproduce it, then fix the cause</text>
<text x="48" y="108" fill="#686a61" font-size="22">the order of work on a failure, from the report to the fix</text>
<line x1="60" y1="310" x2="112" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="168" y1="310" x2="272" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="328" y1="310" x2="572" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="628" y1="310" x2="742" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="798" y1="310" x2="912" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="968" y1="310" x2="1042" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="1098" y1="310" x2="1150" y2="310" stroke="#a19f93" stroke-width="4" stroke-linecap="round"/>
<line x1="450" y1="150" x2="450" y2="470" stroke="#b2341f" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="285" y="478" width="330" height="46" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="450" y="508" fill="#b2341f" font-size="20" text-anchor="middle" font-weight="700">no line of fix before this</text>
<circle cx="140" cy="310" r="20" fill="#b8650a" stroke="#b8650a" stroke-width="2"/>
<text x="140" y="317" fill="#fffefb" font-size="20" text-anchor="middle" font-weight="700">!</text>
<line x1="140" y1="282" x2="140" y2="242" stroke="#b8650a" stroke-width="3" stroke-linecap="round"/>
<text x="140" y="196" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">Reported</text>
<text x="140" y="224" fill="#686a61" font-size="19" text-anchor="middle">a trace is only a guess</text>
<circle cx="300" cy="310" r="20" fill="#2743b8" stroke="#2743b8" stroke-width="2"/>
<text x="300" y="317" fill="#fffefb" font-size="20" text-anchor="middle" font-weight="700">1</text>
<line x1="300" y1="338" x2="300" y2="378" stroke="#2743b8" stroke-width="3" stroke-linecap="round"/>
<text x="300" y="410" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">Reproduce it</text>
<text x="300" y="438" fill="#686a61" font-size="19" text-anchor="middle">make it happen on demand</text>
<circle cx="600" cy="310" r="20" fill="#2743b8" stroke="#2743b8" stroke-width="2"/>
<text x="600" y="317" fill="#fffefb" font-size="20" text-anchor="middle" font-weight="700">2</text>
<line x1="600" y1="282" x2="600" y2="242" stroke="#2743b8" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="196" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">Name the condition</text>
<text x="600" y="224" fill="#686a61" font-size="19" text-anchor="middle">in one sentence</text>
<circle cx="770" cy="310" r="20" fill="#2743b8" stroke="#2743b8" stroke-width="2"/>
<text x="770" y="317" fill="#fffefb" font-size="20" text-anchor="middle" font-weight="700">3</text>
<line x1="770" y1="338" x2="770" y2="378" stroke="#2743b8" stroke-width="3" stroke-linecap="round"/>
<text x="770" y="410" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">Decide the response</text>
<text x="770" y="438" fill="#686a61" font-size="19" text-anchor="middle">retry, wait, fall back, ask</text>
<circle cx="940" cy="310" r="20" fill="#1a7443" stroke="#1a7443" stroke-width="2"/>
<text x="940" y="317" fill="#fffefb" font-size="20" text-anchor="middle" font-weight="700">4</text>
<line x1="940" y1="282" x2="940" y2="242" stroke="#1a7443" stroke-width="3" stroke-linecap="round"/>
<text x="940" y="196" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">Wire it in</text>
<text x="940" y="224" fill="#686a61" font-size="19" text-anchor="middle">at the cause, not where it hurts</text>
<circle cx="1070" cy="310" r="20" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="1070" y="317" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">5</text>
<line x1="1070" y1="338" x2="1070" y2="378" stroke="#a19f93" stroke-width="3" stroke-linecap="round"/>
<text x="1070" y="410" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">The reporting</text>
<text x="1070" y="438" fill="#686a61" font-size="19" text-anchor="middle">only now</text>
<text x="48" y="570" fill="#686a61" font-size="21">Reproduce before any fix; change the cause, never the report or the test.</text>
</svg>
