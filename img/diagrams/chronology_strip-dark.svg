<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><rect width="1000" height="470" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">Chronology: one user, first to last</text><text x="20" y="82" font-size="18" fill="#BAB8AB">What one user did, in order; each step the same distance from the next.</text><line x1="40" y1="260" x2="960" y2="260" stroke="#8A887C" stroke-width="3" stroke-linecap="round"/><rect x="661" y="246" width="18" height="28" fill="#1E1D21"/><line x1="660" y1="272" x2="668" y2="248" stroke="#F08C4A" stroke-width="3" stroke-linecap="round"/><line x1="672" y1="272" x2="680" y2="248" stroke="#F08C4A" stroke-width="3" stroke-linecap="round"/><text x="670" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#F08C4A">23 hours</text><text x="670" y="376" font-size="18" text-anchor="middle" fill="#F08C4A">cut short</text><line x1="80" y1="250" x2="80" y2="196" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="80" cy="260" r="9" fill="#6E9BF5"/><text x="80" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Mon 10:02</text><text x="80" y="180" font-size="18" text-anchor="middle" fill="#BAB8AB">pricing page</text><line x1="200" y1="270" x2="200" y2="324" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="200" cy="260" r="9" fill="#6E9BF5"/><text x="200" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Mon 10:04</text><text x="200" y="376" font-size="18" text-anchor="middle" fill="#BAB8AB">signed up</text><line x1="320" y1="250" x2="320" y2="196" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="320" cy="260" r="9" fill="#6E9BF5"/><text x="320" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Mon 10:05</text><text x="320" y="180" font-size="18" text-anchor="middle" fill="#BAB8AB">email confirmed</text><line x1="440" y1="270" x2="440" y2="324" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="440" cy="260" r="9" fill="#6E9BF5"/><text x="440" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Mon 10:11</text><text x="440" y="376" font-size="18" text-anchor="middle" fill="#BAB8AB">first banner</text><line x1="560" y1="250" x2="560" y2="196" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="560" cy="260" r="9" fill="#6E9BF5"/><text x="560" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Mon 10:26</text><text x="560" y="180" font-size="18" text-anchor="middle" fill="#BAB8AB">GIF exported</text><line x1="780" y1="270" x2="780" y2="324" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="780" cy="260" r="9" fill="#6E9BF5"/><text x="780" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Tue 09:14</text><text x="780" y="376" font-size="18" text-anchor="middle" fill="#BAB8AB">came back</text><line x1="900" y1="250" x2="900" y2="196" stroke="#5CC26A" stroke-width="1.75"/><circle cx="900" cy="260" r="9" fill="#5CC26A"/><text x="900" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Tue 09:20</text><text x="900" y="180" font-size="18" text-anchor="middle" fill="#5CC26A">upgraded to Pro</text><text x="20" y="446" font-size="18" fill="#BAB8AB">Even steps: the order and the times count, not the gaps between them.</text></svg>
