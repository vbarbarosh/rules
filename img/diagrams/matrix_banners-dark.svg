<text x="40" y="650" font-size="17" fill="#E8E6DC">How to read: the row calls the column. Row users, column Cloudflare: users call Cloudflare on 443.</text>
<text x="40" y="675" font-size="17" fill="#E8E6DC">Calls above the grey diagonal go down the chain; the one below it (orange) is Lambda writing back.</text>
<text x="40" y="712" font-size="17" fill="#BAB8AB">Good for: every link at a glance, however many; layers, and cycles as cells below the diagonal.</text>
<text x="40" y="737" font-size="17" fill="#BAB8AB">Drawn with: Lattix, NDepend dependency matrix, Structure101, IntelliJ IDEA DSM, a spreadsheet.</text>
