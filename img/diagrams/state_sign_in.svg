<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-text" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#1F1E1C" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2B3FBF" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#C92A2A" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2B8A3E" stroke-linejoin="round"/></marker><marker id="arrow-grey" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#5C5A55" stroke-linejoin="round"/></marker></defs><rect width="1000" height="500" fill="#E9E6E0"/><text x="20" y="46" font-size="26" font-weight="700" fill="#1F1E1C">State diagram: a sign-in card</text><text x="20" y="82" font-size="18" fill="#5C5A55">What states a thing has, and what moves it between them.</text><circle cx="40" cy="245" r="9" fill="#1F1E1C"/><rect x="70" y="210" width="160" height="70" rx="10" fill="#FCE4D6" stroke="#C2410C" stroke-width="2"/><text x="150" y="251" font-size="18" text-anchor="middle" fill="#1F1E1C">Signed out</text><rect x="300" y="210" width="170" height="70" rx="10" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="2"/><text x="385" y="240" font-size="18" text-anchor="middle" fill="#1F1E1C">The code</text><text x="385" y="262" font-size="18" text-anchor="middle" fill="#1F1E1C">to paste</text><rect x="540" y="210" width="190" height="70" rx="10" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="2"/><text x="635" y="240" font-size="18" text-anchor="middle" fill="#1F1E1C">Waiting for</text><text x="635" y="262" font-size="18" text-anchor="middle" fill="#1F1E1C">the token</text><rect x="800" y="210" width="170" height="70" rx="10" fill="#DDF0E0" stroke="#2B8A3E" stroke-width="2"/><text x="885" y="251" font-size="18" text-anchor="middle" font-weight="700" fill="#1F1E1C">Saved</text><rect x="540" y="350" width="190" height="70" rx="10" fill="#FCE4D6" stroke="#C2410C" stroke-width="2"/><text x="635" y="380" font-size="18" text-anchor="middle" fill="#1F1E1C">Token shown</text><text x="635" y="402" font-size="18" text-anchor="middle" fill="#1F1E1C">in its window</text><path d="M49 245 H66" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M230 245 H296" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M470 245 H536" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M730 245 H796" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M600 210 C600 120 455.1 131.3 411.5 193.6 L402.3 206.7" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M635 280 V346" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M730 385 C830 385 864.3 309.5 882.7 283.3" fill="none" stroke="#5C5A55" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><text x="263" y="195" font-size="18" text-anchor="middle" fill="#5C5A55">Open link</text><text x="505" y="195" font-size="18" text-anchor="middle" fill="#5C5A55">Paste</text><text x="765" y="195" font-size="18" text-anchor="middle" fill="#5C5A55">read</text><text x="500" y="128" font-size="18" text-anchor="middle" fill="#5C5A55">refused: a new link</text><text x="647" y="322" font-size="18" text-anchor="start" fill="#5C5A55">ended, unread</text><text x="748" y="420" font-size="18" text-anchor="start" fill="#5C5A55">Paste the token</text><text x="20" y="476" font-size="18" fill="#5C5A55">Boxes are states, arrows what moves it; the dot is where it starts.</text></svg>
