<line x1="21" y1="314" x2="979" y2="314" stroke="#BDB9B1" stroke-width="1.5"/>
<line x1="21" y1="418" x2="979" y2="418" stroke="#BDB9B1" stroke-width="1.5"/>
<text x="40" y="165" font-size="20" fill="#1F1E1C" font-weight="700">Customer</text>
<text x="40" y="269" font-size="20" fill="#1F1E1C" font-weight="700">Support</text>
<text x="40" y="362" font-size="20" fill="#1F1E1C" font-weight="700">You</text>
<text x="40" y="386" font-size="18" fill="#5C5A55">shop owner</text>
<text x="40" y="466" font-size="20" fill="#1F1E1C" font-weight="700">Payment</text>
<text x="40" y="490" font-size="20" fill="#1F1E1C" font-weight="700">service</text>
<rect x="214" y="126" width="136" height="64" rx="8" fill="#DDF0E0" stroke="#2B8A3E" stroke-width="1.5"/>
<text x="282" y="152" font-size="18" fill="#1F1E1C" font-weight="700" text-anchor="middle">Asks for</text>
<text x="282" y="176" font-size="18" fill="#1F1E1C" text-anchor="middle">a refund</text>
<rect x="366" y="230" width="136" height="64" rx="8" fill="#DDF0E0" stroke="#2B8A3E" stroke-width="1.5"/>
<text x="434" y="256" font-size="18" fill="#1F1E1C" font-weight="700" text-anchor="middle">Checks</text>
<text x="434" y="280" font-size="18" fill="#1F1E1C" text-anchor="middle">the order</text>
