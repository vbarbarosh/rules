<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#6E9BF5" stroke-linejoin="round"/></marker><marker id="arrow-grey" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#A9A79B" stroke-linejoin="round"/></marker></defs><rect width="1000" height="860" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">Flywheel: search that learns from its users</text><text x="20" y="82" font-size="18" fill="#BAB8AB">Each stage feeds the next; the amber one turns slowest, the grey one comes from outside.</text><path d="M597.71 159.04 A260 260 0 0 1 685 217.3 L692.49 225.34" fill="none" stroke="#6E9BF5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M745.31 313.62 A260 260 0 0 1 749.5 473.1 L745.75 484.5" fill="none" stroke="#6E9BF5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M693.22 574.09 A260 260 0 0 1 610.3 635.4 L599.27 640.2" fill="none" stroke="#6E9BF5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M402.29 640.96 A260 260 0 0 1 315 582.7 L307.51 574.66" fill="none" stroke="#6E9BF5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M254.69 486.38 A260 260 0 0 1 250.5 326.9 L254.25 315.5" fill="none" stroke="#6E9BF5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M306.78 225.91 A260 260 0 0 1 389.7 164.6 L400.73 159.8" fill="none" stroke="#6E9BF5" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M500 752 V706" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-dasharray="8 6" stroke-linecap="round" marker-end="url(#arrow-grey)"/><rect x="408" y="102" width="184" height="76" rx="10" fill="#1E3A24" stroke="#5CC26A" stroke-width="2"/><text x="500" y="134" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">More users</text><text x="500" y="160" font-size="18" text-anchor="middle" fill="#BAB8AB">1.2k new a week</text><rect x="633.2" y="232" width="184" height="76" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2"/><text x="725.2" y="264" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">More searches</text><text x="725.2" y="290" font-size="18" text-anchor="middle" fill="#BAB8AB">40k a day</text><rect x="633.2" y="492" width="184" height="76" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2"/><text x="725.2" y="524" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Clicks logged</text><text x="725.2" y="550" font-size="18" text-anchor="middle" fill="#BAB8AB">28k a day</text><rect x="408" y="622" width="184" height="76" rx="10" fill="#3D2A1D" stroke="#F08C4A" stroke-width="2"/><text x="500" y="654" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Clicks as labels</text><text x="500" y="680" font-size="18" text-anchor="middle" fill="#BAB8AB">only 15% usable</text><rect x="182.8" y="492" width="184" height="76" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2"/><text x="274.8" y="524" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Model retrained</text><text x="274.8" y="550" font-size="18" text-anchor="middle" fill="#BAB8AB">every Monday</text><rect x="182.8" y="232" width="184" height="76" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2"/><text x="274.8" y="264" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">Better ranking</text><text x="274.8" y="290" font-size="18" text-anchor="middle" fill="#BAB8AB">top-3 hit 71%</text><rect x="415" y="758" width="170" height="76" rx="10" fill="#26252A" stroke="#A9A79B" stroke-width="1.5" stroke-dasharray="6 4"/><text x="500" y="790" font-size="18" text-anchor="middle" fill="#E8E6DC">Seed labels</text><text x="500" y="816" font-size="18" text-anchor="middle" fill="#BAB8AB">2k by hand</text><text x="620" y="790" font-size="18" fill="#F08C4A">The weak link: 85% of clicks</text><text x="620" y="816" font-size="18" fill="#F08C4A">are too noisy to learn from</text><text x="500" y="396" font-size="22" font-weight="700" text-anchor="middle" fill="#E8E6DC">A turn a week</text><text x="500" y="426" font-size="18" text-anchor="middle" fill="#BAB8AB">from users to a better ranking</text></svg>
