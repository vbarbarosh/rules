ext x="500" y="416" font-size="18" text-anchor="middle" fill="#BAB8AB">from users to a better ranking</text><text x="500" y="676" font-size="18" text-anchor="middle" fill="#F08C4A">The weak link: 85% of clicks are too noisy to learn from</text></svg>
