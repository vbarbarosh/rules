<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-text" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#E8E6DC" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#6E9BF5" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#F06A62" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#5CC26A" stroke-linejoin="round"/></marker><marker id="arrow-grey" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#A9A79B" stroke-linejoin="round"/></marker></defs><rect width="1000" height="500" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">State diagram: a sign-in card</text><text x="20" y="82" font-size="18" fill="#BAB8AB">What states a thing has, and what moves it between them.</text><circle cx="40" cy="245" r="9" fill="#E8E6DC"/><rect x="70" y="210" width="160" height="70" rx="10" fill="#3D2A1D" stroke="#F08C4A" stroke-width="2"/><text x="150" y="251" font-size="18" text-anchor="middle" fill="#E8E6DC">Signed out</text><rect x="300" y="210" width="170" height="70" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2"/><text x="385" y="240" font-size="18" text-anchor="middle" fill="#E8E6DC">The code</text><text x="385" y="262" font-size="18" text-anchor="middle" fill="#E8E6DC">to paste</text><rect x="540" y="210" width="190" height="70" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2"/><text x="635" y="240" font-size="18" text-anchor="middle" fill="#E8E6DC">Waiting for</text><text x="635" y="262" font-size="18" text-anchor="middle" fill="#E8E6DC">the token</text><rect x="800" y="210" width="170" height="70" rx="10" fill="#1E3A24" stroke="#5CC26A" stroke-width="2"/><text x="885" y="251" font-size="18" text-anchor="middle" font-weight="700" fill="#E8E6DC">Saved</text><rect x="540" y="350" width="190" height="70" rx="10" fill="#3D2A1D" stroke="#F08C4A" stroke-width="2"/><text x="635" y="380" font-size="18" text-anchor="middle" fill="#E8E6DC">Token shown</text><text x="635" y="402" font-size="18" text-anchor="middle" fill="#E8E6DC">in its window</text><path d="M55 245 H62" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M236 245 H292" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M476 245 H532" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M736 245 H792" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M599.96 204 C599.96 114 455.1 131.3 411.5 193.6 L405.17 202.61" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M635 286 V342" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><path d="M736 384.98 C836 384.98 861.45 313.61 879.85 287.41" fill="none" stroke="#A9A79B" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-grey)"/><text x="263" y="195" font-size="18" text-anchor="middle" fill="#BAB8AB">Open link</text><text x="505" y="195" font-size="18" text-anchor="middle" fill="#BAB8AB">Paste</text><text x="765" y="195" font-size="18" text-anchor="middle" fill="#BAB8AB">read</text><text x="500" y="128" font-size="18" text-anchor="middle" fill="#BAB8AB">refused: a new link</text><text x="651" y="322" font-size="18" text-anchor="start" fill="#BAB8AB">ended, unread</text><text x="748" y="420" font-size="18" text-anchor="start" fill="#BAB8AB">Paste the token</text><text x="20" y="476" font-size="18" fill="#BAB8AB">Boxes are states, arrows what moves it; the dot is where it starts.</text></svg>
