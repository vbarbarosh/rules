<rect x="730" y="120" width="240" height="34" fill="#33322C" clip-path="url(#signup-frame-3)"/>
<text x="744" y="142" font-size="18" fill="#BAB8AB" font-weight="700">Welcome</text>
<circle cx="850" cy="212" r="34" fill="#1E3A24" stroke="#5CC26A" stroke-width="3"/>
<text x="850" y="224" font-size="34" fill="#5CC26A" font-weight="700" text-anchor="middle">✓</text>
<text x="850" y="296" font-size="18" fill="#E8E6DC" font-weight="700" text-anchor="middle">Your account is ready</text>
<text x="850" y="328" font-size="18" fill="#BAB8AB" text-anchor="middle">Start with a first note</text>
<path d="M258 334 C300 334 316.6 284 359.9 259 L372 252" fill="none" stroke="#F08C4A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
