<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-text" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#E8E6DC" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#6E9BF5" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#5CC26A" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#F06A62" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#F08C4A" stroke-linejoin="round"/></marker><clipPath id="signup-frame-1"><rect x="30" y="120" width="240" height="300" rx="10"/></clipPath><clipPath id="signup-frame-2"><rect x="380" y="120" width="240" height="300" rx="10"/></clipPath><clipPath id="signup-frame-3"><rect x="730" y="120" width="240" height="300" rx="10"/></clipPath></defs>
<rect width="1000" height="460" fill="#1E1D21"/>
<text x="20" y="46" font-size="26" fill="#E8E6DC" font-weight="700">Wireflow: signing up</text>
<text x="20" y="82" font-size="18" fill="#BAB8AB">Each frame is the screen; the ringed spot is the tap, its arrow leads to the next screen.</text>
<rect x="30" y="120" width="240" height="300" rx="10" fill="#26252A" stroke="#5E5C4E" stroke-width="2"/>
<rect x="30" y="120" width="240" height="34" fill="#33322C" clip-path="url(#signup-frame-1)"/>
<text x="44" y="142" font-size="18" fill="#BAB8AB" font-weight="700">Sign up</text>
<text x="46" y="176" font-size="18" fill="#E8E6DC">Email</text>
<rect x="46" y="188" width="208" height="30" rx="6" fill="#1E2A4A" stroke="#5E5C4E" stroke-width="1.5"/>
<text x="46" y="240" font-size="18" fill="#E8E6DC">Password</text>
<rect x="46" y="252" width="208" height="30" rx="6" fill="#1E2A4A" stroke="#5E5C4E" stroke-width="1.5"/>
<rect x="46" y="306" width="208" height="40" rx="6" fill="#6E9BF5"/>
<text x="150" y="332" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">Sign up</text>
<text x="150" y="380" font-size="18" fill="#BAB8AB" text-anchor="middle">Already have an account?</text>
<circle cx="242" cy="334" r="16" fill="none" stroke="#F08C4A" stroke-width="3"/>
<rect x="380" y="120" width="240" height="300" rx="10" fill="#26252A" stroke="#5E5C4E" stroke-width="2"/>
<rect x="380" y="120" width="240" height="34" fill="#33322C" clip-path="url(#signup-frame-2)"/>
<text x="394" y="142" font-size="18" fill="#BAB8AB" font-weight="700">Verify email</text>
<text x="500" y="180" font-size="18" fill="#E8E6DC" text-anchor="middle">A code was sent to you</text>
<rect x="394" y="196" width="46" height="52" rx="6" fill="#1E2A4A" stroke="#5E5C4E" stroke-width="1.5"/>
<text x="417" y="232" font-size="20" fill="#E8E6DC" font-weight="700" text-anchor="middle">2</text>
<rect x="448" y="196" width="46" height="52" rx="6" fill="#1E2A4A" stroke="#5E5C4E" stroke-width="1.5"/>
<text x="471" y="232" font-size="20" fill="#E8E6DC" font-weight="700" text-anchor="middle">3</text>
<rect x="502" y="196" width="46" height="52" rx="6" fill="#1E2A4A" stroke="#5E5C4E" stroke-width="1.5"/>
<text x="525" y="232" font-size="20" fill="#E8E6DC" font-weight="700" text-anchor="middle">8</text>
<rect x="556" y="196" width="46" height="52" rx="6" fill="#1E2A4A" stroke="#5E5C4E" stroke-width="1.5"/>
<text x="579" y="232" font-size="20" fill="#E8E6DC" font-weight="700" text-anchor="middle">1</text>
<rect x="396" y="292" width="208" height="40" rx="6" fill="#6E9BF5"/>
<text x="500" y="318" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">Confirm</text>
<circle cx="592" cy="320" r="16" fill="none" stroke="#F08C4A" stroke-width="3"/>
<text x="500" y="380" font-size="18" fill="#BAB8AB" text-anchor="middle">Code is wrong? Resend</text>
