<path d="M608 320 C650 320 666.6 284 709.9 259 L722 252" fill="none" stroke="#F08C4A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="690" y="226" font-size="18" fill="#F08C4A" font-weight="700" text-anchor="middle">tap</text>
<text x="20" y="448" font-size="18" fill="#BAB8AB">The tap in amber; the screen the flow ends on in green.</text>
</svg>
