<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" width="1000" height="572" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><rect width="1000" height="572" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">Chronology as a list: one user, first to last</text><text x="20" y="82" font-size="18" fill="#BAB8AB">The same steps down a line, the times on the left: room for many more.</text><line x1="200" y1="120" x2="200" y2="482" stroke="#8A887C" stroke-width="3" stroke-linecap="round"/><rect x="186" y="361" width="28" height="18" fill="#1E1D21"/><line x1="188" y1="368" x2="212" y2="360" stroke="#F08C4A" stroke-width="3" stroke-linecap="round"/><line x1="188" y1="380" x2="212" y2="372" stroke="#F08C4A" stroke-width="3" stroke-linecap="round"/><text x="230" y="376" font-size="18" font-weight="700" fill="#F08C4A">23 hours, cut short</text><circle cx="200" cy="140" r="9" fill="#6E9BF5"/><text x="170" y="146" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Mon 10:02</text><text x="230" y="146" font-size="18" fill="#E8E6DC">Opened the pricing page</text><circle cx="200" cy="186" r="9" fill="#6E9BF5"/><text x="170" y="192" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Mon 10:04</text><text x="230" y="192" font-size="18" fill="#E8E6DC">Signed up</text><circle cx="200" cy="232" r="9" fill="#6E9BF5"/><text x="170" y="238" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Mon 10:05</text><text x="230" y="238" font-size="18" fill="#E8E6DC">Confirmed the email</text><circle cx="200" cy="278" r="9" fill="#6E9BF5"/><text x="170" y="284" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Mon 10:11</text><text x="230" y="284" font-size="18" fill="#E8E6DC">Made a first banner</text><circle cx="200" cy="324" r="9" fill="#6E9BF5"/><text x="170" y="330" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Mon 10:26</text><text x="230" y="330" font-size="18" fill="#E8E6DC">Exported it as a GIF</text><circle cx="200" cy="416" r="9" fill="#6E9BF5"/><text x="170" y="422" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Tue 09:14</text><text x="230" y="422" font-size="18" fill="#E8E6DC">Came back to it</text><circle cx="200" cy="462" r="9" fill="#5CC26A"/><text x="170" y="468" font-size="18" font-weight="700" text-anchor="end" fill="#E8E6DC">Tue 09:20</text><text x="230" y="468" font-size="18" fill="#5CC26A">Upgraded to Pro</text><text x="20" y="548" font-size="18" fill="#BAB8AB">Top to bottom, first to last; one row per step, however long between them.</text></svg>
