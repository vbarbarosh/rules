<rect x="340" y="248" width="32" height="32" rx="4" fill="#BDB9B1"/>
<rect x="384" y="258" width="96" height="14" rx="4" fill="#BDB9B1"/>
<rect x="492" y="258" width="32" height="14" rx="4" fill="#BDB9B1"/>
<rect x="340" y="296" width="32" height="32" rx="4" fill="#BDB9B1"/>
<rect x="384" y="306" width="72" height="14" rx="4" fill="#BDB9B1"/>
<rect x="492" y="306" width="32" height="14" rx="4" fill="#BDB9B1"/>
<text x="340" y="368" font-size="18" fill="#1F1E1C" font-weight="700">Total</text>
<text x="524" y="368" font-size="18" fill="#1F1E1C" font-weight="700" text-anchor="end">$84.00</text>
<rect x="340" y="384" width="184" height="40" rx="6" fill="#F1EFEB" stroke="#B5B1A8" stroke-width="1.5"/>
<text x="354" y="410" font-size="18" fill="#5C5A55">Coupon code</text>
<rect x="340" y="440" width="184" height="44" rx="6" fill="#FCE4D6" stroke="#C92A2A" stroke-width="1.5"/>
<text x="354" y="468" font-size="18" fill="#C92A2A" font-weight="700">Card declined</text>
<rect x="340" y="496" width="184" height="44" rx="6" fill="#2B3FBF" stroke="#2B3FBF" stroke-width="1.5"/>
<text x="432" y="524" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">Pay $84.00</text>
<circle cx="556" cy="462" r="15" fill="#C2410C"/>
<text x="556" y="468" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">3</text>
<circle cx="628" cy="160" r="15" fill="#C2410C"/>
<text x="628" y="166" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">1</text>
<text x="654" y="166" font-size="18" fill="#1F1E1C" font-weight="700">The coupon field moves</text>
<text x="654" y="194" font-size="18" fill="#5C5A55">from the top of the page</text>
<text x="654" y="220" font-size="18" fill="#5C5A55">to under the total, next to</text>
<text x="654" y="246" font-size="18" fill="#5C5A55">the price it changes.</text>
<circle cx="628" cy="294" r="15" fill="#C2410C"/>
<text x="628" y="300" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">2</text>
<text x="654" y="300" font-size="18" fill="#1F1E1C" font-weight="700">Pay shows a spinner</text>
<text x="654" y="328" font-size="18" fill="#5C5A55">and stays disabled until the</text>
<text x="654" y="354" font-size="18" fill="#5C5A55">bank answers: a second click</text>
<text x="654" y="380" font-size="18" fill="#5C5A55">charges nothing.</text>
<circle cx="628" cy="428" r="15" fill="#C2410C"/>
<text x="628" y="434" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">3</text>
<text x="654" y="434" font-size="18" fill="#1F1E1C" font-weight="700">The error shows by Pay,</text>
<text x="654" y="462" font-size="18" fill="#5C5A55">right above the button; at</text>
<text x="654" y="488" font-size="18" fill="#5C5A55">the top of the page it was</text>
<text x="654" y="514" font-size="18" fill="#5C5A55">out of sight.</text>
<rect x="20" y="594" width="960" height="68" rx="8" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="1.5"/>
<text x="40" y="635" font-size="18" fill="#1F1E1C"><tspan font-weight="700" fill="#2B3FBF">Now</tspan><tspan dx="14">Three changes: the coupon by the total, Pay locked while paying, the error by Pay.</tspan></text>
</svg>
