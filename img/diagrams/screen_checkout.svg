<rect x="100" y="306" width="72" height="14" rx="4" fill="#BDB9B1"/>
<rect x="208" y="306" width="32" height="14" rx="4" fill="#BDB9B1"/>
<text x="56" y="368" font-size="18" fill="#1F1E1C" font-weight="700">Total</text>
<text x="240" y="368" font-size="18" fill="#1F1E1C" font-weight="700" text-anchor="end">$84.00</text>
<rect x="56" y="384" width="184" height="40" rx="6" fill="#F1EFEB" stroke="#B5B1A8" stroke-width="1.5"/>
<text x="70" y="410" font-size="18" fill="#5C5A55">Coupon code</text>
<rect x="56" y="456" width="184" height="44" rx="6" fill="#D6DCF1" stroke="#D6DCF1" stroke-width="1.5"/>
<circle cx="82" cy="478" r="9" fill="none" stroke="#2B3FBF" stroke-width="3" stroke-dasharray="40 17"/>
<text x="102" y="484" font-size="18" fill="#5C5A55" font-weight="700">Paying…</text>
<rect x="56" y="524" width="120" height="12" rx="4" fill="#BDB9B1"/>
<circle cx="272" cy="404" r="15" fill="#C2410C"/>
<text x="272" y="410" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">1</text>
<circle cx="272" cy="478" r="15" fill="#C2410C"/>
<text x="272" y="484" font-size="18" fill="#F1EFEB" font-weight="700" text-anchor="middle">2</text>
<text x="324" y="140" font-size="18" fill="#5C5A55" font-weight="700">Card declined</text>
<rect x="324" y="156" width="264" height="400" rx="14" fill="#E9E6E0" stroke="#BDB9B1" stroke-width="1.5"/>
<rect x="340" y="172" width="80" height="20" rx="4" fill="#BDB9B1"/>
<rect x="500" y="172" width="24" height="20" rx="4" fill="#BDB9B1"/>
