<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><rect width="1000" height="680" fill="#E9E6E0"/>
