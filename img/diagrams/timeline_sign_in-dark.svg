<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-text" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#E8E6DC" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#6E9BF5" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#F06A62" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#5CC26A" stroke-linejoin="round"/></marker><marker id="arrow-grey" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#A9A79B" stroke-linejoin="round"/></marker></defs><rect width="1000" height="520" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">Timeline: a sign-in, second by second</text><text x="20" y="82" font-size="18" fill="#BAB8AB">What happened when, from the app's log.</text><line x1="40" y1="260" x2="960" y2="260" stroke="#8A887C" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="250" x2="110" y2="196" stroke="#6E9BF5" stroke-width="1.75"/><circle cx="110" cy="260" r="9" fill="#6E9BF5"/><text x="110" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#E8E6DC">14:23:10</text><text x="110" y="180" font-size="18" text-anchor="midd