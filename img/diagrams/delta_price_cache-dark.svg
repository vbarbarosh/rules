<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-text" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#E8E6DC" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#6E9BF5" stroke-linejoin="round"/></marker><marker id="arrow-grey" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#A9A79B" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#5CC26A" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#F06A62" stroke-linejoin="round"/></marker></defs><rect width="1000" height="600" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">Before and after: checkout gets a price cache</text><text x="20" y="82" font-size="18" fill="#BAB8AB">One map of the system now, each part marked by what the change did to it.</text><rect x="20" y="104" width="118" height="34" rx="17" fill="#1E3A24" stroke="#5CC26A" stroke-width="1.5"/><text x="34" y="127" font-size="18" font-weight="700" fill="#5CC26A">+ 1 added</text><rect x="150" y="104" width="138" height="34" rx="17" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.5"/><text x="164" y="127" font-size="18" font-weight="700" fill="#6E9BF5">~ 1 changed</text><rect x="298" y="104" width="138" height="34" rx="17" fill="#4A2323" stroke="#F06A62" stroke-width="1.5"/><text x="312" y="127" font-size="18" font-weight="700" fill="#F06A62">− 1 removed</text><text x="452" y="127" font-size="18" fill="#BAB8AB">2 stay the same</text><path d="M248 300 H350" fill="none" stroke="#E8E6DC" stroke-width="2.5" marker-end="url(#arrow-text)"/><text x="298" y="276" font-size="18" text-anchor="middle" fill="#BAB8AB">HTTPS</text><path d="M608 290 H700" fill="none" stroke="#E8E6DC" stroke-width="2.5" marker-end="url(#arrow-text)"/><text x="654" y="274" font-size="18" text-anchor="middle" fill="#BAB8AB">SQL</text><path d="M520 254 V214 H700" fill="none" stroke="#5CC26A" stroke-width="2.5" marker-end="url(#arrow-green)"/><text x="612" y="204" font-size="18" font-weight="700" text-anchor="middle" fill="#5CC26A">cache first</text><path d="M608 430 H780 V350" fill="none" stroke="#F06A62" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/><text x="690" y="420" font-size="18" text-anchor="middle" fill="#F06A62">every night</text><rect x="40" y="262" width="200" height="76" rx="10" fill="#26252A" stroke="#8A887C" stroke-width="2.5"/><text x="58" y="294" font-size="18" font-weight="700" fill="#E8E6DC">Browser</text><text x="58" y="320" font-size="18" fill="#BAB8AB">the shop</text><rect x="360" y="262" width="240" height="76" rx="10" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="2.5"/><text x="378" y="294" font-size="18" font-weight="700" fill="#E8E6DC">Checkout API</text><text x="378" y="320" font-size="18" fill="#6E9BF5">reads the cache</text><circle cx="576" cy="286" r="14" fill="#6E9BF5"/><text x="576" y="293" font-size="20" font-weight="700" text-anchor="middle" fill="#1A1918">~</text><rect x="710" y="176" width="230" height="76" rx="10" fill="#1E3A24" stroke="#5CC26A" stroke-width="2.5"/><text x="728" y="208" font-size="18" font-weight="700" fill="#E8E6DC">Redis</text><text x="728" y="234" font-size="18" fill="#5CC26A">prices, 5 min</text><circle cx="916" cy="200" r="14" fill="#5CC26A"/><text x="916" y="207" font-size="20" font-weight="700" text-anchor="middle" fill="#1A1918">+</text><rect x="710" y="262" width="230" height="76" rx="10" fill="#26252A" stroke="#8A887C" stroke-width="2.5"/><text x="728" y="294" font-size="18" font-weight="700" fill="#E8E6DC">MySQL</text><text x="728" y="320" font-size="18" fill="#BAB8AB">orders, prices</text><rect x="360" y="392" width="240" height="76" rx="10" fill="#4A2323" stroke="#F06A62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="378" y="424" font-size="18" font-weight="700" text-decoration="line-through" fill="#F06A62">Price cron</text><text x="378" y="450" font-size="18" fill="#F06A62">gone: prices live</text><circle cx="576" cy="416" r="14" fill="#F06A62"/><text x="576" y="423" font-size="20" font-weight="700" text-anchor="middle" fill="#1A1918">−</text><rect x="20" y="512" width="960" height="68" rx="8" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.5"/><text x="40" y="553" font-size="18" fill="#E8E6DC"><tspan font-weight="700" fill="#6E9BF5">Now</tspan><tspan dx="14">Prices come from Redis, filled as they change; the nightly cron is gone.</tspan></text></svg>
