06" y="250" font-size="18" text-anchor="middle" fill="#1F1E1C">Tracker</text><rect x="699" y="277" width="120" height="27" rx="5" fill="#F1EFEB"/><text x="705" y="297" font-size="18" fill="#5C5A55">holds rows</text><rect x="592" y="331" width="239" height="27" rx="5" fill="#F1EFEB"/><text x="598" y="351" font-size="18" fill="#2B3FBF">13:05 INSERT … SELECT</text><rect x="592" y="385" width="153" height="27" rx="5" fill="#F1EFEB"/><text x="598" y="405" font-size="18" fill="#C92A2A">1213 deadlock</text><rect x="592" y="439" width="207" height="27" rx="5" fill="#F1EFEB"/><text x="598" y="459" font-size="18" fill="#2B3FBF">once more, at once</text><rect x="592" y="493" width="99" height="27" rx="5" fill="#F1EFEB"/><text x="598" y="513" font-size="18" fill="#2B8A3E">inserted</text><rect x="592" y="547" width="99" height="27" rx="5" fill="#F1EFEB"/><text x="598" y="567" font-size="18" fill="#5C5A55">no event</text><rect x="526" y="128" width="71" height="36" rx="6" fill="#DDF0E0"/><text x="536" y="153" font-size="21" font-weight="700" fill="#2B8A3E">Made</text><text x="20" y="658" font-size="18" fill="#5C5A55">Reproduced locally: a writer holding the rows deadlocks the insert 3 of 3 times;</text><text x="20" y="686" font-size="18" fill="#5C5A55">with the retry, 3 of 3 insert.</text></svg>
