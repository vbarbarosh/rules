<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#6E9BF5" stroke-linejoin="round"/></marker></defs><rect width="1000" height="760" fill="#1E1D21"/><text x="20" y="46" font-size="26" font-weight="700" fill="#E8E6DC">servermon · kept running by the agent</text><text x="20" y="82" font-size="18" fill="#BAB8AB">The machine's load, logged every second; the agent starts servermon and checks on it.</text><rect x="20" y="112" width="960" height="590" rx="10" fill="#26252A" stroke="#45443A" stroke-width="1.5"/><rect x="132" y="168" width="36" height="19" rx="4" stroke="#BAB8AB" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="132" y="191" width="36" height="19" rx="4" stroke="#BAB8AB" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="141" cy="178" r="2.5" fill="#BAB8AB"/><circle cx="141" cy="201" r="2.5" fill="#BAB8AB"/><rect x="373" y="168" width="34" height="40" rx="4" stroke="#6E9BF5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M381 180 H399 M381 188 H399 M381 196 H394" stroke="#6E9BF5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="630" cy="188" r="20" stroke="#6E9BF5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M630 177 V188 L638 194" stroke="#6E9BF5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="240" font-size="18" text-anchor="middle" fill="#E8E6DC">systemd</text><line x1="150" y1="258" x2="150" y2="680" stroke="#5E5C4E" stroke-width="1.6" stroke-dasharray="5 5"/><text x="390" y="240" font-size="18" text-anchor="middle" fill="#E8E6DC">Agent</text><line x1="390" y1="258" x2="390" y2="680" stroke="#5E5C4E" stroke-width="1.6" stroke-dasharray="5 5"/><text x="630" y="240" font-size="18" text-anchor="middle" fill="#E8E6DC">servermon</text><line x1="630" y1="258" x2="630" y2="680" stroke="#5E5C4E" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="150" y1="310" x2="386" y2="310" stroke="#6E9BF5" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="158" y="280" width="70" height="27" rx="5" fill="#26252A"/><text x="164" y="300" font-size="18" fill="#6E9BF5">start</text><line x1="390" y1="370" x2="626" y2="370" stroke="#6E9BF5" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="398" y="340" width="190" height="27" rx="5" fill="#26252A"/><text x="404" y="360" font-size="18" fill="#6E9BF5">write, start .js</text><text x="644" y="376" font-size="18" fill="#5CC26A">a JSON line a second</text><text x="398" y="430" font-size="18" fill="#BAB8AB">its own log</text><line x1="150" y1="490" x2="386" y2="490" stroke="#6E9BF5" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="158" y="460" width="166" height="27" rx="5" fill="#26252A"/><text x="164" y="480" font-size="18" fill="#6E9BF5">agent restarted</text><text x="644" y="496" font-size="18" fill="#5CC26A">keeps running</text><rect x="392" y="578" width="236" height="48" rx="16" fill="none" stroke="#F08C4A" stroke-width="3"/><path d="M502 570 L516 578 L502 586 Z" fill="#F08C4A"/><path d="M518 618 L504 626 L518 634 Z" fill="#F08C4A"/><text x="510" y="608" font-size="18" text-anchor="middle" fill="#E8E6DC">every minute</text><text x="644" y="584" font-size="18" fill="#E8E6DC">alive? writing?</text><text x="644" y="610" font-size="18" fill="#BAB8AB">gone, silent 30 s or older:</text><text x="644" y="636" font-size="18" fill="#BAB8AB">started again</text><text x="20" y="736" font-size="18" fill="#BAB8AB">systemd keeps the agent up; the agent keeps servermon up, a minute at most.</text></svg>
