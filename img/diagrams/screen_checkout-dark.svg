<rect x="40" y="156" width="264" height="400" rx="14" fill="#1E1D21" stroke="#5E5C4E" stroke-width="1.5"/>
<rect x="56" y="172" width="80" height="20" rx="4" fill="#5E5C4E"/>
<rect x="216" y="172" width="24" height="20" rx="4" fill="#5E5C4E"/>
