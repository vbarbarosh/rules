<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><rect width="1000" height="680" fill="#1E1D21"/>
<text x="20" y="46" font-size="26" fill="#E8E6DC" font-weight="700">Annotated screen: the checkout page</text>
<text x="20" y="82" font-size="18" fill="#BAB8AB">Grey stays as it is; each amber number marks a change, the list says what.</text>
