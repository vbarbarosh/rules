<rect x="100" y="258" width="96" height="14" rx="4" fill="#5E5C4E"/>
<rect x="208" y="258" width="32" height="14" rx="4" fill="#5E5C4E"/>
<rect x="56" y="296" width="32" height="32" rx="4" fill="#5E5C4E"/>
<rect x="100" y="306" width="72" height="14" rx="4" fill="#5E5C4E"/>
<rect x="208" y="306" width="32" height="14" rx="4" fill="#5E5C4E"/>
<text x="56" y="368" font-size="18" fill="#E8E6DC" font-weight="700">Total</text>
<text x="240" y="368" font-size="18" fill="#E8E6DC" font-weight="700" text-anchor="end">$84.00</text>
<rect x="56" y="384" width="184" height="40" rx="6" fill="#26252A" stroke="#6B695D" stroke-width="1.5"/>
<text x="70" y="410" font-size="18" fill="#BAB8AB">Coupon code</text>
<rect x="56" y="456" width="184" height="44" rx="6" fill="#1E2A4A" stroke="#1E2A4A" stroke-width="1.5"/>
<circle cx="82" cy="478" r="9" fill="none" stroke="#6E9BF5" stroke-width="3" stroke-dasharray="40 17"/>
<text x="102" y="484" font-size="18" fill="#BAB8AB" font-weight="700">Paying…</text>
<rect x="56" y="524" width="120" height="12" rx="4" fill="#5E5C4E"/>
<circle cx="272" cy="404" r="15" fill="#F08C4A"/>
<text x="272" y="410" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">1</text>
<circle cx="272" cy="478" r="15" fill="#F08C4A"/>
<text x="272" y="484" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">2</text>
<text x="324" y="140" font-size="18" fill="#BAB8AB" font-weight="700">Card declined</text>
<rect x="324" y="156" width="264" height="400" rx="14" fill="#1E1D21" stroke="#5E5C4E" stroke-width="1.5"/>
<rect x="340" y="172" width="80" height="20" rx="4" fill="#5E5C4E"/>
<rect x="500" y="172" width="24" height="20" rx="4" fill="#5E5C4E"/>
<text x="340" y="228" font-size="20" fill="#E8E6DC" font-weight="700">Checkout</text>
<rect x="340" y="248" width="32" height="32" rx="4" fill="#5E5C4E"/>
<rect x="384" y="258" width="96" height="14" rx="4" fill="#5E5C4E"/>
<rect x="492" y="258" width="32" height="14" rx="4" fill="#5E5C4E"/>
<rect x="340" y="296" width="32" height="32" rx="4" fill="#5E5C4E"/>
<rect x="384" y="306" width="72" height="14" rx="4" fill="#5E5C4E"/>
<rect x="492" y="306" width="32" height="14" rx="4" fill="#5E5C4E"/>
<text x="340" y="368" font-size="18" fill="#E8E6DC" font-weight="700">Total</text>
<text x="524" y="368" font-size="18" fill="#E8E6DC" font-weight="700" text-anchor="end">$84.00</text>
<rect x="340" y="384" width="184" height="40" rx="6" fill="#26252A" stroke="#6B695D" stroke-width="1.5"/>
<text x="354" y="410" font-size="18" fill="#BAB8AB">Coupon code</text>
<rect x="340" y="440" width="184" height="44" rx="6" fill="#3D2A1D" stroke="#F06A62" stroke-width="1.5"/>
<text x="354" y="468" font-size="18" fill="#F06A62" font-weight="700">Card declined</text>
<rect x="340" y="496" width="184" height="44" rx="6" fill="#6E9BF5" stroke="#6E9BF5" stroke-width="1.5"/>
<text x="432" y="524" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">Pay $84.00</text>
<circle cx="556" cy="462" r="15" fill="#F08C4A"/>
<text x="556" y="468" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">3</text>
<circle cx="628" cy="160" r="15" fill="#F08C4A"/>
<text x="628" y="166" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">1</text>
<text x="654" y="166" font-size="18" fill="#E8E6DC" font-weight="700">The coupon field moves</text>
<text x="654" y="194" font-size="18" fill="#BAB8AB">from the top of the page</text>
<text x="654" y="220" font-size="18" fill="#BAB8AB">to under the total, next to</text>
<text x="654" y="246" font-size="18" fill="#BAB8AB">the price it changes.</text>
<circle cx="628" cy="294" r="15" fill="#F08C4A"/>
<text x="628" y="300" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">2</text>
<text x="654" y="300" font-size="18" fill="#E8E6DC" font-weight="700">Pay shows a spinner</text>
<text x="654" y="328" font-size="18" fill="#BAB8AB">and stays disabled until the</text>
<text x="654" y="354" font-size="18" fill="#BAB8AB">bank answers: a second click</text>
<text x="654" y="380" font-size="18" fill="#BAB8AB">charges nothing.</text>
<circle cx="628" cy="428" r="15" fill="#F08C4A"/>
<text x="628" y="434" font-size="18" fill="#26252A" font-weight="700" text-anchor="middle">3</text>
<text x="654" y="434" font-size="18" fill="#E8E6DC" font-weight="700">The error shows by Pay,</text>
<text x="654" y="462" font-size="18" fill="#BAB8AB">right above the button; at</text>
<text x="654" y="488" font-size="18" fill="#BAB8AB">the top of the page it was</text>
<text x="654" y="514" font-size="18" fill="#BAB8AB">out of sight.</text>
<rect x="20" y="594" width="960" height="68" rx="8" fill="#1E2A4A" stroke="#6E9BF5" stroke-width="1.5"/>
<text x="40" y="635" font-size="18" fill="#E8E6DC"><tspan font-weight="700" fill="#6E9BF5">Now</tspan><tspan dx="14">Three changes: the coupon by the total, Pay locked while paying, the error by Pay.</tspan></text>
</svg>
