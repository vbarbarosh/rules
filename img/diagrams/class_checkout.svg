<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><defs><marker id="arrow-text" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#1F1E1C" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2B3FBF" stroke-linejoin="round"/></marker><marker id="arrow-grey" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#5C5A55" stroke-linejoin="round"/></marker></defs><rect width="1000" height="760" fill="#E9E6E0"/><text x="20" y="46" font-size="26" font-weight="700" fill="#1F1E1C">Class diagram: how checkout pays</text><text x="20" y="82" font-size="18" fill="#5C5A55">The types, their fields and methods, and how they link; the green one is new.</text><path d="M190 334 V460" stroke="#1F1E1C" stroke-width="2"/><path d="M190 312 l9 11 -9 11 -9 -11 z" fill="#1F1E1C"/><text x="204" y="356" font-size="18" font-weight="700" fill="#1F1E1C">1</text><text x="204" y="450" font-size="18" font-weight="700" fill="#1F1E1C">n</text><text x="212" y="390" font-size="18" fill="#5C5A55">is made of</text><path d="M348 200 H552" fill="none" stroke="#1F1E1C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-text)"/><text x="446" y="190" font-size="18" text-anchor="middle" fill="#5C5A55">pays with</text><path d="M555 430 V324 H720 V296 M845 430 V324 H720" fill="none" stroke="#1F1E1C" stroke-width="2" stroke-dasharray="8 6"/><path d="M720 278 l-11 18 h22 z" fill="#F1EFEB" stroke="#1F1E1C" stroke-width="2"/><text x="700" y="362" font-size="18" text-anchor="middle" fill="#5C5A55">both are a PaymentMethod</text><rect x="40" y="130" width="300" height="182" rx="10" fill="#F1EFEB" stroke="#8F8B82" stroke-width="2"/><rect x="42" y="132" width="296" height="40" rx="8" fill="#D6DCF1"/><text x="190" y="159" font-size="20" font-weight="700" text-anchor="middle" fill="#1F1E1C">Order</text><path d="M40 172 H340 M40 270 H340" stroke="#8F8B82" stroke-width="1.5"/><text x="56" y="202" font-size="18" fill="#1F1E1C">id: number</text><text x="56" y="230" font-size="18" fill="#1F1E1C">lines: OrderLine[]</text><text x="56" y="258" font-size="18" fill="#1F1E1C">total: Money</text><text x="56" y="300" font-size="18" fill="#1F1E1C">pay(method)</text><rect x="40" y="460" width="300" height="154" rx="10" fill="#F1EFEB" stroke="#8F8B82" stroke-width="2"/><rect x="42" y="462" width="296" height="40" rx="8" fill="#D6DCF1"/><text x="190" y="489" font-size="20" font-weight="700" text-anchor="middle" fill="#1F1E1C">OrderLine</text><path d="M40 502 H340 M40 572 H340" stroke="#8F8B82" stroke-width="1.5"/><text x="56" y="532" font-size="18" fill="#1F1E1C">product: Product</text><text x="56" y="560" font-size="18" fill="#1F1E1C">quantity: number</text><text x="56" y="602" font-size="18" fill="#1F1E1C">subtotal()</text><rect x="560" y="130" width="320" height="148" rx="10" fill="#F1EFEB" stroke="#8F8B82" stroke-width="2"/><rect x="562" y="132" width="316" height="62" rx="8" fill="#D6DCF1"/><text x="720" y="156" font-size="18" text-anchor="middle" fill="#5C5A55">«interface»</text><text x="720" y="182" font-size="20" font-weight="700" text-anchor="middle" font-style="italic" fill="#1F1E1C">PaymentMethod</text><path d="M560 194 H880 M560 208 H880" stroke="#8F8B82" stroke-width="1.5"/><text x="576" y="238" font-size="18" fill="#1F1E1C">charge(amount): Receipt</text><text x="576" y="266" font-size="18" fill="#1F1E1C">refund(receipt)</text><rect x="430" y="430" width="250" height="154" rx="10" fill="#F1EFEB" stroke="#8F8B82" stroke-width="2"/><rect x="432" y="432" width="246" height="40" rx="8" fill="#D6DCF1"/><text x="555" y="459" font-size="20" font-weight="700" text-anchor="middle" fill="#1F1E1C">CardPayment</text><path d="M430 472 H680 M430 514 H680" stroke="#8F8B82" stroke-width="1.5"/><text x="446" y="502" font-size="18" fill="#1F1E1C">token: string</text><text x="446" y="544" font-size="18" fill="#1F1E1C">charge(amount)</text><text x="446" y="572" font-size="18" fill="#1F1E1C">refund(receipt)</text><rect x="720" y="430" width="250" height="182" rx="10" fill="#F1EFEB" stroke="#2B8A3E" stroke-width="2"/><rect x="722" y="432" width="246" height="40" rx="8" fill="#DDF0E0"/><text x="845" y="459" font-size="20" font-weight="700" text-anchor="middle" fill="#1F1E1C">GiftCardPayment</text><path d="M720 472 H970 M720 542 H970" stroke="#2B8A3E" stroke-width="1.5"/><text x="736" y="502" font-size="18" fill="#1F1E1C">code: string</text><text x="736" y="530" font-size="18" fill="#1F1E1C">balance: Money</text><text x="736" y="572" font-size="18" fill="#1F1E1C">charge(amount)</text><text x="736" y="600" font-size="18" fill="#1F1E1C">refund(receipt)</text><text x="845" y="642" font-size="18" font-weight="700" text-anchor="middle" fill="#2B8A3E">new</text><rect x="20" y="672" width="960" height="68" rx="8" fill="#D6DCF1" stroke="#2B3FBF" stroke-width="1.5"/><text x="40" y="713" font-size="18" fill="#1F1E1C"><tspan font-weight="700" fill="#2B3FBF">Now</tspan><tspan dx="14">A new way to pay is one more class under PaymentMethod; Order does not change.</tspan></text></svg>
