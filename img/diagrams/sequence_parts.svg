<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 594" width="1000" height="594" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><rect width="1000" height="594" fill="#E9E6E0"/><text x="20" y="46" font-size="26" font-weight="700" fill="#1F1E1C">A sequence diagram: who talks to whom, in time order</text><text x="20" y="82" font-size="18" fill="#5C5A55">Its parts, named as UML, Mermaid and PlantUML name them.</text><rect x="20" y="112" width="590" height="458" rx="10" fill="#F1EFEB" stroke="#D3CFC7" stroke-width="1.5"/><circle cx="109" cy="190" r="9" fill="#55534E"/><path d="M92 220 C92 206 100 201 109 201 C118 201 126 206 126 220 Z" fill="#55534E"/><line x1="109" y1="270" x2="109" y2="548" stroke="#BDB9B1" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="224" y="182" width="44" height="30" rx="3" stroke="#55534E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M218 218 H274" stroke="#55534E" stroke-width="5" stroke-linecap="round"/><line x1="246" y1="270" x2="246" y2="548" stroke="#BDB9B1" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="366" y="180" width="36" height="19" rx="4" stroke="#2B3FBF" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="366" y="203" width="36" height="19" rx="4" stroke="#2B3FBF" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="375" cy="190" r="2.5" fill="#2B3FBF"/><circle cx="375" cy="213" r="2.5" fill="#2B3FBF"/><line x1="384" y1="270" x2="384" y2="548" stroke="#BDB9B1" stroke-width="1.6" stroke-dasharray="5 5"/><path d="M521 180 L544 220 H498 Z" fill="#FBDCDC" stroke="#C92A2A" stroke-width="3" stroke-linejoin="round"/><path d="M521 194 V205" stroke="#C92A2A" stroke-width="3.5" stroke-linecap="round"/><circle cx="521" cy="212" r="2.3" fill="#C92A2A"/><line x1="521" y1="270" x2="521" y2="548" stroke="#BDB9B1" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="109" y1="314" x2="243" y2="314" stroke="#1F1E1C" stroke-width="2.5"/><path d="M234 307 L244 314 L234 321" fill="none" stroke="#1F1E1C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="246" y1="368" x2="381" y2="368" stroke="#2B3FBF" stroke-width="2.5"/><path d="M372 361 L382 368 L372 375" fill="none" stroke="#2B3FBF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="384" y1="422" x2="249" y2="422" stroke="#2B3FBF" stroke-width="2.5"/><path d="M258 415 L248 422 L258 429" fill="none" stroke="#2B3FBF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="246" y1="476" x2="112" y2="476" stroke="#2B8A3E" stroke-width="2.5"/><path d="M121 469 L111 476 L121 483" fill="none" stroke="#2B8A3E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="246" y1="530" x2="518" y2="530" stroke="#C92A2A" stroke-width="2.5"/><path d="M509 523 L519 530 L509 537" fill="none" stroke="#C92A2A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="553" y1="202" x2="626" y2="202" stroke="#6741C4" stroke-width="1.6"/><circle cx="553" cy="202" r="4" fill="#6741C4"/><line x1="525" y1="288" x2="626" y2="288" stroke="#6741C4" stroke-width="1.6"/><circle cx="525" cy="288" r="4" fill="#6741C4"/><line x1="392" y1="368" x2="626" y2="368" stroke="#6741C4" stroke-width="1.6"/><circle cx="392" cy="368" r="4" fill="#6741C4"/><line x1="640" y1="462" x2="678" y2="462" stroke="#2B3FBF" stroke-width="3"/><line x1="640" y1="496" x2="678" y2="496" stroke="#2B8A3E" stroke-width="3"/><line x1="640" y1="530" x2="678" y2="530" stroke="#C92A2A" stroke-width="3"/><line x1="640" y1="564" x2="678" y2="564" stroke="#5C5A55" stroke-width="3"/><text x="109" y="250" font-size="18" text-anchor="middle" fill="#1F1E1C">Person</text><text x="246" y="250" font-size="18" text-anchor="middle" fill="#1F1E1C">Browser</text><text x="384" y="250" font-size="18" text-anchor="middle" fill="#1F1E1C">Server</text><text x="521" y="250" font-size="18" text-anchor="middle" fill="#1F1E1C">Tracker</text><rect x="117" y="277" width="185" height="27" rx="5" fill="#F1EFEB"/><text x="123" y="297" font-size="18" fill="#1F1E1C">Create a project</text><rect x="254" y="331" width="164" height="27" rx="5" fill="#F1EFEB"/><text x="260" y="351" font-size="18" fill="#2B3FBF">POST /projects</text><rect x="254" y="385" width="164" height="27" rx="5" fill="#F1EFEB"/><text x="260" y="405" font-size="18" fill="#2B3FBF">403 plan limit</text><rect x="117" y="439" width="164" height="27" rx="5" fill="#F1EFEB"/><text x="123" y="459" font-size="18" fill="#2B8A3E">Upgrade window</text><rect x="254" y="493" width="164" height="27" rx="5" fill="#F1EFEB"/><text x="260" y="513" font-size="18" fill="#C92A2A">an error event</text><rect x="36" y="128" width="83" height="36" rx="6" fill="#FBDCDC"/><text x="46" y="153" font-size="21" font-weight="700" fill="#C92A2A">Today</text><text x="640" y="208" font-size="18" fill="#6741C4">participant: an icon, its name</text><text x="640" y="294" font-size="18" fill="#6741C4">lifeline: dashed, under each one</text><text x="640" y="374" font-size="18" fill="#6741C4">message: an arrow, a few words,</text><text x="640" y="400" font-size="18" fill="#6741C4">top to bottom in time order</text><text x="692" y="468" font-size="18" fill="#2B3FBF">a request</text><text x="692" y="502" font-size="18" fill="#2B8A3E">a success, an answer</text><text x="692" y="536" font-size="18" fill="#C92A2A">a failure, an error</text><text x="692" y="570" font-size="18" fill="#5C5A55">what stays the same</text></svg>
