<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="Noto Sans, Ubuntu, system-ui, sans-serif">
<rect width="1160" height="560" fill="#E9E6E0"/>
<text x="20" y="46" font-size="26" fill="#1F1E1C" font-weight="700">Step tree: its parts</text>
<text x="20" y="82" font-size="18" fill="#5C5A55">A short tree, each part numbered where it is.</text>
<rect x="20" y="100" width="760" height="460" rx="10" fill="#F1EFEB" stroke="#BDB9B1"/>
<g font-family="JetBrains Mono, Cascadia Code, Menlo, DejaVu Sans Mono, ui-monospace, monospace">
<text x="72" y="147" font-size="22" font-weight="700" fill="#1F1E1C">🧩  Resize: one banner → many sizes</text>
<path d="M82 161V187" stroke="#2B3FBF" stroke-width="3" fill="none"/>
<path d="M82 187h18" stroke="#2B3FBF" stroke-width="3" fill="none"/>
<text x="108" y="194" font-size="20">👤</text>
<text x="142" y="194" font-size="20" font-weight="700" fill="#2B3FBF">Board (you)</text>
<path d="M118 205V217h16" stroke="#2B3FBF" stroke-width="2.5" fill="none"/>
<text x="142" y="224" font-size="20">☑️</text>
<text x="176" y="224" font-size="20" fill="#1F1E1C">tick sizes, drop the source banner</text>
<path d="M118 217V247h16" stroke="#2B3FBF" stroke-width="2.5" fill="none"/>
<text x="142" y="254" font-size="20">🔀</text>
<text x="176" y="254" font-size="20" fill="#1F1E1C">every size → its own chat turn</text>
<path d="M100 271H750" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
<path d="M82 187V295" stroke="#2B3FBF" stroke-width="3" fill="none"/>
<path d="M82 295h18" stroke="#2B3FBF" stroke-width="3" fill="none"/>
<text x="108" y="302" font-size="20">🤖</text>
<text x="142" y="302" font-size="20" font-weight="700" fill="#2B3FBF">Round 1 → gpt-6.1-sol</text>
<text x="740" y="302" font-size="20" font-weight="700" fill="#2B8A3E" text-anchor="end">💵 ~$0.005</text>
<path d="M118 313V325h16" stroke="#2B3FBF" stroke-width="2.5" fill="none"/>
<text x="142" y="332" font-size="20">📖</text>
<text x="176" y="332" font-size="20" fill="#1F1E1C">reads the layouts skill</text>
<path d="M82 295V373" stroke="#2B3FBF" stroke-width="3" fill="none"/>
<path d="M82 373h18" stroke="#C2410C" stroke-width="3" fill="none"/>
<text x="108" y="380" font-size="20">⚙️</text>
<text x="142" y="380" font-size="20" font-weight="700" fill="#C2410C">layout (code, no model)</text>
<text x="740" y="380" font-size="20" font-weight="700" fill="#2B3FBF" text-anchor="end">🆓 $0</text>
<path d="M118 391V403h16" stroke="#C2410C" stroke-width="2.5" fill="none"/>
<text x="142" y="410" font-size="20">📌</text>
<text x="176" y="410" font-size="20" fill="#1F1E1C">pinned elements kept on their edges</text>
<path d="M118 403V433h16" stroke="#C2410C" stroke-width="2.5" fill="none"/>
<text x="142" y="440" font-size="20">📦</text>
<text x="176" y="440" font-size="20" fill="#1F1E1C">blocks scaled whole</text>
<text x="740" y="440" font-size="20" font-weight="700" fill="#C92A2A" text-anchor="end">⚠️ the shoe stays small</text>
<path d="M82 373V481" stroke="#C2410C" stroke-width="3" fill="none"/>
<path d="M82 481h18" stroke="#2B8A3E" stroke-width="3" fill="none"/>
<text x="108" y="488" font-size="20">💾</text>
<text x="142" y="488" font-size="20" font-weight="700" fill="#2B8A3E">Save → a new banner per size</text>
<text x="72" y="536" font-size="20" font-weight="700" fill="#2B8A3E">💰  One size $0.035–0.06 · four sizes $0.20</text>
</g>
<circle cx="42" cy="139" r="12" fill="#C2410C"/><text x="42" y="145" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">1</text>
<circle cx="828" cy="117" r="12" fill="#C2410C"/><text x="828" y="123" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">1</text>
<text x="850" y="124" font-size="20" font-weight="700" fill="#1F1E1C">The title</text>
<text x="850" y="148" font-size="17" fill="#5C5A55">an emoji, then from → to</text>
<circle cx="42" cy="187" r="12" fill="#C2410C"/><text x="42" y="193" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">2</text>
<circle cx="828" cy="177" r="12" fill="#C2410C"/><text x="828" y="183" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">2</text>
<text x="850" y="184" font-size="20" font-weight="700" fill="#1F1E1C">A stage</text>
<text x="850" y="208" font-size="17" fill="#5C5A55">who or what does it, in its colour</text>
<rect x="70" y="391" width="24" height="24" rx="12" fill="#C2410C"/><text x="82" y="409" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">3</text>
<circle cx="828" cy="237" r="12" fill="#C2410C"/><text x="828" y="243" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">3</text>
<text x="850" y="244" font-size="20" font-weight="700" fill="#1F1E1C">The trunk</text>
<text x="850" y="268" font-size="17" fill="#5C5A55">one line, the colour of its stage</text>
<circle cx="42" cy="217" r="12" fill="#C2410C"/><text x="42" y="223" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">4</text>
<circle cx="828" cy="297" r="12" fill="#C2410C"/><text x="828" y="303" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">4</text>
<text x="850" y="304" font-size="20" font-weight="700" fill="#1F1E1C">The steps</text>
<text x="850" y="328" font-size="17" fill="#5C5A55">a leaf each, an emoji first</text>
<circle cx="42" cy="271" r="12" fill="#C2410C"/><text x="42" y="277" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">5</text>
<circle cx="828" cy="357" r="12" fill="#C2410C"/><text x="828" y="363" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">5</text>
<text x="850" y="364" font-size="20" font-weight="700" fill="#1F1E1C">A blank line</text>
<text x="850" y="388" font-size="17" fill="#5C5A55">between stages, none inside one</text>
<circle cx="758" cy="295" r="12" fill="#C2410C"/><text x="758" y="301" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">6</text>
<circle cx="828" cy="417" r="12" fill="#C2410C"/><text x="828" y="423" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">6</text>
<text x="850" y="424" font-size="20" font-weight="700" fill="#1F1E1C">Tags at the right</text>
<text x="850" y="448" font-size="17" fill="#5C5A55">a cost, free, a warning</text>
<circle cx="42" cy="529" r="12" fill="#C2410C"/><text x="42" y="535" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">7</text>
<circle cx="828" cy="477" r="12" fill="#C2410C"/><text x="828" y="483" font-size="17" font-weight="700" fill="#E9E6E0" text-anchor="middle">7</text>
<text x="850" y="484" font-size="20" font-weight="700" fill="#1F1E1C">The total</text>
<text x="850" y="508" font-size="17" fill="#5C5A55">the sum, the last line</text>
</svg>