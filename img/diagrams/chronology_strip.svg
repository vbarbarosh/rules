<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Noto Sans, Ubuntu, system-ui, sans-serif"><rect width="1000" height="470" fill="#E9E6E0"/><text x="20" y="46" font-size="26" font-weight="700" fill="#1F1E1C">Chronology: one user, first to last</text><text x="20" y="82" font-size="18" fill="#5C5A55">What one user did, in order; each step the same distance from the next.</text><line x1="40" y1="260" x2="960" y2="260" stroke="#8F8B82" stroke-width="3" stroke-linecap="round"/><rect x="661" y="246" width="18" height="28" fill="#E9E6E0"/><line x1="660" y1="272" x2="668" y2="248" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/><line x1="672" y1="272" x2="680" y2="248" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/><text x="670" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#C2410C">23 hours</text><text x="670" y="376" font-size="18" text-anchor="middle" fill="#C2410C">cut short</text><line x1="80" y1="250" x2="80" y2="196" stroke="#2B3FBF" stroke-width="1.75"/><circle cx="80" cy="260" r="9" fill="#2B3FBF"/><text x="80" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Mon 10:02</text><text x="80" y="180" font-size="18" text-anchor="middle" fill="#5C5A55">pricing page</text><line x1="200" y1="270" x2="200" y2="324" stroke="#2B3FBF" stroke-width="1.75"/><circle cx="200" cy="260" r="9" fill="#2B3FBF"/><text x="200" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Mon 10:04</text><text x="200" y="376" font-size="18" text-anchor="middle" fill="#5C5A55">signed up</text><line x1="320" y1="250" x2="320" y2="196" stroke="#2B3FBF" stroke-width="1.75"/><circle cx="320" cy="260" r="9" fill="#2B3FBF"/><text x="320" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Mon 10:05</text><text x="320" y="180" font-size="18" text-anchor="middle" fill="#5C5A55">email confirmed</text><line x1="440" y1="270" x2="440" y2="324" stroke="#2B3FBF" stroke-width="1.75"/><circle cx="440" cy="260" r="9" fill="#2B3FBF"/><text x="440" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Mon 10:11</text><text x="440" y="376" font-size="18" text-anchor="middle" fill="#5C5A55">first banner</text><line x1="560" y1="250" x2="560" y2="196" stroke="#2B3FBF" stroke-width="1.75"/><circle cx="560" cy="260" r="9" fill="#2B3FBF"/><text x="560" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Mon 10:26</text><text x="560" y="180" font-size="18" text-anchor="middle" fill="#5C5A55">GIF exported</text><line x1="780" y1="270" x2="780" y2="324" stroke="#2B3FBF" stroke-width="1.75"/><circle cx="780" cy="260" r="9" fill="#2B3FBF"/><text x="780" y="352" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Tue 09:14</text><text x="780" y="376" font-size="18" text-anchor="middle" fill="#5C5A55">came back</text><line x1="900" y1="250" x2="900" y2="196" stroke="#2B8A3E" stroke-width="1.75"/><circle cx="900" cy="260" r="9" fill="#2B8A3E"/><text x="900" y="156" font-size="18" font-weight="700" text-anchor="middle" fill="#1F1E1C">Tue 09:20</text><text x="900" y="180" font-size="18" text-anchor="middle" fill="#2B8A3E">upgraded to Pro</text><text x="20" y="446" font-size="18" fill="#5C5A55">Even steps: the order and the times count, not the gaps between them.</text></svg>
