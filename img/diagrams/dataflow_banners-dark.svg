<text x="108" y="308" font-size="16" fill="#BAB8AB" text-anchor="middle">WAF, CDN</text>
<text x="465" y="322" font-size="18" font-weight="bold" fill="#E8E6DC" text-anchor="middle">edge cache</text>
<text x="108" y="470" font-size="18" font-weight="bold" fill="#E8E6DC" text-anchor="middle">ALB +</text>
<text x="108" y="490" font-size="16" fill="#BAB8AB" text-anchor="middle">nginx</text>
