<text x="24" y="46" font-size="26" font-weight="bold" fill="#E8E6DC">Data flow diagram: where data crosses a trust boundary</text>
<text x="24" y="76" font-size="18" fill="#BAB8AB">Which data moves where, and at which points does it enter a zone trusted differently?</text>
<text x="680" y="228" font-size="16" font-weight="bold" fill="#F06A62" text-anchor="end">Cloudflare</text>
<text x="964" y="228" font-size="16" font-weight="bold" fill="#F06A62" text-anchor="end">AWS managed</text>
<text x="36" y="598" font-size="16" font-weight="bold" fill="#F06A62">AWS public</text>
<text x="36" y="618" font-size="16" font-weight="bold" fill="#F06A62">subnet</text>
<text x="680" y="618" font-size="16" font-weight="bold" fill="#F06A62" text-anchor="end">AWS private subnet</text>
<text x="200" y="150" font-size="16" font-weight="bold" fill="#F06A62">Internet: untrusted</text>
<text x="110" y="110.6" font-size="18" font-weight="bold" fill="#E8E6DC" text-anchor="middle">User</text>
<text x="110" y="130.6" font-size="16" fill="#BAB8AB" text-anchor="middle">browser, phone</text>
