<text x="228" y="182" font-size="16" fill="#BAB8AB">outside party</text>
<text x="365.59" y="182" font-size="16" fill="#BAB8AB">process</text>
<text x="467.83" y="182" font-size="16" fill="#BAB8AB">data store</text>
<text x="592.7" y="182" font-size="16" fill="#BAB8AB">trust boundary</text>
<text x="748.16" y="182" font-size="16" fill="#BAB8AB">crossing</text>
<text x="502" y="656" font-size="16" fill="#BAB8AB">TLS ends at the ALB: inside the VPC it is plain HTTP.</text>
<text x="502" y="678" font-size="16" fill="#BAB8AB">The upload skips Cloudflare's WAF: S3 must check it.</text>
<text x="502" y="700" font-size="16" fill="#BAB8AB">Only a card token leaves AWS, never a card number.</text>
<text x="24" y="742" font-size="17" fill="#BAB8AB">Good for: threat modelling (STRIDE per crossing), security reviews, privacy and data audits</text>
<text x="24" y="762" font-size="17" fill="#BAB8AB">Drawn with: Microsoft Threat Modeling Tool, OWASP Threat Dragon, IriusRisk, draw.io</text>
