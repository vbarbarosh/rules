<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#16181b"/>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Dictionary</text>
<text x="48" y="108" fill="#92958c" font-size="22">every word of a language, in order, each with all its meanings</text>
<rect x="48" y="150" width="1104" height="370" rx="16" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<rect x="1060" y="172" width="64" height="46" rx="23" fill="#1b2346" stroke="#9db2ff" stroke-width="1.5"/>
<text x="1092" y="204" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">P</text>
<text x="80" y="204" fill="#9db2ff" font-size="26" font-weight="700">process</text>
<text x="216" y="204" fill="#92958c" font-size="20" font-style="italic">noun</text>
<text x="104" y="238" fill="#d3d1c9" font-size="22">1. a running program: its own memory, from start to exit</text>
<text x="104" y="272" fill="#d3d1c9" font-size="22">2. a way of doing things, one step after another</text>
<line x1="80" y1="310" x2="1020" y2="310" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="350" fill="#9db2ff" font-size="26" font-weight="700">provider</text>
<text x="232" y="350" fill="#92958c" font-size="20" font-style="italic">noun</text>
<text x="104" y="384" fill="#d3d1c9" font-size="22">1. one that supplies what others need</text>
<line x1="80" y1="422" x2="1020" y2="422" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="462" fill="#9db2ff" font-size="26" font-weight="700">proxy</text>
<text x="184" y="462" fill="#92958c" font-size="20" font-style="italic">noun</text>
<text x="104" y="496" fill="#d3d1c9" font-size="22">1. one that acts for another, in its place</text>
<text x="48" y="568" fill="#92958c" font-size="21">A glossary keeps our words, one meaning each; a dictionary keeps every word, all its meanings.</text>
</svg>
