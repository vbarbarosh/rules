<rect x="224" y="272" width="140" height="46" rx="23" fill="#fffefb" stroke="#2743b8" stroke-width="1.5"/>
<text x="294" y="303" fill="#2743b8" font-size="22" text-anchor="middle" font-weight="700">message</text>
<rect x="376" y="272" width="140" height="46" rx="23" fill="#fffefb" stroke="#2743b8" stroke-width="1.5"/>
<text x="446" y="303" fill="#2743b8" font-size="22" text-anchor="middle" font-weight="700">transcript</text>
<rect x="528" y="272" width="140" height="46" rx="23" fill="#fffefb" stroke="#2743b8" stroke-width="1.5"/>
