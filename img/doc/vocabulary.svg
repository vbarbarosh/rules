<rect x="376" y="338" width="140" height="46" rx="23" fill="#fffefb" stroke="#2743b8" stroke-width="1.5"/>
<text x="446" y="369" fill="#2743b8" font-size="22" text-anchor="middle" font-weight="700">policy</text>
