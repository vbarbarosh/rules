<text x="760" y="292" fill="#686a61" font-size="24" text-anchor="start" style="text-decoration: line-through; text-decoration-color: #b2341f; text-decoration-thickness: 3px">iteration</text>
<text x="930" y="292" fill="#1a7443" font-size="22" text-anchor="start">→ round</text>
<text x="760" y="348" fill="#686a61" font-size="24" text-anchor="start" style="text-decoration: line-through; text-decoration-color: #b2341f; text-decoration-thickness: 3px">prompt</text>
<text x="930" y="348" fill="#1a7443" font-size="22" text-anchor="start">→ message</text>
<text x="760" y="404" fill="#686a61" font-size="24" text-anchor="start" style="text-decoration: line-through; text-decoration-color: #b2341f; text-decoration-thickness: 3px">chat</text>
<text x="930" y="404" fill="#1a7443" font-size="22" text-anchor="start">→ session</text>
<text x="760" y="460" fill="#686a61" font-size="24" text-anchor="start" style="text-decoration: line-through; text-decoration-color: #b2341f; text-decoration-thickness: 3px">bot</text>
<text x="930" y="460" fill="#1a7443" font-size="22" text-anchor="start">→ agent</text>
<text x="48" y="536" fill="#686a61" font-size="21" text-anchor="start">A vocabulary is the choice of words; a glossary (next) says what each one means.</text>
