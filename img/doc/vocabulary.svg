<text x="446" y="435" fill="#2743b8" font-size="22" text-anchor="middle" font-weight="700">sandbox</text>
<rect x="730" y="150" width="422" height="340" rx="16" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2" stroke-dasharray="12 8"/>
