<text x="126.28" y="358.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">policy</text>
<rect x="196.56" y="328" width="100" height="46" rx="23.0" fill="#1b2346"/>
<text x="246.46" y="358.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">skill</text>
<rect x="310.36" y="328" width="100" height="46" rx="23.0" fill="#1b2346"/>
<text x="360.26" y="358.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">final</text>
<rect x="424.16" y="328" width="87" height="46" rx="23.0" fill="#1b2346"/>
<text x="467.68" y="358.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">gate</text>
