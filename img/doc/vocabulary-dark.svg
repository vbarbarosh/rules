<text x="587.86" y="358.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">sandbox</text>
<rect x="730" y="150" width="422" height="400" rx="16" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="12 8"/>
<text x="750" y="184" fill="#92958c" font-size="22" text-anchor="start" font-weight="700">not our words</text>
<text x="760" y="240" fill="#92958c" font-size="24" text-anchor="start">step</text>
