<text x="676.14" y="230.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">message</text>
<rect x="70" y="264" width="164" height="46" rx="23.0" fill="#1b2346"/>
<text x="151.8" y="294.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">transcript</text>
<rect x="247.6" y="264" width="125" height="46" rx="23.0" fill="#1b2346"/>
