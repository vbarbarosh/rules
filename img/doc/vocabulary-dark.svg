<text x="760" y="304" fill="#92958c" font-size="24" text-anchor="start">iteration</text>
<line x1="755" y1="296" x2="877" y2="296" stroke="#ff937c" stroke-width="3"/>
<text x="930" y="304" fill="#72d39c" font-size="22" text-anchor="start">→ round</text>
<text x="760" y="368" fill="#92958c" font-size="24" text-anchor="start">prompt</text>
<line x1="755" y1="360" x2="838" y2="360" stroke="#ff937c" stroke-width="3"/>
<text x="930" y="368" fill="#72d39c" font-size="22" text-anchor="start">→ message</text>
<text x="760" y="432" fill="#92958c" font-size="24" text-anchor="start">chat</text>
<line x1="755" y1="424" x2="812" y2="424" stroke="#ff937c" stroke-width="3"/>
<text x="930" y="432" fill="#72d39c" font-size="22" text-anchor="start">→ session</text>
<text x="760" y="496" fill="#92958c" font-size="24" text-anchor="start">bot</text>
<line x1="755" y1="488" x2="799" y2="488" stroke="#ff937c" stroke-width="3"/>
<text x="930" y="496" fill="#72d39c" font-size="22" text-anchor="start">→ agent</text>
<text x="48" y="590" fill="#92958c" font-size="21" text-anchor="start">A vocabulary is the choice of words; a glossary (next) says what each one means.</text>
</svg>
