<text x="48" y="420" fill="#686a61" font-size="21" text-anchor="start">What the system does under a flood is the question: does it stay up, say so once, and</text>
<text x="48" y="451" fill="#686a61" font-size="21" text-anchor="start">keep the 25% that work? A flood is the scenario to test the logging, the alerts and the</text>
<text x="48" y="482" fill="#686a61" font-size="21" text-anchor="start">retries against; one error at a time never shows it.</text>
