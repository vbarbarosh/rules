<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker><marker id="a5E5C4E" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#4a4f57" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Smoke tests</text>
<text x="48" y="108" fill="#92958c" font-size="22">a few basic tests: does it run at all? If they fail, deeper tests are pointless</text>
<rect x="60" y="200" width="220" height="120" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="170.0" y="254.0" fill="#9db2ff" font-size="24" text-anchor="middle" font-weight="700">power on</text>
<text x="170.0" y="282.8" fill="#92958c" font-size="20" text-anchor="middle">start the app</text>
<line x1="280" y1="260" x2="360" y2="260" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299da)"/>
<rect x="360" y="180" width="300" height="160" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="510" y="232" fill="#d3d1c9" font-size="26" text-anchor="middle" font-weight="700">the app</text>
<text x="510" y="266" fill="#92958c" font-size="20" text-anchor="middle">starts? answers? logs in?</text>
<text x="510" y="296" fill="#92958c" font-size="20" text-anchor="middle">3 tests, 10 seconds</text>

<path d="M480 174 q10 -10 0 -20 q-10 -10 0 -20" fill="none" stroke="#ff937c" stroke-width="5" stroke-linecap="round" opacity="0.8"/><path d="M510 174 q10 -10 0 -20 q-10 -10 0 -20" fill="none" stroke="#ff937c" stroke-width="5" stroke-linecap="round" opacity="0.8"/><path d="M540 174 q10 -10 0 -20 q-10 -10 0 -20" fill="none" stroke="#ff937c" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
<text x="510" y="374" fill="#ff937c" font-size="19" text-anchor="middle">smoke: something is seriously broken</text>
<line x1="660" y1="260" x2="760" y2="260" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<rect x="760" y="180" width="392" height="160" rx="16" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="12 8"/>
<text x="780" y="214" fill="#92958c" font-size="22" text-anchor="start" font-weight="700">the deep tests: 2,000 of them</text>
<rect x="790" y="250" width="90" height="50" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="10 8"/>
<text x="835.0" y="282.2" fill="#92958c" font-size="20" text-anchor="middle" font-weight="700">…</text>
<rect x="900" y="250" width="90" height="50" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="10 8"/>
<text x="945.0" y="282.2" fill="#92958c" font-size="20" text-anchor="middle" font-weight="700">…</text>
<rect x="1010" y="250" width="90" height="50" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="10 8"/>
<text x="1055.0" y="282.2" fill="#92958c" font-size="20" text-anchor="middle" font-weight="700">…</text>
<text x="956" y="330" fill="#92958c" font-size="18" text-anchor="middle">pointless until the smoke test passes</text>
<text x="48" y="440" fill="#92958c" font-size="21" text-anchor="start">From hardware: power it on; if smoke comes out, stop there. A smoke test answers one</text>
<text x="48" y="471" fill="#92958c" font-size="21" text-anchor="start">question, before any other test runs: does the application run without immediately</text>
<text x="48" y="502" fill="#92958c" font-size="21" text-anchor="start">breaking?</text>
</svg>
