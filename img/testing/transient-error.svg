<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#fffefb"/>
<defs><marker id="a5E5C4E" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Transient error</text>
<text x="48" y="108" fill="#686a61" font-size="22">a temporary failure that resolves by itself: try again a moment later</text>
<rect x="100" y="200" width="220" height="110" rx="12" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="210" y="236" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">try 1</text>
<path d="M199.2 261.2 l21.599999999999998 21.599999999999998 M220.8 261.2 l-21.599999999999998 21.599999999999998" stroke="#b2341f" stroke-width="6.0" stroke-linecap="round"/>
<text x="210" y="350" fill="#686a61" font-size="20" text-anchor="middle">network blip</text>
<line x1="326" y1="255" x2="452" y2="255" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<text x="390" y="230" fill="#686a61" font-size="20" text-anchor="middle" font-style="italic">wait, retry</text>
<rect x="460" y="200" width="220" height="110" rx="12" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="570" y="236" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">try 2</text>
<path d="M559.2 261.2 l21.599999999999998 21.599999999999998 M580.8 261.2 l-21.599999999999998 21.599999999999998" stroke="#b2341f" stroke-width="6.0" stroke-linecap="round"/>
<text x="570" y="350" fill="#686a61" font-size="20" text-anchor="middle">pool full</text>
<line x1="686" y1="255" x2="812" y2="255" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<text x="750" y="230" fill="#686a61" font-size="20" text-anchor="middle" font-style="italic">wait, retry</text>
<rect x="820" y="200" width="220" height="110" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="930" y="236" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">try 3</text>
<path d="M918.0 278 l9.6 9.6 l19.2 -21.599999999999998" fill="none" stroke="#1a7443" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="930" y="300" fill="#686a61" font-size="1" text-anchor="start"></text>
<text x="930" y="350" fill="#686a61" font-size="20" text-anchor="middle">answered</text>
<text x="48" y="460" fill="#686a61" font-size="21" text-anchor="start">A transient error is not a bug of the code: the network blinked, a connection pool was</text>
<text x="48" y="491" fill="#686a61" font-size="21" text-anchor="start">full, a file was locked for a second. The answer is a retry with a short wait; one that</text>
<text x="48" y="522" fill="#686a61" font-size="21" text-anchor="start">never resolves is an error of its own.</text>
</svg>
