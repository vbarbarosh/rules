<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#16181b"/>
<defs><marker id="ag" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#72d39c" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#ff937c" stroke-linejoin="round"/></marker><marker id="ab" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker><marker id="an" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#4a4f57" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Robustness</text>
<text x="48" y="108" fill="#92958c" font-size="22">how well a program keeps behaving right off the happy path</text>
<rect x="70" y="150" width="180" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="160.0" y="192.0" fill="#72d39c" font-size="21" text-anchor="middle" font-weight="700">open the form</text>
<line x1="256" y1="185" x2="282" y2="185" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="290" y="150" width="180" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="380.0" y="192.0" fill="#72d39c" font-size="21" text-anchor="middle" font-weight="700">fill it in</text>
<line x1="476" y1="185" x2="502" y2="185" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="510" y="150" width="180" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="192.0" fill="#72d39c" font-size="21" text-anchor="middle" font-weight="700">send</text>
<line x1="696" y1="185" x2="722" y2="185" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="730" y="150" width="180" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="820.0" y="192.0" fill="#72d39c" font-size="21" text-anchor="middle" font-weight="700">saved</text>
<line x1="916" y1="185" x2="942" y2="185" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="950" y="150" width="180" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1040.0" y="192.0" fill="#72d39c" font-size="21" text-anchor="middle" font-weight="700">done</text>
<line x1="380" y1="226" x2="380" y2="282" stroke="#ff937c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="280" y="290" width="200" height="60" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="380.0" y="327.0" fill="#ff937c" font-size="19" text-anchor="middle" font-weight="700">a field empty</text>
<line x1="380" y1="356" x2="380" y2="412" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="280" y="420" width="200" height="60" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="380.0" y="457.0" fill="#72d39c" font-size="19" text-anchor="middle" font-weight="700">names the field</text>
<line x1="600" y1="226" x2="600" y2="282" stroke="#ff937c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="500" y="290" width="200" height="60" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="600.0" y="327.0" fill="#ff937c" font-size="19" text-anchor="middle" font-weight="700">the network down</text>
<line x1="600" y1="356" x2="600" y2="412" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="500" y="420" width="200" height="60" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="457.0" fill="#72d39c" font-size="19" text-anchor="middle" font-weight="700">keeps it, retries</text>
<line x1="820" y1="226" x2="820" y2="282" stroke="#ff937c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="720" y="290" width="200" height="60" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="820.0" y="327.0" fill="#ff937c" font-size="19" text-anchor="middle" font-weight="700">the server says no</text>
<line x1="820" y1="356" x2="820" y2="412" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="720" y="420" width="200" height="60" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="820.0" y="457.0" fill="#72d39c" font-size="19" text-anchor="middle" font-weight="700">shows why</text>
<text x="48" y="545" fill="#92958c" font-size="21">The same road as the happy path. Every way off it now ends in an answer the</text>
<text x="48" y="576" fill="#92958c" font-size="21">person can act on, not in a crash or a blank screen.</text>
</svg>
