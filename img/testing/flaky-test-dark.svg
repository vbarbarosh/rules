<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="a5E5C4E" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#4a4f57" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Flaky test</text>
<text x="48" y="108" fill="#92958c" font-size="22">a test that passes and fails by turns, with no change to the code or the test</text>
<rect x="80" y="190" width="400" height="90" rx="12" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="280.0" y="242.2" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">test("API returns data")</text>
<text x="280" y="310" fill="#92958c" font-size="20" text-anchor="middle">unchanged since Monday</text>
<rect x="560" y="200" width="100" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<path d="M600.0 235 l8.0 8.0 l16.0 -18.0" fill="none" stroke="#72d39c" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="610" y="300" fill="#92958c" font-size="20" text-anchor="middle">Mon</text>
<rect x="680" y="200" width="100" height="70" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<path d="M721.0 226.0 l18.0 18.0 M739.0 226.0 l-18.0 18.0" stroke="#ff937c" stroke-width="5.0" stroke-linecap="round"/>
<text x="730" y="300" fill="#92958c" font-size="20" text-anchor="middle">Tue</text>
<rect x="800" y="200" width="100" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<path d="M840.0 235 l8.0 8.0 l16.0 -18.0" fill="none" stroke="#72d39c" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="850" y="300" fill="#92958c" font-size="20" text-anchor="middle">Wed</text>
<rect x="920" y="200" width="100" height="70" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<path d="M961.0 226.0 l18.0 18.0 M979.0 226.0 l-18.0 18.0" stroke="#ff937c" stroke-width="5.0" stroke-linecap="round"/>
<text x="970" y="300" fill="#92958c" font-size="20" text-anchor="middle">Thu</text>
<rect x="1040" y="200" width="100" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<path d="M1080.0 235 l8.0 8.0 l16.0 -18.0" fill="none" stroke="#72d39c" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1090" y="300" fill="#92958c" font-size="20" text-anchor="middle">Fri</text>
<line x1="486" y1="235" x2="552" y2="235" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<text x="48" y="400" fill="#92958c" font-size="21" text-anchor="start">A flaky test is an intermittent failure in the test suite. Its usual cause is a wait</text>
<text x="48" y="431" fill="#92958c" font-size="21" text-anchor="start">that is sometimes too short: a timeout, a race with a server, an order the test assumed.</text>
<text x="48" y="462" fill="#92958c" font-size="21" text-anchor="start">Nobody trusts a red suite with one flaky test in it.</text>
</svg>
