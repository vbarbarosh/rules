<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#fffefb"/>
<defs><marker id="ag" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#1a7443" stroke-linejoin="round"/></marker><marker id="ar" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#b2341f" stroke-linejoin="round"/></marker><marker id="ab" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker><marker id="an" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Fault tolerance</text>
<text x="48" y="108" fill="#686a61" font-size="22">a part breaks, and the whole keeps running</text>
<rect x="70" y="290" width="180" height="70" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="160.0" y="332.0" fill="#2743b8" font-size="21" text-anchor="middle" font-weight="700">a request</text>
<line x1="256" y1="325" x2="342" y2="325" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ab)"/>
<rect x="350" y="290" width="220" height="70" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="460.0" y="332.0" fill="#2743b8" font-size="21" text-anchor="middle" font-weight="700">load balancer</text>
<rect x="700" y="150" width="220" height="70" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="810.0" y="192.0" fill="#1a7443" font-size="21" text-anchor="middle" font-weight="700">server A</text>
<rect x="700" y="290" width="220" height="70" rx="12" fill="#fbe3df" stroke="#b2341f" stroke-width="2" stroke-dasharray="10 8"/>
<text x="810.0" y="332.0" fill="#b2341f" font-size="20" text-anchor="middle" font-weight="700">server B: down</text>
<rect x="700" y="430" width="220" height="70" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="810.0" y="472.0" fill="#1a7443" font-size="21" text-anchor="middle" font-weight="700">server C</text>
<line x1="576" y1="310" x2="692" y2="196" stroke="#1a7443" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<line x1="576" y1="325" x2="692" y2="325" stroke="#b2341f" stroke-width="1.75" stroke-dasharray="10 8" stroke-linecap="round" marker-end="url(#ar)"/>
<line x1="576" y1="340" x2="692" y2="454" stroke="#1a7443" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="990" y="290" width="160" height="70" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1070.0" y="332.0" fill="#1a7443" font-size="21" text-anchor="middle" font-weight="700">answered</text>
<line x1="926" y1="196" x2="982" y2="300" stroke="#1a7443" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<line x1="926" y1="454" x2="982" y2="350" stroke="#1a7443" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ag)"/>
<text x="48" y="560" fill="#686a61" font-size="21">One server of three is down, and the request is still answered. Fault tolerance is</text>
<text x="48" y="591" fill="#686a61" font-size="21">one kind of robustness: the program holds when one of its own parts fails.</text>
</svg>
