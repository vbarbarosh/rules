<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#fffefb"/>
<defs><marker id="a-accent" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#1a7443" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#b2341f" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#686a61" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Process</text>
<text x="48" y="108" fill="#686a61" font-size="22">a running program: its own memory and id, from start to exit</text>
<rect x="50" y="150" width="1100" height="250" rx="16" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="70" y="184" fill="#2743b8" font-size="22" font-weight="700">process · pid 4312</text>
<rect x="90" y="210" width="300" height="160" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2" stroke-dasharray="12 8"/>
<text x="240.0" y="298.0" fill="#686a61" font-size="22" text-anchor="middle" font-weight="700">its own memory</text>
<rect x="440" y="250" width="300" height="80" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="590.0" y="284.0" fill="#1a7443" font-size="22" text-anchor="middle" font-weight="700">job 1</text>
<text x="590.0" y="312.0" fill="#686a61" font-size="19" text-anchor="middle">done</text>
<rect x="790" y="250" width="320" height="80" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="950.0" y="284.0" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">job 2</text>
<text x="950.0" y="312.0" fill="#686a61" font-size="19" text-anchor="middle">running</text>
<circle cx="60" cy="450" r="8" fill="#2743b8"/>
<circle cx="1140" cy="450" r="8" fill="#2743b8"/>
<line x1="74" y1="450" x2="1124" y2="450" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a-accent)"/>
<text x="60" y="488" fill="#686a61" font-size="19" text-anchor="start">started</text>
<text x="1140" y="488" fill="#686a61" font-size="19" text-anchor="end">exits</text>
<text x="48" y="540" fill="#686a61" font-size="21">Also: worker (takes jobs from a queue), instance (one of several copies)</text>
