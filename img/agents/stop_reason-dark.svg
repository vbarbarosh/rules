<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="a5E5C4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4f57"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Stop reason</text>
<text x="48" y="108" fill="#92958c" font-size="22">why a call ended: final, tool_call, max_tokens or refusal, the names the API uses</text>
<rect x="60" y="160" width="260" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="190.0" y="202.92" fill="#72d39c" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">final</text>
<line x1="320" y1="195" x2="380" y2="195" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5e5c4e)"/>
<text x="390" y="203" fill="#d3d1c9" font-size="21" text-anchor="start">the model is done; the turn ends</text>
<rect x="60" y="255" width="260" height="70" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="190.0" y="297.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tool_call</text>
<line x1="320" y1="290" x2="380" y2="290" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5e5c4e)"/>
<text x="390" y="298" fill="#d3d1c9" font-size="21" text-anchor="start">the model wants a tool run; another round</text>
<rect x="60" y="350" width="260" height="70" rx="12" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="190.0" y="392.92" fill="#ffb257" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">max_tokens</text>
<line x1="320" y1="385" x2="380" y2="385" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5e5c4e)"/>
<text x="390" y="393" fill="#d3d1c9" font-size="21" text-anchor="start">the answer was cut by the token cap</text>
<rect x="60" y="445" width="260" height="70" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="190.0" y="487.92" fill="#ff937c" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">refusal</text>
<line x1="320" y1="480" x2="380" y2="480" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5e5c4e)"/>
<text x="390" y="488" fill="#d3d1c9" font-size="21" text-anchor="start">the model declined the request</text>
<text x="48" y="560" fill="#92958c" font-size="21" text-anchor="start">The harness reads the stop reason, not the text, to decide what happens next.</text>
</svg>
