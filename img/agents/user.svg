<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#fffefb"/>
<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker><marker id="a5E5C4E" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">User</text>
<text x="48" y="108" fill="#686a61" font-size="22">who starts a turn: a person, or a calling application</text>
<rect x="70" y="200" width="300" height="110" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="220.0" y="249.0" fill="#2743b8" font-size="24" text-anchor="middle" font-weight="700">a person</text>
<text x="220.0" y="277.8" fill="#686a61" font-size="20" text-anchor="middle">types a message</text>
<rect x="70" y="340" width="300" height="110" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="220.0" y="389.0" fill="#2743b8" font-size="24" text-anchor="middle" font-weight="700">an application</text>
<text x="220.0" y="417.8" fill="#686a61" font-size="20" text-anchor="middle">calls the agent with a task</text>
<line x1="370" y1="255" x2="478.09" y2="289.39" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299DA)"/>
<line x1="370" y1="395" x2="478.09" y2="360.61" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299DA)"/>
<rect x="480" y="280" width="240" height="90" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="600.0" y="332.92" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">a turn begins</text>
<line x1="720" y1="325" x2="798" y2="325" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<rect x="800" y="250" width="330" height="150" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="965" y="310" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">the agent</text>
<text x="965" y="345" fill="#686a61" font-size="20" text-anchor="middle">rounds, until the final</text>
<text x="48" y="490" fill="#686a61" font-size="21" text-anchor="start">The user stands outside the loop: whoever gives the agent its task, person or program.</text>
</svg>
