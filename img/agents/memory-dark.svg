<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="a5E5C4E" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#4a4f57" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Memory</text>
<text x="48" y="108" fill="#92958c" font-size="22">what outlives one context: the transcript, plus the stores outside it</text>
<rect x="60" y="180" width="300" height="110" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="210.0" y="229.0" fill="#9db2ff" font-size="24" text-anchor="middle" font-weight="700">the context</text>
<text x="210.0" y="257.8" fill="#92958c" font-size="20" text-anchor="middle">one call, then gone</text>
<line x1="360" y1="235" x2="440" y2="235" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<rect x="440" y="150" width="700" height="330" rx="16" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="12 8"/>
<text x="460" y="184" fill="#92958c" font-size="22" text-anchor="start" font-weight="700">memory · outlives the call</text>
<rect x="470" y="200" width="310" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="625.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">the transcript</text>
<rect x="800" y="200" width="310" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="955.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">notes and files</text>
<rect x="470" y="290" width="310" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="625.0" y="332.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">a database</text>
<rect x="800" y="290" width="310" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="955.0" y="332.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">the author's messages</text>
<text x="790" y="420" fill="#92958c" font-size="20" text-anchor="middle">read back into a later context, by the harness or by a tool</text>
<text x="48" y="520" fill="#92958c" font-size="21" text-anchor="start">A model remembers nothing; what must be known tomorrow is written somewhere that is read</text>
<text x="48" y="551" fill="#92958c" font-size="21" text-anchor="start">again.</text>
</svg>
