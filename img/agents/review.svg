<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#fffefb"/>
<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker><marker id="a5E5C4E" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Review</text>
<text x="48" y="108" fill="#686a61" font-size="22">one extra call that inspects the result against the task: the same model, another agent, or a person</text>
<rect x="60" y="200" width="260" height="100" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="190.0" y="244.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">the task</text>
<text x="190.0" y="270.9" fill="#686a61" font-size="19" text-anchor="middle">"fix the footer"</text>
<rect x="60" y="330" width="260" height="100" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="190.0" y="374.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">the result</text>
<text x="190.0" y="400.9" fill="#686a61" font-size="19" text-anchor="middle">the diff, the final</text>
<line x1="320" y1="250" x2="448.13" y2="299.28" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<line x1="320" y1="380" x2="448.13" y2="330.72" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<rect x="450" y="260" width="300" height="110" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="600.0" y="309.5" fill="#2743b8" font-size="22" text-anchor="middle" font-weight="700">the reviewer</text>
<text x="600.0" y="335.9" fill="#686a61" font-size="19" text-anchor="middle">reads both, once</text>
<line x1="750" y1="315" x2="838" y2="315" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299DA)"/>
<rect x="840" y="240" width="300" height="150" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="990" y="290" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">the verdict</text>
<text x="990" y="324" fill="#686a61" font-size="19" text-anchor="middle">done as asked, or</text>
<text x="990" y="352" fill="#686a61" font-size="19" text-anchor="middle">what is missing, where</text>
<text x="48" y="470" fill="#686a61" font-size="21" text-anchor="start">A check runs the tests; a review reads the work. The reviewer may be the same model in a</text>
<text x="48" y="501" fill="#686a61" font-size="21" text-anchor="start">fresh context, another agent, or a human.</text>
</svg>
