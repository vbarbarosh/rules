<text x="290" y="431" fill="#9db2ff" font-size="20" text-anchor="middle" font-weight="700">deploy to the server</text>
<text x="290" y="455" fill="#92958c" font-size="17" text-anchor="middle">this turn only: loaded when asked for</text>
<text x="290" y="505" fill="#92958c" font-size="20" text-anchor="middle">3,000 tokens, always</text>
