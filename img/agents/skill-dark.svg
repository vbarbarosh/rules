<path d="M684 232 C590 232 600 436 496 436" fill="none" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299da)"/>
<text x="48" y="572" fill="#92958c" font-size="21" text-anchor="start">A skill is read only in the turn that needs it, so the context stays small; a policy is read</text>
<text x="48" y="603" fill="#92958c" font-size="21" text-anchor="start">in every call.</text>
