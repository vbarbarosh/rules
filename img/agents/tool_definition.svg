<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Tool definition</text>
<text x="48" y="108" fill="#686a61" font-size="22">name + description + input_schema: what the model sees; the description is what makes it pick the tool</text>
<rect x="60" y="160" width="560" height="330" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="90" y="202" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<text x="90" y="234" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  "name": "read_file",</text>
<text x="90" y="266" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  "description": "Reads one file of the</text>
<text x="90" y="298" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    workspace by its path. Use it before</text>
<text x="90" y="330" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    editing a file you have not seen.",</text>
<text x="90" y="362" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  "input_schema": {"path": "string"}</text>
<text x="90" y="394" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<rect x="680" y="160" width="460" height="90" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="910.0" y="199.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">name</text>
<text x="910.0" y="225.9" fill="#686a61" font-size="19" text-anchor="middle">how the model calls it</text>
<rect x="680" y="270" width="460" height="100" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="910.0" y="314.5" fill="#2743b8" font-size="22" text-anchor="middle" font-weight="700">description</text>
<text x="910.0" y="340.9" fill="#686a61" font-size="19" text-anchor="middle">why and when: the model chooses by this</text>
<rect x="680" y="390" width="460" height="90" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="910.0" y="429.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">input_schema</text>
<text x="910.0" y="455.9" fill="#686a61" font-size="19" text-anchor="middle">the shape of the arguments</text>
<text x="48" y="540" fill="#686a61" font-size="21" text-anchor="start">A vague description gets a tool used wrongly or not at all; the schema only shapes the</text>
<text x="48" y="571" fill="#686a61" font-size="21" text-anchor="start">arguments once it is chosen.</text>
</svg>
