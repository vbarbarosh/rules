<text x="1050" y="257.92" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">harness</text>
<text x="48" y="420" fill="#686a61" font-size="21" text-anchor="start">The model asks; it never runs anything itself. The id pairs this call with the result that</text>
<text x="48" y="451" fill="#686a61" font-size="21" text-anchor="start">comes back.</text>
