<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Tool call</text>
<text x="48" y="108" fill="#686a61" font-size="22">model to harness: a tool's name, its arguments and an id</text>
<rect x="60" y="200" width="200" height="100" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="160" y="258.64" fill="#2743b8" font-size="24" text-anchor="middle" font-weight="700">the model</text>
<line x1="266" y1="250" x2="354" y2="250" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299DA)"/>
<rect x="360" y="170" width="500" height="160" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="384" y="212" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tool_call</text>
<text x="384" y="242" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  name: edit</text>
<text x="384" y="272" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  arguments: {path: "footer.vue", …}</text>
<text x="384" y="302" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  id: call_12</text>
