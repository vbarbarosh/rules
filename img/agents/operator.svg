<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#fffefb"/>
<defs><marker id="a5E5C4E" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Operator</text>
<text x="48" y="108" fill="#686a61" font-size="22">who configures and deploys the agent</text>
<rect x="70" y="257" width="300" height="110" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="220.0" y="306.0" fill="#2743b8" font-size="24" text-anchor="middle" font-weight="700">the operator</text>
<text x="220.0" y="334.8" fill="#686a61" font-size="20" text-anchor="middle">before any turn</text>
<rect x="450" y="160" width="400" height="64" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="650.0" y="199.2" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">writes the policy</text>
<rect x="450" y="240" width="400" height="64" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="650.0" y="279.2" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">picks the model and the tools</text>
<rect x="450" y="320" width="400" height="64" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="650.0" y="359.2" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">sets permissions and budgets</text>
<rect x="450" y="400" width="400" height="64" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="650.0" y="439.2" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">deploys the harness</text>
<rect x="920" y="252" width="220" height="120" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="1030" y="306.0" fill="#686a61" font-size="24" text-anchor="middle" font-weight="700">the agent</text>
<text x="1030" y="334.8" fill="#686a61" font-size="20" text-anchor="middle">ready for its users</text>
<line x1="376" y1="312" x2="410" y2="312" stroke="#a19f93" stroke-width="2"/>
<line x1="410" y1="192" x2="410" y2="432" stroke="#a19f93" stroke-width="2"/>
<line x1="410" y1="192" x2="444" y2="192" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<line x1="410" y1="272" x2="444" y2="272" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<line x1="410" y1="352" x2="444" y2="352" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<line x1="410" y1="432" x2="444" y2="432" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<line x1="856" y1="192" x2="874" y2="192" stroke="#a19f93" stroke-width="2"/>
<line x1="856" y1="272" x2="874" y2="272" stroke="#a19f93" stroke-width="2"/>
<line x1="856" y1="352" x2="874" y2="352" stroke="#a19f93" stroke-width="2"/>
<line x1="856" y1="432" x2="874" y2="432" stroke="#a19f93" stroke-width="2"/>
<line x1="874" y1="192" x2="874" y2="432" stroke="#a19f93" stroke-width="2"/>
<line x1="874" y1="312" x2="914" y2="312" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<text x="48" y="514" fill="#686a61" font-size="21" text-anchor="start">The user starts turns; the operator makes the agent that answers them. Often the same</text>
<text x="48" y="545" fill="#686a61" font-size="21" text-anchor="start">person, never the same role.</text>
</svg>
