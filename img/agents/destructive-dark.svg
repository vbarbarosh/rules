<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Destructive</text>
<text x="48" y="108" fill="#92958c" font-size="22">mutating and hard to undo: rm, drop, deploy</text>
<rect x="60" y="160" width="260" height="80" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="190.0" y="207.92" fill="#92958c" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">readonly</text>
<rect x="340" y="160" width="320" height="80" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="500.0" y="207.2" fill="#92958c" font-size="20" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">view · grep · query</text>
<text x="690" y="208" fill="#92958c" font-size="21" text-anchor="start">reads, changes nothing</text>
<rect x="60" y="270" width="260" height="80" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="190.0" y="317.92" fill="#92958c" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">mutating</text>
<rect x="340" y="270" width="320" height="80" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="500.0" y="317.2" fill="#92958c" font-size="20" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">edit · insert · shell</text>
<text x="690" y="318" fill="#92958c" font-size="21" text-anchor="start">changes the workspace; undo by hand</text>
<rect x="60" y="380" width="260" height="80" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="4"/>
<text x="190.0" y="427.92" fill="#ff937c" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">destructive</text>
<rect x="340" y="380" width="320" height="80" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="500.0" y="427.2" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">rm · drop · deploy</text>
<text x="690" y="428" fill="#d3d1c9" font-size="21" text-anchor="start">mutating and hard to undo: gated by default</text>
<text x="48" y="520" fill="#92958c" font-size="21" text-anchor="start">Declared at registration, and a tool is classed by the worst its arguments allow: a shell</text>
<text x="48" y="551" fill="#92958c" font-size="21" text-anchor="start">that can run rm is destructive, whatever it ran last time.</text>
</svg>
