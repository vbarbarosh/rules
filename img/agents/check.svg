<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#fffefb"/>
<defs><marker id="a56DB3A" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#1a7443" stroke-linejoin="round"/></marker><marker id="a5E5C4E" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker><marker id="aFF6B6B" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#b2341f" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Check</text>
<text x="48" y="108" fill="#686a61" font-size="22">the harness runs tests or lint after the final, and re-prompts on failure: the turn goes on</text>
<rect x="60" y="200" width="220" height="90" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="170.0" y="239.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">final</text>
<text x="170.0" y="265.9" fill="#686a61" font-size="19" text-anchor="middle">"the footer is fixed"</text>
<line x1="280" y1="245" x2="360" y2="245" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<rect x="360" y="200" width="260" height="90" rx="12" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="490.0" y="239.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">npm test</text>
<text x="490.0" y="265.9" fill="#686a61" font-size="19" text-anchor="middle">run by the harness</text>
<line x1="620" y1="225" x2="720" y2="180" stroke="#1a7443" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a56DB3A)"/>
<rect x="720" y="150" width="300" height="70" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="870.0" y="192.2" fill="#1a7443" font-size="20" text-anchor="middle" font-weight="700">passed: the turn ends</text>
<line x1="620" y1="265" x2="720" y2="310" stroke="#b2341f" stroke-width="1.75" stroke-linecap="round" marker-end="url(#aFF6B6B)"/>
<rect x="720" y="280" width="420" height="100" rx="12" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="930" y="314" fill="#b2341f" font-size="20" text-anchor="middle" font-weight="700">failed: 1 test</text>
<text x="930" y="342" fill="#191a17" font-size="18" text-anchor="middle">the output goes back as a message:</text>
<text x="930" y="366" fill="#191a17" font-size="18" text-anchor="middle">another round</text>
<text x="48" y="444" fill="#686a61" font-size="21" text-anchor="start">A check turns the model's claim into a result: the final is not the end of the turn until</text>
<text x="48" y="475" fill="#686a61" font-size="21" text-anchor="start">the tests say so.</text>
</svg>
