<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#16181b"/>
<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Tool</text>
<text x="48" y="108" fill="#92958c" font-size="22">a named operation the model may request: it sees the definition, the harness owns the implementation</text>
<rect x="60" y="150" width="500" height="360" rx="16" fill="#1b2346" stroke="#9db2ff" stroke-width="2" stroke-dasharray="12 8"/>
<text x="80" y="184" fill="#9db2ff" font-size="22" text-anchor="start" font-weight="700">what the model sees</text>
<rect x="90" y="200" width="440" height="280" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="110" y="240" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<text x="110" y="269" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  "name": "read_file",</text>
<text x="110" y="298" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  "description": "Reads one file</text>
<text x="110" y="327" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">    of the workspace by its path",</text>
<text x="110" y="356" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  "input_schema": {</text>
<text x="110" y="385" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">    "path": "string"</text>
<text x="110" y="414" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  }</text>
<text x="110" y="443" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<line x1="566" y1="330" x2="692" y2="330" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299da)"/>
<text x="630" y="298" fill="#9db2ff" font-size="20" text-anchor="middle" font-style="italic">requests</text>
<rect x="700" y="150" width="452" height="360" rx="16" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="12 8"/>
<text x="720" y="184" fill="#92958c" font-size="22" text-anchor="start" font-weight="700">what the harness owns</text>
<rect x="720" y="200" width="412" height="120" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="926" y="250" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">the implementation</text>
<text x="926" y="282" fill="#92958c" font-size="19" text-anchor="middle">fs.readFile, with its permission check</text>
<rect x="720" y="350" width="412" height="130" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="926" y="392" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">the result</text>
<text x="926" y="424" fill="#92958c" font-size="19" text-anchor="middle">the file's text, or an error,</text>
<text x="926" y="450" fill="#92958c" font-size="19" text-anchor="middle">back into the context</text>
<text x="48" y="560" fill="#92958c" font-size="21" text-anchor="start">The description is what makes the model pick the tool; the harness decides whether and how</text>
<text x="48" y="591" fill="#92958c" font-size="21" text-anchor="start">it runs.</text>
</svg>
