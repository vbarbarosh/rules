<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#fffefb"/>
<defs><marker id="a1299DA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Handoff</text>
<text x="48" y="108" fill="#686a61" font-size="22">the agent stops and passes the task and its context to the user or to another agent</text>
<rect x="60" y="220" width="280" height="110" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="200.0" y="269.5" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">this agent</text>
<text x="200.0" y="295.9" fill="#686a61" font-size="19" text-anchor="middle">stops here</text>
<line x1="340" y1="275" x2="460" y2="275" stroke="#2743b8" stroke-width="4" marker-end="url(#a1299DA)"/>
<text x="400.0" y="263.0" fill="#2743b8" font-size="20" text-anchor="middle" font-style="italic">the task + its context</text>
<rect x="460" y="180" width="300" height="90" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="610.0" y="220.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">the user</text>
<text x="610.0" y="244.0" fill="#686a61" font-size="17" text-anchor="middle">a question only they can answer</text>
<rect x="460" y="300" width="300" height="90" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="610.0" y="340.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">another agent</text>
<text x="610.0" y="364.0" fill="#686a61" font-size="17" text-anchor="middle">whose repository it is</text>
<rect x="820" y="200" width="320" height="150" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="980" y="250" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">what goes with it</text>
<text x="980" y="284" fill="#686a61" font-size="19" text-anchor="middle">the task, what was found,</text>
<text x="980" y="312" fill="#686a61" font-size="19" text-anchor="middle">what is left, where in the code</text>
<text x="48" y="450" fill="#686a61" font-size="21" text-anchor="start">A handoff is written whole: the one who takes it over knows only what the handoff says.</text>
</svg>
