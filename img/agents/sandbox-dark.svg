<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="aFF6B6B" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#ff937c" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Sandbox</text>
<text x="48" y="108" fill="#92958c" font-size="22">the boundary that contains a tool's effects: files, network, processes</text>
<rect x="60" y="150" width="700" height="300" rx="16" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="80" y="184" fill="#9db2ff" font-size="22" text-anchor="start" font-weight="700">the sandbox</text>
<rect x="100" y="210" width="280" height="90" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="240.0" y="249.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">files</text>
<text x="240.0" y="275.9" fill="#92958c" font-size="19" text-anchor="middle">/app and /tmp only</text>
<rect x="420" y="210" width="300" height="90" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="570.0" y="249.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">network</text>
<text x="570.0" y="275.9" fill="#92958c" font-size="19" text-anchor="middle">the registry, nothing else</text>
<rect x="100" y="330" width="280" height="90" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="240.0" y="369.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">processes</text>
<text x="240.0" y="395.9" fill="#92958c" font-size="19" text-anchor="middle">its own, killed on exit</text>
<rect x="420" y="330" width="300" height="90" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="570.0" y="382.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">the tool runs here</text>
<rect x="820" y="210" width="320" height="90" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="980.0" y="250.0" fill="#ff937c" font-size="20" text-anchor="middle" font-weight="700">/home/user/.ssh</text>
<text x="980.0" y="274.0" fill="#92958c" font-size="17" text-anchor="middle">unreachable</text>
<rect x="820" y="330" width="320" height="90" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="980.0" y="370.0" fill="#ff937c" font-size="20" text-anchor="middle" font-weight="700">the production server</text>
<text x="980.0" y="394.0" fill="#92958c" font-size="17" text-anchor="middle">unreachable</text>
<line x1="726" y1="352" x2="812.55" y2="269.38" stroke="#ff937c" stroke-width="1.75" stroke-dasharray="10 8" stroke-linecap="round" marker-end="url(#aFF6B6B)"/>
<line x1="726" y1="385" x2="812" y2="380.11" stroke="#ff937c" stroke-width="1.75" stroke-dasharray="10 8" stroke-linecap="round" marker-end="url(#aFF6B6B)"/>
<text x="48" y="500" fill="#92958c" font-size="21" text-anchor="start">Whatever the tool does, it does inside the boundary; a wrong command costs the sandbox, not</text>
<text x="48" y="531" fill="#92958c" font-size="21" text-anchor="start">the machine.</text>
</svg>
