<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#fffefb"/>
<defs><marker id="a1299DA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Tool</text>
<text x="48" y="108" fill="#686a61" font-size="22">a named operation the model may request: it sees the definition, the harness owns the implementation</text>
<rect x="60" y="150" width="500" height="360" rx="16" fill="#e2e7fb" stroke="#2743b8" stroke-width="2" stroke-dasharray="12 8"/>
<text x="80" y="184" fill="#2743b8" font-size="22" text-anchor="start" font-weight="700">what the model sees</text>
<rect x="90" y="200" width="440" height="280" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="110" y="240" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<text x="110" y="269" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  "name": "read_file",</text>
<text x="110" y="298" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  "description": "Reads one file</text>
<text x="110" y="327" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    of the workspace by its path",</text>
<text x="110" y="356" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  "input_schema": {</text>
<text x="110" y="385" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    "path": "string"</text>
<text x="110" y="414" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  }</text>
<text x="110" y="443" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<line x1="560" y1="330" x2="640" y2="330" stroke="#2743b8" stroke-width="4" marker-end="url(#a1299DA)"/>
<text x="600.0" y="318.0" fill="#2743b8" font-size="20" text-anchor="middle" font-style="italic">requests</text>
<rect x="640" y="150" width="500" height="360" rx="16" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2" stroke-dasharray="12 8"/>
<text x="660" y="184" fill="#686a61" font-size="22" text-anchor="start" font-weight="700">what the harness owns</text>
<rect x="670" y="200" width="440" height="120" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="890" y="250" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">the implementation</text>
<text x="890" y="282" fill="#686a61" font-size="19" text-anchor="middle">fs.readFile, with its permission check</text>
<rect x="670" y="350" width="440" height="130" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="890" y="398" fill="#191a17" font-size="22" text-anchor="middle" font-weight="700">the result</text>
<text x="890" y="430" fill="#686a61" font-size="19" text-anchor="middle">the file's text, or an error, back into the context</text>
<text x="48" y="560" fill="#686a61" font-size="21" text-anchor="start">The description is what makes the model pick the tool; the harness decides whether and how</text>
<text x="48" y="591" fill="#686a61" font-size="21" text-anchor="start">it runs.</text>
</svg>
