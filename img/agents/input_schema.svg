<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Input schema</text>
<text x="48" y="108" fill="#686a61" font-size="22">the shape of a tool's arguments, as JSON Schema</text>
<rect x="60" y="160" width="520" height="330" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="90" y="202" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">"input_schema": {</text>
<text x="90" y="234" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  "type": "object",</text>
<text x="90" y="266" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  "properties": {</text>
<text x="90" y="298" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">    "path": {"type": "string"},</text>
<text x="90" y="330" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">    "max_lines": {"type": "integer"}</text>
<text x="90" y="362" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  },</text>
<text x="90" y="394" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" xml:space="preserve">  "required": ["path"]</text>
<text x="90" y="426" fill="#191a17" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<rect x="640" y="170" width="500" height="120" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="890" y="212" fill="#1a7443" font-size="19" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{"path": "src/app.js", "max_lines": 40}</text>
<text x="890" y="246" fill="#191a17" font-size="20" text-anchor="middle">fits: the tool runs</text>
<rect x="640" y="320" width="500" height="120" rx="12" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="890" y="362" fill="#b2341f" font-size="19" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{"file": "src/app.js"}</text>
<text x="890" y="396" fill="#191a17" font-size="20" text-anchor="middle">does not fit: refused before the tool runs</text>
<text x="48" y="540" fill="#686a61" font-size="21" text-anchor="start">The harness checks the arguments against the schema; the model learns the shape from the</text>
<text x="48" y="571" fill="#686a61" font-size="21" text-anchor="start">same text.</text>
</svg>
