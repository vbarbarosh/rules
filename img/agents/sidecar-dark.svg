<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="a1299DA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker><marker id="a5E5C4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4f57"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Sidecar</text>
<text x="48" y="108" fill="#92958c" font-size="22">a second payload beside a message, never merged into it: the request goes over the wire, the sidecar stays with the harness</text>
<rect x="60" y="180" width="520" height="120" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="320" y="226" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">tool_result · 2 KB</text>
<text x="320" y="260" fill="#92958c" font-size="19" text-anchor="middle">the first 80 lines of the log</text>
<line x1="580" y1="240" x2="680" y2="240" stroke="#9db2ff" stroke-width="4" marker-end="url(#a1299DA)"/>
<text x="630.0" y="228.0" fill="#9db2ff" font-size="20" text-anchor="middle" font-style="italic">over the wire</text>
<rect x="680" y="200" width="240" height="80" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="800.0" y="247.92" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">the model</text>
<rect x="60" y="330" width="520" height="150" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="320" y="380" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">sidecar · 40 MB</text>
<text x="320" y="412" fill="#92958c" font-size="19" text-anchor="middle">the whole log, the file handles,</text>
<text x="320" y="440" fill="#92958c" font-size="19" text-anchor="middle">the timings</text>
<line x1="580" y1="405" x2="680" y2="405" stroke="#4a4f57" stroke-width="4" marker-end="url(#a5E5C4E)"/>
<text x="630.0" y="393.0" fill="#92958c" font-size="20" text-anchor="middle" font-style="italic">stays here</text>
<rect x="680" y="365" width="240" height="80" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="800.0" y="412.92" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">the harness</text>
<text x="48" y="530" fill="#92958c" font-size="21" text-anchor="start">The message carries what fits the context; the sidecar keeps the rest, so nothing is lost</text>
<text x="48" y="561" fill="#92958c" font-size="21" text-anchor="start">when a result is truncated or compacted.</text>
</svg>
