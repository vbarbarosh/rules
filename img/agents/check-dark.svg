<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="a56DB3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#72d39c"/></marker><marker id="a5E5C4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4f57"/></marker><marker id="aFF6B6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff937c"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Check</text>
<text x="48" y="108" fill="#92958c" font-size="22">the harness runs tests or lint after the final, and re-prompts on failure: the turn goes on</text>
<rect x="60" y="200" width="220" height="90" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="170.0" y="239.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">final</text>
<text x="170.0" y="265.9" fill="#92958c" font-size="19" text-anchor="middle">"the footer is fixed"</text>
<line x1="280" y1="245" x2="360" y2="245" stroke="#4a4f57" stroke-width="4" marker-end="url(#a5E5C4E)"/>
<rect x="360" y="200" width="260" height="90" rx="12" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="490.0" y="239.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">npm test</text>
<text x="490.0" y="265.9" fill="#92958c" font-size="19" text-anchor="middle">run by the harness</text>
<line x1="620" y1="225" x2="720" y2="180" stroke="#72d39c" stroke-width="4" marker-end="url(#a56DB3A)"/>
<rect x="720" y="150" width="300" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="870.0" y="192.2" fill="#72d39c" font-size="20" text-anchor="middle" font-weight="700">passed: the turn ends</text>
<line x1="620" y1="265" x2="720" y2="310" stroke="#ff937c" stroke-width="4" marker-end="url(#aFF6B6B)"/>
<rect x="720" y="280" width="420" height="90" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="930" y="316" fill="#ff937c" font-size="20" text-anchor="middle" font-weight="700">failed: 1 test</text>
<text x="930" y="348" fill="#d3d1c9" font-size="18" text-anchor="middle">the output goes back as a message, another round</text>
<text x="48" y="440" fill="#92958c" font-size="21" text-anchor="start">A check turns the model's claim into a result: the final is not the end of the turn until</text>
<text x="48" y="471" fill="#92958c" font-size="21" text-anchor="start">the tests say so.</text>
</svg>
