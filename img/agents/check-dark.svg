<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="a56DB3A" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#72d39c" stroke-linejoin="round"/></marker><marker id="a5E5C4E" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#4a4f57" stroke-linejoin="round"/></marker><marker id="aFF6B6B" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#ff937c" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Check</text>
<text x="48" y="108" fill="#92958c" font-size="22">the harness runs tests or lint after the final, and re-prompts on failure: the turn goes on</text>
<rect x="60" y="200" width="220" height="90" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="170.0" y="239.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">final</text>
<text x="170.0" y="265.9" fill="#92958c" font-size="19" text-anchor="middle">"the footer is fixed"</text>
<line x1="280" y1="245" x2="358" y2="245" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<rect x="360" y="200" width="260" height="90" rx="12" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="490.0" y="239.5" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">npm test</text>
<text x="490.0" y="265.9" fill="#92958c" font-size="19" text-anchor="middle">run by the harness</text>
<line x1="620" y1="225" x2="718.18" y2="180.82" stroke="#72d39c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a56db3a)"/>
<rect x="720" y="150" width="300" height="70" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="870.0" y="192.2" fill="#72d39c" font-size="20" text-anchor="middle" font-weight="700">passed: the turn ends</text>
<line x1="620" y1="265" x2="718.18" y2="309.18" stroke="#ff937c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#aff6b6b)"/>
<rect x="720" y="280" width="420" height="100" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="930" y="314" fill="#ff937c" font-size="20" text-anchor="middle" font-weight="700">failed: 1 test</text>
<text x="930" y="342" fill="#d3d1c9" font-size="18" text-anchor="middle">the output goes back as a message:</text>
<text x="930" y="366" fill="#d3d1c9" font-size="18" text-anchor="middle">another round</text>
<text x="48" y="444" fill="#92958c" font-size="21" text-anchor="start">A check turns the model's claim into a result: the final is not the end of the turn until</text>
<text x="48" y="475" fill="#92958c" font-size="21" text-anchor="start">the tests say so.</text>
</svg>
