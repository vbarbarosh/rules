<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="a1299DA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Tool call</text>
<text x="48" y="108" fill="#92958c" font-size="22">model to harness: a tool's name, its arguments and an id</text>
<rect x="60" y="200" width="260" height="100" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="190.0" y="258.64" fill="#9db2ff" font-size="24" text-anchor="middle" font-weight="700">the model</text>
<line x1="320" y1="250" x2="480" y2="250" stroke="#9db2ff" stroke-width="5" marker-end="url(#a1299DA)"/>
<rect x="480" y="170" width="420" height="160" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="510" y="212" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tool_call</text>
<text x="510" y="242" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  name: edit</text>
<text x="510" y="272" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  arguments: {path: "footer.vue", …}</text>
<text x="510" y="302" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">  id: call_12</text>
<line x1="900" y1="250" x2="1000" y2="250" stroke="#9db2ff" stroke-width="5" marker-end="url(#a1299DA)"/>
<rect x="1000" y="200" width="150" height="100" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="1075.0" y="257.92" fill="#d3d1c9" font-size="22" text-anchor="middle" font-weight="700">harness</text>
<text x="48" y="420" fill="#92958c" font-size="21" text-anchor="start">The model asks; it never runs anything itself. The id pairs this call with the result that</text>
<text x="48" y="451" fill="#92958c" font-size="21" text-anchor="start">comes back.</text>
</svg>
