<text x="870" y="170" fill="#b2341f" font-size="22" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">max_rounds = 6</text>
<text x="1000" y="340" fill="#b2341f" font-size="20" text-anchor="middle">stopped: a runaway</text>
<text x="48" y="420" fill="#686a61" font-size="21" text-anchor="start">The seventh round never runs: the harness ends the turn and says why. A cap is a safety net</text>
<text x="48" y="451" fill="#686a61" font-size="21" text-anchor="start">for the loop, not a plan.</text>
