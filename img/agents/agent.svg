<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="620" fill="#fffefb"/>
<defs><marker id="a5E5C4E" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#a19f93" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Agent</text>
<text x="48" y="108" fill="#686a61" font-size="22">harness + model + tools + policy: never the model alone</text>
<rect x="60" y="150" width="680" height="330" rx="16" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="80" y="184" fill="#2743b8" font-size="22" text-anchor="start" font-weight="700">the agent</text>
<rect x="90" y="210" width="300" height="110" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="240" y="259.0" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">harness</text>
<text x="240" y="288.0" fill="#686a61" font-size="20" text-anchor="middle" >the code that runs the loop</text>
<rect x="420" y="210" width="300" height="110" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="570" y="259.0" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">model</text>
<text x="570" y="288.0" fill="#686a61" font-size="20" text-anchor="middle" >the LLM, stateless</text>
<rect x="90" y="346" width="300" height="104" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="240" y="392.0" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">tools</text>
<text x="240" y="421.0" fill="#686a61" font-size="20" text-anchor="middle" >view, grep, edit, shell</text>
<rect x="420" y="346" width="300" height="104" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="570" y="392.0" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">policy</text>
<text x="570" y="421.0" fill="#686a61" font-size="20" text-anchor="middle" >the text that constrains it</text>
<line x1="746" y1="398" x2="842" y2="398" stroke="#a19f93" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<text x="795" y="373" fill="#686a61" font-size="20" text-anchor="middle" font-style="italic">acts on</text>
<rect x="850" y="210" width="290" height="240" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="995" y="300" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">workspace</text>
<text x="995" y="334" fill="#686a61" font-size="20" text-anchor="middle" >what the tools act on:</text>
<text x="995" y="362" fill="#686a61" font-size="20" text-anchor="middle" >a repo, a canvas, a database</text>
<text x="48" y="530" fill="#686a61" font-size="21" text-anchor="start">The model alone answers one call. It becomes an agent when a harness loops it, hands it</text>
<text x="48" y="561" fill="#686a61" font-size="21" text-anchor="start">tools, and holds it to a policy.</text>
</svg>
