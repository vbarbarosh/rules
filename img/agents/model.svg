<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Model</text>
<text x="48" y="108" fill="#686a61" font-size="22">the LLM, named by a string: stateless, one context in, one message out</text>
<rect x="80" y="200" width="320" height="140" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="240" y="250" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">context</text>
<text x="240" y="282" fill="#686a61" font-size="19" text-anchor="middle">system · tools · transcript</text>
<text x="240" y="310" fill="#686a61" font-size="19" text-anchor="middle">48,000 tokens</text>
<line x1="400" y1="270" x2="470" y2="270" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299DA)"/>
<rect x="470" y="190" width="300" height="160" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="620" y="250" fill="#2743b8" font-size="24" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">claude-opus-5</text>
<text x="620" y="286" fill="#191a17" font-size="20" text-anchor="middle">remembers nothing</text>
<text x="620" y="314" fill="#191a17" font-size="20" text-anchor="middle">between two calls</text>
<line x1="770" y1="270" x2="840" y2="270" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299DA)"/>
<rect x="840" y="200" width="280" height="140" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="980" y="250" fill="#191a17" font-size="24" text-anchor="middle" font-weight="700">one message</text>
<text x="980" y="282" fill="#686a61" font-size="19" text-anchor="middle">text, or a tool_call</text>
<text x="980" y="310" fill="#686a61" font-size="19" text-anchor="middle">and a stop_reason</text>
<text x="48" y="420" fill="#686a61" font-size="21" text-anchor="start">Every call starts from zero: whatever the model is to know must be in the context again. The</text>
<text x="48" y="451" fill="#686a61" font-size="21" text-anchor="start">harness keeps the state, not the model.</text>
</svg>
