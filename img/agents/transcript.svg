<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="660" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Transcript</text>
<text x="48" y="108" fill="#686a61" font-size="22">every message of the session so far, append-only: tool_calls and tool_results included</text>
<rect x="60" y="150" width="520" height="54" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="76" y="184" fill="#2743b8" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">system</text>
<text x="210" y="184" fill="#191a17" font-size="19" text-anchor="start">policy: never delete…</text>
<rect x="60" y="212" width="520" height="54" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="76" y="246" fill="#686a61" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user</text>
<text x="210" y="246" fill="#191a17" font-size="19" text-anchor="start">fix the footer</text>
<rect x="60" y="274" width="520" height="54" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="76" y="308" fill="#2743b8" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assistant</text>
<text x="210" y="308" fill="#191a17" font-size="19" text-anchor="start">tool_call: grep "footer"</text>
<rect x="60" y="336" width="520" height="54" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="76" y="370" fill="#686a61" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tool</text>
<text x="210" y="370" fill="#191a17" font-size="19" text-anchor="start">tool_result: 3 files</text>
<rect x="60" y="398" width="520" height="54" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="76" y="432" fill="#2743b8" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assistant</text>
<text x="210" y="432" fill="#191a17" font-size="19" text-anchor="start">tool_call: edit footer.vue</text>
<rect x="60" y="460" width="520" height="54" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="76" y="494" fill="#686a61" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tool</text>
<text x="210" y="494" fill="#191a17" font-size="19" text-anchor="start">tool_result: ok</text>
<rect x="60" y="522" width="520" height="54" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="76" y="556" fill="#2743b8" font-size="18" text-anchor="start" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assistant</text>
<text x="210" y="556" fill="#191a17" font-size="19" text-anchor="start">final: the footer is fixed</text>
<rect x="60" y="584" width="520" height="44" rx="8" fill="none" stroke="#a19f93" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="612" fill="#686a61" font-size="18" text-anchor="middle" font-style="italic">the next message goes here</text>
<text x="640" y="200" fill="#191a17" font-size="24" text-anchor="start" font-weight="700">append-only</text>
<text x="640" y="240" fill="#686a61" font-size="21" text-anchor="start">a new message goes at the end;</text>
<text x="640" y="272" fill="#686a61" font-size="21" text-anchor="start">nothing above it ever changes.</text>
<text x="640" y="304" fill="#686a61" font-size="21" text-anchor="start"></text>
<text x="640" y="336" fill="#686a61" font-size="21" text-anchor="start">the transcript is the memory of</text>
<text x="640" y="368" fill="#686a61" font-size="21" text-anchor="start">the session: what the context</text>
<text x="640" y="400" fill="#686a61" font-size="21" text-anchor="start">is built from, call after call.</text>
</svg>
