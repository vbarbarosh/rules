<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="a1299DA" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker><marker id="aFF6B6B" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#ff937c" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Permission</text>
<text x="48" y="108" fill="#92958c" font-size="22">what the harness lets a tool touch: paths, hosts, commands; enforced before the tool runs</text>
<rect x="60" y="180" width="260" height="90" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="190.0" y="219.5" fill="#9db2ff" font-size="22" text-anchor="middle" font-weight="700">tool_call</text>
<text x="190.0" y="245.9" fill="#92958c" font-size="19" text-anchor="middle">edit /etc/hosts</text>
<line x1="320" y1="225" x2="418" y2="225" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a1299da)"/>
<rect x="420" y="150" width="400" height="330" rx="16" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="440" y="184" fill="#92958c" font-size="22" text-anchor="start" font-weight="700">the permission</text>
<text x="450" y="226" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">paths: src/**, docs/**</text>
<text x="450" y="260" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">hosts: api.example.com</text>
<text x="450" y="294" fill="#d3d1c9" font-size="20" text-anchor="start" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">commands: npm, git, node</text>
<rect x="450" y="350" width="340" height="60" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="620.0" y="386.84" fill="#ff937c" font-size="19" text-anchor="middle" font-weight="700">/etc/hosts is outside src/</text>
<line x1="820" y1="225" x2="898" y2="225" stroke="#ff937c" stroke-width="1.75" stroke-linecap="round" marker-end="url(#aff6b6b)"/>
<rect x="900" y="180" width="240" height="90" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="1020.0" y="219.5" fill="#ff937c" font-size="22" text-anchor="middle" font-weight="700">refused</text>
<text x="1020.0" y="245.9" fill="#92958c" font-size="19" text-anchor="middle">the tool never ran</text>
<text x="48" y="530" fill="#92958c" font-size="21" text-anchor="start">A permission is enforced by code, not read by the model: the policy may say "only src/", the</text>
<text x="48" y="561" fill="#92958c" font-size="21" text-anchor="start">permission makes it so.</text>
</svg>
