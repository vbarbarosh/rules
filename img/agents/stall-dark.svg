<text x="610" y="236" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">round 5</text>
<text x="610" y="268" fill="#ffb257" font-size="19" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">grep "footer"</text>
<line x1="710" y1="245" x2="728" y2="245" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<rect x="730" y="200" width="200" height="90" rx="12" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="830" y="236" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">round 6</text>
<text x="830" y="268" fill="#ffb257" font-size="19" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">grep "footer"</text>
<line x1="930" y1="245" x2="948" y2="245" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5E5C4E)"/>
<rect x="950" y="200" width="200" height="90" rx="12" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="1050" y="236" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">round 7</text>
<text x="1050" y="268" fill="#ffb257" font-size="19" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">grep "footer"</text>
<text x="600" y="340" fill="#ffb257" font-size="21" text-anchor="middle" font-weight="700">the same call, the same result, five times: nothing moves</text>
<text x="48" y="430" fill="#92958c" font-size="21" text-anchor="start">A stall is caught by the harness, not the model: a repeated call with no new result ends the</text>
<text x="48" y="461" fill="#92958c" font-size="21" text-anchor="start">turn, or asks the user, before the cap does.</text>
