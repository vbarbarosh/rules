<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="a5E5C4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4f57"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Harness</text>
<text x="48" y="108" fill="#92958c" font-size="22">the code that runs the loop: builds the context, calls the model, runs the tools, appends the results, stops</text>
<rect x="60" y="200" width="200" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="160.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">build context</text>
<line x1="260" y1="235" x2="280" y2="235" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5E5C4E)"/>
<rect x="280" y="200" width="200" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="380.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">call the model</text>
<line x1="480" y1="235" x2="500" y2="235" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5E5C4E)"/>
<rect x="500" y="200" width="200" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="600.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">run the tool_calls</text>
<line x1="700" y1="235" x2="720" y2="235" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5E5C4E)"/>
<rect x="720" y="200" width="200" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="820.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">append results</text>
<line x1="920" y1="235" x2="940" y2="235" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5E5C4E)"/>
<rect x="940" y="200" width="200" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="1040.0" y="242.56" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">stop at a final</text>
<path d="M940 270 Q550 370 160 270" fill="none" stroke="#4a4f57" stroke-width="3" marker-end="url(#a5E5C4E)"/>
<text x="550" y="370" fill="#92958c" font-size="20" text-anchor="middle" font-style="italic">again, the next round</text>
<text x="48" y="400" fill="#92958c" font-size="21" text-anchor="start">Round after round, until the model answers with no tool_call: that is the final, and the</text>
<text x="48" y="431" fill="#92958c" font-size="21" text-anchor="start">harness stops. The harness owns every tool's implementation, the model only their names.</text>
</svg>
