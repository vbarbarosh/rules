<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="a5E5C4E" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#4a4f57" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Harness</text>
<text x="48" y="108" fill="#92958c" font-size="22">the code that runs the loop: builds the context, calls the model, runs the tools, appends the results, stops</text>
<rect x="60" y="260" width="220" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="170" y="302" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">build context</text>
<line x1="286" y1="295" x2="332" y2="295" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<rect x="340" y="260" width="220" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="450" y="302" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">call the model</text>
<line x1="566" y1="295" x2="612" y2="295" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<rect x="620" y="260" width="220" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="730" y="302" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">run the tool_calls</text>
<line x1="846" y1="295" x2="892" y2="295" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<rect x="900" y="260" width="220" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="1010" y="302" fill="#d3d1c9" font-size="21" text-anchor="middle" font-weight="700">append results</text>
<line x1="450" y1="254" x2="450" y2="204" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<text x="474" y="234" fill="#92958c" font-size="20" text-anchor="start" font-style="italic">no tool_call</text>
<rect x="340" y="138" width="220" height="58" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="450" y="174" fill="#72d39c" font-size="21" text-anchor="middle" font-weight="700">stop at a final</text>
<path d="M1010 336 C1010 420 170 420 170 338" fill="none" stroke="#4a4f57" stroke-width="1.75" stroke-linecap="round" marker-end="url(#a5e5c4e)"/>
<text x="590" y="428" fill="#92958c" font-size="20" text-anchor="middle" font-style="italic">tool_calls ran: again, the next round</text>
<text x="48" y="500" fill="#92958c" font-size="21" text-anchor="start">Round after round, until the model answers with no tool_call: that is the final, and the</text>
<text x="48" y="531" fill="#92958c" font-size="21" text-anchor="start">harness stops. The harness owns every tool's implementation, the model only their names.</text>
</svg>
