<text x="290" y="371" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">the transcript</text>
<rect x="90" y="404" width="400" height="64" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="290" y="431" fill="#2743b8" font-size="20" text-anchor="middle" font-weight="700">deploy to the server</text>
<text x="290" y="455" fill="#686a61" font-size="17" text-anchor="middle">this turn only: loaded when asked for</text>
<text x="290" y="505" fill="#686a61" font-size="20" text-anchor="middle">3,000 tokens, always</text>
<rect x="660" y="150" width="492" height="380" rx="16" fill="#e2e7fb" stroke="#2743b8" stroke-width="2" stroke-dasharray="12 8"/>
<text x="680" y="184" fill="#2743b8" font-size="22" text-anchor="start" font-weight="700">the skills, on the shelf</text>
<rect x="690" y="200" width="432" height="64" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="906" y="227" fill="#2743b8" font-size="20" text-anchor="middle" font-weight="700">deploy to the server</text>
<text x="906" y="251" fill="#686a61" font-size="17" text-anchor="middle">2,400 tokens</text>
<rect x="690" y="280" width="432" height="64" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="906" y="307" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">write a release note</text>
<text x="906" y="331" fill="#686a61" font-size="17" text-anchor="middle">900 tokens</text>
<rect x="690" y="360" width="432" height="64" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="906" y="387" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">run the e2e suite</text>
<text x="906" y="411" fill="#686a61" font-size="17" text-anchor="middle">1,800 tokens</text>
<path d="M684 232 C590 232 600 436 494 436" fill="none" stroke="#2743b8" stroke-width="4" marker-end="url(#a1299DA)"/>
<text x="48" y="572" fill="#686a61" font-size="21" text-anchor="start">A skill is read only in the turn that needs it, so the context stays small; a policy is read</text>
<text x="48" y="603" fill="#686a61" font-size="21" text-anchor="start">in every call.</text>
