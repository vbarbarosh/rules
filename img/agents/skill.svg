<text x="290" y="235" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">system message · policy</text>
<rect x="90" y="268" width="400" height="56" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="290" y="303" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">tool definitions</text>
