<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#fffefb"/>
<defs><marker id="a1299DA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Skill</text>
<text x="48" y="108" fill="#686a61" font-size="22">instructions loaded into the context on demand, not resident in every call</text>
