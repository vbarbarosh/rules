<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">The build ends with the self-check</text>
<text x="48" y="108" fill="#92958c" font-size="22">one probe per thing it needs; a lit lamp names what to fix</text>
<rect x="60" y="160" width="320" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="220.0" y="198.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/build</text>
<text x="220.0" y="224.0" fill="#92958c" font-size="17" text-anchor="middle">its steps</text>
<rect x="440" y="160" width="320" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="600.0" y="198.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/self-check</text>
<text x="600.0" y="224.0" fill="#92958c" font-size="17" text-anchor="middle">the last step</text>
<line x1="386" y1="202.0" x2="434" y2="202.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="340" height="64" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="230.0" y="338.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[ffmpeg] 6.1.1</text>
<rect x="430" y="300" width="340" height="64" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="338.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[pyftsubset] zopfli</text>
<rect x="800" y="300" width="340" height="64" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="970.0" y="338.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">build/front.d: missing</text>
<line x1="570" y1="250" x2="230" y2="294" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="570" y1="250" x2="600" y2="294" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="570" y1="250" x2="970" y2="294" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="800" y="160" width="340" height="84" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="970.0" y="198.0" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">ships nothing</text>
<text x="970.0" y="224.0" fill="#92958c" font-size="17" text-anchor="middle">until the lamp is out</text>
<text x="48" y="470" fill="#92958c" font-size="21">A build that fails its own check is not a build.</text>
</svg>
