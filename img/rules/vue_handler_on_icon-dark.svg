<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A handler on an icon is named after the icon</text>
<text x="48" y="108" fill="#92958c" font-size="22">a button with no text is named by its icon</text>
<rect x="60" y="180" width="120" height="70" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="60" y="286" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">svg-icon-archive</text>
<line x1="186" y1="215" x2="272" y2="215" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="170" width="440" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="500.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">click_icon_archive</text>
<text x="500.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">named after the icon</text>
<rect x="60" y="320" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="357" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="click_button"</text>
<text x="80" y="387" fill="#ff937c" font-size="17">✗ which button? it has no text</text>
<rect x="580" y="320" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="357" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="click_icon_archive"</text>
<text x="600" y="387" fill="#72d39c" font-size="17">✓ the icon names it</text>
<line x1="506" y1="360.5" x2="572" y2="360.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#92958c" font-size="21">click_icon_ and the icon name, as svg-icon-archive gives it.</text>
<rect x="104" y="207" width="26" height="18" rx="2" fill="none" stroke="#d3d1c9" stroke-width="2.5"/><rect x="101" y="201" width="32" height="7" rx="2" fill="none" stroke="#d3d1c9" stroke-width="2.5"/>
</svg>
