<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="420" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A modal returns a commit flag</text>
<text x="48" y="108" fill="#686a61" font-size="22">it does its own work and answers one thing: was anything committed?</text>
<rect x="60" y="170" width="420" height="110" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="212" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (await modal_upload().promise())</text>
<text x="110" y="250" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await blocking(this.refresh());</text>
<rect x="560" y="165" width="280" height="120" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="700.0" y="208.9" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">the modal</text>
<text x="700.0" y="232.6" fill="#686a61" font-size="17" text-anchor="middle">uploads, checks, saves:</text>
<text x="700.0" y="256.4" fill="#686a61" font-size="17" text-anchor="middle">its own logic</text>
<line x1="486" y1="225" x2="552" y2="225" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="920" y="150" width="220" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1030.0" y="181.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">true</text>
<text x="1030.0" y="207.0" fill="#686a61" font-size="17" text-anchor="middle">committed: refresh</text>
<rect x="920" y="240" width="220" height="70" rx="10" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="1030.0" y="271.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">false</text>
<text x="1030.0" y="297.0" fill="#686a61" font-size="17" text-anchor="middle">cancel or no change</text>
<line x1="846" y1="205" x2="912.08" y2="185.56" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="846" y1="245" x2="912.17" y2="274.19" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="380" fill="#686a61" font-size="21">The flag states intent; the control flow stays inside the modal.</text>
</svg>
