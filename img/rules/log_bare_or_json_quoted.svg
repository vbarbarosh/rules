<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="590" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Simple words bare, the rest JSON-quoted</text>
<text x="48" y="108" fill="#686a61" font-size="22">a bare word cannot span words, break the line or mint a tag</text>
<rect x="60" y="160" width="1080" height="106" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="78.0" y="190.4" fill="#1a7443" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">name=select_users</text>
<text x="78.0" y="218.4" fill="#1a7443" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">reason="db timeout"</text>
<text x="78.0" y="246.4" fill="#1a7443" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">value=""</text>
<text x="460" y="190.4" fill="#686a61" font-size="18">bare: a simple word</text>
<text x="460" y="218.4" fill="#686a61" font-size="18">quoted: it has a space</text>
<text x="460" y="246.4" fill="#686a61" font-size="18">quoted: it is empty</text>
<rect x="60" y="306" width="470" height="84" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="335.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">reason=db timeout</text>
<text x="78" y="376" fill="#b2341f" font-size="17">✗ two words, one value?</text>
<rect x="670" y="306" width="470" height="84" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="335.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">reason="db timeout"</text>
<text x="688" y="376" fill="#1a7443" font-size="17">✓ quoted</text>
<line x1="536" y1="348.0" x2="664" y2="348.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="410" width="470" height="84" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="439.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">role=[admin]</text>
<text x="78" y="480" fill="#b2341f" font-size="17">✗ looks like a field</text>
<rect x="670" y="410" width="470" height="84" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="439.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">role="[admin]"</text>
<text x="688" y="480" fill="#1a7443" font-size="17">✓ quoted</text>
<line x1="536" y1="452.0" x2="664" y2="452.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="550" fill="#686a61" font-size="21">Bare are exactly the bytes sent; anything else is JSON-quoted.</text>
</svg>
