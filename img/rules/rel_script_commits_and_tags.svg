<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">The script commits and tags, not the bump</text>
<text x="48" y="108" fill="#686a61" font-size="22">npm only changes the version; the script owns the commit and the tag</text>
<rect x="60" y="170" width="510" height="84" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="315.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">npm version patch</text>
<text x="315.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">--no-git-tag-version</text>
<rect x="630" y="170" width="510" height="84" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="885.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">git commit, git tag</text>
<text x="885.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">in the script</text>
<line x1="576" y1="212.0" x2="622" y2="212" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="500" height="84" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="310.0" y="338.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">npm version patch</text>
<text x="310.0" y="364.0" fill="#686a61" font-size="17" text-anchor="middle">✗ commits and tags on its own</text>
<rect x="640" y="300" width="500" height="84" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="890.0" y="338.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/release</text>
<text x="890.0" y="364.0" fill="#686a61" font-size="17" text-anchor="middle">✓ commits after dist/ is built</text>
<line x1="566" y1="342.0" x2="632" y2="342" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="450" fill="#686a61" font-size="21">The commit has to include the new dist/, so the script makes it.</text>
</svg>
