<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A handler on an icon is named after the icon</text>
<text x="48" y="108" fill="#686a61" font-size="22">a button with no text is named by its icon</text>
<rect x="60" y="180" width="120" height="70" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="60" y="286" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">svg-icon-archive</text>
<line x1="186" y1="215" x2="274" y2="215" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="280" y="170" width="440" height="90" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="500.0" y="211.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">click_icon_archive</text>
<text x="500.0" y="237.0" fill="#686a61" font-size="17" text-anchor="middle">named after the icon</text>
<rect x="60" y="320" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="357" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="click_button"</text>
<text x="80" y="387" fill="#b2341f" font-size="17">✗ which button? it has no text</text>
<rect x="580" y="320" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="357" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="click_icon_archive"</text>
<text x="600" y="387" fill="#1a7443" font-size="17">✓ the icon names it</text>
<line x1="506" y1="360.5" x2="574" y2="360.5" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#686a61" font-size="21">click_icon_ and the icon name, as svg-icon-archive gives it.</text>
<rect x="104" y="207" width="26" height="18" rx="2" fill="none" stroke="#191a17" stroke-width="2.5"/><rect x="101" y="201" width="32" height="7" rx="2" fill="none" stroke="#191a17" stroke-width="2.5"/>
</svg>
