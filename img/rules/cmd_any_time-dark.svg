<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker><marker id="arrow_bad" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#ff937c" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Any command runs by hand, at any time</text>
<text x="48" y="108" fill="#92958c" font-size="22">called whenever, it reads the state and does what is left; nothing breaks</text>
<rect x="48" y="150" width="500" height="320" rx="12" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
<text x="72" y="188" fill="#d3d1c9" font-size="20" font-weight="700">Called whenever</text>
<circle cx="92" cy="234" r="14" fill="none" stroke="#92958c" stroke-width="2"/>
<path d="M92 226 V234 H99" fill="none" stroke="#92958c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="118" y="240" fill="#d3d1c9" font-size="18">at night</text>
<line x1="262" y1="234" x2="334" y2="234" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="92" cy="308" r="14" fill="none" stroke="#92958c" stroke-width="2"/>
