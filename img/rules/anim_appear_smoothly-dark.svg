<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<style>
.a16-pop { animation: a16-pop 3.6s linear -3.6s infinite alternate; }
@keyframes a16-pop { 0%,49% { opacity: 0; } 50%,100% { opacity: 1; } }
.a16-fade { animation: a16-fade 3.6s ease-in-out -3.6s infinite alternate; }
@keyframes a16-fade { 0%,25% { opacity: 0; } 75%,100% { opacity: 1; } }
.a16-morph { animation: a16-morph 3.6s ease-in-out -3.6s infinite alternate; }
@keyframes a16-morph { 0%,25% { y: 20px; width: 110px; height: 34px; opacity: 0; } 35% { opacity: 1; } 75%,100% { y: 62px; width: 180px; height: 106px; opacity: 1; } }
.a16-late { animation: a16-late 3.6s ease-in-out -3.6s infinite alternate; }
@keyframes a16-late { 0%,55% { opacity: 0; } 75%,100% { opacity: 1; } }

</style>
<rect width="720" height="300" fill="#16181b"/>
<text x="20" y="32" fill="#ff937c" font-size="19" font-weight="700">✗ Pops in and out</text>
<rect x="16" y="46" width="336" height="238" rx="10" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
<g transform="translate(16 46)"><rect x="20" y="20" width="110" height="34" rx="8" fill="#1d2024" stroke="#3a3f46"/><text x="75" y="42" text-anchor="middle" fill="#d3d1c9" font-size="16" font-weight="700">⋯ Menu</text><rect x="150" y="31" width="166" height="8" rx="4" fill="#3a3f46"/><rect x="150" y="47" width="120" height="8" rx="4" fill="#3a3f46"/><g class="a16-pop"><rect x="20" y="62" width="180" height="106" rx="8" fill="#1b2346" stroke="#9db2ff"/><text x="36" y="88" fill="#d3d1c9" font-size="16">Rename</text><text x="36" y="120" fill="#d3d1c9" font-size="16">Move</text><text x="36" y="152" fill="#d3d1c9" font-size="16">Delete</text></g><g class="a16-pop"><rect x="120" y="184" width="196" height="38" rx="19" fill="#16301f" stroke="#72d39c"/><text x="218" y="208" text-anchor="middle" fill="#72d39c" font-size="16" font-weight="700">✓ Saved</text></g></g>
<text x="380" y="32" fill="#72d39c" font-size="19" font-weight="700">✓ Grows from its button; fades</text>
<rect x="368" y="46" width="336" height="238" rx="10" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
<g transform="translate(368 46)"><rect class="a16-morph" x="20" y="62" width="180" height="106" rx="8" fill="#1b2346" stroke="#9db2ff"/><rect x="20" y="20" width="110" height="34" rx="8" fill="#1d2024" stroke="#3a3f46"/><text x="75" y="42" text-anchor="middle" fill="#d3d1c9" font-size="16" font-weight="700">⋯ Menu</text><rect x="150" y="31" width="166" height="8" rx="4" fill="#3a3f46"/><rect x="150" y="47" width="120" height="8" rx="4" fill="#3a3f46"/><g class="a16-late"><text x="36" y="88" fill="#d3d1c9" font-size="16">Rename</text><text x="36" y="120" fill="#d3d1c9" font-size="16">Move</text><text x="36" y="152" fill="#d3d1c9" font-size="16">Delete</text></g><g class="a16-fade"><rect x="120" y="184" width="196" height="38" rx="19" fill="#16301f" stroke="#72d39c"/><text x="218" y="208" text-anchor="middle" fill="#72d39c" font-size="16" font-weight="700">✓ Saved</text></g></g>
</svg>
