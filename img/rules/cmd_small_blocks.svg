<rect x="950" y="380" width="178" height="72" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="964" y="408" fill="#191a17" font-size="16" font-weight="700" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">release</text>
