<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Keep the place yourself; the browser won't</text>
<text x="48" y="108" fill="#92958c" font-size="22">a block above grows; the line being read stays where it was on screen</text>
<text x="60" y="158" fill="#ff937c" font-size="19">✗ the browser alone: moved 120 px</text>
<rect x="60" y="175" width="480" height="300" rx="12" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="80" y="192" width="440" height="70" rx="8" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="300" y="234" fill="#d3d1c9" font-size="19" text-anchor="middle">the summary grew</text>
<rect x="80" y="280" width="440" height="56" rx="8" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="8 6"/>
<text x="300" y="315" fill="#92958c" font-size="18" text-anchor="middle">it was here</text>
<rect x="80" y="400" width="440" height="56" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="300" y="435" fill="#d3d1c9" font-size="19" text-anchor="middle">the line you read</text>
<line x1="460" y1="342" x2="460" y2="392" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="660" y="158" fill="#72d39c" font-size="19">✓ scroll_keep: moved 0 px</text>
<rect x="660" y="175" width="480" height="300" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="680" y="192" width="440" height="70" rx="8" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="900" y="234" fill="#d3d1c9" font-size="19" text-anchor="middle">the summary grew</text>
<rect x="680" y="280" width="440" height="56" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="900" y="315" fill="#d3d1c9" font-size="19" text-anchor="middle">the line you read</text>
<line x1="546" y1="325" x2="652" y2="325" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="520" fill="#92958c" font-size="21">Note the middle element before the change; scroll by however far it moved after.</text>
</svg>
