<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="454" viewBox="0 0 1200 454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="454" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Align switch and case</text>
<text x="48" y="108" fill="#92958c" font-size="22">case sits at the indentation of switch</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ case indented under switch</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ case at the level of switch</text>
<rect x="60" y="180" width="500" height="192" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">switch (type) {</text>
<rect x="70" y="229" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="123.2" y="250" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">case 'voice':</text>
<text x="166.4" y="284" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">break;</text>
<rect x="70" y="297" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="123.2" y="318" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">default:</text>
<text x="80.0" y="352" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<rect x="640" y="180" width="500" height="192" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">switch (type) {</text>
<rect x="650" y="229" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="250" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">case 'voice':</text>
<text x="703.2" y="284" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">break;</text>
<rect x="650" y="297" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="318" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">default:</text>
<text x="660.0" y="352" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<line x1="566" y1="276.0" x2="634" y2="276.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="422" fill="#92958c" font-size="21">The cases are the switch's labels, so they stand at its level; their bodies go one in.</text>
