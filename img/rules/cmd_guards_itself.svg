<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker><marker id="arrow_bad" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#b2341f" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A command that runs one at a time guards itself</text>
<text x="48" y="108" fill="#686a61" font-size="22">a second call sees the first and ends with an error that says so</text>
<rect x="48" y="150" width="540" height="300" rx="12" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<text x="72" y="188" fill="#191a17" font-size="20" font-weight="700">The first call</text>
<rect x="72" y="208" width="492" height="150" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="92" y="244" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$ refresh-builds</text>
<path d="M97 280 V274 A9 9 0 0 1 115 274 V280" fill="none" stroke="#b8650a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="92" y="280" width="28" height="22" rx="4" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="134" y="296" fill="#191a17" font-size="17">takes its lock</text>
<text x="92" y="338" fill="#b8650a" font-size="17">○ running · 2 of 3</text>
<text x="72" y="412" fill="#686a61" font-size="17">holds the lock till it ends</text>
<rect x="612" y="150" width="540" height="300" rx="12" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<text x="636" y="188" fill="#191a17" font-size="20" font-weight="700">A second call, meanwhile</text>
<rect x="636" y="208" width="492" height="150" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="656" y="244" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$ refresh-builds</text>
<text x="656" y="290" fill="#b2341f" font-size="17" font-weight="700">✗ already running</text>
<text x="656" y="314" fill="#b2341f" font-size="17">the first call holds the lock</text>
<text x="656" y="338" fill="#b2341f" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">exit 1</text>
<text x="636" y="412" fill="#1a7443" font-size="17">✓ the caller need not check first</text>
<text x="48" y="488" fill="#686a61" font-size="21">The guard is inside the command, so a click, the clock or a hand may call it.</text>
</svg>
