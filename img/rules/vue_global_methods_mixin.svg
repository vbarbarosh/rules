<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Three global methods through a mixin</text>
<text x="48" y="108" fill="#686a61" font-size="22">every component can call px, uid and emit_input, with no import</text>
<rect x="60" y="170" width="420" height="220" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="84" y="210" fill="#191a17" font-size="21" font-weight="700">the globals mixin</text>
<text x="84" y="256" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">px(value)</text>
<text x="84" y="296" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">uid([name])</text>
<text x="84" y="336" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">emit_input(value)</text>
<rect x="640" y="160" width="500" height="72" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="890.0" y="192.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">app-input-email</text>
<text x="890.0" y="218.0" fill="#686a61" font-size="17" text-anchor="middle">this.px(), this.uid(), this.emit_input()</text>
<line x1="486" y1="280" x2="632.26" y2="196.99" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640" y="250" width="500" height="72" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="890.0" y="282.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">app-slider</text>
<text x="890.0" y="308.0" fill="#686a61" font-size="17" text-anchor="middle">this.px(), this.uid(), this.emit_input()</text>
<line x1="486" y1="280" x2="632" y2="285.92" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640" y="340" width="500" height="72" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="890.0" y="372.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">badge-new</text>
<text x="890.0" y="398.0" fill="#686a61" font-size="17" text-anchor="middle">this.px(), this.uid(), this.emit_input()</text>
<line x1="486" y1="280" x2="632.32" y2="374.91" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="470" fill="#686a61" font-size="21">One mixin hands the three methods to every component of the app.</text>
</svg>
