<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="444" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="35" font-weight="700">A subquery body is indented between its parentheses</text>
<text x="48" y="108" fill="#92958c" font-size="22">( ends the line that uses it; ) closes at that line's indent</text>
<rect x="60" y="160" width="470" height="188" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">WHERE id IN (</text>
<text x="78.0" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">SELECT id FROM (</text>
<text x="78.0" y="241.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">SELECT MIN(id) AS id</text>
<text x="78.0" y="267.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">) AS oldest</text>
<text x="78.0" y="293.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">)</text>
<text x="78" y="334" fill="#ff937c" font-size="17">✗ flat: no levels</text>
<rect x="670" y="160" width="470" height="188" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">WHERE id IN (</text>
<text x="728.8" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">SELECT id FROM (</text>
<text x="769.6" y="241.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">SELECT MIN(id) AS id</text>
<text x="728.8" y="267.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">) AS oldest</text>
<text x="688.0" y="293.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">)</text>
<text x="688" y="334" fill="#72d39c" font-size="17">✓ a level per subquery</text>
<line x1="536" y1="254.0" x2="664" y2="254.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="404" fill="#92958c" font-size="21">The closing parenthesis comes on its own line, followed by the alias.</text>
</svg>
