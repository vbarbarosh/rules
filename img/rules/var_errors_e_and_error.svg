<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Errors use e in arrows, error in regular handlers</text>
<text x="48" y="108" fill="#686a61" font-size="22">where the error arrives decides its name</text>
<rect x="60" y="160" width="260" height="70" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="190.0" y="201.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">an arrow</text>
<rect x="340" y="160" width="600" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="202" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">promise.catch(e =&gt; report(e));</text>
<rect x="980" y="160" width="160" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1060.0" y="202.7" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">e</text>
<rect x="60" y="260" width="260" height="70" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="190.0" y="301.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">a regular function</text>
<rect x="340" y="260" width="600" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="302" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">server.on('error', function (error) {</text>
<rect x="980" y="260" width="160" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1060.0" y="302.7" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">error</text>
<rect x="60" y="360" width="260" height="70" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="190.0" y="401.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">a catch binding</text>
<rect x="340" y="360" width="600" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="402" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">catch (error) { … }</text>
<rect x="980" y="360" width="160" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1060.0" y="402.7" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">error</text>
<text x="48" y="510" fill="#686a61" font-size="21">The same at every depth; a DOM error event is an event, VAR-16.</text>
</svg>
