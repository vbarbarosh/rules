<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A generic name has one meaning</text>
<text x="48" y="108" fill="#92958c" font-size="22">each short name means one thing; anything else is named by what it holds</text>
<rect x="60" y="150" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="230.0" y="181.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">i</text>
<text x="230.0" y="207.0" fill="#92958c" font-size="17" text-anchor="middle">loop index</text>
<rect x="430" y="150" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="181.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">end</text>
<text x="600.0" y="207.0" fill="#92958c" font-size="17" text-anchor="middle">cached length</text>
<rect x="800" y="150" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="970.0" y="181.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">ii</text>
<text x="970.0" y="207.0" fill="#92958c" font-size="17" text-anchor="middle">nested bound</text>
<rect x="60" y="234" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="230.0" y="265.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">v</text>
<text x="230.0" y="291.0" fill="#92958c" font-size="17" text-anchor="middle">arrow value</text>
<rect x="430" y="234" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="265.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">e</text>
<text x="600.0" y="291.0" fill="#92958c" font-size="17" text-anchor="middle">arrow error</text>
<rect x="800" y="234" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="970.0" y="265.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">error</text>
<text x="970.0" y="291.0" fill="#92958c" font-size="17" text-anchor="middle">caught error</text>
<rect x="60" y="318" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="230.0" y="349.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">event</text>
<text x="230.0" y="375.0" fill="#92958c" font-size="17" text-anchor="middle">DOM event</text>
<rect x="430" y="318" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="349.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">out</text>
<text x="600.0" y="375.0" fill="#92958c" font-size="17" text-anchor="middle">built, then return out;</text>
<rect x="800" y="318" width="340" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="970.0" y="349.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">time0</text>
<text x="970.0" y="375.0" fill="#92958c" font-size="17" text-anchor="middle">start of a measurement</text>
<rect x="60" y="420" width="500" height="118" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="454" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const out = [...new Set(tags)];</text>
<text x="80.0" y="482" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return … ? tags : out;</text>
<text x="80" y="522" fill="#ff937c" font-size="17">✗ returned on a condition: not out</text>
<rect x="640" y="420" width="500" height="118" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="454" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const unique_tags = [...new Set(tags)];</text>
<text x="660.0" y="482" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return … ? tags : unique_tags;</text>
<text x="660" y="522" fill="#72d39c" font-size="17">✓ named by what it holds</text>
<line x1="566" y1="479.0" x2="634" y2="479.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
