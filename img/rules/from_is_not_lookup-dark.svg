<line x1="786" y1="263" x2="854" y2="263" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="500" fill="#92958c" font-size="21">A lookup disguised as construction hides what it costs and where the data lives.</text>
