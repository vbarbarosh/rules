<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="351" viewBox="0 0 1200 351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="351" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Spell out v-on and v-bind</text>
<text x="48" y="108" fill="#686a61" font-size="22">the full directive names, never the : and @ shorthands</text>
<rect x="60" y="170" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="207" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;img :src="url" @click="open" /&gt;</text>
<text x="80" y="237" fill="#b2341f" font-size="17">✗ the shorthands : and @</text>
<rect x="580" y="170" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="207" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;img v-bind:src="url" v-on:click="open" /&gt;</text>
<text x="600" y="237" fill="#1a7443" font-size="17">✓ v-bind: and v-on: spelled out</text>
<line x1="506" y1="210.5" x2="574" y2="210.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="311" fill="#686a61" font-size="21">The full names are searchable and read the same in every file.</text>
</svg>
