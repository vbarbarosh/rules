<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="633" viewBox="0 0 1200 633" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="633" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A script runs main and exports nothing</text>
<text x="48" y="108" fill="#686a61" font-size="22">it is run, not required: main is its entry</text>
<rect x="60" y="150" width="500" height="81.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="150" width="500" height="81.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="183.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">module.exports = main;</text>
<text x="78" y="215.3" fill="#b2341f" font-size="17">✗ a script that exports</text>
<text x="658.0" y="183.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// nothing exported</text>
<text x="658" y="215.3" fill="#1a7443" font-size="17">✓ it only runs</text>
<line x1="566" y1="190.65" x2="632" y2="190.65" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="261.3" width="1080" height="282" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="78" y="293.3" fill="#686a61" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">bin/build</text>
<rect x="74" y="311.3" width="1052" height="46" rx="6" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="90" y="340.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">#!/usr/bin/env node</text>
<rect x="74" y="367.3" width="1052" height="46" rx="6" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="90" y="396.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const cli = require('@vbarbarosh/node-helpers/src/cli');</text>
<rect x="74" y="423.3" width="1052" height="46" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="90" y="452.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">cli(main);</text>
<text x="1110" y="452.3" fill="#686a61" font-size="17" text-anchor="end">runs main</text>
<rect x="74" y="479.3" width="1052" height="46" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="90" y="508.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">async function main()</text>
<text x="1110" y="508.3" fill="#686a61" font-size="17" text-anchor="end">the entry</text>
<text x="48" y="597" fill="#686a61" font-size="21">A script is a verb of the project: it runs main and gives nothing away.</text>
</svg>
