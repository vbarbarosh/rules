<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Typing focuses the main search</text>
<text x="48" y="108" fill="#686a61" font-size="22">typing outside a field goes to the main filter, the first key included</text>
<rect x="60" y="196" width="56" height="56" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="88" y="233" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">s</text>
<rect x="130" y="196" width="56" height="56" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="158" y="233" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">m</text>
<line x1="192" y1="224" x2="334" y2="224" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="340" y="190" width="520" height="68" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="364" y="233" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">sm</text>
<text x="880" y="233" fill="#686a61" font-size="18">the main filter</text>
<rect x="340" y="290" width="300" height="56" rx="8" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="326" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Bob</text>
<text x="660" y="326" fill="#686a61" font-size="18">a local field keeps its typing</text>
<rect x="60" y="390" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="427" fill="#191a17" font-size="19">first key focuses, then is lost</text>
<text x="80" y="457" fill="#b2341f" font-size="17">✗ the filter shows only "m"</text>
<rect x="580" y="390" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="427" fill="#191a17" font-size="19">first key focuses and types</text>
<text x="600" y="457" fill="#1a7443" font-size="17">✓ the filter shows "sm"</text>
<line x1="506" y1="430.5" x2="574" y2="430.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
