<text x="660.0" y="194" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (!user) {</text>
<text x="680.4" y="222" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return null;</text>
<text x="660.0" y="250" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="660.0" y="278" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (!items.length) { return []; }</text>
<text x="660.0" y="306" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// the work</text>
