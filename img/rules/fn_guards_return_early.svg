<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Guards return early</text>
<text x="48" y="108" fill="#686a61" font-size="22">check the inputs first and leave; the work stays unindented</text>
<rect x="60" y="160" width="500" height="202" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="194" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (user) {</text>
<text x="100.4" y="222" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (items.length) {</text>
<text x="120.8" y="250" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// the work</text>
<text x="100.4" y="278" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="80.0" y="306" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="80" y="346" fill="#b2341f" font-size="17">✗ the work buried in ifs</text>
