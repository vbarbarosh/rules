<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Runtime state in data/, never committed</text>
<text x="48" y="108" fill="#92958c" font-size="22">what the running app writes stays out of git</text>
<rect x="60" y="170" width="510" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="315.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">the running app</text>
<text x="315.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">writes as it works</text>
<rect x="630" y="170" width="510" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="885.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">data/logs/2026-08-24.txt</text>
<text x="885.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">runtime state</text>
<line x1="576" y1="212.0" x2="624" y2="212.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="500" height="84" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="310.0" y="348.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">data/</text>
<text x="310.0" y="374.0" fill="#92958c" font-size="17" text-anchor="middle">.gitignore</text>
<text x="600" y="360" fill="#92958c" font-size="19">git never sees runtime state</text>
<text x="48" y="470" fill="#92958c" font-size="21">Logs, uploads and databases belong to the running app, not to the repository.</text>
</svg>
