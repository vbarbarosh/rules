<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Rename the handler with its label</text>
<text x="48" y="108" fill="#686a61" font-size="22">when the words on the button change, the handler changes with them</text>
<rect x="60" y="175" width="200" height="60" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="160" y="212" fill="#191a17" font-size="20" text-anchor="middle">Approve</text>
<line x1="266" y1="205" x2="354" y2="205" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="360" y="170" width="300" height="70" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="510.0" y="201.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">click_approve</text>
<text x="510.0" y="227.0" fill="#686a61" font-size="17" text-anchor="middle">before</text>
<rect x="60" y="290" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="327" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Accept  →  click_approve</text>
<text x="80" y="357" fill="#b2341f" font-size="17">✗ the label changed, the name did not</text>
<rect x="580" y="290" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="327" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Accept  →  click_accept</text>
<text x="600" y="357" fill="#1a7443" font-size="17">✓ renamed with its label</text>
<line x1="506" y1="330.5" x2="574" y2="330.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="440" fill="#686a61" font-size="21">A stale name sends the next reader to a button that no longer exists.</text>
</svg>
