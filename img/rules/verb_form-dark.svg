<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">The verb form marks function or data</text>
<text x="48" y="108" fill="#92958c" font-size="22">an imperative verb makes a function; a past participle makes data</text>
<text x="60" y="180" fill="#9db2ff" font-size="19" font-weight="700">imperative: sort</text>
<rect x="60" y="196" width="420" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="270.0" y="237.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">items_sort_by_time(items)</text>
<text x="270.0" y="263.0" fill="#92958c" font-size="17" text-anchor="middle">a function, called</text>
<text x="640" y="180" fill="#72d39c" font-size="19" font-weight="700">past participle: sorted</text>
<rect x="640" y="196" width="420" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="850.0" y="237.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">items_sorted_by_time</text>
<text x="850.0" y="263.0" fill="#92958c" font-size="17" text-anchor="middle">data, read</text>
<line x1="486" y1="241" x2="632" y2="241" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="330" width="1000" height="110" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="84" y="372" fill="#92958c" font-size="19">no verb in the name: a marker makes it a function</text>
<text x="84" y="414" fill="#d3d1c9" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">_from_   _to_   _of_   check_</text>
<text x="48" y="510" fill="#92958c" font-size="21">The grammar of the name says whether to call it or read it.</text>
</svg>
