<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="442" viewBox="0 0 1200 442" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="442" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Parenthesize compound operands in logic</text>
<text x="48" y="108" fill="#686a61" font-size="22">an operand with an operator of its own goes in parentheses</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ a comparison bare beside ||</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ the comparison in parentheses</text>
<rect x="60" y="180" width="500" height="56" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return is_dev || i === end - 1;</text>
<rect x="640" y="180" width="500" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return is_dev || (i === end - 1);</text>
<line x1="566" y1="208.0" x2="632" y2="208" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="292" fill="#b2341f" font-size="18" font-weight="700">✗ a bare condition before ?</text>
<text x="640" y="292" fill="#1a7443" font-size="18" font-weight="700">✓ the condition in parentheses</text>
<rect x="60" y="304" width="500" height="56" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="70" y="319" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="340" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">state === 'done' ? 'ok' : 'wait'</text>
<rect x="640" y="304" width="500" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="650" y="319" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="340" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">(state === 'done') ? 'ok' : 'wait'</text>
<line x1="566" y1="332.0" x2="632" y2="332" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="410" fill="#686a61" font-size="21">Names, calls and negations stay bare; anything with its own operator is wrapped.</text>
</svg>
