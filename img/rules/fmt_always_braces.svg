<text x="80.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (!user) return null;</text>
<rect x="640" y="180" width="500" height="124" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
