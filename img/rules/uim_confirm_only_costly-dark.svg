<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="379" viewBox="0 0 1200 379" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="379" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Confirm only the costly and the final</text>
<text x="48" y="108" fill="#92958c" font-size="22">closing an account, erasing data for good: a deliberate step, not OK/Cancel</text>
<rect x="60" y="170" width="440" height="109" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="207" fill="#d3d1c9" font-size="19">Close account?</text>
<text x="80.0" y="235" fill="#d3d1c9" font-size="19">[OK]  [Cancel]</text>
<text x="80" y="265" fill="#ff937c" font-size="17">✗ one click on OK, gone for good</text>
<rect x="580" y="170" width="560" height="109" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="207" fill="#d3d1c9" font-size="19">type "acme-shop" to close it</text>
<text x="600.0" y="235" fill="#d3d1c9" font-size="19">[Close account]</text>
<text x="600" y="265" fill="#72d39c" font-size="17">✓ a deliberate step</text>
<line x1="506" y1="224.5" x2="572" y2="224.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="339" fill="#92958c" font-size="21">Or a link sent by email; everything that can be undone is not confirmed.</text>
</svg>
