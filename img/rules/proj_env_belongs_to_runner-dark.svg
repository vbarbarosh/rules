<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">.env belongs to whoever runs the app</text>
<text x="48" y="108" fill="#92958c" font-size="22">docker loads it, or the Dockerfile sets the variables; the app only reads them</text>
<rect x="60" y="160" width="300" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="210.0" y="191.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">.env</text>
<text x="210.0" y="217.0" fill="#92958c" font-size="17" text-anchor="middle">docker loads it</text>
<rect x="60" y="260" width="300" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="210.0" y="291.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Dockerfile ENV</text>
<text x="210.0" y="317.0" fill="#92958c" font-size="17" text-anchor="middle">or sets them</text>
<rect x="460" y="210" width="300" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="610.0" y="241.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">process.env</text>
<text x="610.0" y="267.0" fill="#92958c" font-size="17" text-anchor="middle">the environment</text>
<rect x="860" y="210" width="280" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1000.0" y="241.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">the app</text>
<text x="1000.0" y="267.0" fill="#92958c" font-size="17" text-anchor="middle">reads it</text>
<line x1="366" y1="195" x2="452.18" y2="234.17" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="366" y1="295" x2="452.18" y2="255.83" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="766" y1="245" x2="852" y2="245" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="450" fill="#92958c" font-size="21">The rules set nothing for .env: it is the runner's file, not the application's.</text>
</svg>
