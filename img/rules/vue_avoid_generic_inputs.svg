<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="397" viewBox="0 0 1200 397" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="397" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Avoid generic inputs</text>
<text x="48" y="108" fill="#686a61" font-size="22">one input per kind of value, not one input with many knobs</text>
<rect x="60" y="160" width="440" height="137" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="197" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-number</text>
<text x="102.8" y="225" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">min max step</text>
<text x="102.8" y="253" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">unit precision …</text>
<text x="80" y="283" fill="#b2341f" font-size="17">✗ one input, many properties</text>
<rect x="580" y="160" width="560" height="137" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="197" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-percent /&gt;</text>
<text x="600.0" y="225" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-px /&gt;</text>
<text x="600.0" y="253" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-year /&gt;</text>
<text x="600" y="283" fill="#1a7443" font-size="17">✓ one input for each kind of value</text>
<line x1="506" y1="228.5" x2="574" y2="228.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="357" fill="#686a61" font-size="21">A specific input knows its range and step; the call site sets nothing.</text>
</svg>
