<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Two levels, always</text>
<text x="48" y="108" fill="#686a61" font-size="22">under a command only records; never a record alone, never a command in a command</text>
<rect x="48" y="150" width="352" height="300" rx="12" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<text x="72" y="188" fill="#b2341f" font-size="20" font-weight="700">✗ A record alone</text>
<rect x="96" y="214" width="200" height="44" rx="8" fill="none" stroke="#a19f93" stroke-width="2" stroke-dasharray="7 6"/>
<text x="196.0" y="243.0" fill="#686a61" font-size="20" text-anchor="middle">?</text>
<path d="M124 258 V322 M124 322 H150" fill="none" stroke="#686a61" stroke-width="2" stroke-linejoin="round"/>
<rect x="152" y="300" width="210" height="44" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="170" y="328.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">folder_created</text>
<text x="72" y="410" fill="#b2341f" font-size="17">✗ no command above it</text>
<rect x="424" y="150" width="352" height="300" rx="12" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<text x="448" y="188" fill="#b2341f" font-size="20" font-weight="700">✗ A command in a command</text>
<rect x="448" y="214" width="304" height="134" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="466" y="246" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_create_project</text>
<rect x="468" y="268" width="264" height="60" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="486" y="304.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_create_folder</text>
<text x="448" y="410" fill="#b2341f" font-size="17">✗ a third level</text>
<rect x="800" y="150" width="352" height="300" rx="12" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<text x="824" y="188" fill="#1a7443" font-size="20" font-weight="700">✓ A command, records under it</text>
<rect x="824" y="214" width="304" height="44" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="842" y="242.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_create_project</text>
<path d="M852 258 V358 M852 302 H886 M852 358 H886" fill="none" stroke="#686a61" stroke-width="2" stroke-linejoin="round"/>
<rect x="888" y="280" width="240" height="44" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="906" y="308.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">project_created</text>
<rect x="888" y="336" width="240" height="44" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="906" y="364.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">folder_created</text>
<text x="824" y="410" fill="#1a7443" font-size="17">✓ two levels</text>
<text x="48" y="508" fill="#686a61" font-size="21">The command is the parent; under it only created, updated and deleted.</text>
</svg>
