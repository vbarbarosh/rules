<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="672" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Every event carries its group uid</text>
<text x="48" y="108" fill="#92958c" font-size="22">one unit of work, one uid on all its lines</text>
<text x="60" y="180" fill="#92958c" font-size="19" font-weight="700">one request: group cd8e5vqp</text>
<rect x="60" y="196" width="180" height="50" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="150" y="228" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="196" width="560" height="50" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="270" y="228" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[http_request_begin] GET /users</text>
<rect x="60" y="256" width="180" height="50" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="150" y="288" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="256" width="560" height="50" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="270" y="288" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[db_query_begin] name=select_users</text>
<rect x="60" y="316" width="180" height="50" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="150" y="348" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="316" width="560" height="50" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="270" y="348" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[db_query_end_ok] 0.012s</text>
<rect x="60" y="376" width="180" height="50" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="150" y="408" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="376" width="560" height="50" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="270" y="408" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[http_request_end] 200 0.020s</text>
<rect x="860" y="230" width="280" height="140" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="1000.0" y="283.9" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a group</text>
<text x="1000.0" y="307.6" fill="#92958c" font-size="17" text-anchor="middle">a request, a job,</text>
<text x="1000.0" y="331.4" fill="#92958c" font-size="17" text-anchor="middle">a cron run</text>
<rect x="60" y="466" width="470" height="110" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="495.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[http_request_begin] GET /users</text>
<text x="78" y="562" fill="#ff937c" font-size="17">✗ whose request?</text>
<rect x="670" y="466" width="470" height="110" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="495.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[cd8e5vqp][http_request_begin]</text>
<text x="688.0" y="521.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">GET /users</text>
<text x="688" y="562" fill="#72d39c" font-size="17">✓ its group named</text>
<line x1="536" y1="521.0" x2="662" y2="521" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="632" fill="#92958c" font-size="21">A grep for the uid gives the whole story of one unit of work.</text>
</svg>
