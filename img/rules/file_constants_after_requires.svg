<rect x="640" y="160" width="500" height="135.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const report_limit = 31;</text>
<text x="78.0" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const fs = require('fs');</text>
<text x="78.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function main()</text>
<text x="78" y="279.3" fill="#b2341f" font-size="17">✗ a constant above the requires</text>
<text x="658.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const fs = require('fs');</text>
<text x="658.0" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const report_limit = 31;</text>
<text x="658.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function main()</text>
<text x="658" y="279.3" fill="#1a7443" font-size="17">✓ requires, then constants</text>
<line x1="566" y1="227.65" x2="634" y2="227.65" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="349" fill="#686a61" font-size="21">Requires first: a constant may use what they bring.</text>
