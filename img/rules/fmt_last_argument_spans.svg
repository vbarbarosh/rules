<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="612" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Only the last argument spans lines</text>
<text x="48" y="108" fill="#686a61" font-size="22">nothing follows a multi-line argument</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ an argument dangling after }</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ the function passed by name</text>
<rect x="60" y="180" width="500" height="124" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="216" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">page.evaluate(function (text) {</text>
<text x="120.8" y="250" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// ...</text>
<rect x="70" y="263" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="284" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}, text);</text>
<rect x="640" y="180" width="500" height="124" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="216" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">page.evaluate(find_families, text);</text>
<line x1="566" y1="242.0" x2="634" y2="242.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="360" fill="#b2341f" font-size="18" font-weight="700">✗ a call chained after })</text>
<text x="640" y="360" fill="#1a7443" font-size="18" font-weight="700">✓ the chained call on its own line</text>
<rect x="60" y="372" width="500" height="158" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="408" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items.filter(function (item) {</text>
<text x="120.8" y="442" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return item.active;</text>
<rect x="70" y="455" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="476" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}).map(v =&gt; v.uid);</text>
<rect x="640" y="372" width="500" height="158" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="660.0" y="408" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const kept = items.filter(function (item) {</text>
<text x="700.8" y="442" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return item.active;</text>
<text x="660.0" y="476" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">});</text>
<rect x="650" y="489" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="510" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const uids = kept.map(v =&gt; v.uid);</text>
<line x1="566" y1="451.0" x2="634" y2="451.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="580" fill="#686a61" font-size="21">Declare the function in the caller and pass it by name; a chained call becomes a variable.</text>
