<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Refresh is safe to call anytime</text>
<text x="48" y="108" fill="#92958c" font-size="22">once, twice, at any moment: the same up-to-date state</text>
<rect x="60" y="150" width="280" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="200.0" y="181.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh()</text>
<text x="200.0" y="207.0" fill="#92958c" font-size="17" text-anchor="middle">on load</text>
<line x1="346" y1="185" x2="592.07" y2="249.49" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="240" width="280" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="200.0" y="271.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh()</text>
<text x="200.0" y="297.0" fill="#92958c" font-size="17" text-anchor="middle">after a save</text>
<line x1="346" y1="275" x2="592.01" y2="250.2" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="330" width="280" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="200.0" y="361.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh()</text>
<text x="200.0" y="387.0" fill="#92958c" font-size="17" text-anchor="middle">twice in a row</text>
<line x1="346" y1="365" x2="592.19" y2="250.84" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="600" y="200" width="540" height="100" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="870.0" y="245.0" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">the same up-to-date state</text>
<text x="870.0" y="270.0" fill="#92958c" font-size="18" text-anchor="middle">no duplicates, no errors</text>
<text x="48" y="480" fill="#92958c" font-size="21">Idempotent: a call more or less changes nothing but freshness.</text>
</svg>
