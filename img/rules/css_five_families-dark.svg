<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="29" font-weight="700">Five families: layout, spacing, sizing, decoration, typography</text>
<text x="48" y="108" fill="#92958c" font-size="22">what each family holds</text>
<rect x="60" y="160" width="200" height="200" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="160" y="196" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">layout</text>
<text x="160" y="244" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">flex-row</text>
<text x="160" y="280" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">grid-*</text>
<text x="160" y="316" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">hsplit</text>
<rect x="280" y="160" width="200" height="200" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="380" y="196" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">spacing</text>
<text x="380" y="244" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">p10</text>
<text x="380" y="280" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">m5</text>
<text x="380" y="316" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">gap10</text>
<rect x="500" y="160" width="200" height="200" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="600" y="196" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">sizing</text>
<text x="600" y="244" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">w80</text>
<text x="600" y="280" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">h80</text>
<text x="600" y="316" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">max-w600</text>
<rect x="720" y="160" width="200" height="200" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="820" y="196" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">decoration</text>
<text x="820" y="244" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">br4</text>
<text x="820" y="280" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">fit-cover</text>
<text x="820" y="316" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">cur-pointer</text>
<rect x="940" y="160" width="200" height="200" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="1040" y="196" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">typography</text>
<text x="1040" y="244" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">fs14</text>
<text x="1040" y="280" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">fw600</text>
<text x="1040" y="316" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">nowrap</text>
<rect x="60" y="400" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="429.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="fs14 p10 flex-row"</text>
<text x="78" y="470" fill="#ff937c" font-size="17">✗ families mixed up</text>
<rect x="670" y="400" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="429.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="flex-row p10 fs14"</text>
<text x="688" y="470" fill="#72d39c" font-size="17">✓ in family order</text>
<line x1="536" y1="442.0" x2="664" y2="442.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="540" fill="#92958c" font-size="21">The families give the order in which a class list is written.</text>
</svg>
