<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Every #- class has a real style</text>
<text x="48" y="108" fill="#92958c" font-size="22">a #- class in the template needs a nonempty rule in the same component</text>
<rect x="60" y="170" width="480" height="80" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78" y="204" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.#-empty { }</text>
<text x="78" y="232" fill="#ff937c" font-size="17">✗ an empty rule</text>
<rect x="620" y="170" width="520" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="638" y="204" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.#-title { font-weight: 600; }</text>
<text x="638" y="232" fill="#72d39c" font-size="17">✓ a declaration</text>
<line x1="546" y1="210.0" x2="614" y2="210.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="280" width="480" height="80" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78" y="314" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.row:not(.#-done) { … }</text>
<text x="78" y="342" fill="#ff937c" font-size="17">✗ only inside :not(…)</text>
<rect x="620" y="280" width="520" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="638" y="314" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.#-done { opacity: 0.6; }</text>
<text x="638" y="342" fill="#72d39c" font-size="17">✓ a rule of its own</text>
<line x1="546" y1="320.0" x2="614" y2="320.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="450" fill="#92958c" font-size="21">Declarations, includes and extends count; empty or variable-only rules do not.</text>
</svg>
