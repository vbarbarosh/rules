<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="392" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">No lone end in a new group</text>
<text x="48" y="108" fill="#686a61" font-size="22">its begin was on the parent: keep the pair there</text>
<rect x="60" y="160" width="470" height="136" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_begin]</text>
<text x="78.0" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][group_spawn] parent=aaa</text>
<text x="78.0" y="241.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][process_end_ok] 0.000s</text>
<text x="78" y="282" fill="#b2341f" font-size="17">✗ the end strayed</text>
<rect x="670" y="160" width="470" height="136" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_begin]</text>
<text x="688.0" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_end_ok] 0.000s</text>
<text x="688" y="282" fill="#1a7443" font-size="17">✓ the pair together</text>
<line x1="536" y1="228.0" x2="664" y2="228.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="352" fill="#686a61" font-size="21">A begin and its end live in one group.</text>
</svg>
