<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="612" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Only the last argument spans lines</text>
<text x="48" y="108" fill="#92958c" font-size="22">nothing follows a multi-line argument</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ an argument dangling after }</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ the function passed by name</text>
<rect x="60" y="180" width="500" height="124" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">page.evaluate(function (text) {</text>
<text x="120.8" y="250" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// ...</text>
<rect x="70" y="263" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="284" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}, text);</text>
<rect x="640" y="180" width="500" height="124" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">page.evaluate(find_families, text);</text>
<line x1="566" y1="242.0" x2="634" y2="242.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="60" y="360" fill="#ff937c" font-size="18" font-weight="700">✗ a call chained after })</text>
<text x="640" y="360" fill="#72d39c" font-size="18" font-weight="700">✓ the chained call on its own line</text>
<rect x="60" y="372" width="500" height="158" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="408" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items.filter(function (item) {</text>
<text x="120.8" y="442" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return item.active;</text>
<rect x="70" y="455" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="476" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}).map(v =&gt; v.uid);</text>
<rect x="640" y="372" width="500" height="158" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="408" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const kept = items.filter(function (item) {</text>
<text x="700.8" y="442" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return item.active;</text>
<text x="660.0" y="476" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">});</text>
<rect x="650" y="489" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="510" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const uids = kept.map(v =&gt; v.uid);</text>
<line x1="566" y1="451.0" x2="634" y2="451.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="580" fill="#92958c" font-size="21">Declare the function in the caller and pass it by name; a chained call becomes a variable.</text>
</svg>
