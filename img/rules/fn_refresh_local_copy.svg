<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A local copy of remote data has "refresh"</text>
<text x="48" y="108" fill="#686a61" font-size="22">it pulls the data and brings the local copy up to date</text>
<rect x="60" y="180" width="220" height="110" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="170.0" y="230.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">server</text>
<text x="170.0" y="255.0" fill="#686a61" font-size="18" text-anchor="middle">the remote data</text>
<rect x="380" y="195" width="260" height="80" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="510.0" y="231.0" fill="#191a17" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh()</text>
<text x="510.0" y="257.0" fill="#686a61" font-size="17" text-anchor="middle">pulls</text>
<rect x="740" y="165" width="400" height="140" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="940" y="205" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">the local copy</text>
<text x="940" y="245" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">this.user</text>
<text x="940" y="280" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">this.photos</text>
<line x1="286" y1="235" x2="372" y2="235" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="646" y1="235" x2="732" y2="235" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="450" fill="#686a61" font-size="21">The mental model is the browser's refresh button.</text>
</svg>
