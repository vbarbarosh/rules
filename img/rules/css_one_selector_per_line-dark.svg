<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="366" viewBox="0 0 1200 366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="366" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">One selector per line</text>
<text x="48" y="108" fill="#92958c" font-size="22">the comma closes the line; the brace follows the last one</text>
<rect x="60" y="160" width="470" height="110" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.docs th, .docs td {</text>
<text x="78" y="256" fill="#ff937c" font-size="17">✗ two on a line</text>
<rect x="670" y="160" width="470" height="110" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.docs th,</text>
<text x="688.0" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.docs td {</text>
<text x="688" y="256" fill="#72d39c" font-size="17">✓ one a line</text>
<line x1="536" y1="215.0" x2="664" y2="215.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="326" fill="#92958c" font-size="21">Each selector on its own line reads and diffs one at a time.</text>
</svg>
