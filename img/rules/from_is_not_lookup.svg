<text x="85" y="270" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">id = 12</text>
<line x1="146" y1="263" x2="192" y2="263" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="500" y="225" width="280" height="76" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="640.0" y="258" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">user_from_id(id)</text>
<text x="640.0" y="285" fill="#686a61" font-size="17" text-anchor="middle">✗ dressed as built</text>
<rect x="860" y="225" width="280" height="76" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1000.0" y="258" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">user_by_id[id]</text>
<text x="1000.0" y="285" fill="#686a61" font-size="17" text-anchor="middle">✓ looked up</text>
<line x1="786" y1="263" x2="852" y2="263" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="500" fill="#686a61" font-size="21">A lookup disguised as construction hides what it costs and where the data lives.</text>
