<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="497" viewBox="0 0 1200 497" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="497" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Use an indexed loop when the index is needed</text>
<text x="48" y="108" fill="#686a61" font-size="22">the position matters: a neighbour, a number, a step</text>
<rect x="60" y="170" width="110" height="60" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="115.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Ann</text>
<text x="115" y="260" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">0</text>
<rect x="190" y="170" width="110" height="60" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="245.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Bo</text>
<text x="245" y="260" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">1</text>
<rect x="320" y="170" width="110" height="60" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="375.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Cy</text>
<text x="375" y="260" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">2</text>
<rect x="450" y="170" width="110" height="60" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="505.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Di</text>
<text x="505" y="260" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">3</text>
<rect x="580" y="170" width="110" height="60" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="635.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Eve</text>
<text x="635" y="260" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">4</text>
<text x="750" y="196" fill="#2743b8" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items[i]: Bo</text>
<text x="750" y="232" fill="#1a7443" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items[i + 1]: its neighbour</text>
<rect x="60" y="300" width="1080" height="107.30000000000001" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="78.0" y="333.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (let i = 0, end = items.length; i &lt; end; ++i) {</text>
<text x="121.2" y="360.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">pair_check(items[i], items[i + 1]);</text>
<text x="78.0" y="387.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="48" y="461" fill="#686a61" font-size="21">When the loop needs i itself, it counts; end is read once.</text>
