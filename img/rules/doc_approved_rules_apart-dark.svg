<line x1="546" y1="460.0" x2="614" y2="460.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="540" fill="#92958c" font-size="21">The approval file is kept by hand, never regenerated.</text>
