<line x1="396" y1="215" x2="814" y2="265" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="396" y1="335" x2="814" y2="285" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="480" height="80" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78" y="454" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">an AI suggestion, filed as MP-51</text>
<text x="78" y="482" fill="#ff937c" font-size="17">✗ a suggestion is no approval</text>
