<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="418" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Each clause on its own line</text>
<text x="48" y="108" fill="#92958c" font-size="22">the clause on a line; what it takes on the next, four spaces in</text>
<rect x="60" y="160" width="470" height="162" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">CREATE UNIQUE INDEX user_ids_unique</text>
<text x="78.0" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ON user_identities (primary_user_id)</text>
<text x="78" y="308" fill="#ff937c" font-size="17">✗ clauses run on</text>
<rect x="670" y="160" width="470" height="162" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">CREATE UNIQUE INDEX</text>
<text x="728.8" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_ids_unique</text>
<text x="688.0" y="241.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ON</text>
<text x="728.8" y="267.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_identities (primary_user_id)</text>
<text x="688" y="308" fill="#72d39c" font-size="17">✓ a clause, then its operand</text>
<line x1="536" y1="241.0" x2="664" y2="241.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="378" fill="#92958c" font-size="21">A keyword of several words, CREATE UNIQUE INDEX, stays on one line.</text>
</svg>
