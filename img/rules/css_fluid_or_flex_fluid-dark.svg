<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="516" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Fluid in a split, flex-fluid in a flex</text>
<text x="48" y="108" fill="#92958c" font-size="22">the same CSS; the name says which container it sits in</text>
<text x="60" y="180" fill="#92958c" font-size="19" font-weight="700">hsplit</text>
<rect x="60" y="196" width="500" height="70" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<rect x="72" y="208" width="90" height="46" rx="6" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<rect x="170" y="208" width="280" height="46" rx="6" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="310" y="238" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">fluid</text>
<rect x="458" y="208" width="90" height="46" rx="6" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="640" y="180" fill="#92958c" font-size="19" font-weight="700">flex-row</text>
<rect x="640" y="196" width="500" height="70" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<rect x="652" y="208" width="90" height="46" rx="6" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<rect x="750" y="208" width="378" height="46" rx="6" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="939" y="238" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">flex-fluid</text>
<rect x="60" y="310" width="470" height="110" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="339.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div class="hsplit"&gt;</text>
<text x="98.4" y="365.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div class="flex-fluid"&gt;</text>
<text x="78" y="406" fill="#ff937c" font-size="17">✗ the flex name in a split</text>
<rect x="670" y="310" width="470" height="110" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="339.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div class="hsplit"&gt;</text>
<text x="708.4" y="365.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div class="fluid"&gt;</text>
<text x="688" y="406" fill="#72d39c" font-size="17">✓ fluid in a split</text>
<line x1="536" y1="365.0" x2="664" y2="365.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="476" fill="#92958c" font-size="21">A split's children default to flex: none; fluid is the one that fills.</text>
</svg>
