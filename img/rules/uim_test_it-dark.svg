<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Test it</text>
<text x="48" y="108" fill="#92958c" font-size="22">for each kind of change: note, change, measure; and once without the fix</text>
<rect x="60" y="170" width="220" height="90" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="170.0" y="211.0" fill="#d3d1c9" font-size="20" text-anchor="middle">note the middle</text>
<text x="170.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">element and its y</text>
<rect x="340" y="170" width="220" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="450.0" y="211.0" fill="#d3d1c9" font-size="20" text-anchor="middle">make the change</text>
<text x="450.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">at the top, mid-view</text>
<rect x="620" y="170" width="220" height="90" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="730.0" y="211.0" fill="#d3d1c9" font-size="20" text-anchor="middle">measure</text>
<text x="730.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">how far it moved</text>
<rect x="900" y="170" width="240" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1020.0" y="211.0" fill="#d3d1c9" font-size="20" text-anchor="middle">assert 0 px</text>
<text x="1020.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">with the fix</text>
<line x1="286" y1="215" x2="334" y2="215" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="566" y1="215" x2="614" y2="215" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="846" y1="215" x2="894" y2="215" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="347" fill="#d3d1c9" font-size="19">the check passes without the fix</text>
<text x="80" y="377" fill="#ff937c" font-size="17">✗ it tests nothing</text>
<rect x="580" y="310" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="347" fill="#d3d1c9" font-size="19">without the fix: it sees the jump</text>
<text x="600" y="377" fill="#72d39c" font-size="17">✓ the test can fail</text>
<line x1="506" y1="350.5" x2="574" y2="350.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#92958c" font-size="21">One more run, without the fix, must see the shift: proof the test can tell.</text>
</svg>
