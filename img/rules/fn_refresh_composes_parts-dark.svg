<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Refresh composes per-part refreshes</text>
<text x="48" y="108" fill="#92958c" font-size="22">each refresh_&lt;part&gt;() syncs one part; refresh() runs them all</text>
<rect x="60" y="230" width="220" height="80" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="170.0" y="277.35" fill="#d3d1c9" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh()</text>
<rect x="380" y="160" width="300" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="530.0" y="201.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh_user()</text>
<rect x="780" y="160" width="360" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="960.0" y="201.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">this.user</text>
<line x1="686" y1="195" x2="772" y2="195" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="380" y="300" width="300" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="530.0" y="341.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">refresh_photos()</text>
<rect x="780" y="300" width="360" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="960.0" y="341.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">this.photos</text>
<line x1="686" y1="335" x2="772" y2="335" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="286" y1="255" x2="372.3" y2="201.06" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="286" y1="285" x2="372.22" y2="329.09" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#92958c" font-size="21">A part refreshes alone when only it changed; refresh() awaits them all.</text>
</svg>
