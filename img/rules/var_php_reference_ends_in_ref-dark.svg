<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="530" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A PHP reference ends in _ref</text>
<text x="48" y="108" fill="#92958c" font-size="22">a variable made with &amp; is a second name of another value; _ref says so at every use</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ reads as a value of its own</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ the name says where a write lands</text>
<rect x="60" y="180" width="500" height="250" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent = &amp;$plan[2];</text>
<text x="80" y="248" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent['steps'][] = $step;</text>
<text x="80" y="309" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$plan</text>
<rect x="200" y="282" width="60" height="40" fill="#16181b" stroke="#4a4f57" stroke-width="2"/>
