<text x="290" y="308" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[1]</text>
<text x="350" y="308" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[2]</text>
<rect x="275" y="362" width="150" height="40" rx="6" fill="#16181b" stroke="#ff937c" stroke-width="2"/>
<text x="350" y="388" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">$parent</text>
<line x1="350" y1="356" x2="350" y2="330" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640" y="180" width="500" height="250" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent_ref = &amp;$plan[2];</text>
<text x="660" y="248" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent_ref['steps'][] = $step;</text>
<text x="660" y="309" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$plan</text>
<rect x="780" y="282" width="60" height="40" fill="#16181b" stroke="#4a4f57" stroke-width="2"/>
<rect x="840" y="282" width="60" height="40" fill="#16181b" stroke="#4a4f57" stroke-width="2"/>
<rect x="900" y="282" width="60" height="40" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="810" y="308" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[0]</text>
<text x="870" y="308" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[1]</text>
<text x="930" y="308" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[2]</text>
