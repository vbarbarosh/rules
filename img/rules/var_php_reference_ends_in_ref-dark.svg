<text x="930" y="388" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">$parent_ref</text>
<line x1="930" y1="356" x2="930" y2="330" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="566" y1="305" x2="632" y2="305" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="490" fill="#92958c" font-size="21">foreach ($items as &amp;$item_ref) is one too; a parameter taken by &amp; is not.</text>
