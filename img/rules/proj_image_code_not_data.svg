<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Docker images carry code, not data</text>
<text x="48" y="108" fill="#686a61" font-size="22">one mount of data/ keeps it; moving the project is moving data/</text>
<rect x="60" y="170" width="300" height="90" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="210.0" y="211.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">image</text>
<text x="210.0" y="237.0" fill="#686a61" font-size="17" text-anchor="middle">the code only</text>
<rect x="60" y="290" width="300" height="90" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="210.0" y="331.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">app-data</text>
<text x="210.0" y="357.0" fill="#686a61" font-size="17" text-anchor="middle">a volume: data/</text>
<rect x="460" y="230" width="300" height="90" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="610.0" y="271.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">container</text>
<text x="610.0" y="297.0" fill="#686a61" font-size="17" text-anchor="middle">/app/data mounted</text>
<line x1="366" y1="215" x2="454" y2="260" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="366" y1="335" x2="454" y2="290" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="820" y="200" width="320" height="111.2" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="840.0" y="234.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">docker run</text>
<text x="861.6" y="264.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">-v app-data:/app/data</text>
<text x="861.6" y="294.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">app</text>
<text x="48" y="470" fill="#686a61" font-size="21">A new image replaces the code; the volume keeps the data.</text>
</svg>
