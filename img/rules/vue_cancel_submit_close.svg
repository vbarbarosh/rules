<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Cancel and submit close the form</text>
<text x="48" y="108" fill="#686a61" font-size="22">each of the form's buttons ends it, one way or the other</text>
<rect x="60" y="150" width="480" height="250" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="84" y="192" fill="#191a17" font-size="20" font-weight="700">Rename file</text>
<rect x="84" y="214" width="200" height="52" rx="6" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="100" y="247" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">notes.md</text>
<rect x="330" y="214" width="180" height="56" rx="8" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="420" y="249" fill="#191a17" font-size="19" text-anchor="middle">Cancel</text>
<rect x="330" y="300" width="180" height="56" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="420" y="335" fill="#191a17" font-size="19" text-anchor="middle">Submit</text>
<rect x="660" y="190" width="480" height="84" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="900.0" y="228.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">modal.return(false)</text>
<text x="900.0" y="254.0" fill="#686a61" font-size="17" text-anchor="middle">closes, nothing saved</text>
<rect x="660" y="300" width="480" height="84" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="900.0" y="338.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">type="submit"</text>
<text x="900.0" y="364.0" fill="#686a61" font-size="17" text-anchor="middle">saves, then closes</text>
<line x1="516" y1="242" x2="652.01" y2="232.14" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="516" y1="328" x2="652.01" y2="341.8" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#686a61" font-size="21">No button leaves the form open with nothing done.</text>
</svg>
