<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">plural() takes the whole sentence</text>
<text x="48" y="108" fill="#92958c" font-size="22">each form a whole phrase, a few words or a sentence, # where the number goes</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ plural( inside ${…}: a part of a longer string</text>
<rect x="60" y="180" width="480" height="56" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="195" width="460" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">`${plural(n, '# step', '# steps')} back`</text>
<line x1="546" y1="208" x2="592" y2="208" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="288" fill="#ff937c" font-size="18" font-weight="700">✗ the caller puts the number in: no #</text>
<rect x="60" y="300" width="480" height="56" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="315" width="460" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80" y="336" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">plural(n, `${n} step`, `${n} steps`)</text>
<line x1="546" y1="328" x2="592" y2="328" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="600" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ one call, a whole phrase in each form: short, or a sentence</text>
<rect x="600" y="180" width="560" height="224" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="610" y="195" width="540" height="36" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="620" y="219" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">plural(n, '# file selected', '# files selected')</text>
<rect x="610" y="243" width="540" height="146" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="620" y="269" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">plural(n,</text>
<text x="620" y="301" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    `Holds # step back; ${steps} is past it`,</text>
<text x="620" y="333" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    `Holds # steps back; ${steps} is past them`,</text>
<text x="620" y="365" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">    `Holds no step back; ${steps} is past it`)</text>
<text x="48" y="450" fill="#92958c" font-size="21">The call's result is returned or assigned as it is; the same in PHP.</text>
</svg>
