<rect x="820" y="318" width="300" height="76" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="970.0" y="351" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">user_by_id[id]</text>
<text x="970.0" y="378" fill="#92958c" font-size="17" text-anchor="middle">✓ read with brackets</text>
<line x1="726" y1="356" x2="814" y2="356" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="480" fill="#92958c" font-size="21">Brackets, or .get() on a Map: a "by" name is looked into, never called.</text>
