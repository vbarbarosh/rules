<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A bare "by" name is data, never called</text>
<text x="48" y="108" fill="#92958c" font-size="22">user_by_id holds users by their id: it is read, not run</text>
<text x="60" y="176" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-weight="700">user_by_id</text>
<rect x="60" y="190" width="90" height="42" rx="0" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="105.0" y="218.0" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">7</text>
<rect x="150" y="190" width="150" height="42" rx="0" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="225.0" y="218.0" fill="#d3d1c9" font-size="18" text-anchor="middle">User Ann</text>
<rect x="60" y="232" width="90" height="42" rx="0" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="105.0" y="260.0" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">12</text>
<rect x="150" y="232" width="150" height="42" rx="0" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="225.0" y="260.0" fill="#d3d1c9" font-size="18" text-anchor="middle">User Bo</text>
<rect x="60" y="274" width="90" height="42" rx="0" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="105.0" y="302.0" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">31</text>
<rect x="150" y="274" width="150" height="42" rx="0" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="225.0" y="302.0" fill="#d3d1c9" font-size="18" text-anchor="middle">User Cy</text>
<text x="420" y="220" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_by_id[id]</text>
<text x="612.0" y="220" fill="#72d39c" font-size="18">✓ right</text>
<text x="420" y="280" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_by_id.get(id)</text>
<text x="660.0" y="280" fill="#72d39c" font-size="18">✓ right, a Map</text>
<text x="420" y="340" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_by_id(id)</text>
<text x="612.0" y="340" fill="#ff937c" font-size="18">✗ wrong: it is not a function</text>
<text x="48" y="480" fill="#92958c" font-size="21">Brackets, or .get() on a Map: a "by" name is looked into, never called.</text>
</svg>
