<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Author sources govern the explanation</text>
<text x="48" y="108" fill="#92958c" font-size="22">the author's half and the approved rules decide what the AI writes</text>
<rect x="60" y="170" width="330" height="90" rx="12" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="225.0" y="210.0" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">the author's half</text>
<text x="225.0" y="235.0" fill="#92958c" font-size="18" text-anchor="middle">the top of the document</text>
<rect x="60" y="290" width="330" height="90" rx="12" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="225.0" y="330.0" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">approved rules</text>
<text x="225.0" y="355.0" fill="#92958c" font-size="18" text-anchor="middle">MANUALLY_APPROVED_RULES.md</text>
<rect x="480" y="230" width="260" height="90" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="610.0" y="270.0" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">the AI reads both</text>
<text x="610.0" y="295.0" fill="#92958c" font-size="18" text-anchor="middle">then writes</text>
<rect x="830" y="230" width="310" height="90" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="985.0" y="270.0" fill="#d3d1c9" font-size="20" text-anchor="middle" font-weight="700">the explanation</text>
<text x="985.0" y="295.0" fill="#92958c" font-size="18" text-anchor="middle">the bottom half</text>
<line x1="396" y1="215" x2="472.27" y2="259" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="396" y1="335" x2="472.27" y2="291" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="746" y1="275" x2="822" y2="275" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="1080" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="84" y="463" fill="#d3d1c9" font-size="19">they disagree, and no approved entry settles it: ask the author before regenerating</text>
<text x="48" y="550" fill="#92958c" font-size="21">An approved entry may clarify older wording within its scope; otherwise the AI asks.</text>
</svg>
