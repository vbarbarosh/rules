<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Usually a heading starts the bottom half</text>
<text x="48" y="108" fill="#92958c" font-size="22">the first # heading is the boundary; a --- line before it is decoration</text>
<rect x="60" y="170" width="620" height="100" rx="0" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="76" y="198" fill="#92958c" font-size="17" font-weight="700">the author's notes</text>
<text x="76" y="228" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">- cache it: one bolt tightened</text>
<rect x="60" y="270" width="620" height="60" rx="0" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="8 6"/>
<text x="80" y="308" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">--- ✨ AI-Generated Content Below ✨ ---</text>
<rect x="60" y="330" width="620" height="100" rx="0" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="76" y="358" fill="#92958c" font-size="17" font-weight="700">the AI's half</text>
<text x="76" y="388" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"># Consequences first</text>
<rect x="800" y="270" width="340" height="60" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="970.0" y="306.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">decoration</text>
<rect x="800" y="370" width="340" height="60" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="970.0" y="406.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">the boundary</text>
<line x1="794" y1="300" x2="688" y2="300" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="794" y1="400" x2="688" y2="400" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="500" fill="#92958c" font-size="21">There is no strict marker: most of the time the heading is the line between them.</text>
</svg>
