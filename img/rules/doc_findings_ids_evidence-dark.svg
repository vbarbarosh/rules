<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Findings have permanent ids and evidence</text>
<text x="48" y="108" fill="#92958c" font-size="22">an id is never reused or renumbered; each finding shows where and how it was seen</text>
<rect x="60" y="160" width="1080" height="210" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="84" y="198" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-weight="700">### DEMO-01 Classes banned in one file, shown in another (high)</text>
<text x="84" y="238" fill="#9db2ff" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">src/app-card.vue:42</text>
<text x="127" y="274" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div class="mg10 flex-row"&gt;</text>
<text x="84" y="314" fill="#9db2ff" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$ npx eslint src/app-card.vue</text>
<text x="84" y="350" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">42:17  error  vue-layout-classes</text>
<rect x="60" y="400" width="480" height="80" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78" y="434" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DEMO-02 reused for a new one</text>
<text x="78" y="462" fill="#ff937c" font-size="17">✗ the old links now mean another</text>
<rect x="620" y="400" width="520" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="638" y="434" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DEMO-04 for the next finding</text>
<text x="638" y="462" fill="#72d39c" font-size="17">✓ ids only grow</text>
<line x1="546" y1="440.0" x2="612" y2="440" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="550" fill="#92958c" font-size="21">The quoted lines and the command with its output are the evidence.</text>
</svg>
