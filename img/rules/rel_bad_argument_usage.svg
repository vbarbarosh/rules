<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A bad argument prints usage to stderr and exits 1</text>
<text x="48" y="108" fill="#686a61" font-size="22">the caller sees how to call it, and the run counts as failed</text>
<rect x="60" y="170" width="320" height="84" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="220.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/release banana</text>
<text x="220.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">a bad argument</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">usage: release …</text>
<text x="600.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">to stderr</text>
<line x1="386" y1="212.0" x2="434" y2="212.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="820" y="170" width="320" height="84" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="980.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">exit 1</text>
<text x="980.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">failed</text>
<line x1="766" y1="212.0" x2="814" y2="212.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="330" fill="#686a61" font-size="21">Nothing runs; the usage line says what would have.</text>
</svg>
