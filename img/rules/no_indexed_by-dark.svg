<text x="490.0" y="232.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">users_index_by_id()</text>
<rect x="760" y="190" width="380" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="950.0" y="232.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">user_by_id</text>
<line x1="226" y1="225" x2="314" y2="225" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
