<text x="60" y="400" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">users_indexed_by_id</text>
<text x="312.0" y="400" fill="#ff937c" font-size="18">✗ does not exist</text>
<text x="48" y="470" fill="#92958c" font-size="21">The participle adds nothing here: bare by already names that shape.</text>
