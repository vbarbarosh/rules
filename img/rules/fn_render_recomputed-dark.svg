<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">"render" is recomputed, never stored</text>
<text x="48" y="108" fill="#92958c" font-size="22">stored attributes are read; rendered content is made on each call</text>
<rect x="60" y="160" width="320" height="84" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="220.0" y="198.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">$this-&gt;text_color</text>
<text x="220.0" y="224.0" fill="#92958c" font-size="17" text-anchor="middle">a stored attribute</text>
<rect x="460" y="160" width="260" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="590.0" y="198.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">render_css()</text>
<text x="590.0" y="224.0" fill="#92958c" font-size="17" text-anchor="middle">on each call</text>
<rect x="800" y="160" width="340" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="970.0" y="198.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">body { color: … }</text>
<text x="970.0" y="224.0" fill="#92958c" font-size="17" text-anchor="middle">fresh every time</text>
<line x1="386" y1="202" x2="454" y2="202" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="726" y1="202" x2="794" y2="202" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="500" height="90" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="334" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$this-&gt;css = $this-&gt;render_css();</text>
<text x="80" y="374" fill="#ff937c" font-size="17">✗ stored: goes stale</text>
<rect x="640" y="300" width="500" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="334" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$this-&gt;render_css()</text>
<text x="660" y="374" fill="#72d39c" font-size="17">✓ called where needed</text>
<line x1="566" y1="345.0" x2="634" y2="345.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
