<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="484" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A plain end when the outcome speaks</text>
<text x="48" y="108" fill="#686a61" font-size="22">an HTTP status already says what happened</text>
<rect x="60" y="160" width="1080" height="78" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="78.0" y="190.4" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][http_request_begin] GET /users/42</text>
<text x="78.0" y="218.4" fill="#1a7443" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][http_request_end] 404 0.012s</text>
<rect x="60" y="278" width="470" height="110" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="307.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][http_request_end_error]</text>
<text x="98.4" y="333.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">404 0.012s</text>
<text x="78" y="374" fill="#b2341f" font-size="17">✗ a 404 may be right</text>
<rect x="670" y="278" width="470" height="110" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="307.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][http_request_end]</text>
<text x="708.4" y="333.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">404 0.012s</text>
<text x="688" y="374" fill="#1a7443" font-size="17">✓ the status says it</text>
<line x1="536" y1="333.0" x2="664" y2="333.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="444" fill="#686a61" font-size="21">When ok or error would mislead, _end leaves the outcome to the status.</text>
</svg>
