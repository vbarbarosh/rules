<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="554" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">sender is snake_case</text>
<text x="48" y="108" fill="#92958c" font-size="22">lower-case words joined by underscores</text>
<rect x="60" y="170" width="1080" height="64" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="209" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">^[a-z_][a-z0-9_]*$</text>
<rect x="60" y="270" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="299.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">dbQueryBegin</text>
<text x="78" y="340" fill="#ff937c" font-size="17">✗ camelCase</text>
<rect x="670" y="270" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="299.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">db_query_begin</text>
<text x="688" y="340" fill="#72d39c" font-size="17">✓ right</text>
<line x1="536" y1="312.0" x2="662" y2="312" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="374" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="403.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">db-query-begin</text>
<text x="78" y="444" fill="#ff937c" font-size="17">✗ hyphens</text>
<rect x="670" y="374" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="403.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">db_query_begin</text>
<text x="688" y="444" fill="#72d39c" font-size="17">✓ right</text>
<line x1="536" y1="416.0" x2="662" y2="416" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="514" fill="#92958c" font-size="21">One form for every sender, so a grep never misses a spelling.</text>
</svg>
