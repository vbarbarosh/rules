<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">_per_ marks a ratio or a rate</text>
<text x="48" y="108" fill="#92958c" font-size="22">one number divided by another</text>
<rect x="60" y="190" width="280" height="80" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="200.0" y="226.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">1 240</text>
<text x="200.0" y="252.0" fill="#92958c" font-size="17" text-anchor="middle">clicks</text>
<rect x="60" y="300" width="280" height="80" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="200.0" y="336.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">400</text>
<text x="200.0" y="362.0" fill="#92958c" font-size="17" text-anchor="middle">visits</text>
<line x1="346" y1="230" x2="534" y2="270" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="346" y1="340" x2="534" y2="300" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="540" y="230" width="340" height="110" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="710.0" y="281.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">3.1</text>
<text x="710.0" y="307.0" fill="#92958c" font-size="17" text-anchor="middle">clicks_per_visit</text>
<text x="920" y="295" fill="#92958c" font-size="19">a rate, not a list</text>
<text x="48" y="450" fill="#92958c" font-size="21">clicks_per_visit is a number: clicks for each visit.</text>
</svg>
