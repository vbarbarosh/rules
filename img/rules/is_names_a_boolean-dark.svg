<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">"is" names a boolean, a predicate or data</text>
<text x="48" y="108" fill="#92958c" font-size="22">called or read, it is true or false; a check that must be called is check_</text>
<rect x="60" y="170" width="520" height="72" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="80" y="204" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">is_ancestor(a, b)</text>
<text x="80" y="230" fill="#92958c" font-size="17">a predicate, called</text>
<line x1="586" y1="206" x2="694" y2="206" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="700" y="176" width="160" height="60" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="780.0" y="213.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">true</text>
<rect x="60" y="266" width="520" height="72" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="80" y="300" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">is_open</text>
<text x="80" y="326" fill="#92958c" font-size="17">a boolean, read</text>
<line x1="586" y1="302" x2="694" y2="302" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="700" y="272" width="160" height="60" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="780.0" y="309.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">false</text>
<rect x="60" y="362" width="520" height="72" rx="8" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80" y="396" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">check_status()</text>
<text x="80" y="422" fill="#92958c" font-size="17">a check, a verb</text>
<line x1="586" y1="398" x2="694" y2="398" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="700" y="368" width="160" height="60" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="780.0" y="405.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">runs</text>
<text x="48" y="490" fill="#92958c" font-size="21">is_ is no function marker: is_open is data; check_status() reads as a call.</text>
</svg>
