<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Nested bounds double the index: ii, jj, kk</text>
<text x="48" y="108" fill="#92958c" font-size="22">each loop caches its own bound under its index, doubled</text>
<rect x="60" y="160" width="70" height="60" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="95.0" y="197.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">i</text>
<rect x="140" y="160" width="90" height="60" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="185.0" y="197.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">ii</text>
<text x="250" y="198" fill="#92958c" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">= foo.length</text>
<rect x="130" y="250" width="70" height="60" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="165.0" y="287.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">j</text>
<rect x="210" y="250" width="90" height="60" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="255.0" y="287.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">jj</text>
<text x="320" y="288" fill="#92958c" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">= bar.length</text>
<rect x="200" y="340" width="70" height="60" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="235.0" y="377.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">k</text>
<rect x="280" y="340" width="90" height="60" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="325.0" y="377.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">kk</text>
<text x="390" y="378" fill="#92958c" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">= baz.length</text>
<rect x="780" y="180" width="360" height="140" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="960.0" y="245.2" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">the bound doubles its index</text>
<text x="960.0" y="269.0" fill="#92958c" font-size="17" text-anchor="middle">i → ii, j → jj, k → kk</text>
<text x="48" y="490" fill="#92958c" font-size="21">One loop alone caches end (VAR-11); nested, each bound is its index doubled.</text>
</svg>
