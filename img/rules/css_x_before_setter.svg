<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="510" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">The x class comes before its setter</text>
<text x="48" y="108" fill="#686a61" font-size="22">the broad class leads and the narrow one corrects it</text>
<rect x="60" y="160" width="52" height="46" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="86.0" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">xm</text>
<rect x="122" y="160" width="62" height="46" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="153.0" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">ml5</text>
<rect x="400" y="160" width="740" height="46" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="420" y="189" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">margin: 0; margin-left: 5px</text>
<rect x="60" y="240" width="52" height="46" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="86.0" y="269.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">m5</text>
<rect x="122" y="240" width="62" height="46" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="153.0" y="269.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">xml</text>
<rect x="400" y="240" width="740" height="46" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="420" y="269" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">margin: 5px; margin-left: 0</text>
<rect x="60" y="330" width="470" height="84" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="359.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="ml5 xm"</text>
<text x="78" y="400" fill="#b2341f" font-size="17">✗ the reset after the setter</text>
<rect x="670" y="330" width="470" height="84" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="359.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="xm ml5"</text>
<text x="688" y="400" fill="#1a7443" font-size="17">✓ broad, then narrow</text>
<line x1="536" y1="372.0" x2="662" y2="372" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="470" fill="#686a61" font-size="21">Read left to right, each class narrows what the one before it set.</text>
