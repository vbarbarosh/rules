<text x="658.0" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">module.exports = build;</text>
<text x="658" y="252.3" fill="#1a7443" font-size="17">✓ CommonJS</text>
