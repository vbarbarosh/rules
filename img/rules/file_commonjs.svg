<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">This repository is CommonJS</text>
<text x="48" y="108" fill="#686a61" font-size="22">its code and node scripts use require and module.exports</text>
<rect x="60" y="160" width="500" height="108.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="160" width="500" height="108.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import fs from 'fs';</text>
<text x="78.0" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">export default build;</text>
<text x="78" y="252.3" fill="#b2341f" font-size="17">✗ ES modules, here</text>
