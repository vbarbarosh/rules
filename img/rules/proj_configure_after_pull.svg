<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">After git pull, run bin/configure</text>
<text x="48" y="108" fill="#686a61" font-size="22">one command makes a fresh checkout ready for development</text>
<rect x="60" y="170" width="320" height="84" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="220.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">git pull</text>
<text x="220.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">new code</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/configure</text>
<text x="600.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">the one command</text>
<line x1="386" y1="212.0" x2="432" y2="212" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="820" y="170" width="320" height="84" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="980.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">ready</text>
<text x="980.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">deps, config, tools</text>
<line x1="766" y1="212.0" x2="812" y2="212" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="500" height="84" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="310.0" y="338.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">npm i; cp .env…; …</text>
<text x="310.0" y="364.0" fill="#686a61" font-size="17" text-anchor="middle">✗ steps someone must remember</text>
<rect x="640" y="300" width="500" height="84" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="890.0" y="338.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/configure</text>
<text x="890.0" y="364.0" fill="#686a61" font-size="17" text-anchor="middle">✓ the steps written down, run</text>
<line x1="566" y1="342.0" x2="632" y2="342" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#686a61" font-size="21">Whatever a checkout needs after a pull, bin/configure does.</text>
</svg>
