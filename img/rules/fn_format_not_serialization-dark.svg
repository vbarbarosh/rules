<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">"format" is not serialization</text>
<text x="48" y="108" fill="#92958c" font-size="22">a person reads one string, a machine the other</text>
<rect x="60" y="230" width="180" height="80" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="150.0" y="277.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">user</text>
<rect x="320" y="160" width="320" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="480.0" y="201.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">format_user(user)</text>
<rect x="320" y="300" width="320" height="70" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="480.0" y="341.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">json_from_user(user)</text>
<rect x="720" y="160" width="420" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="930.0" y="191.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">"Alex K. (admin)"</text>
<text x="930.0" y="217.0" fill="#92958c" font-size="17" text-anchor="middle">a person reads it</text>
<rect x="720" y="300" width="420" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="930.0" y="331.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">{"name":"Alex",…}</text>
<text x="930.0" y="357.0" fill="#92958c" font-size="17" text-anchor="middle">a machine reads it</text>
<line x1="246" y1="255" x2="314" y2="200" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="246" y1="285" x2="314" y2="330" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="646" y1="195" x2="714" y2="195" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="646" y1="335" x2="714" y2="335" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="450" fill="#92958c" font-size="21">Serialization is a conversion: it is named with from, not format.</text>
</svg>
