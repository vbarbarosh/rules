<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="512" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Spawn a group only when it pays</text>
<text x="48" y="108" fill="#686a61" font-size="22">a group costs at least three lines</text>
<rect x="60" y="160" width="470" height="136" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][group_spawn] parent=aaa</text>
<text x="78.0" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][process_begin]</text>
<text x="78.0" y="241.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][process_end_ok] 0.000s</text>
<text x="78" y="282" fill="#b2341f" font-size="17">✗ three lines of noise</text>
<rect x="670" y="160" width="470" height="136" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_begin]</text>
<text x="688.0" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_end_ok] 0.000s</text>
<text x="688" y="282" fill="#1a7443" font-size="17">✓ on the caller's group</text>
<line x1="536" y1="228.0" x2="662" y2="228" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="336" width="1080" height="80" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="600.0" y="371.2" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">a group earns its lines</text>
<text x="600.0" y="395.0" fill="#686a61" font-size="17" text-anchor="middle">seconds of work, or many logging call sites</text>
<text x="48" y="472" fill="#686a61" font-size="21">For one short call, the caller's group is enough.</text>
</svg>
