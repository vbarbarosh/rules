<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Show the drop target; never lose the page</text>
<text x="48" y="108" fill="#92958c" font-size="22">the target lights up while files are over it; a miss does nothing</text>
<rect x="60" y="160" width="560" height="230" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<rect x="100" y="190" width="480" height="110" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2" stroke-dasharray="8 6"/>
<text x="340" y="252" fill="#d3d1c9" font-size="20" text-anchor="middle">Drop files here</text>
<rect x="330" y="326" width="170" height="44" rx="6" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="415" y="355" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">photo.jpg</text>
<rect x="700" y="190" width="440" height="80" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="920.0" y="236.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">lights up while dragging</text>
<rect x="700" y="300" width="440" height="80" rx="12" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="920.0" y="346.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a miss beside it: ignored</text>
<rect x="60" y="420" width="440" height="80" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="456" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">dropped beside: the tab opens it</text>
<text x="80" y="486" fill="#ff937c" font-size="17">✗ the page and its work are gone</text>
<rect x="580" y="420" width="560" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="456" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">window: preventDefault on drop</text>
<text x="600" y="486" fill="#72d39c" font-size="17">✓ the page stays</text>
<line x1="506" y1="460.0" x2="574" y2="460.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
