<text x="580.0" y="241.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">users_group_by_role()</text>
<text x="580.0" y="267.0" fill="#92958c" font-size="17" text-anchor="middle">a function: a verb</text>
