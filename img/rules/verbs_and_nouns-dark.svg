<text x="600" y="383" fill="#d3d1c9" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">const users_by_role = users_group_by_role(users);</text>
<text x="48" y="480" fill="#92958c" font-size="21">Read left to right: the result, a noun; the operation, a verb; what it takes, a noun.</text>
