<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Functions are verbs; data are nouns</text>
<text x="48" y="108" fill="#92958c" font-size="22">an assignment reads as a sentence: the verb performs, the noun holds</text>
