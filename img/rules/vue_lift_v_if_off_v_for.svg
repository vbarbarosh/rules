<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="404" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Lift v-if off a v-for</text>
<text x="48" y="108" fill="#686a61" font-size="22">the condition goes on a &lt;template&gt; around the loop</text>
<rect x="60" y="170" width="440" height="134" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="206" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div v-for="i in items" v-if="items"&gt;</text>
<text x="80" y="290" fill="#b2341f" font-size="17">✗ two directives on one element</text>
<rect x="580" y="170" width="560" height="134" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="206" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;template v-if="items"&gt;</text>
<text x="643.2" y="233" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div v-for="item in items"&gt;</text>
<text x="600.0" y="260" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;/template&gt;</text>
<text x="600" y="290" fill="#1a7443" font-size="17">✓ the condition lifted to a template</text>
<line x1="506" y1="237.0" x2="572" y2="237" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="364" fill="#686a61" font-size="21">One element, one directive: which runs first is never a question.</text>
</svg>
