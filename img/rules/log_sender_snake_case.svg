<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="554" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">sender is snake_case</text>
<text x="48" y="108" fill="#686a61" font-size="22">lower-case words joined by underscores</text>
<rect x="60" y="170" width="1080" height="64" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="209" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">^[a-z_][a-z0-9_]*$</text>
<rect x="60" y="270" width="470" height="84" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="299.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">dbQueryBegin</text>
<text x="78" y="340" fill="#b2341f" font-size="17">✗ camelCase</text>
<rect x="670" y="270" width="470" height="84" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="299.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">db_query_begin</text>
<text x="688" y="340" fill="#1a7443" font-size="17">✓ right</text>
<line x1="536" y1="312.0" x2="664" y2="312.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="374" width="470" height="84" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="403.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">db-query-begin</text>
<text x="78" y="444" fill="#b2341f" font-size="17">✗ hyphens</text>
<rect x="670" y="374" width="470" height="84" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="403.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">db_query_begin</text>
<text x="688" y="444" fill="#1a7443" font-size="17">✓ right</text>
<line x1="536" y1="416.0" x2="664" y2="416.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="514" fill="#686a61" font-size="21">One form for every sender, so a grep never misses a spelling.</text>
</svg>
