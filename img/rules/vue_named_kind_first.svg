<text x="600" y="321" fill="#1a7443" font-size="17">✓ sorted, each kind together</text>
<line x1="506" y1="252.5" x2="574" y2="252.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="395" fill="#686a61" font-size="21">As icons are svg-icon-*, badges are badge-*.</text>
