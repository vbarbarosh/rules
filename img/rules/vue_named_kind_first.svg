<text x="80.0" y="263" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">in-progress-badge</text>
<text x="80.0" y="291" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">no-reply-badge</text>
