<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="ok" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#72d39c" stroke-linejoin="round"/></marker><marker id="bad" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#ff937c" stroke-linejoin="round"/></marker><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">assert_* states what is expected, or throws</text>
<text x="48" y="108" fill="#92958c" font-size="22">a statement of what the code after it relies on; it returns nothing</text>
<rect x="60" y="150" width="660" height="272" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<rect x="88" y="236" width="616" height="116" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="84" y="190" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function sign_up(form)</text>
<text x="84" y="222" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<text x="108" y="266" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assert_valid_username(form.username);</text>
<text x="108" y="300" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assert_valid_email(form.email);</text>
<text x="108" y="334" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assert_valid_password(form.password);</text>
<text x="108" y="376" fill="#92958c" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// the work</text>
<text x="84" y="408" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<path d="M710 276 L788 226" stroke="#72d39c" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
<path d="M710 312 L788 350" stroke="#ff937c" stroke-width="2.5" fill="none" marker-end="url(#bad)"/>
<rect x="796" y="170" width="344" height="104" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="820" y="212" fill="#72d39c" font-size="22" font-weight="700">✓ all hold</text>
<text x="820" y="250" fill="#d3d1c9" font-size="20">nothing returned; the work runs</text>
<rect x="796" y="300" width="344" height="104" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="820" y="342" fill="#ff937c" font-size="22" font-weight="700">✗ one fails</text>
<text x="820" y="380" fill="#d3d1c9" font-size="20">it throws; the work never runs</text>
<text x="48" y="468" fill="#92958c" font-size="21">No if around the call, no false, no null: it holds, or an exception.</text>
</svg>
