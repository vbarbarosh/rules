<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="548" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">No secrets or payloads in details</text>
<text x="48" y="108" fill="#92958c" font-size="22">a reference to the payload, never the payload</text>
<rect x="60" y="160" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">token=eyJhbGciOiJIUzI1NiJ9…</text>
<text x="78" y="230" fill="#ff937c" font-size="17">✗ a secret in the log</text>
<rect x="670" y="160" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user=cd8e5vqp</text>
<text x="688" y="230" fill="#72d39c" font-size="17">✓ who, not their key</text>
<line x1="536" y1="202.0" x2="662" y2="202" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="264" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="293.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">url=https://s3/f.png?sig=9f2…</text>
<text x="78" y="334" fill="#ff937c" font-size="17">✗ a signed URL</text>
<rect x="670" y="264" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="293.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">file=uploads/7f3a.png</text>
<text x="688" y="334" fill="#72d39c" font-size="17">✓ a reference</text>
<line x1="536" y1="306.0" x2="662" y2="306" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="368" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="397.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">body={"name":"Ann","card":…}</text>
<text x="78" y="438" fill="#ff937c" font-size="17">✗ a payload</text>
<rect x="670" y="368" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="397.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">body_bytes=1840</text>
<text x="688" y="438" fill="#72d39c" font-size="17">✓ its size</text>
<line x1="536" y1="410.0" x2="662" y2="410" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="508" fill="#92958c" font-size="21">Logs are copied and kept: nothing in them may unlock anything.</text>
</svg>
