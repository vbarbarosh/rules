<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="578" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Break lines only to show structure</text>
<text x="48" y="108" fill="#92958c" font-size="22">a break must show a part of the statement</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ a break that shows nothing</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ one line</text>
<rect x="60" y="180" width="500" height="90" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const ok = user &amp;&amp;</text>
<rect x="70" y="229" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="120.8" y="250" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user.active;</text>
<rect x="640" y="180" width="500" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const ok = user &amp;&amp; user.active;</text>
<line x1="566" y1="225.0" x2="632" y2="225" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="326" fill="#ff937c" font-size="18" font-weight="700">✗ a list crammed into a line</text>
<text x="640" y="326" fill="#72d39c" font-size="18" font-weight="700">✓ a break per row shows the list</text>
<rect x="60" y="338" width="500" height="158" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="353" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="374" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const rows = [{value: 'nl'}, {value: 'md'}];</text>
<rect x="640" y="338" width="500" height="158" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="374" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const rows = [</text>
<rect x="650" y="387" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="700.8" y="408" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{value: 'nl'},</text>
<rect x="650" y="421" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="700.8" y="442" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{value: 'md'},</text>
<text x="660.0" y="476" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">];</text>
<line x1="566" y1="417.0" x2="632" y2="417" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="546" fill="#92958c" font-size="21">Where the statement has parts, a break per part; where it has none, no break.</text>
</svg>
