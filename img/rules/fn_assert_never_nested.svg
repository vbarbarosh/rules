<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#fffefb"/>
<defs><marker id="ok" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#1a7443" stroke-linejoin="round"/></marker><marker id="bad" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#b2341f" stroke-linejoin="round"/></marker><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Asserts are never nested</text>
<text x="48" y="108" fill="#686a61" font-size="22">one after the other, in the code that relies on them</text>
<text x="60" y="164" fill="#b2341f" font-size="18" font-weight="700">✗ one assert inside another</text>
<rect x="60" y="178" width="530" height="214" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80" y="218" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function assert_email_sent(user)</text>
<text x="80" y="252" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<rect x="92" y="266" width="486" height="36" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="104" y="291" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assert_confirmation_requested(user);</text>
<text x="104" y="332" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// ...</text>
<text x="80" y="368" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<path d="M596 284 L652 284" stroke="#2743b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="660" y="164" fill="#1a7443" font-size="18" font-weight="700">✓ the first, then the second</text>
<rect x="660" y="178" width="480" height="214" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<circle cx="682" cy="250" r="16" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="682" y="257" fill="#2743b8" font-size="18" font-weight="700" text-anchor="middle">1</text>
<text x="708" y="257" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assert_confirmation_requested(user);</text>
<circle cx="682" cy="314" r="16" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="682" y="321" fill="#2743b8" font-size="18" font-weight="700" text-anchor="middle">2</text>
<text x="708" y="321" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">assert_email_sent(user);</text>
<text x="48" y="446" fill="#686a61" font-size="21">The caller sees every expectation, in its order; each assert checks its own.</text>
</svg>
