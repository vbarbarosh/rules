<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="412" viewBox="0 0 1200 412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="412" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">No implicit magic or hidden side effects</text>
<text x="48" y="108" fill="#92958c" font-size="22">an import that does something stands at the top, in run order</text>
<rect x="60" y="160" width="500" height="162.3" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="640" y="160" width="500" height="162.3" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import Vue from 'vue';</text>
<text x="78.0" y="220.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import './patch-array';</text>
<text x="78.0" y="247.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import axios from 'axios';</text>
<text x="78" y="306.3" fill="#ff937c" font-size="17">✗ an effect hidden mid-list</text>
<text x="658.0" y="193.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import './sass/main.sass';</text>
<text x="658.0" y="220.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import './main-pre';</text>
<text x="658.0" y="274.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import Vue from 'vue';</text>
<text x="658" y="306.3" fill="#72d39c" font-size="17">✓ side effects first, in run order</text>
<line x1="566" y1="241.15" x2="634" y2="241.15" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="376" fill="#92958c" font-size="21">Nothing changes behind the reader: what runs on import is seen at once.</text>
</svg>
