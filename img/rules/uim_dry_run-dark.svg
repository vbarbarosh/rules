<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Ask the action first: a dry run</text>
<text x="48" y="108" fill="#92958c" font-size="22">every action can answer "would it work now?" without doing anything</text>
<rect x="60" y="190" width="360" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="240.0" y="231.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">can_end_chat(chat)</text>
<text x="240.0" y="257.0" fill="#92958c" font-size="17" text-anchor="middle">asked before drawing</text>
<rect x="560" y="160" width="360" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="740.0" y="201.65" fill="#d3d1c9" font-size="19" text-anchor="middle">true: End chat shown</text>
<rect x="560" y="250" width="360" height="70" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="740.0" y="291.65" fill="#d3d1c9" font-size="19" text-anchor="middle">false: no End chat</text>
<line x1="426" y1="220" x2="554" y2="195" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="426" y1="250" x2="554" y2="285" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="360" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="397" fill="#d3d1c9" font-size="19">End chat  →  "Sorry, expired"</text>
<text x="80" y="427" fill="#ff937c" font-size="17">✗ the answer comes after the click</text>
<rect x="580" y="360" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="397" fill="#d3d1c9" font-size="19">no End chat button</text>
<text x="600" y="427" fill="#72d39c" font-size="17">✓ asked again when it can change</text>
<line x1="506" y1="400.5" x2="574" y2="400.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
