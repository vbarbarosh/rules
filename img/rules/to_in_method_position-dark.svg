<rect x="380" y="190" width="280" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="520.0" y="231.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">.to_json()</text>
<text x="520.0" y="257.0" fill="#92958c" font-size="17" text-anchor="middle">its method</text>
<rect x="760" y="190" width="380" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="950.0" y="231.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">'{"root": …}'</text>
<text x="950.0" y="257.0" fill="#92958c" font-size="17" text-anchor="middle">json</text>
<line x1="286" y1="235" x2="374" y2="235" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="666" y1="235" x2="754" y2="235" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="60" y="360" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tree.to_json()</text>
<text x="252.0" y="360" fill="#72d39c" font-size="18">✓ a method</text>
<text x="60" y="410" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">json_from_tree(tree)</text>
<text x="324.0" y="410" fill="#72d39c" font-size="18">✓ standalone: from</text>
<text x="640" y="360" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tree_to_json(tree)</text>
<text x="880.0" y="360" fill="#ff937c" font-size="18">✗ to outside a method</text>
<text x="48" y="480" fill="#92958c" font-size="21">Standalone, a conversion is named with from, the result first.</text>
