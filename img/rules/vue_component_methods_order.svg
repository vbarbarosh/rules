<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="510" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Component methods keep one order</text>
<text x="48" y="108" fill="#686a61" font-size="22">names from other modules on top, then refresh, then its own</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ a written format_title up with the listed names</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ the listed names, then refresh, then its own</text>
<rect x="60" y="180" width="500" height="252" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">methods: {</text>
<text x="124" y="254" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_bytes,</text>
<text x="124" y="292" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_size,</text>
<rect x="70" y="309" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="124" y="330" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_title: function () {…},</text>
<text x="124" y="368" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">refresh: async function () {…},</text>
<text x="80" y="406" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">},</text>
<rect x="640" y="180" width="500" height="252" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="660" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">methods: {</text>
<text x="704" y="254" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_bytes,</text>
<text x="704" y="292" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_size,</text>
<text x="704" y="330" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">refresh: async function () {…},</text>
<rect x="650" y="347" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="704" y="368" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_title: function () {…},</text>
<text x="660" y="406" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">},</text>
<text x="1120" y="279" fill="#686a61" font-size="17" text-anchor="end">written elsewhere</text>
<text x="1120" y="368" fill="#686a61" font-size="17" text-anchor="end">its own</text>
<line x1="566" y1="306" x2="632" y2="306" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="482" fill="#686a61" font-size="21">The names on top are no family's run: a format_* written here stands below refresh.</text>
