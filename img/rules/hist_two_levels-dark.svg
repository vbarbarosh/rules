<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#16181b"/>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Two levels, always</text>
<text x="48" y="108" fill="#92958c" font-size="22">under a command only records; never a record alone, never a command in a command</text>
<rect x="48" y="150" width="352" height="300" rx="12" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
<text x="72" y="188" fill="#ff937c" font-size="20" font-weight="700">✗ A record alone</text>
<rect x="96" y="214" width="200" height="44" rx="8" fill="none" stroke="#4a4f57" stroke-width="2" stroke-dasharray="7 6"/>
<text x="196.0" y="243.0" fill="#92958c" font-size="20" text-anchor="middle">?</text>
<path d="M124 258 V322 M124 322 H150" fill="none" stroke="#92958c" stroke-width="2" stroke-linejoin="round"/>
<rect x="152" y="300" width="210" height="44" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="170" y="328.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">folder_created</text>
<text x="72" y="410" fill="#ff937c" font-size="17">✗ no command above it</text>
<rect x="424" y="150" width="352" height="300" rx="12" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
<text x="448" y="188" fill="#ff937c" font-size="20" font-weight="700">✗ A command in a command</text>
<rect x="448" y="214" width="304" height="134" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="466" y="246" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_create_project</text>
<rect x="468" y="268" width="264" height="60" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="486" y="304.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_create_folder</text>
<text x="448" y="410" fill="#ff937c" font-size="17">✗ a third level</text>
<rect x="800" y="150" width="352" height="300" rx="12" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
<text x="824" y="188" fill="#72d39c" font-size="20" font-weight="700">✓ A command, records under it</text>
<rect x="824" y="214" width="304" height="44" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="842" y="242.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_create_project</text>
<path d="M852 258 V358 M852 302 H886 M852 358 H886" fill="none" stroke="#92958c" stroke-width="2" stroke-linejoin="round"/>
<rect x="888" y="280" width="240" height="44" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="906" y="308.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">project_created</text>
<rect x="888" y="336" width="240" height="44" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="906" y="364.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">folder_created</text>
<text x="824" y="410" fill="#72d39c" font-size="17">✓ two levels</text>
<text x="48" y="508" fill="#92958c" font-size="21">The command is the parent; under it only created, updated and deleted.</text>
</svg>
