<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="440" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Scope says what ran and what did not</text>
<text x="48" y="108" fill="#92958c" font-size="22">a check that was not run is said so, never implied</text>
<rect x="60" y="170" width="520" height="146" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="78" y="204" fill="#72d39c" font-size="18" font-weight="700">✓ ran</text>
<text x="78.0" y="234" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">npm run lint</text>
<text x="78.0" y="264" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">npm test</text>
<text x="78.0" y="294" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tests/browser/*.test.js</text>
<rect x="620" y="170" width="520" height="116" rx="10" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="638" y="204" fill="#ffb257" font-size="18" font-weight="700">not run, and why</text>
<text x="638.0" y="234" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">drafts/scroll-anchoring.test.js</text>
<text x="638.0" y="264" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">needs a headless shell</text>
<text x="48" y="390" fill="#92958c" font-size="21">Silence about a check reads as "passed"; the scope leaves no silence.</text>
</svg>
