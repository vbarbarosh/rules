<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="385" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A return-only callback is an arrow</text>
<text x="48" y="108" fill="#92958c" font-size="22">a body of one return, on one line, is that arrow</text>
<rect x="60" y="160" width="500" height="135.3" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="640" y="160" width="500" height="135.3" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items.filter(function (item) {</text>
<text x="121.2" y="220.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return item_text(item) === text;</text>
<text x="78.0" y="247.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">});</text>
<text x="78" y="279.3" fill="#ff937c" font-size="17">✗ three lines for one expression</text>
<text x="658.0" y="193.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items.filter(v =&gt;</text>
<text x="701.2" y="220.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">item_text(v) === text);</text>
<text x="658" y="279.3" fill="#72d39c" font-size="17">✓ the arrow, one line in the code</text>
<line x1="566" y1="227.65" x2="632" y2="227.65" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="349" fill="#92958c" font-size="21">function stays for a callback that does more, or needs this or arguments.</text>
