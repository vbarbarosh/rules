<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="442" viewBox="0 0 1200 442" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="442" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Parenthesize compound operands in logic</text>
<text x="48" y="108" fill="#92958c" font-size="22">an operand with an operator of its own goes in parentheses</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ a comparison bare beside ||</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ the comparison in parentheses</text>
<rect x="60" y="180" width="500" height="56" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return is_dev || i === end - 1;</text>
<rect x="640" y="180" width="500" height="56" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return is_dev || (i === end - 1);</text>
<line x1="566" y1="208.0" x2="634" y2="208.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="292" fill="#ff937c" font-size="18" font-weight="700">✗ a bare condition before ?</text>
<text x="640" y="292" fill="#72d39c" font-size="18" font-weight="700">✓ the condition in parentheses</text>
<rect x="60" y="304" width="500" height="56" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="319" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="340" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">state === 'done' ? 'ok' : 'wait'</text>
<rect x="640" y="304" width="500" height="56" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="650" y="319" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="340" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">(state === 'done') ? 'ok' : 'wait'</text>
<line x1="566" y1="332.0" x2="634" y2="332.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="410" fill="#92958c" font-size="21">Names, calls and negations stay bare; anything with its own operator is wrapped.</text>
</svg>
