<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="470" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">One ALTER TABLE action per clause</text>
<text x="48" y="108" fill="#92958c" font-size="22">each action a clause, its operand indented under it</text>
<rect x="60" y="160" width="470" height="214" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ALTER TABLE user_identities</text>
<text x="78.0" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DROP INDEX ids_unique, DROP COLUMN</text>
<text x="78.0" y="241.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">primary_user_id</text>
<text x="78" y="360" fill="#ff937c" font-size="17">✗ actions run on</text>
<rect x="670" y="160" width="470" height="214" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ALTER TABLE</text>
<text x="728.8" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_identities</text>
<text x="688.0" y="241.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DROP INDEX</text>
<text x="728.8" y="267.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ids_unique,</text>
<text x="688.0" y="293.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DROP COLUMN</text>
<text x="728.8" y="319.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">primary_user_id</text>
<text x="688" y="360" fill="#72d39c" font-size="17">✓ one action a clause</text>
<line x1="536" y1="267.0" x2="664" y2="267.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="430" fill="#92958c" font-size="21">The comma between two actions ends the first operand's line.</text>
</svg>
