<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Spaces around operators, except multiplicative ones</text>
<text x="48" y="108" fill="#686a61" font-size="22">*, / and ** stay tight; every other operator has a space on each side</text>
<rect x="60" y="170" width="480" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78" y="204" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const x = a * b+c / d-e ** 2;</text>
<text x="78" y="232" fill="#b2341f" font-size="17">✗ spaced * / **, tight + -</text>
<rect x="620" y="170" width="520" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="638" y="204" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const x = a*b + c/d - e**2;</text>
<text x="638" y="232" fill="#1a7443" font-size="17">✓ tight * / **, spaced + -</text>
<line x1="546" y1="210.0" x2="614" y2="210.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="280" width="480" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78" y="314" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const x = a%2;</text>
<text x="78" y="342" fill="#b2341f" font-size="17">✗ % is spaced like the others</text>
<rect x="620" y="280" width="520" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="638" y="314" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const x = a % 2;</text>
<text x="638" y="342" fill="#1a7443" font-size="17">✓ a space on each side</text>
<line x1="546" y1="320.0" x2="614" y2="320.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="450" fill="#686a61" font-size="21">Tight multiplication binds visually, the way it binds in the expression.</text>
</svg>
