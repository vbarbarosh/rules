<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Cancel and submit close the form</text>
<text x="48" y="108" fill="#92958c" font-size="22">each of the form's buttons ends it, one way or the other</text>
<rect x="60" y="150" width="480" height="250" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="84" y="192" fill="#d3d1c9" font-size="20" font-weight="700">Rename file</text>
<rect x="84" y="214" width="200" height="52" rx="6" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="100" y="247" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">notes.md</text>
<rect x="330" y="214" width="180" height="56" rx="8" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="420" y="249" fill="#d3d1c9" font-size="19" text-anchor="middle">Cancel</text>
<rect x="330" y="300" width="180" height="56" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="420" y="335" fill="#d3d1c9" font-size="19" text-anchor="middle">Submit</text>
<rect x="660" y="190" width="480" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="900.0" y="228.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">modal.return(false)</text>
<text x="900.0" y="254.0" fill="#92958c" font-size="17" text-anchor="middle">closes, nothing saved</text>
<rect x="660" y="300" width="480" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="900.0" y="338.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">type="submit"</text>
<text x="900.0" y="364.0" fill="#92958c" font-size="17" text-anchor="middle">saves, then closes</text>
<line x1="516" y1="242" x2="654" y2="232" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="516" y1="328" x2="654" y2="342" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#92958c" font-size="21">No button leaves the form open with nothing done.</text>
</svg>
