<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Scripts follow bin/templ</text>
<text x="48" y="108" fill="#92958c" font-size="22">strict mode, a temporary directory, and a message that is failed until the last line</text>
<rect x="60" y="150" width="700" height="52" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="80" y="183" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">set -o nounset -o errexit -o pipefail</text>
<text x="800" y="183" fill="#92958c" font-size="18">strict mode</text>
<rect x="60" y="240" width="700" height="52" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80" y="273" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">EXIT_MESSAGE="…failed…"</text>
<text x="800" y="273" fill="#92958c" font-size="18">failed until proven otherwise</text>
<line x1="410" y1="208" x2="410" y2="234" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="330" width="700" height="52" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="80" y="363" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">trap 'rm -rf $tempdir; echo …' EXIT</text>
<text x="800" y="363" fill="#92958c" font-size="18">the temporary directory goes</text>
<line x1="410" y1="298" x2="410" y2="324" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="700" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="80" y="453" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">…the work…</text>
<line x1="410" y1="388" x2="410" y2="414" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="510" width="700" height="52" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="80" y="543" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">EXIT_MESSAGE="…succeeded…"</text>
<text x="800" y="543" fill="#92958c" font-size="18">the last line</text>
<line x1="410" y1="478" x2="410" y2="504" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="610" fill="#92958c" font-size="21">Stopped anywhere, the script says it failed; only the last line says it succeeded.</text>
</svg>
