<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="386" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Comment intent, not mechanics</text>
<text x="48" y="108" fill="#686a61" font-size="22">say why, not what the line already says</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ says what the code says</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ says why it is so</text>
<rect x="60" y="180" width="500" height="124" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// call fetch with the url</text>
<text x="80.0" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await fetch(url);</text>
<rect x="640" y="180" width="500" height="124" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// The CDN drops the first request</text>
<rect x="650" y="229" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// after a deploy: retry once.</text>
<text x="660.0" y="284" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await fetch_retry(url);</text>
<line x1="566" y1="242.0" x2="634" y2="242.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="354" fill="#686a61" font-size="21">The code says what it does; a comment says what the code cannot.</text>
</svg>
