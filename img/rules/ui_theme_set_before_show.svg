<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">The theme is set before the page shows</text>
<text x="48" y="108" fill="#686a61" font-size="22">the saved choice is on &lt;html&gt; before the first paint</text>
<rect x="60" y="170" width="220" height="90" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="170.0" y="222.0" fill="#191a17" font-size="20" text-anchor="middle">the page loads</text>
<rect x="340" y="170" width="220" height="90" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="450.0" y="211.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">localStorage</text>
<text x="450.0" y="237.0" fill="#686a61" font-size="17" text-anchor="middle">read, in try/catch</text>
<rect x="620" y="170" width="220" height="90" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="730.0" y="211.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">data-theme</text>
<text x="730.0" y="237.0" fill="#686a61" font-size="17" text-anchor="middle">set on &lt;html&gt;</text>
<rect x="900" y="170" width="240" height="90" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1020.0" y="211.0" fill="#191a17" font-size="20" text-anchor="middle">first paint</text>
<text x="1020.0" y="237.0" fill="#686a61" font-size="17" text-anchor="middle">already in its theme</text>
<line x1="286" y1="215" x2="334" y2="215" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="566" y1="215" x2="614" y2="215" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="846" y1="215" x2="894" y2="215" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="320" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="357" fill="#191a17" font-size="19">paint light, then switch</text>
<text x="80" y="387" fill="#b2341f" font-size="17">✗ a white flash on every load</text>
<rect x="580" y="320" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="357" fill="#191a17" font-size="19">set the theme, then paint</text>
<text x="600" y="387" fill="#1a7443" font-size="17">✓ no flash</text>
<line x1="506" y1="360.5" x2="574" y2="360.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="480" fill="#686a61" font-size="21">With nothing saved, the OS setting decides once; each new choice is saved.</text>
</svg>
