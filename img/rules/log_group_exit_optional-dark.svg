<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">group_exit is optional; nothing follows it</text>
<text x="48" y="108" fill="#92958c" font-size="22">it marks the end, mainly to find leaks</text>
<rect x="60" y="160" width="520" height="134" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="78.0" y="190.4" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][group_spawn]</text>
<text x="78.0" y="218.4" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][job_begin]</text>
<text x="78.0" y="246.4" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][job_end_ok] 2.100s</text>
<text x="78.0" y="274.4" fill="#9db2ff" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][group_exit]</text>
<rect x="640" y="170" width="500" height="120" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="8 6"/>
<text x="890.0" y="213.9" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">optional</text>
<text x="890.0" y="237.6" fill="#92958c" font-size="17" text-anchor="middle">a group without it is fine:</text>
<text x="890.0" y="261.4" fill="#92958c" font-size="17" text-anchor="middle">its absence claims nothing</text>
<rect x="60" y="334" width="470" height="110" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="363.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][group_exit]</text>
<text x="78.0" y="389.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][job_progress] 80%</text>
<text x="78" y="430" fill="#ff937c" font-size="17">✗ an event after exit</text>
<rect x="670" y="334" width="470" height="110" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="363.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][job_progress] 80%</text>
<text x="688.0" y="389.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][group_exit]</text>
<text x="688" y="430" fill="#72d39c" font-size="17">✓ exit last</text>
<line x1="536" y1="389.0" x2="664" y2="389.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="500" fill="#92958c" font-size="21">A parent may emit group_exit for work it abandons.</text>
</svg>
