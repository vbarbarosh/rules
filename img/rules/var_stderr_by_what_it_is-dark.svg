<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Name stderr text by what it is</text>
<text x="48" y="108" fill="#92958c" font-size="22">text a process wrote is not a caught error</text>
<rect x="60" y="160" width="300" height="80" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="210.0" y="196.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">spawn('git', …)</text>
<text x="210.0" y="222.0" fill="#92958c" font-size="17" text-anchor="middle">a child process</text>
<line x1="366" y1="200" x2="472" y2="200" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="480" y="160" width="340" height="80" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="650.0" y="196.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">stderr += chunk</text>
<text x="650.0" y="222.0" fill="#92958c" font-size="17" text-anchor="middle">the text it wrote</text>
<rect x="60" y="290" width="500" height="90" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="324" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">let err = '';</text>
<text x="80" y="364" fill="#ff937c" font-size="17">✗ reads as a caught error</text>
<rect x="640" y="290" width="500" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="324" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">let stderr = '';</text>
<text x="660" y="364" fill="#72d39c" font-size="17">✓ what it is</text>
<line x1="566" y1="335.0" x2="632" y2="335" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="460" fill="#92958c" font-size="21">An error variable holds an Error; collected stderr is text.</text>
</svg>
