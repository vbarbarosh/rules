<line x1="584.0" y1="215.0" x2="616.0" y2="215.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="809.3" y="180" width="143.3" height="70" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
