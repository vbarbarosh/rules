<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A slider thumb moves from 0 to 100%</text>
<text x="48" y="108" fill="#92958c" font-size="22">the thumb is placed with left (or top), from 0, empty, to 100%, full</text>
<text x="60" y="206" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">left: 0</text>
<rect x="300" y="190" width="600" height="22" rx="11" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<rect x="288" y="180" width="24" height="42" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="960" y="206" fill="#92958c" font-size="20">empty</text>
<text x="60" y="296" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">left: 50%</text>
<rect x="300" y="280" width="600" height="22" rx="11" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<rect x="300" y="280" width="300" height="22" rx="11" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="588" y="270" width="24" height="42" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="960" y="296" fill="#92958c" font-size="20">half</text>
<text x="60" y="386" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">left: 100%</text>
<rect x="300" y="370" width="600" height="22" rx="11" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<rect x="300" y="370" width="600" height="22" rx="11" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="888" y="360" width="24" height="42" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="960" y="386" fill="#92958c" font-size="20">full</text>
<text x="48" y="460" fill="#92958c" font-size="21">A slider is a container and a thumb: 0 means empty, 100% means full.</text>
</svg>
