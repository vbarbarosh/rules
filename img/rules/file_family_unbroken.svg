<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="385" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A function family stays unbroken</text>
<text x="48" y="108" fill="#686a61" font-size="22">render_* together; another family goes outside the run</text>
<rect x="60" y="160" width="500" height="135.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="160" width="500" height="135.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">render_css()</text>
<text x="78.0" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">describe()</text>
<text x="78.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">render_html()</text>
<text x="78" y="279.3" fill="#b2341f" font-size="17">✗ splits the run</text>
<text x="658.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">render_css()</text>
<text x="658.0" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">render_html()</text>
<text x="658.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">describe()</text>
<text x="658" y="279.3" fill="#1a7443" font-size="17">✓ after the run</text>
<line x1="566" y1="227.65" x2="632" y2="227.65" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="349" fill="#686a61" font-size="21">A new member joins its run; a stranger never stands between two members.</text>
</svg>
