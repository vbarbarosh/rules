<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="585" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Plain data: Set, Map or {}</text>
<text x="48" y="108" fill="#92958c" font-size="22">lookups in plain structures; a module owns its own state</text>
<rect x="60" y="150" width="340" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="230.0" y="188.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">new Set()</text>
<text x="230.0" y="214.0" fill="#92958c" font-size="17" text-anchor="middle">membership</text>
<rect x="430" y="150" width="340" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="188.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">new Map()</text>
<text x="600.0" y="214.0" fill="#92958c" font-size="17" text-anchor="middle">lookup by any key</text>
<rect x="800" y="150" width="340" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="970.0" y="188.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">{}</text>
<text x="970.0" y="214.0" fill="#92958c" font-size="17" text-anchor="middle">lookup by a string key</text>
<rect x="60" y="280" width="500" height="215.45" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="640" y="280" width="500" height="215.45" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="78.0" y="312.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// other.js</text>
<text x="78.0" y="339.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import modal from './modal';</text>
<text x="78.0" y="366.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">modal.current = null;</text>
<text x="78" y="479.45" fill="#ff937c" font-size="17">✗ writes another module's state</text>
<text x="658.0" y="312.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// modal.js</text>
<text x="658.0" y="339.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">let modal = null;</text>
<text x="658.0" y="366.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function modal_show()</text>
<text x="658.0" y="393.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<text x="698.8" y="420.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">modal = modal_make();</text>
<text x="658.0" y="447.4" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="658" y="479.45" fill="#72d39c" font-size="17">✓ written only by its own functions</text>
<line x1="566" y1="387.725" x2="634" y2="387.725" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="549" fill="#92958c" font-size="21">No prototypes, no shared state: across modules, state is read through functions.</text>
</svg>
