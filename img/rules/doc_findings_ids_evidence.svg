<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Findings have permanent ids and evidence</text>
<text x="48" y="108" fill="#686a61" font-size="22">an id is never reused or renumbered; each finding shows where and how it was seen</text>
<rect x="60" y="160" width="1080" height="210" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="84" y="198" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-weight="700">### DEMO-01 Classes banned in one file, shown in another (high)</text>
<text x="84" y="238" fill="#2743b8" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">src/app-card.vue:42</text>
<text x="127" y="274" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;div class="mg10 flex-row"&gt;</text>
<text x="84" y="314" fill="#2743b8" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$ npx eslint src/app-card.vue</text>
<text x="84" y="350" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">42:17  error  vue-layout-classes</text>
<rect x="60" y="400" width="480" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78" y="434" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DEMO-02 reused for a new one</text>
<text x="78" y="462" fill="#b2341f" font-size="17">✗ the old links now mean another</text>
<rect x="620" y="400" width="520" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="638" y="434" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">DEMO-04 for the next finding</text>
<text x="638" y="462" fill="#1a7443" font-size="17">✓ ids only grow</text>
<line x1="546" y1="440.0" x2="614" y2="440.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="550" fill="#686a61" font-size="21">The quoted lines and the command with its output are the evidence.</text>
</svg>
