<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="318" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Build objects from needed fields only</text>
<text x="48" y="108" fill="#686a61" font-size="22">name each field the object needs</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ the whole item spread in</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ only the fields needed</text>
<rect x="60" y="180" width="500" height="56" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const next = {...item, index};</text>
<rect x="640" y="180" width="500" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const next = {uid: item.uid, index};</text>
<line x1="566" y1="208.0" x2="634" y2="208.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="286" fill="#686a61" font-size="21">A spread carries every field, the ones nobody asked for too.</text>
</svg>
