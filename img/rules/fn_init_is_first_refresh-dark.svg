<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Init is the first refresh</text>
<text x="48" y="108" fill="#92958c" font-size="22">mounting the component is its first refresh, nothing more</text>
<rect x="60" y="180" width="220" height="80" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="170.0" y="216.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">mounted</text>
<text x="170.0" y="242.0" fill="#92958c" font-size="17" text-anchor="middle">the component</text>
<rect x="360" y="180" width="340" height="80" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="530.0" y="216.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">await this.refresh()</text>
<text x="530.0" y="242.0" fill="#92958c" font-size="17" text-anchor="middle">the same as later</text>
<rect x="780" y="180" width="360" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="960.0" y="216.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">this.ready = true</text>
<text x="960.0" y="242.0" fill="#92958c" font-size="17" text-anchor="middle">then it shows</text>
<line x1="286" y1="220" x2="354" y2="220" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="706" y1="220" x2="774" y2="220" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="400" fill="#92958c" font-size="21">No separate init: what loads first is what reloads later.</text>
</svg>
