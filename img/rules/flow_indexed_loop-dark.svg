<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="497" viewBox="0 0 1200 497" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="497" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Use an indexed loop when the index is needed</text>
<text x="48" y="108" fill="#92958c" font-size="22">the position matters: a neighbour, a number, a step</text>
<rect x="60" y="170" width="110" height="60" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="115.0" y="206.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Ann</text>
<text x="115" y="260" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">0</text>
<rect x="190" y="170" width="110" height="60" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="245.0" y="206.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Bo</text>
<text x="245" y="260" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">1</text>
<rect x="320" y="170" width="110" height="60" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="375.0" y="206.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Cy</text>
<text x="375" y="260" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">2</text>
<rect x="450" y="170" width="110" height="60" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="505.0" y="206.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Di</text>
<text x="505" y="260" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">3</text>
<rect x="580" y="170" width="110" height="60" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="635.0" y="206.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Eve</text>
<text x="635" y="260" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">4</text>
<text x="750" y="196" fill="#9db2ff" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items[i]: Bo</text>
<text x="750" y="232" fill="#72d39c" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items[i + 1]: its neighbour</text>
<rect x="60" y="300" width="1080" height="107.30000000000001" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="78.0" y="333.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (let i = 0, end = items.length; i &lt; end; ++i) {</text>
<text x="121.2" y="360.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">pair_check(items[i], items[i + 1]);</text>
<text x="78.0" y="387.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="48" y="461" fill="#92958c" font-size="21">When the loop needs i itself, it counts; end is read once.</text>
