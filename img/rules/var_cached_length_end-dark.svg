<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A cached length is "end"</text>
<text x="48" y="108" fill="#92958c" font-size="22">the loop reads items.length once and stops at end</text>
<rect x="60" y="170" width="80" height="60" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="100" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">0</text>
<rect x="150" y="170" width="80" height="60" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="190" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">1</text>
<rect x="240" y="170" width="80" height="60" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="280" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">2</text>
<rect x="330" y="170" width="80" height="60" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="370" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">3</text>
<rect x="420" y="170" width="80" height="60" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="460" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">4</text>
<rect x="510" y="170" width="80" height="60" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="550" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">5</text>
<rect x="600" y="170" width="220" height="60" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2" stroke-dasharray="8 6"/>
<text x="710" y="208" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">end = 6</text>
<rect x="200" y="290" width="120" height="50" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="260.0" y="322.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">i</text>
<line x1="262" y1="284" x2="280" y2="236" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="380" width="680" height="64" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="420" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (let i = 0, end = items.length; i &lt; end; ++i)</text>
<text x="48" y="490" fill="#92958c" font-size="21">end is the bound one past the last item; i runs up to it.</text>
</svg>
