<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Audit notes keep one section order</text>
<text x="48" y="108" fill="#92958c" font-size="22">every audit note reads in the same ten steps</text>
<rect x="60" y="160" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="80" y="194" fill="#92958c" font-size="19" font-weight="700">1</text>
<text x="120" y="194" fill="#d3d1c9" font-size="19">title</text>
<rect x="60" y="224" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="80" y="258" fill="#92958c" font-size="19" font-weight="700">2</text>
<text x="120" y="258" fill="#d3d1c9" font-size="19">repository line</text>
<rect x="60" y="288" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="80" y="322" fill="#92958c" font-size="19" font-weight="700">3</text>
<text x="120" y="322" fill="#d3d1c9" font-size="19">scope</text>
<rect x="60" y="352" width="520" height="52" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="80" y="386" fill="#92958c" font-size="19" font-weight="700">4</text>
<text x="120" y="386" fill="#d3d1c9" font-size="19">verdict and health table</text>
<rect x="60" y="416" width="520" height="52" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="80" y="450" fill="#92958c" font-size="19" font-weight="700">5</text>
<text x="120" y="450" fill="#d3d1c9" font-size="19">finding register</text>
<rect x="620" y="160" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="640" y="194" fill="#92958c" font-size="19" font-weight="700">6</text>
<text x="680" y="194" fill="#d3d1c9" font-size="19">findings</text>
<rect x="620" y="224" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="640" y="258" fill="#92958c" font-size="19" font-weight="700">7</text>
<text x="680" y="258" fill="#d3d1c9" font-size="19">what is good</text>
<rect x="620" y="288" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="640" y="322" fill="#92958c" font-size="19" font-weight="700">8</text>
<text x="680" y="322" fill="#d3d1c9" font-size="19">recommended order of work</text>
<rect x="620" y="352" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="640" y="386" fill="#92958c" font-size="19" font-weight="700">9</text>
<text x="680" y="386" fill="#d3d1c9" font-size="19">status of prior findings</text>
<rect x="620" y="416" width="520" height="52" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="640" y="450" fill="#92958c" font-size="19" font-weight="700">10</text>
<text x="680" y="450" fill="#d3d1c9" font-size="19">file inventory</text>
<text x="48" y="520" fill="#92958c" font-size="21">One order in every note: a reader finds the verdict and the register at once.</text>
</svg>
