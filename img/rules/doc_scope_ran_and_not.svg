<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="440" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Scope says what ran and what did not</text>
<text x="48" y="108" fill="#686a61" font-size="22">a check that was not run is said so, never implied</text>
<rect x="60" y="170" width="520" height="146" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78" y="204" fill="#1a7443" font-size="18" font-weight="700">✓ ran</text>
<text x="78.0" y="234" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">npm run lint</text>
<text x="78.0" y="264" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">npm test</text>
<text x="78.0" y="294" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tests/browser/*.test.js</text>
<rect x="620" y="170" width="520" height="116" rx="10" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="638" y="204" fill="#b8650a" font-size="18" font-weight="700">not run, and why</text>
<text x="638.0" y="234" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">drafts/scroll-anchoring.test.js</text>
<text x="638.0" y="264" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">needs a headless shell</text>
<text x="48" y="390" fill="#686a61" font-size="21">Silence about a check reads as "passed"; the scope leaves no silence.</text>
</svg>
