<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Empty elements close themselves</text>
<text x="48" y="108" fill="#92958c" font-size="22">an element without a body ends with /&gt;</text>
<rect x="60" y="160" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="197" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;th&gt;&lt;/th&gt;</text>
<text x="80" y="227" fill="#ff937c" font-size="17">✗ an empty HTML element, left open</text>
<rect x="580" y="160" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="197" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;th /&gt;</text>
<text x="600" y="227" fill="#72d39c" font-size="17">✓ closes itself</text>
<line x1="506" y1="200.5" x2="574" y2="200.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="261" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="298" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;svg-icon-close&gt;&lt;/svg-icon-close&gt;</text>
<text x="80" y="328" fill="#ff937c" font-size="17">✗ an empty component, left open</text>
<rect x="580" y="261" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="298" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;svg-icon-close /&gt;</text>
<text x="600" y="328" fill="#72d39c" font-size="17">✓ closes itself</text>
<line x1="506" y1="301.5" x2="574" y2="301.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="362" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="399" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;br&gt;</text>
<text x="80" y="429" fill="#ff937c" font-size="17">✗ a void element, bare</text>
<rect x="580" y="362" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="399" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;br /&gt;</text>
<text x="600" y="429" fill="#72d39c" font-size="17">✓ closes itself too</text>
<line x1="506" y1="402.5" x2="574" y2="402.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="503" fill="#92958c" font-size="21">In .vue files and string templates; an in-DOM template is parsed by the browser first.</text>
</svg>
