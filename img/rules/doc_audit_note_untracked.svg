<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Audit notes have no top half and stay untracked</text>
<text x="48" y="108" fill="#686a61" font-size="22">the AI writes the whole note; it is committed only when asked</text>
<rect x="60" y="170" width="520" height="150" rx="0" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="76" y="198" fill="#686a61" font-size="17" font-weight="700">written by the AI, whole</text>
<text x="76" y="228" fill="#191a17" font-size="18"># Audit 2026-10-11</text>
<text x="76" y="256" fill="#191a17" font-size="18">Scope, verdict, findings…</text>
<text x="76" y="284" fill="#191a17" font-size="18">no top half, no separator</text>
<rect x="660" y="170" width="480" height="120" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="684" y="210" fill="#2743b8" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$ git status --short</text>
<text x="684" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">?? notes/audit-2026-10-11.md</text>
<rect x="60" y="350" width="1080" height="70" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="600.0" y="380.2" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">committed only on request</text>
<text x="600.0" y="404.0" fill="#686a61" font-size="17" text-anchor="middle">until then it stays untracked</text>
<text x="48" y="470" fill="#686a61" font-size="21">The note reports on the repository; it does not change it unless asked.</text>
</svg>
