<text x="101.6" y="224.6" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;source media="(…: dark)"</text>
<text x="134.0" y="254.6" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">srcset="img/cover-dark.png"&gt;</text>
<text x="101.6" y="284.6" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;img src="img/cover.png"&gt;</text>
<text x="80.0" y="314.6" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;/picture&gt;</text>
