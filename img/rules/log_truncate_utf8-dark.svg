<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="440" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Truncate on UTF-8, count what is cut</text>
<text x="48" y="108" fill="#92958c" font-size="22">the cut falls between characters and says how much is gone</text>
<rect x="60" y="160" width="700" height="60" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="80" y="197" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">body="Привет, это длинный ответ</text>
<rect x="770" y="160" width="370" height="60" rx="8" fill="#212428" stroke="#2c3035" stroke-width="2" stroke-dasharray="8 6"/>
<text x="955" y="197" fill="#92958c" font-size="18" text-anchor="middle">4 821 bytes cut</text>
<rect x="60" y="260" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="289.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">…длинный от\xd0</text>
<text x="78" y="330" fill="#ff937c" font-size="17">✗ half a character</text>
<rect x="670" y="260" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="289.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">…длинный от...+4821</text>
<text x="688" y="330" fill="#72d39c" font-size="17">✓ whole, and counted</text>
<line x1="536" y1="302.0" x2="662" y2="302" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="400" fill="#92958c" font-size="21">A truncated value stays valid UTF-8 and ends with ...+ and the bytes omitted.</text>
</svg>
