<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Functions are verbs; data are nouns</text>
<text x="48" y="108" fill="#686a61" font-size="22">an assignment reads as a sentence: the verb performs, the noun holds</text>
<rect x="60" y="200" width="220" height="90" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="170.0" y="241.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">users</text>
<text x="170.0" y="267.0" fill="#686a61" font-size="17" text-anchor="middle">data: a noun</text>
<rect x="400" y="200" width="360" height="90" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="580.0" y="241.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">users_group_by_role()</text>
<text x="580.0" y="267.0" fill="#686a61" font-size="17" text-anchor="middle">a function: a verb</text>
<rect x="880" y="200" width="260" height="90" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1010.0" y="241.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">users_by_role</text>
<text x="1010.0" y="267.0" fill="#686a61" font-size="17" text-anchor="middle">data: a noun</text>
<line x1="286" y1="245" x2="394" y2="245" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="766" y1="245" x2="874" y2="245" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="340" width="1080" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="600" y="383" fill="#191a17" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">const users_by_role = users_group_by_role(users);</text>
<text x="48" y="480" fill="#686a61" font-size="21">Read left to right: the result, a noun; the operation, a verb; what it takes, a noun.</text>
