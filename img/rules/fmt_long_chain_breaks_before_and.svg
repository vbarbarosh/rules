<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="540" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">a long &amp;&amp; chain in a return breaks before each &amp;&amp;</text>
<text x="48" y="108" fill="#686a61" font-size="22">each operand on a line of its own, the &amp;&amp; opening it, one level deeper</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ three operands on one line, too long for it</text>
<rect x="48" y="180" width="1104" height="56" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="68" y="215" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return $this-&gt;is_cancel_requested &amp;&amp; $this-&gt;period_end_at &amp;&amp; $this-&gt;period_end_at-&gt;gt(now());</text>
<line x1="600" y1="242" x2="600" y2="331" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="326" fill="#1a7443" font-size="18" font-weight="700">✓ one operand a line, the first after return</text>
<rect x="48" y="338" width="1104" height="128" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="68" y="374" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return $this-&gt;is_cancel_requested</text>
<rect x="102" y="384" width="40" height="36" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="110" y="408" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&amp;&amp;</text>
<text x="150" y="408" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$this-&gt;period_end_at</text>
<rect x="102" y="422" width="40" height="36" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="110" y="446" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&amp;&amp;</text>
<text x="150" y="446" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$this-&gt;period_end_at-&gt;gt(now());</text>
<text x="640" y="429" fill="#686a61" font-size="18" font-style="italic">each blue &amp;&amp; opens its line, one level deeper</text>
<text x="48" y="512" fill="#686a61" font-size="21">A return only; || and ?? alike; in PHP as in JavaScript.</text>
</svg>
