<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="352" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">An empty function is {} on one line</text>
<text x="48" y="108" fill="#686a61" font-size="22">a no-op is never split over two lines</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ an empty body over two lines</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ {} on one line</text>
<rect x="60" y="180" width="500" height="90" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">opts.done = opts.done || function () {</text>
<rect x="70" y="229" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">};</text>
<rect x="640" y="180" width="500" height="90" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">opts.done = opts.done || function () {};</text>
<rect x="650" y="229" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">promise.catch(() =&gt; {});</text>
<line x1="566" y1="225.0" x2="634" y2="225.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="320" fill="#686a61" font-size="21">Declarations and methods keep their braces apart; a body with a comment is not empty.</text>
