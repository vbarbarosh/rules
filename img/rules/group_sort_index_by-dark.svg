<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Group by, sort by, index by produce them</text>
<text x="48" y="108" fill="#92958c" font-size="22">each operation is a verb with its criterion after it; its result is the shape it names</text>
