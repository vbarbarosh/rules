<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="590" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Simple words bare, the rest JSON-quoted</text>
<text x="48" y="108" fill="#92958c" font-size="22">a bare word cannot span words, break the line or mint a tag</text>
<rect x="60" y="160" width="1080" height="106" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="78.0" y="190.4" fill="#72d39c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">name=select_users</text>
<text x="78.0" y="218.4" fill="#72d39c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">reason="db timeout"</text>
<text x="78.0" y="246.4" fill="#72d39c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">value=""</text>
<text x="460" y="190.4" fill="#92958c" font-size="18">bare: a simple word</text>
<text x="460" y="218.4" fill="#92958c" font-size="18">quoted: it has a space</text>
<text x="460" y="246.4" fill="#92958c" font-size="18">quoted: it is empty</text>
<rect x="60" y="306" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="335.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">reason=db timeout</text>
<text x="78" y="376" fill="#ff937c" font-size="17">✗ two words, one value?</text>
<rect x="670" y="306" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="335.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">reason="db timeout"</text>
<text x="688" y="376" fill="#72d39c" font-size="17">✓ quoted</text>
<line x1="536" y1="348.0" x2="664" y2="348.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="410" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="439.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">role=[admin]</text>
<text x="78" y="480" fill="#ff937c" font-size="17">✗ looks like a field</text>
<rect x="670" y="410" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="439.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">role="[admin]"</text>
<text x="688" y="480" fill="#72d39c" font-size="17">✓ quoted</text>
<line x1="536" y1="452.0" x2="664" y2="452.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="550" fill="#92958c" font-size="21">Bare are exactly the bytes sent; anything else is JSON-quoted.</text>
</svg>
