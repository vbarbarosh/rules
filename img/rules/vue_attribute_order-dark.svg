<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Attributes keep one order</text>
<text x="48" y="108" fill="#92958c" font-size="22">the same order on every element: references and control first, then plain attributes</text>
<rect x="60" y="160" width="200" height="56" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="160.0" y="194.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">1  ref</text>
<rect x="280" y="160" width="200" height="56" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="380.0" y="194.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">2  v-if</text>
<rect x="500" y="160" width="200" height="56" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="600.0" y="194.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">3  v-for</text>
<rect x="720" y="160" width="200" height="56" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="820.0" y="194.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">4  v-on</text>
<rect x="940" y="160" width="200" height="56" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="1040.0" y="194.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">5  v-bind:ref</text>
<rect x="60" y="236" width="200" height="56" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="160.0" y="270.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">6  v-bind</text>
<rect x="280" y="236" width="200" height="56" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="380.0" y="270.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">7  class</text>
<rect x="500" y="236" width="200" height="56" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="600.0" y="270.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">8  type</text>
<rect x="720" y="236" width="200" height="56" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="820.0" y="270.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">9  placeholder</text>
<rect x="940" y="236" width="200" height="56" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="1040.0" y="270.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">10  title</text>
<rect x="60" y="330" width="700" height="201" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="362" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-weight="700">an element in that order</text>
<text x="80" y="392" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;input ref="email"</text>
<text x="104" y="421" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-if="is_open"</text>
<text x="104" y="450" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:input="input_email"</text>
<text x="104" y="479" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="w200"</text>
<text x="104" y="508" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">type="email" /&gt;</text>
<text x="48" y="600" fill="#92958c" font-size="21">Read top to bottom, every element lists its attributes in the same places.</text>
</svg>
