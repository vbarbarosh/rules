<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A favicon in the standard sizes</text>
<text x="48" y="108" fill="#686a61" font-size="22">one drawing, icon.svg, and the files made from it</text>
<rect x="72" y="324" width="16" height="16" rx="3.5" fill="#3d62ff"/><rect x="76.8" y="328.8" width="6.4" height="6.4" rx="1.0" fill="#c8f04b"/>
<rect x="98" y="308" width="32" height="32" rx="7.0" fill="#3d62ff"/><rect x="107.6" y="317.6" width="12.8" height="12.8" rx="1.9" fill="#c8f04b"/>
<rect x="140" y="292" width="48" height="48" rx="10.6" fill="#3d62ff"/><rect x="154.4" y="306.4" width="19.2" height="19.2" rx="2.9" fill="#c8f04b"/>
<rect x="268" y="276" width="64" height="64" rx="14.1" fill="#3d62ff"/><rect x="287.2" y="295.2" width="25.6" height="25.6" rx="3.8" fill="#c8f04b"/>
<rect x="260" y="268" width="80" height="80" rx="18" fill="none" stroke="#686a61" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="430" y="240" width="100" height="100" rx="22.0" fill="#3d62ff"/><rect x="460.0" y="270.0" width="40.0" height="40.0" rx="6.0" fill="#c8f04b"/>
<rect x="626" y="232" width="108" height="108" rx="23.8" fill="#3d62ff"/><rect x="658.4" y="264.4" width="43.2" height="43.2" rx="6.5" fill="#c8f04b"/>
<rect x="825" y="150" width="190" height="190" rx="41.8" fill="#3d62ff"/><rect x="882.0" y="207.0" width="76.0" height="76.0" rx="11.4" fill="#c8f04b"/>
<text x="130" y="380" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">favicon.ico</text>
<text x="130" y="405" fill="#686a61" font-size="16" text-anchor="middle">16 · 32 · 48 px</text>
<text x="130" y="429" fill="#686a61" font-size="16" text-anchor="middle">older tabs</text>
<text x="300" y="380" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">icon.svg</text>
<text x="300" y="405" fill="#686a61" font-size="16" text-anchor="middle">any size</text>
<text x="300" y="429" fill="#686a61" font-size="16" text-anchor="middle">every tab</text>
<text x="480" y="380" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">apple-touch-icon.png</text>
<text x="480" y="405" fill="#686a61" font-size="16" text-anchor="middle">180 px</text>
<text x="480" y="429" fill="#686a61" font-size="16" text-anchor="middle">iPhone home</text>
<text x="680" y="380" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">icon-192.png</text>
<text x="680" y="405" fill="#686a61" font-size="16" text-anchor="middle">192 px</text>
<text x="680" y="429" fill="#686a61" font-size="16" text-anchor="middle">Android home</text>
<text x="920" y="380" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">icon-512.png</text>
<text x="920" y="405" fill="#686a61" font-size="16" text-anchor="middle">512 px</text>
<text x="920" y="429" fill="#686a61" font-size="16" text-anchor="middle">install</text>
<text x="48" y="485" fill="#686a61" font-size="21">Every page links them in its &lt;head&gt;; manifest.webmanifest lists the 192 and the 512.</text>
</svg>
