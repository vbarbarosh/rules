<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A body wraps at 72 characters</text>
<text x="48" y="108" fill="#686a61" font-size="22">every line within 72, broken between words</text>
<rect x="60" y="160" width="1080" height="230" rx="12" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="200" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">docs: the agents page has a picture for each guide</text>
<text x="80" y="280" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Consequences first: the task, its four what-if questions and what each</text>
<text x="80" y="320" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">shapes. One example, all cases: only the shown dropdown fixed against</text>
<text x="80" y="360" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">every case found.</text>
<rect x="886" y="170" width="3" height="210" rx="0" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="900" y="196" fill="#b2341f" font-size="18" font-weight="700">72</text>
<rect x="60" y="410" width="500" height="70" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="310.0" y="441.0" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">one line of 300</text>
<text x="310.0" y="467.0" fill="#686a61" font-size="17" text-anchor="middle">✗ runs off the screen</text>
<rect x="640" y="410" width="500" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="890.0" y="441.0" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">lines of 72 at most</text>
<text x="890.0" y="467.0" fill="#686a61" font-size="17" text-anchor="middle">✓ reads in any terminal</text>
<line x1="566" y1="445.0" x2="634" y2="445.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="530" fill="#686a61" font-size="21">A path or URL longer than 72 keeps a line of its own, whole.</text>
</svg>
