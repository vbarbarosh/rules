<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="485" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A block-body arrow becomes a function</text>
<text x="48" y="108" fill="#686a61" font-size="22">braces after =&gt; mean a function; write function</text>
<rect x="60" y="160" width="500" height="135.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="160" width="500" height="135.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">request.on('end', async () =&gt; {</text>
<text x="121.2" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await done();</text>
<text x="78.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">});</text>
<text x="78" y="279.3" fill="#b2341f" font-size="17">✗ does not exist</text>
<text x="658.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">request.on('end', async function () {</text>
<text x="701.2" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await done();</text>
<text x="658.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">});</text>
<text x="658" y="279.3" fill="#1a7443" font-size="17">✓ a function, with _this if needed</text>
<line x1="566" y1="227.65" x2="634" y2="227.65" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="335.3" width="1080" height="60" rx="10" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="373.3" fill="#686a61" font-size="18">the one exception: the empty () =&gt; {}, a no-op (FMT-32)</text>
<text x="48" y="449" fill="#686a61" font-size="21">The mirror of FLOW-11: a return-only callback is an arrow.</text>
</svg>
