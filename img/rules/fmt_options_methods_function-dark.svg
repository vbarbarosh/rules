<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="522" viewBox="0 0 1200 522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="522" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Options methods are function expressions</text>
<text x="48" y="108" fill="#92958c" font-size="22">even a method that only returns a value</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ arrows as option methods</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ function expressions</text>
<rect x="60" y="180" width="500" height="260" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const options = {</text>
<rect x="70" y="229" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="123.2" y="250" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">refresh: async () =&gt; {</text>
<text x="123.2" y="284" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">},</text>
<rect x="70" y="297" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="123.2" y="318" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">px: v =&gt; v ? `${v}px` : '0',</text>
<text x="80.0" y="352" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">};</text>
<rect x="640" y="180" width="500" height="260" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const options = {</text>
<rect x="650" y="229" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="703.2" y="250" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">refresh: async function () {</text>
<text x="703.2" y="284" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">},</text>
<rect x="650" y="297" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="703.2" y="318" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">px: function (value) {</text>
<text x="746.4" y="352" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return value ? `${value}px` : '0';</text>
<text x="703.2" y="386" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">},</text>
<text x="660.0" y="420" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">};</text>
<line x1="566" y1="310.0" x2="634" y2="310.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="490" fill="#92958c" font-size="21">Tiny arrows are for callbacks and value factories, not for the methods of an options object.</text>
</svg>
