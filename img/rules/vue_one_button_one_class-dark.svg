<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="351" viewBox="0 0 1200 351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="351" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">One button, one class</text>
<text x="48" y="108" fill="#92958c" font-size="22">a kind of button is one class, not a set assembled at each use</text>
<rect x="60" y="170" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="207" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="btn btn-green btn-lg"</text>
<text x="80" y="237" fill="#ff937c" font-size="17">✗ a button assembled from classes</text>
<rect x="580" y="170" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="207" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="button-green"</text>
<text x="600" y="237" fill="#72d39c" font-size="17">✓ one class says the whole button</text>
<line x1="506" y1="210.5" x2="572" y2="210.5" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="311" fill="#92958c" font-size="21">Change the green button once, in its class, and every one follows.</text>
</svg>
