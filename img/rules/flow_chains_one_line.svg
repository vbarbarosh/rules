<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="576" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Reduce and chains only on one line</text>
<text x="48" y="108" fill="#686a61" font-size="22">a chain that fits one line stays; a longer one becomes a loop</text>
<rect x="60" y="150" width="1080" height="79.30000000000001" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="183.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const total = prices.reduce((a, v) =&gt; a + v, 0);</text>
<text x="78" y="215.3" fill="#1a7443" font-size="17">✓ one line: kept as it is</text>
<rect x="60" y="270" width="500" height="216.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="270" width="500" height="216.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="303.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const total = items</text>
<text x="121.2" y="330.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.filter(v =&gt; v.active)</text>
<text x="121.2" y="357.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.map(v =&gt; v.price)</text>
<text x="121.2" y="384.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.reduce((a, v) =&gt; a + v, 0);</text>
<text x="78" y="470.3" fill="#b2341f" font-size="17">✗ a pipeline over four lines</text>
<text x="658.0" y="303.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">let total = 0;</text>
<text x="658.0" y="330.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (const item of items) {</text>
<text x="701.2" y="357.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">if (item.active) {</text>
<text x="744.4" y="384.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">total += item.price;</text>
<text x="701.2" y="411.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="658.0" y="438.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="658" y="470.3" fill="#1a7443" font-size="17">✓ a loop, step by step</text>
<line x1="566" y1="378.15" x2="632" y2="378.15" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="540" fill="#686a61" font-size="21">If the expression does not fit one line, write the loop.</text>
</svg>
