<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Name a handler by event and button text</text>
<text x="48" y="108" fill="#92958c" font-size="22">the event first, then the words on the button</text>
<rect x="60" y="180" width="220" height="64" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="170" y="220" fill="#d3d1c9" font-size="20" text-anchor="middle">Approve</text>
<line x1="286" y1="212" x2="374" y2="212" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="380" y="170" width="420" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="590.0" y="208.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">click_approve</text>
<text x="590.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">the event, then the button text</text>
<rect x="60" y="300" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="337" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="handle_click"</text>
<text x="80" y="367" fill="#ff937c" font-size="17">✗ says nothing of the button</text>
<rect x="580" y="300" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="337" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="click_approve"</text>
<text x="600" y="367" fill="#72d39c" font-size="17">✓ click, then Approve</text>
<line x1="506" y1="340.5" x2="574" y2="340.5" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="440" fill="#92958c" font-size="21">The handler is found from the screen: read the button, know the name.</text>
</svg>
