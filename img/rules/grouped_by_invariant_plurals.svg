<text x="80" y="300" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">fish_grouped_by_tank[tank]</text>
<line x1="586" y1="292" x2="652" y2="292" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
