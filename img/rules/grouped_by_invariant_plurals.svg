<rect x="744" y="270" width="34" height="44" rx="5" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="800" y="300" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Fish[]</text>
<rect x="60" y="370" width="480" height="76" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="300.0" y="403" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">data_by_source</text>
<text x="300.0" y="430" fill="#686a61" font-size="17" text-anchor="middle">✗ cannot say one or many</text>
<rect x="660" y="370" width="480" height="76" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="900.0" y="403" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">rows_by_source</text>
<text x="900.0" y="430" fill="#686a61" font-size="17" text-anchor="middle">✓ a countable noun says it</text>
<line x1="546" y1="408" x2="652" y2="408" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="530" fill="#686a61" font-size="21">Where a countable noun exists, its plural says it and grouped is not needed.</text>
