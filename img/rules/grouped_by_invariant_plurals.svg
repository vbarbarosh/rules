<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">"Grouped by" only for invariant plurals</text>
<text x="48" y="108" fill="#686a61" font-size="22">fish, data, series cannot show one or many, so grouped says it</text>
<rect x="60" y="170" width="520" height="64" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="210" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">fish_by_tank[tank]</text>
<line x1="586" y1="202" x2="654" y2="202" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="180" width="34" height="44" rx="5" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="716" y="210" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Fish</text>
<rect x="60" y="260" width="520" height="64" rx="8" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="300" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">fish_grouped_by_tank[tank]</text>
<line x1="586" y1="292" x2="654" y2="292" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="270" width="34" height="44" rx="5" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="702" y="270" width="34" height="44" rx="5" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="744" y="270" width="34" height="44" rx="5" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="800" y="300" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Fish[]</text>
<text x="60" y="400" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">rows_by_source</text>
<text x="252.0" y="400" fill="#1a7443" font-size="18">✓ a countable noun, preferred</text>
<text x="60" y="450" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">data_by_source</text>
<text x="252.0" y="450" fill="#b2341f" font-size="18">✗ cannot say one or many</text>
<text x="48" y="530" fill="#686a61" font-size="21">Where a countable noun exists, its plural says it and grouped is not needed.</text>
</svg>
