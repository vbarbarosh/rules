<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Keep one log line under 2k UTF-8 bytes</text>
<text x="48" y="108" fill="#686a61" font-size="22">a line describes an event; it is not payload storage</text>
<rect x="60" y="170" width="300" height="50" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="80" y="202" fill="#191a17" font-size="17">an event: 120 bytes</text>
<rect x="60" y="240" width="1080" height="50" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80" y="272" fill="#191a17" font-size="17">a payload: 48 000 bytes</text>
<rect x="640" y="150" width="8" height="160" rx="2" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="660" y="168" fill="#b8650a" font-size="18" font-weight="700">2 KB</text>
<rect x="60" y="340" width="470" height="84" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="369.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">response={"items":[…48 KB…]}</text>
<text x="78" y="410" fill="#b2341f" font-size="17">✗ payload storage</text>
<rect x="670" y="340" width="470" height="84" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="369.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">response_items=3:[…] +47210</text>
<text x="688" y="410" fill="#1a7443" font-size="17">✓ counted, truncated</text>
<line x1="536" y1="382.0" x2="662" y2="382" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="480" fill="#686a61" font-size="21">Past 2 KB a line is storing data, not describing an event.</text>
</svg>
