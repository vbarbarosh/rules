<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="380" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Use for...of, not forEach</text>
<text x="48" y="108" fill="#686a61" font-size="22">forEach does not exist here</text>
<rect x="60" y="170" width="480" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78" y="204" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items.forEach(function (item) {</text>
<text x="78" y="232" fill="#b2341f" font-size="17">✗ forEach</text>
<rect x="620" y="170" width="520" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="638" y="204" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (const item of items) {</text>
<text x="638" y="232" fill="#1a7443" font-size="17">✓ for...of</text>
<line x1="546" y1="210.0" x2="614" y2="210.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="320" fill="#686a61" font-size="21">for...of can break, continue, return and await; forEach can do none of these.</text>
</svg>
