<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="640" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Scripts follow bin/templ</text>
<text x="48" y="108" fill="#686a61" font-size="22">strict mode, a temporary directory, and a message that is failed until the last line</text>
<rect x="60" y="150" width="700" height="52" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="80" y="183" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">set -o nounset -o errexit -o pipefail</text>
<text x="800" y="183" fill="#686a61" font-size="18">strict mode</text>
<rect x="60" y="240" width="700" height="52" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80" y="273" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">EXIT_MESSAGE="…failed…"</text>
<text x="800" y="273" fill="#686a61" font-size="18">failed until proven otherwise</text>
<line x1="410" y1="208" x2="410" y2="232" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="330" width="700" height="52" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="80" y="363" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">trap 'rm -rf $tempdir; echo …' EXIT</text>
<text x="800" y="363" fill="#686a61" font-size="18">the temporary directory goes</text>
<line x1="410" y1="298" x2="410" y2="322" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="420" width="700" height="52" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="80" y="453" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">…the work…</text>
<line x1="410" y1="388" x2="410" y2="412" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="510" width="700" height="52" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="80" y="543" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">EXIT_MESSAGE="…succeeded…"</text>
<text x="800" y="543" fill="#686a61" font-size="18">the last line</text>
<line x1="410" y1="478" x2="410" y2="502" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="610" fill="#686a61" font-size="21">Stopped anywhere, the script says it failed; only the last line says it succeeded.</text>
</svg>
