<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="760" fill="#fffefb"/>
<text x="48" y="64" fill="#191a17" font-size="38" font-weight="700">A script starts from bin/templ</text>
<text x="60" y="118" fill="#1a7443" font-size="22" font-weight="700">Always stays: the header and script, scriptdir, scriptname</text>
<rect x="60" y="134" width="1080" height="292" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="84" y="172" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">#!/bin/bash</text>
<text x="84" y="202" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"></text>
<text x="84" y="232" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"># http://www.gnu.org/software/bash/manual/bash.html#The-Set-Builtin</text>
<text x="84" y="262" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"># http://redsymbol.net/articles/unofficial-bash-strict-mode</text>
<text x="84" y="292" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">set -o nounset -o errexit -o pipefail</text>
<text x="84" y="322" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"></text>
<text x="84" y="352" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">script=`realpath $0`</text>
<text x="84" y="382" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">scriptdir=`dirname $script`</text>
<text x="84" y="412" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">scriptname=`basename $script`</text>
<text x="60" y="462" fill="#191a17" font-size="22" font-weight="700">Only if the script needs it</text>
<rect x="60" y="476" width="1080" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2" stroke-dasharray="7 6"/>
<text x="84" y="508" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">RED="\e[31m" GREEN="\e[32m" …</text>
<text x="1116" y="508" text-anchor="end" fill="#686a61" font-size="19">colors</text>
<rect x="60" y="538" width="1080" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2" stroke-dasharray="7 6"/>
<text x="84" y="570" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">EXIT_MESSAGE="${RED}… failed${RESET}"</text>
<text x="1116" y="570" text-anchor="end" fill="#686a61" font-size="19">an exit message</text>
<rect x="60" y="600" width="1080" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2" stroke-dasharray="7 6"/>
<text x="84" y="632" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tempdir=`mktemp -d …`; trap '…' EXIT</text>
<text x="1116" y="632" text-anchor="end" fill="#686a61" font-size="19">a temporary directory</text>
<rect x="60" y="662" width="1080" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2" stroke-dasharray="7 6"/>
<text x="84" y="694" fill="#686a61" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">echo script=$script …  (4 lines)</text>
<text x="1116" y="694" text-anchor="end" fill="#686a61" font-size="19">the template’s demo</text>
</svg>
