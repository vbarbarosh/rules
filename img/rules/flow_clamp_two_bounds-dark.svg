<text x="78" y="344" fill="#d3d1c9" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Math.max(2, Math.min(3, n))</text>
<text x="78" y="394" fill="#ff937c" font-size="17">✗ read inside out for the bounds</text>
<text x="658" y="344" fill="#d3d1c9" font-size="21" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">clamp(2, 3, n)</text>
<text x="658" y="394" fill="#72d39c" font-size="17">✓ the bounds first, the value last</text>
<line x1="566" y1="357" x2="632" y2="357" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="472" fill="#92958c" font-size="21">clamp(min, max, value) of node-helpers; a single bound stays Math.max or Math.min.</text>
