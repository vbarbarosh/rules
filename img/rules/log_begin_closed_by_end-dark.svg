<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="504" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Every begin is closed by its end</text>
<text x="48" y="108" fill="#92958c" font-size="22">the same stem, in the same group: _end_ok or _end_error</text>
<rect x="60" y="160" width="520" height="78" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="78.0" y="190.4" fill="#9db2ff" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c9k2vf3p][mp4gif_worker_begin]</text>
<text x="78.0" y="218.4" fill="#72d39c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c9k2vf3p][mp4gif_worker_end_ok] 4.512s</text>
<rect x="620" y="160" width="520" height="106" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="638.0" y="190.4" fill="#9db2ff" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c7t0xb1m][mp4gif_worker_begin]</text>
<text x="638.0" y="218.4" fill="#ff937c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c7t0xb1m][mp4gif_worker_end_error]</text>
<text x="659.6" y="246.4" fill="#ff937c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">0.884s ffmpeg exit=1</text>
<rect x="60" y="298" width="470" height="110" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="327.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c7t0xb1m][mp4gif_worker_end_ok]</text>
<text x="98.4" y="353.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">4.512s</text>
<text x="78" y="394" fill="#ff937c" font-size="17">✗ an end with no begin</text>
<rect x="670" y="298" width="470" height="110" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="327.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c7t0xb1m][mp4gif_worker_begin]</text>
<text x="688.0" y="353.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[c7t0xb1m][mp4gif_worker_end_ok] …</text>
<text x="688" y="394" fill="#72d39c" font-size="17">✓ its begin first</text>
<line x1="536" y1="353.0" x2="662" y2="353" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="464" fill="#92958c" font-size="21">Every begin has one end, so a missing end shows work that never finished.</text>
</svg>
