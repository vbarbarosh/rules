<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Nested function: brace on the same line</text>
<text x="48" y="108" fill="#92958c" font-size="22">a function inside a function keeps its brace on the declaration line</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ nested brace on its own line</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ nested brace on the line</text>
