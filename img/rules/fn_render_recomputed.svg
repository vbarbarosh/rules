<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">"render" is recomputed, never stored</text>
<text x="48" y="108" fill="#686a61" font-size="22">stored attributes are read; rendered content is made on each call</text>
<rect x="60" y="160" width="320" height="84" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="220.0" y="198.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">$this-&gt;text_color</text>
<text x="220.0" y="224.0" fill="#686a61" font-size="17" text-anchor="middle">a stored attribute</text>
<rect x="460" y="160" width="260" height="84" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="590.0" y="198.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">render_css()</text>
<text x="590.0" y="224.0" fill="#686a61" font-size="17" text-anchor="middle">on each call</text>
<rect x="800" y="160" width="340" height="84" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="970.0" y="198.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">body { color: … }</text>
<text x="970.0" y="224.0" fill="#686a61" font-size="17" text-anchor="middle">fresh every time</text>
<line x1="386" y1="202" x2="454" y2="202" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="726" y1="202" x2="794" y2="202" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="500" height="90" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="334" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$this-&gt;css = $this-&gt;render_css();</text>
<text x="80" y="374" fill="#b2341f" font-size="17">✗ stored: goes stale</text>
<rect x="640" y="300" width="500" height="90" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="660.0" y="334" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$this-&gt;render_css()</text>
<text x="660" y="374" fill="#1a7443" font-size="17">✓ called where needed</text>
<line x1="566" y1="345.0" x2="634" y2="345.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
