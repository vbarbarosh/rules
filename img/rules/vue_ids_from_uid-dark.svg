<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Ids come from uid</text>
<text x="48" y="108" fill="#92958c" font-size="22">the component instance makes the id; label and input both use it</text>
<rect x="60" y="170" width="280" height="90" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="200.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">_uid = 42</text>
<text x="200.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">this component</text>
<rect x="400" y="170" width="300" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="550.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">uid('email')</text>
<text x="550.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">in the template</text>
<rect x="760" y="170" width="380" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="950.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">'c42_email'</text>
<text x="950.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">its id</text>
<line x1="346" y1="215" x2="394" y2="215" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="706" y1="215" x2="754" y2="215" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="1080" height="84" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="332" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-label v-bind:for="uid('email')"&gt;Email:&lt;/app-label&gt;</text>
<text x="80" y="361" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;input v-bind:id="uid('email')" type="email" /&gt;</text>
<text x="48" y="460" fill="#92958c" font-size="21">A second instance, _uid 43, gets c43_email: ids never clash.</text>
</svg>
