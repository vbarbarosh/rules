<text x="800" y="420" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Node[]</text>
<text x="48" y="530" fill="#92958c" font-size="21">user is singular: one User per key; users and children are plural: a list per key.</text>
