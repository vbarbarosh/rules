<text x="80.0" y="442" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const db = {</text>
<text x="123.2" y="476" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">host: 'db',</text>
<rect x="70" y="489" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="123.2" y="510" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">pool: {min: 1, max: 9}</text>
<text x="80.0" y="544" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">};</text>
