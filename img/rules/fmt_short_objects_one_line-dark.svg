<rect x="650" y="489" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="703.2" y="510" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">pool: {min: 1, max: 9},</text>
<text x="660.0" y="544" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">};</text>
<line x1="566" y1="485.0" x2="632" y2="485" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="614" fill="#92958c" font-size="21">One line while it fits; once it must break, one field per line and a trailing comma.</text>
