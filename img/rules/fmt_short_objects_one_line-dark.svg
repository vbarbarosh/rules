<rect x="650" y="195" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const next = {uid: item.uid, index};</text>
<line x1="566" y1="259.0" x2="632" y2="259" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="394" fill="#ff937c" font-size="18" font-weight="700">✗ expanded, no trailing comma</text>
