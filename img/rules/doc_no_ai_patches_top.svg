<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">No AI patches the top half</text>
<text x="48" y="108" fill="#686a61" font-size="22">the author's words stay as the author wrote them</text>
<rect x="60" y="180" width="480" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78" y="214" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">- caching: apply to all lists</text>
<text x="78" y="242" fill="#b2341f" font-size="17">✗ the AI reworded the top half</text>
<rect x="620" y="180" width="520" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="638" y="214" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">- cache it: one bolt tightened</text>
<text x="638" y="242" fill="#1a7443" font-size="17">✓ the author's words, kept</text>
<line x1="546" y1="220.0" x2="614" y2="220.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="1080" height="80" rx="10" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="84" y="336" fill="#191a17" font-size="18" font-weight="700">the one exception</text>
<text x="84" y="364" fill="#686a61" font-size="18">the author asks, in so many words, for the top half to change</text>
<text x="48" y="460" fill="#686a61" font-size="21">What the AI wants changed up there goes to the author as a question.</text>
</svg>
