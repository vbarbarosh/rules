<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="508" viewBox="0 0 1200 508" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="508" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">No index needed: use for...of</text>
<text x="48" y="108" fill="#686a61" font-size="22">the loop hands over each item; nothing counts</text>
<rect x="60" y="170" width="110" height="60" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="115.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Ann</text>
<rect x="190" y="170" width="110" height="60" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="245.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Bo</text>
<rect x="320" y="170" width="110" height="60" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="375.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Cy</text>
<rect x="450" y="170" width="110" height="60" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="505.0" y="206.65" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">Di</text>
<text x="60" y="270" fill="#686a61" font-size="18">item, item, item, item: one at a time</text>
<rect x="60" y="310" width="500" height="108.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="310" width="500" height="108.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="343.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (let i = 0; i &lt; n; ++i) {</text>
<text x="121.2" y="370.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">send(items[i]);</text>
<text x="78" y="402.3" fill="#b2341f" font-size="17">✗ an index nobody needs</text>
<text x="658.0" y="343.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">for (const item of items) {</text>
<text x="701.2" y="370.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">send(item);</text>
<text x="658" y="402.3" fill="#1a7443" font-size="17">✓ just the item</text>
<line x1="566" y1="364.15" x2="634" y2="364.15" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="472" fill="#686a61" font-size="21">An index that is only used to fetch the item is noise.</text>
</svg>
