<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Release order: clean, bump, build, commit, tag</text>
<text x="48" y="108" fill="#92958c" font-size="22">five steps, always in this order</text>
<rect x="60" y="170" width="184" height="84" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="152.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">clean</text>
<text x="152.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">no changes</text>
<rect x="284" y="170" width="184" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="376.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bump</text>
<text x="376.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">the version</text>
<line x1="250" y1="212.0" x2="276" y2="212" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="508" y="170" width="184" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">build</text>
<text x="600.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">build/ → dist/</text>
<line x1="474" y1="212.0" x2="500" y2="212" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="732" y="170" width="184" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="824.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">commit</text>
<text x="824.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">release: v…</text>
<line x1="698" y1="212.0" x2="724" y2="212" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="956" y="170" width="184" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1048.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">tag</text>
<text x="1048.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">v1.4.2</text>
<line x1="922" y1="212.0" x2="948" y2="212" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="330" fill="#92958c" font-size="21">The tag points at the commit that holds the new dist/.</text>
</svg>
