<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="638" viewBox="0 0 1200 638" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="638" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Omit time when the runtime stamps it</text>
<text x="48" y="108" fill="#92958c" font-size="22">docker already writes a timestamp in front of every line</text>
<text x="60" y="180" fill="#92958c" font-size="19" font-weight="700">written straight to a file: the line carries its time</text>
<rect x="60" y="196" width="1080" height="50" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="78.0" y="226.4" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[2026-08-17T16:09:20.185Z][cd8e5vqp][db_query_begin] name=select_users</text>
<text x="60" y="296" fill="#92958c" font-size="19" font-weight="700">written to stdout under docker: docker adds the time</text>
<rect x="60" y="312" width="330" height="60" rx="8" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="349" fill="#92958c" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">2026-08-17T16:09:20.185Z</text>
<rect x="400" y="312" width="740" height="60" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="420" y="349" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[cd8e5vqp][db_query_begin] name=select_users</text>
<text x="225" y="400" fill="#92958c" font-size="17" text-anchor="middle">stamped by docker</text>
<text x="770" y="400" fill="#92958c" font-size="17" text-anchor="middle">written by the app</text>
<rect x="60" y="432" width="470" height="110" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="461.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">2026-08-17T16:09:20.185Z</text>
<text x="78.0" y="487.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[2026-08-17T16:09:20.185Z][cd8e5vqp]…</text>
<text x="78" y="528" fill="#ff937c" font-size="17">✗ the time twice</text>
<rect x="670" y="432" width="470" height="110" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="461.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">2026-08-17T16:09:20.185Z</text>
<text x="688.0" y="487.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[cd8e5vqp][db_query_begin] …</text>
<text x="688" y="528" fill="#72d39c" font-size="17">✓ once, from docker</text>
<line x1="536" y1="487.0" x2="664" y2="487.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="598" fill="#92958c" font-size="21">One timestamp a line: the app writes it only when nothing else does.</text>
