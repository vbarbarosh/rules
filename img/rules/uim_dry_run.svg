<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Ask the action first: a dry run</text>
<text x="48" y="108" fill="#686a61" font-size="22">every action can answer "would it work now?" without doing anything</text>
<rect x="60" y="190" width="360" height="90" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="240.0" y="231.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">can_end_chat(chat)</text>
<text x="240.0" y="257.0" fill="#686a61" font-size="17" text-anchor="middle">asked before drawing</text>
<rect x="560" y="160" width="360" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="740.0" y="201.65" fill="#191a17" font-size="19" text-anchor="middle">true: End chat shown</text>
<rect x="560" y="250" width="360" height="70" rx="10" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="740.0" y="291.65" fill="#191a17" font-size="19" text-anchor="middle">false: no End chat</text>
<line x1="426" y1="220" x2="554" y2="195" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="426" y1="250" x2="554" y2="285" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="360" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="397" fill="#191a17" font-size="19">End chat  →  "Sorry, expired"</text>
<text x="80" y="427" fill="#b2341f" font-size="17">✗ the answer comes after the click</text>
<rect x="580" y="360" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="397" fill="#191a17" font-size="19">no End chat button</text>
<text x="600" y="427" fill="#1a7443" font-size="17">✓ asked again when it can change</text>
<line x1="506" y1="400.5" x2="574" y2="400.5" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
