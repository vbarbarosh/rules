<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="633" viewBox="0 0 1200 633" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="633" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A script runs main and exports nothing</text>
<text x="48" y="108" fill="#92958c" font-size="22">it is run, not required: main is its entry</text>
<rect x="60" y="150" width="500" height="81.3" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="640" y="150" width="500" height="81.3" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="78.0" y="183.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">module.exports = main;</text>
<text x="78" y="215.3" fill="#ff937c" font-size="17">✗ a script that exports</text>
<text x="658.0" y="183.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// nothing exported</text>
<text x="658" y="215.3" fill="#72d39c" font-size="17">✓ it only runs</text>
<line x1="566" y1="190.65" x2="632" y2="190.65" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="261.3" width="1080" height="282" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="78" y="293.3" fill="#92958c" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">bin/build</text>
<rect x="74" y="311.3" width="1052" height="46" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="90" y="340.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">#!/usr/bin/env node</text>
<rect x="74" y="367.3" width="1052" height="46" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="90" y="396.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const cli = require('@vbarbarosh/node-helpers/src/cli');</text>
<rect x="74" y="423.3" width="1052" height="46" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="90" y="452.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">cli(main);</text>
<text x="1110" y="452.3" fill="#92958c" font-size="17" text-anchor="end">runs main</text>
<rect x="74" y="479.3" width="1052" height="46" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="90" y="508.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">async function main()</text>
<text x="1110" y="508.3" fill="#92958c" font-size="17" text-anchor="end">the entry</text>
<text x="48" y="597" fill="#92958c" font-size="21">A script is a verb of the project: it runs main and gives nothing away.</text>
</svg>
