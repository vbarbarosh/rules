<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="392" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Imports and includes come first</text>
<text x="48" y="108" fill="#686a61" font-size="22">the mixin brings the base; the rule overrides it</text>
<rect x="60" y="160" width="470" height="136" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.#-card</text>
<text x="118.8" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">box-sizing: border-box</text>
<text x="118.8" y="241.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">@include app-transition(…)</text>
<text x="78" y="282" fill="#b2341f" font-size="17">✗ the include last</text>
<rect x="670" y="160" width="470" height="136" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.#-card</text>
<text x="728.8" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">@include app-transition(…)</text>
<text x="728.8" y="241.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">box-sizing: border-box</text>
<text x="688" y="282" fill="#1a7443" font-size="17">✓ the include first</text>
<line x1="536" y1="228.0" x2="664" y2="228.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="352" fill="#686a61" font-size="21">@import first in a block; @include first in a rule.</text>
</svg>
