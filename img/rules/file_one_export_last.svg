<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A library module exports one public value last</text>
<text x="48" y="108" fill="#686a61" font-size="22">declared above, exported by its name at the end</text>
<rect x="60" y="150" width="640" height="282" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="78" y="182" fill="#686a61" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">items_index_by_uid.js</text>
<rect x="74" y="200" width="612" height="46" rx="6" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="90" y="229.0" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const fs = require('fs');</text>
<text x="670" y="229.0" fill="#686a61" font-size="17" text-anchor="end">requires</text>
<rect x="74" y="256" width="612" height="46" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="90" y="285.0" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function items_index_by_uid(items)</text>
<text x="670" y="285.0" fill="#686a61" font-size="17" text-anchor="end">the value</text>
<rect x="74" y="312" width="612" height="46" rx="6" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="90" y="341.0" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function uid_check(uid)</text>
<text x="670" y="341.0" fill="#686a61" font-size="17" text-anchor="end">helpers</text>
<rect x="74" y="368" width="612" height="46" rx="6" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="90" y="397.0" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">module.exports = items_index_by_uid;</text>
<text x="670" y="397.0" fill="#686a61" font-size="17" text-anchor="end">last</text>
<rect x="760" y="230" width="380" height="140" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="950.0" y="283.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">one public value</text>
<text x="950.0" y="308.0" fill="#686a61" font-size="18" text-anchor="middle">a function, a class,</text>
<text x="950.0" y="333.0" fill="#686a61" font-size="18" text-anchor="middle">configuration or data</text>
<text x="48" y="486" fill="#686a61" font-size="21">The last line says what the file gives; everything above builds it.</text>
