<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="672" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Every event carries its group uid</text>
<text x="48" y="108" fill="#686a61" font-size="22">one unit of work, one uid on all its lines</text>
<text x="60" y="180" fill="#686a61" font-size="19" font-weight="700">one request: group cd8e5vqp</text>
<rect x="60" y="196" width="180" height="50" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="150" y="228" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="196" width="560" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="270" y="228" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[http_request_begin] GET /users</text>
<rect x="60" y="256" width="180" height="50" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="150" y="288" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="256" width="560" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="270" y="288" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[db_query_begin] name=select_users</text>
<rect x="60" y="316" width="180" height="50" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="150" y="348" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="316" width="560" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="270" y="348" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[db_query_end_ok] 0.012s</text>
<rect x="60" y="376" width="180" height="50" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="150" y="408" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">[cd8e5vqp]</text>
<rect x="250" y="376" width="560" height="50" rx="8" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="270" y="408" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[http_request_end] 200 0.020s</text>
<rect x="860" y="230" width="280" height="140" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="1000.0" y="283.9" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">a group</text>
<text x="1000.0" y="307.6" fill="#686a61" font-size="17" text-anchor="middle">a request, a job,</text>
<text x="1000.0" y="331.4" fill="#686a61" font-size="17" text-anchor="middle">a cron run</text>
<rect x="60" y="466" width="470" height="110" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="495.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[http_request_begin] GET /users</text>
<text x="78" y="562" fill="#b2341f" font-size="17">✗ whose request?</text>
<rect x="670" y="466" width="470" height="110" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="495.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[cd8e5vqp][http_request_begin]</text>
<text x="688.0" y="521.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">GET /users</text>
<text x="688" y="562" fill="#1a7443" font-size="17">✓ its group named</text>
<line x1="536" y1="521.0" x2="664" y2="521.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="632" fill="#686a61" font-size="21">A grep for the uid gives the whole story of one unit of work.</text>
</svg>
