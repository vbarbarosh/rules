<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="476" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Keywords upper case, names lower case</text>
<text x="48" y="108" fill="#686a61" font-size="22">what SQL says shouts; what the schema names stays as spelled</text>
<rect x="60" y="160" width="95" height="46" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="107.5" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">SELECT</text>
<text x="107.5" y="232" fill="#686a61" font-size="17" text-anchor="middle">keyword</text>
<rect x="165" y="160" width="106" height="46" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="218.0" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">MIN(id)</text>
<text x="218.0" y="232" fill="#686a61" font-size="17" text-anchor="middle">function</text>
<rect x="281" y="160" width="52" height="46" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="307.0" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">AS</text>
<rect x="343" y="160" width="52" height="46" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="369.0" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">id</text>
<text x="369.0" y="232" fill="#686a61" font-size="17" text-anchor="middle">name</text>
<rect x="405" y="160" width="73" height="46" rx="8" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="441.5" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">FROM</text>
<rect x="488" y="160" width="192" height="46" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="584.0" y="189.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">user_identities</text>
<text x="584.0" y="232" fill="#686a61" font-size="17" text-anchor="middle">table</text>
<rect x="60" y="270" width="470" height="110" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="299.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">select min(id) as id</text>
<text x="78.0" y="325.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">from user_identities</text>
<text x="78" y="366" fill="#b2341f" font-size="17">✗ all lower case</text>
<rect x="670" y="270" width="470" height="110" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="299.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">SELECT MIN(id) AS id</text>
<text x="688.0" y="325.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">FROM user_identities</text>
<text x="688" y="366" fill="#1a7443" font-size="17">✓ keywords upper</text>
<line x1="536" y1="325.0" x2="662" y2="325" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="436" fill="#686a61" font-size="21">Tables, columns, indexes and aliases are spelled as the schema spells them.</text>
</svg>
