<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Name the result out</text>
<text x="48" y="108" fill="#92958c" font-size="22">the value a function builds and returns unchanged is out</text>
<text x="60" y="152" fill="#92958c" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function emails_from_users(users)</text>
<rect x="60" y="170" width="480" height="56" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="300.0" y="204.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">const out = [];</text>
<rect x="60" y="270" width="480" height="56" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="300.0" y="304.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">out.push(user.email);</text>
<rect x="60" y="370" width="480" height="56" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="300.0" y="404.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">return out;</text>
<line x1="300" y1="232" x2="300" y2="262" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="300" y1="332" x2="300" y2="362" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="620" y="170" width="520" height="120" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="880.0" y="225.2" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a parameter returned unchanged</text>
<text x="880.0" y="249.0" fill="#92958c" font-size="17" text-anchor="middle">keeps its own name: return user;</text>
<rect x="60" y="450" width="500" height="118" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="484" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const out = user;</text>
<text x="80.0" y="512" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return out;</text>
<text x="80" y="552" fill="#ff937c" font-size="17">✗ out for a value not built here</text>
<rect x="640" y="450" width="500" height="118" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="484" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return user;</text>
<text x="660" y="552" fill="#72d39c" font-size="17">✓ its own name</text>
<line x1="566" y1="509.0" x2="632" y2="509" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
