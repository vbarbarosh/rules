<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">"render" may return null or throw</text>
<text x="48" y="108" fill="#92958c" font-size="22">what it returns depends on whether the state makes sense</text>
<rect x="60" y="240" width="220" height="80" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="170.0" y="276.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">theme</text>
<text x="170.0" y="302.0" fill="#92958c" font-size="17" text-anchor="middle">the state</text>
<rect x="380" y="240" width="260" height="80" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="510.0" y="287.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">render_css()</text>
<line x1="286" y1="280" x2="374" y2="280" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760" y="150" width="380" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="950.0" y="186.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">'body { … }'</text>
<text x="950.0" y="212.0" fill="#92958c" font-size="17" text-anchor="middle">a theme: its CSS</text>
<line x1="646" y1="280" x2="754" y2="190" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760" y="250" width="380" height="80" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="950.0" y="286.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">null</text>
<text x="950.0" y="312.0" fill="#92958c" font-size="17" text-anchor="middle">no theme: not applicable</text>
<line x1="646" y1="280" x2="754" y2="290" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760" y="350" width="380" height="80" rx="10" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="950.0" y="386.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">throws</text>
<text x="950.0" y="412.0" fill="#92958c" font-size="17" text-anchor="middle">a broken theme: meaningless</text>
<line x1="646" y1="280" x2="754" y2="390" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="480" fill="#92958c" font-size="21">null and an exception are answers too: render never makes up content.</text>
</svg>
