<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Show the drop target; never lose the page</text>
<text x="48" y="108" fill="#686a61" font-size="22">the target lights up while files are over it; a miss does nothing</text>
<rect x="60" y="160" width="560" height="230" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<rect x="100" y="190" width="480" height="110" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="340" y="252" fill="#191a17" font-size="20" text-anchor="middle">Drop files here</text>
<rect x="330" y="326" width="170" height="44" rx="6" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="415" y="355" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">photo.jpg</text>
<rect x="700" y="190" width="440" height="80" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="920.0" y="236.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">lights up while dragging</text>
<rect x="700" y="300" width="440" height="80" rx="12" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="920.0" y="346.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">a miss beside it: ignored</text>
<rect x="60" y="420" width="440" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="456" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">dropped beside: the tab opens it</text>
<text x="80" y="486" fill="#b2341f" font-size="17">✗ the page and its work are gone</text>
<rect x="580" y="420" width="560" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="456" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">window: preventDefault on drop</text>
<text x="600" y="486" fill="#1a7443" font-size="17">✓ the page stays</text>
<line x1="506" y1="460.0" x2="572" y2="460" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
