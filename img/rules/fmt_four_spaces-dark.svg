<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Four spaces, no tabs</text>
<text x="48" y="108" fill="#92958c" font-size="22">indentation is exactly four spaces</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ a tab: its width is the editor's</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ four spaces, the same everywhere</text>
