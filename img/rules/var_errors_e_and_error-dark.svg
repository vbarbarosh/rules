<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Errors use e in arrows, error in regular handlers</text>
<text x="48" y="108" fill="#92958c" font-size="22">where the error arrives decides its name</text>
<rect x="60" y="160" width="260" height="70" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="190.0" y="201.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">an arrow</text>
<rect x="340" y="160" width="600" height="70" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="360" y="202" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">promise.catch(e =&gt; report(e));</text>
<rect x="980" y="160" width="160" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1060.0" y="202.7" fill="#d3d1c9" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">e</text>
<rect x="60" y="260" width="260" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="190.0" y="301.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a regular function</text>
<rect x="340" y="260" width="600" height="70" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="360" y="302" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">server.on('error', function (error) {</text>
<rect x="980" y="260" width="160" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1060.0" y="302.7" fill="#d3d1c9" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">error</text>
<rect x="60" y="360" width="260" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="190.0" y="401.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a catch binding</text>
<rect x="340" y="360" width="600" height="70" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="360" y="402" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">catch (error) { … }</text>
<rect x="980" y="360" width="160" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1060.0" y="402.7" fill="#d3d1c9" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">error</text>
<text x="48" y="510" fill="#92958c" font-size="21">The same at every depth; a DOM error event is an event, VAR-16.</text>
</svg>
