<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="318" viewBox="0 0 1200 318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="318" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Build strings with template literals</text>
<text x="48" y="108" fill="#92958c" font-size="22">a string built from parts is a template literal</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ + joins a string to a value</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ a template literal</text>
<rect x="60" y="180" width="500" height="56" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">'weapons/turret-' + weapon.id</text>
<rect x="640" y="180" width="500" height="56" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">`weapons/turret-${weapon.id}`</text>
<line x1="566" y1="208.0" x2="634" y2="208.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="286" fill="#92958c" font-size="21">Plain quotes stay for a string with nothing to put in it.</text>
</svg>
