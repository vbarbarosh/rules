<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">bin/configure asks everything up front</text>
<text x="48" y="108" fill="#92958c" font-size="22">every question at the very start; then the work runs to the end</text>
<text x="60" y="168" fill="#72d39c" font-size="19" font-weight="700">up front</text>
<rect x="60" y="184" width="260" height="64" rx="8" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="190" y="223" fill="#d3d1c9" font-size="18" text-anchor="middle">sudo, a choice, a key</text>
<rect x="320" y="184" width="820" height="64" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="730" y="223" fill="#d3d1c9" font-size="18" text-anchor="middle">the work, start to finish, no stops</text>
<text x="60" y="298" fill="#ff937c" font-size="19" font-weight="700">halfway</text>
<rect x="60" y="314" width="440" height="64" rx="8" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="280" y="353" fill="#d3d1c9" font-size="18" text-anchor="middle">the work</text>
<rect x="500" y="314" width="260" height="64" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="630" y="353" fill="#d3d1c9" font-size="18" text-anchor="middle">waits for a password</text>
<rect x="760" y="314" width="380" height="64" rx="8" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="950" y="353" fill="#d3d1c9" font-size="18" text-anchor="middle">the rest, after you came back</text>
<text x="48" y="460" fill="#92958c" font-size="21">Answer once at the start, then leave: the run never stops halfway.</text>
</svg>
