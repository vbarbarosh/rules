<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="620" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">A PHP reference is unset right after its last use</text>
<text x="48" y="108" fill="#686a61" font-size="22">unset() ends the second name; the value stays in $plan</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ left bound to the end</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ unset right after its last use</text>
<rect x="60" y="180" width="500" height="344" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="72" y="204" width="10" height="254" rx="5" fill="#b2341f"/>
<text x="100" y="228" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent_ref = &amp;$plan[2];</text>
<text x="100" y="272" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent_ref['steps'][] = $step;</text>
<rect x="92" y="289" width="240" height="40" rx="6" fill="none" stroke="#b2341f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="100" y="360" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$copy = $plan;</text>
<rect x="92" y="377" width="300" height="40" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="100" y="404" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$copy[2]['title'] = 'x';</text>
<text x="100" y="448" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return $plan;</text>
<text x="80" y="500" fill="#b2341f" font-size="18">✗ the copy changes $plan[2] too</text>
<rect x="640" y="180" width="500" height="344" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<rect x="652" y="204" width="10" height="125" rx="5" fill="#1a7443"/>
<text x="680" y="228" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent_ref = &amp;$plan[2];</text>
<text x="680" y="272" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$parent_ref['steps'][] = $step;</text>
<rect x="672" y="289" width="240" height="40" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="680" y="316" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">unset($parent_ref);</text>
<text x="680" y="360" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$copy = $plan;</text>
<text x="680" y="404" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">$copy[2]['title'] = 'x';</text>
<text x="680" y="448" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return $plan;</text>
<text x="660" y="500" fill="#1a7443" font-size="18">✓ the copy is a copy; $plan[2] stays</text>
<line x1="566" y1="352" x2="632" y2="352" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="580" fill="#686a61" font-size="21">At the level where it was made: after the loop, when its last use is inside one.</text>
</svg>
