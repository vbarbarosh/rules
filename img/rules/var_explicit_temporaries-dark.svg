<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Prefer explicit temporaries</text>
<text x="48" y="108" fill="#92958c" font-size="22">a name for each step, read top to bottom</text>
<rect x="60" y="160" width="500" height="146" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="194" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">send(</text>
<text x="99.2" y="222" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_report(</text>
<text x="118.4" y="250" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">rows_filter(rows, is_due)))</text>
<text x="80" y="290" fill="#ff937c" font-size="17">✗ read from the inside out</text>
<rect x="640" y="160" width="500" height="146" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="194" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const due = rows_filter(rows, is_due);</text>
<text x="660.0" y="222" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const report = format_report(due);</text>
<text x="660.0" y="250" fill="#d3d1c9" font-size="16" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">send(report);</text>
<text x="660" y="290" fill="#72d39c" font-size="17">✓ each step named</text>
<line x1="566" y1="233.0" x2="634" y2="233.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="430" fill="#92958c" font-size="21">Clarity over terseness: an intermediate variable says what the step made.</text>
</svg>
