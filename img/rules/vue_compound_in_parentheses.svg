<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Compound directive values in parentheses</text>
<text x="48" y="108" fill="#686a61" font-size="22">a simple value stays bare; one with an operator or a ternary is wrapped</text>
<rect x="60" y="160" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="197" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-if="is_a || is_b"</text>
<text x="80" y="227" fill="#b2341f" font-size="17">✗ compound, left bare</text>
<rect x="580" y="160" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="197" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-if="(is_a || is_b)"</text>
<text x="600" y="227" fill="#1a7443" font-size="17">✓ an operator: in parentheses</text>
<line x1="506" y1="200.5" x2="572" y2="200.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="261" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="298" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-bind:class="wide ? 'w' : 'n'"</text>
<text x="80" y="328" fill="#b2341f" font-size="17">✗ a ternary, left bare</text>
<rect x="580" y="261" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="298" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-bind:class="(wide ? 'w' : 'n')"</text>
<text x="600" y="328" fill="#1a7443" font-size="17">✓ a ternary: in parentheses</text>
<line x1="506" y1="301.5" x2="572" y2="301.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="362" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="399" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-if="(is_ready)"</text>
<text x="80" y="429" fill="#b2341f" font-size="17">✗ simple, wrapped</text>
<rect x="580" y="362" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="399" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-if="is_ready"</text>
<text x="600" y="429" fill="#1a7443" font-size="17">✓ one identifier: bare</text>
<line x1="506" y1="402.5" x2="572" y2="402.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="503" fill="#686a61" font-size="21">Every directive alike: v-if, v-else-if, v-show, v-on, v-bind.</text>
</svg>
