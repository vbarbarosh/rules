<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Name a handler by event and button text</text>
<text x="48" y="108" fill="#686a61" font-size="22">the event first, then the words on the button</text>
<rect x="60" y="180" width="220" height="64" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="170" y="220" fill="#191a17" font-size="20" text-anchor="middle">Approve</text>
<line x1="286" y1="212" x2="374" y2="212" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="380" y="170" width="420" height="84" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="590.0" y="208.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">click_approve</text>
<text x="590.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">the event, then the button text</text>
<rect x="60" y="300" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="337" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="handle_click"</text>
<text x="80" y="367" fill="#b2341f" font-size="17">✗ says nothing of the button</text>
<rect x="580" y="300" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="337" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">v-on:click="click_approve"</text>
<text x="600" y="367" fill="#1a7443" font-size="17">✓ click, then Approve</text>
<line x1="506" y1="340.5" x2="574" y2="340.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="440" fill="#686a61" font-size="21">The handler is found from the screen: read the button, know the name.</text>
</svg>
