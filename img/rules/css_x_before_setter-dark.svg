<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="510" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Broad before narrow</text>
<text x="48" y="108" fill="#92958c" font-size="22">the broad class leads and the narrow one corrects it</text>
