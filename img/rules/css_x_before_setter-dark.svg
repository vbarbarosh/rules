<text x="86.0" y="189.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">xm</text>
<rect x="122" y="160" width="62" height="46" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="153.0" y="189.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">ml5</text>
<rect x="400" y="160" width="740" height="46" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="420" y="189" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">margin: 0; margin-left: 5px</text>
<rect x="60" y="240" width="52" height="46" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="86.0" y="269.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">m5</text>
<rect x="122" y="240" width="62" height="46" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="153.0" y="269.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">xml</text>
<rect x="400" y="240" width="740" height="46" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="420" y="269" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">margin: 5px; margin-left: 0</text>
<rect x="60" y="330" width="470" height="84" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="359.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="ml5 xm"</text>
<text x="78" y="400" fill="#ff937c" font-size="17">✗ the reset after the setter</text>
<rect x="670" y="330" width="470" height="84" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="359.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">class="xm ml5"</text>
<text x="688" y="400" fill="#72d39c" font-size="17">✓ broad, then narrow</text>
<line x1="536" y1="372.0" x2="662" y2="372" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="470" fill="#92958c" font-size="21">Read left to right, each class narrows what the one before it set.</text>
