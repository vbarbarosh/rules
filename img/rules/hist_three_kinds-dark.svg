<text x="820" y="241.9" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">post_updated</text>
<rect x="968" y="214" width="156" height="44" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="986" y="241.9" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">post_deleted</text>
<rect x="636" y="300" width="300" height="44" rx="8" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="654" y="328.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">api2_publish_post</text>
<path d="M664 344 V398 M664 398 H700" fill="none" stroke="#92958c" stroke-width="2" stroke-linejoin="round"/>
<rect x="702" y="376" width="240" height="44" rx="8" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="720" y="404.3" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">post_updated</text>
<text x="964" y="404" fill="#92958c" font-size="18">its record</text>
<text x="48" y="508" fill="#92958c" font-size="21">One row per change in the database, named after the model: post_created.</text>
