<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">The dark theme redefines the light colors</text>
<text x="48" y="108" fill="#686a61" font-size="22">the same variables, other values, under data-theme="dark"</text>
<rect x="60" y="160" width="520" height="142" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="80" y="192" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">:root {</text>
<text x="104" y="221" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">--color-bg: #FFFFFF;</text>
<text x="104" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">--color-text: #1B1F23;</text>
<text x="80" y="279" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<rect x="620" y="160" width="520" height="142" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="640" y="192" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">:root[data-theme="dark"] {</text>
<text x="664" y="221" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">--color-bg: #15181C;</text>
<text x="664" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">--color-text: #E6E8EB;</text>
<text x="640" y="279" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<rect x="60" y="340" width="440" height="80" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="376" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">.dark .card { background: #222 }</text>
<text x="80" y="406" fill="#b2341f" font-size="17">✗ a second set of rules per element</text>
<rect x="580" y="340" width="560" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="376" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">--color-bg redefined once</text>
<text x="600" y="406" fill="#1a7443" font-size="17">✓ everything that reads it follows</text>
<line x1="506" y1="380.0" x2="574" y2="380.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="520" fill="#686a61" font-size="21">Light lives on :root; dark sets the same names under :root[data-theme="dark"].</text>
<rect x="480" y="207" width="28" height="22" rx="4" fill="#FFFFFF" stroke="#a19f93" stroke-width="2"/>
<rect x="480" y="236" width="28" height="22" rx="4" fill="#1B1F23" stroke="#a19f93" stroke-width="2"/>
<rect x="1040" y="207" width="28" height="22" rx="4" fill="#15181C" stroke="#a19f93" stroke-width="2"/>
<rect x="1040" y="236" width="28" height="22" rx="4" fill="#E6E8EB" stroke="#a19f93" stroke-width="2"/>
</svg>
