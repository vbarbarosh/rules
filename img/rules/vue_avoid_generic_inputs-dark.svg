<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="397" viewBox="0 0 1200 397" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="397" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Avoid generic inputs</text>
<text x="48" y="108" fill="#92958c" font-size="22">one input per kind of value, not one input with many knobs</text>
<rect x="60" y="160" width="440" height="137" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="197" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-number</text>
<text x="102.8" y="225" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">min max step</text>
<text x="102.8" y="253" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">unit precision …</text>
<text x="80" y="283" fill="#ff937c" font-size="17">✗ one input, many properties</text>
<rect x="580" y="160" width="560" height="137" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="197" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-percent /&gt;</text>
<text x="600.0" y="225" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-px /&gt;</text>
<text x="600.0" y="253" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;app-input-year /&gt;</text>
<text x="600" y="283" fill="#72d39c" font-size="17">✓ one input for each kind of value</text>
<line x1="506" y1="228.5" x2="574" y2="228.5" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="357" fill="#92958c" font-size="21">A specific input knows its range and step; the call site sets nothing.</text>
</svg>
