<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">format_* returns — it never prints</text>
<text x="48" y="108" fill="#686a61" font-size="22">it hands back the text; the caller decides where it goes</text>
<rect x="60" y="160" width="300" height="120" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="210.0" y="216.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">format_tree(tree)</text>
<text x="210.0" y="242.0" fill="#686a61" font-size="17" text-anchor="middle">returns a string</text>
<rect x="440" y="160" width="260" height="120" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="470" y="196" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">root</text>
<text x="470" y="226" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">├─ a</text>
<text x="470" y="256" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">└─ b</text>
<rect x="780" y="160" width="360" height="120" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="960.0" y="216.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">console.log(text)</text>
<text x="960.0" y="242.0" fill="#686a61" font-size="17" text-anchor="middle">the caller prints</text>
<line x1="366" y1="220" x2="434" y2="220" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="706" y1="220" x2="774" y2="220" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="330" width="500" height="90" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="364" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">format_tree() { console.log(…) }</text>
<text x="80" y="404" fill="#b2341f" font-size="17">✗ prints: the caller's job</text>
<rect x="640" y="330" width="500" height="90" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="660.0" y="364" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">console.log(format_tree(tree));</text>
<text x="660" y="404" fill="#1a7443" font-size="17">✓ returns, the caller prints</text>
<line x1="566" y1="375.0" x2="634" y2="375.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
