<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">tests/ drives the whole program</text>
<text x="48" y="108" fill="#92958c" font-size="22">a suite such as playwright works the app as a user would</text>
<rect x="60" y="170" width="320" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="220.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">tests/</text>
<text x="220.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">playwright suites</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">a browser</text>
<text x="600.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">clicks and types</text>
<line x1="386" y1="212.0" x2="434" y2="212.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="820" y="170" width="320" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="980.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">the whole app</text>
<text x="980.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">running, end to end</text>
<line x1="766" y1="212.0" x2="814" y2="212.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="330" fill="#92958c" font-size="21">Unit tests sit beside their files; tests/ is for suites that run the whole program.</text>
