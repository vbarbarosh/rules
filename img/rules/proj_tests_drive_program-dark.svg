<text x="220.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">playwright suites</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">a browser</text>
<text x="600.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">clicks and types</text>
