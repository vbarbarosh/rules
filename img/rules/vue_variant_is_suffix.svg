<text x="480" y="178" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">badge-in-progress-sm</text>
<rect x="480" y="200" width="160" height="44" rx="22" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="560" y="228" fill="#191a17" font-size="17" text-anchor="middle">In progress</text>
