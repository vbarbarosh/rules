<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="580" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A URL ends its sentence bare</text>
<text x="48" y="108" fill="#92958c" font-size="22">no full stop after a bare URL: a viewer may take it into the link</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ a full stop after the URL</text>
<rect x="60" y="180" width="1080" height="120" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="76" y="196" width="650" height="88" rx="8" fill="#16181b" stroke="#2c3035" stroke-width="2"/>
<text x="96" y="248" fill="#d3d1c9" font-size="22">See <tspan fill="#9db2ff" text-decoration="underline">https://example.com/docs.</tspan> Read it first.</text>
<line x1="732" y1="240" x2="806" y2="240" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="814" y="196" width="310" height="88" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<rect x="826" y="206" width="286" height="34" rx="6" fill="#16181b" stroke="#2c3035" stroke-width="2"/>
<text x="838" y="229" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">example.com/docs.</text>
<text x="838" y="268" fill="#ff937c" font-size="19" font-weight="700">404 · no such page</text>
<text x="60" y="348" fill="#72d39c" font-size="18" font-weight="700">✓ the URL ends bare; the next sentence starts a paragraph</text>
<rect x="60" y="360" width="1080" height="140" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="76" y="376" width="650" height="108" rx="8" fill="#16181b" stroke="#2c3035" stroke-width="2"/>
<text x="96" y="418" fill="#d3d1c9" font-size="22">See <tspan fill="#9db2ff" text-decoration="underline">https://example.com/docs</tspan></text>
<text x="96" y="462" fill="#d3d1c9" font-size="22">Read it first.</text>
<line x1="732" y1="430" x2="806" y2="430" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="814" y="386" width="310" height="88" rx="8" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<rect x="826" y="396" width="286" height="34" rx="6" fill="#16181b" stroke="#2c3035" stroke-width="2"/>
<text x="838" y="419" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">example.com/docs</text>
<text x="838" y="458" fill="#72d39c" font-size="19" font-weight="700">the page opens</text>
<text x="48" y="548" fill="#92958c" font-size="21">The URL is the sentence's last word, with nothing after it; a [name](url) link keeps its full stop.</text>
</svg>
