<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="470" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">time0 for measurement; paired names for other roles</text>
<text x="48" y="108" fill="#92958c" font-size="22">a measurement starts at time0; a range has its two ends</text>
<rect x="60" y="160" width="500" height="90" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="194" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const start = Date.now();</text>
<text x="80" y="234" fill="#ff937c" font-size="17">✗ begin, start, t0: not a measurement</text>
<rect x="640" y="160" width="500" height="90" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="660.0" y="194" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const time0 = Date.now();</text>
<text x="660" y="234" fill="#72d39c" font-size="17">✓ time0 measures</text>
<line x1="566" y1="205.0" x2="632" y2="205" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="300" fill="#92958c" font-size="18">a range with two ends, both used</text>
<rect x="60" y="316" width="540" height="88" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="80" y="350" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const start = range.start;</text>
<text x="80" y="380" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const finish = range.finish;</text>
<rect x="660" y="316" width="220" height="88" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="770.0" y="366.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">start / finish</text>
<rect x="920" y="316" width="220" height="88" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1030.0" y="366.65" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">begin / end</text>
</svg>
