<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="480" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Init is the first refresh</text>
<text x="48" y="108" fill="#686a61" font-size="22">mounting the component is its first refresh, nothing more</text>
<rect x="60" y="180" width="220" height="80" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="170.0" y="216.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">mounted</text>
<text x="170.0" y="242.0" fill="#686a61" font-size="17" text-anchor="middle">the component</text>
<rect x="360" y="180" width="340" height="80" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="530.0" y="216.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">await this.refresh()</text>
<text x="530.0" y="242.0" fill="#686a61" font-size="17" text-anchor="middle">the same as later</text>
<rect x="780" y="180" width="360" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="960.0" y="216.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">this.ready = true</text>
<text x="960.0" y="242.0" fill="#686a61" font-size="17" text-anchor="middle">then it shows</text>
<line x1="286" y1="220" x2="354" y2="220" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="706" y1="220" x2="774" y2="220" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="400" fill="#686a61" font-size="21">No separate init: what loads first is what reloads later.</text>
</svg>
