<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">build/ is never committed; dist/ is the release</text>
<text x="48" y="108" fill="#92958c" font-size="22">one build; the release copies it into dist/ and commits that</text>
<rect x="60" y="170" width="320" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="220.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/build</text>
<text x="220.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">the one build</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">build/</text>
<text x="600.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">never committed</text>
<line x1="386" y1="212.0" x2="432" y2="212" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="820" y="220" fill="#92958c" font-size="19">reproducible at any time</text>
<rect x="60" y="320" width="320" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="220.0" y="358.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">bin/release</text>
<text x="220.0" y="384.0" fill="#92958c" font-size="17" text-anchor="middle">runs bin/build</text>
<rect x="440" y="320" width="320" height="84" rx="10" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="358.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">build/</text>
<text x="600.0" y="384.0" fill="#92958c" font-size="17" text-anchor="middle">copied</text>
<line x1="386" y1="362.0" x2="432" y2="362" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="820" y="320" width="320" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="980.0" y="358.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">dist/</text>
<text x="980.0" y="384.0" fill="#92958c" font-size="17" text-anchor="middle">committed, the release</text>
<line x1="766" y1="362.0" x2="812" y2="362" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="500" fill="#92958c" font-size="21">dist/ changes only when a release is made, and only by bin/release.</text>
</svg>
