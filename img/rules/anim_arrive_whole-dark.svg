<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<style>
.q09a-in { animation: q09a-in 3.6s ease-in-out -3.6s infinite alternate; }
@keyframes q09a-in { 0%,15% { transform: translate(0px, -120px); opacity: 0; } 55%,100% { transform: translate(0px, 0px); opacity: 1; } }
.q09a-grow { animation: q09a-grow 3.6s linear -3.6s infinite alternate; }
@keyframes q09a-grow { 0%,62% { height: 40px; } 66%,100% { height: 78px; } }
.q09a-fill { animation: q09a-fill 3.6s linear -3.6s infinite alternate; }
@keyframes q09a-fill { 0%,74% { opacity: 0; } 78%,100% { opacity: 1; } }
.q09a-push { animation: q09a-push 3.6s linear -3.6s infinite alternate; }
@keyframes q09a-push { 0%,15% { transform: translate(0px, 0px); } 55%,62% { transform: translate(0px, 48px); } 66%,100% { transform: translate(0px, 86px); } }
.q09a-pushok { animation: q09a-pushok 3.6s ease-in-out -3.6s infinite alternate; }
@keyframes q09a-pushok { 0%,15% { transform: translate(0px, 0px); } 55%,100% { transform: translate(0px, 86px); } }

</style>
<rect width="720" height="300" fill="#16181b"/>
<text x="20" y="32" fill="#ff937c" font-size="19" font-weight="700">✗ Jumps, then fills in</text>
<rect x="16" y="46" width="336" height="238" rx="10" fill="#202328" stroke="#3a3f46" stroke-width="1.5"/>
