<text x="980.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">the whole app</text>
<text x="980.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">running, end to end</text>
<line x1="766" y1="212.0" x2="814" y2="212.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="330" fill="#686a61" font-size="21">Unit tests sit beside their files; tests/ is for suites that run the whole program.</text>
