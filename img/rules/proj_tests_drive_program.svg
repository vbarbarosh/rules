<text x="220.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">playwright suites</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">a browser</text>
<text x="600.0" y="234.0" fill="#686a61" font-size="17" text-anchor="middle">clicks and types</text>
<line x1="386" y1="212.0" x2="434" y2="212.0" stroke="#2743b8" stroke-width="4" marker-end="url(#arrow)"/>
