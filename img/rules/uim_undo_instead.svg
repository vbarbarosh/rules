<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Undo instead</text>
<text x="48" y="108" fill="#686a61" font-size="22">the way back is right there after the action, not a question before it</text>
<rect x="60" y="160" width="440" height="109" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="197" fill="#191a17" font-size="19">Delete "notes.md"?</text>
<text x="80.0" y="225" fill="#191a17" font-size="19">[OK]  [Cancel]</text>
<text x="80" y="255" fill="#b2341f" font-size="17">✗ a question before every delete</text>
<rect x="580" y="160" width="560" height="109" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="197" fill="#191a17" font-size="19">Deleted  ·  Undo</text>
<text x="600" y="255" fill="#1a7443" font-size="17">✓ the way back, right after</text>
<line x1="506" y1="214.5" x2="574" y2="214.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="289" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="326" fill="#191a17" font-size="19">Renamed. No way back.</text>
<text x="80" y="356" fill="#b2341f" font-size="17">✗ a slip costs work</text>
<rect x="580" y="289" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="326" fill="#191a17" font-size="19">Renamed  ·  Undo</text>
<text x="600" y="356" fill="#1a7443" font-size="17">✓ rename, edit, move: undoable</text>
<line x1="506" y1="329.5" x2="574" y2="329.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="430" fill="#686a61" font-size="21">A deleted thing goes to a trash; nothing asks "are you sure?".</text>
</svg>
