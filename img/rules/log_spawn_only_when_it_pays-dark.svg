<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="512" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Spawn a group only when it pays</text>
<text x="48" y="108" fill="#92958c" font-size="22">a group costs at least three lines</text>
<rect x="60" y="160" width="470" height="136" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][group_spawn] parent=aaa</text>
<text x="78.0" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][process_begin]</text>
<text x="78.0" y="241.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[bbb][process_end_ok] 0.000s</text>
<text x="78" y="282" fill="#ff937c" font-size="17">✗ three lines of noise</text>
<rect x="670" y="160" width="470" height="136" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_begin]</text>
<text x="688.0" y="215.6" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[aaa][process_end_ok] 0.000s</text>
<text x="688" y="282" fill="#72d39c" font-size="17">✓ on the caller's group</text>
<line x1="536" y1="228.0" x2="664" y2="228.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="336" width="1080" height="80" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="600.0" y="371.2" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a group earns its lines</text>
<text x="600.0" y="395.0" fill="#92958c" font-size="17" text-anchor="middle">seconds of work, or many logging call sites</text>
<text x="48" y="472" fill="#92958c" font-size="21">For one short call, the caller's group is enough.</text>
</svg>
