<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">"render" may return null or throw</text>
<text x="48" y="108" fill="#686a61" font-size="22">what it returns depends on whether the state makes sense</text>
<rect x="60" y="240" width="220" height="80" rx="10" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="170.0" y="276.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">theme</text>
<text x="170.0" y="302.0" fill="#686a61" font-size="17" text-anchor="middle">the state</text>
<rect x="380" y="240" width="260" height="80" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="510.0" y="287.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">render_css()</text>
<line x1="286" y1="280" x2="372" y2="280" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760" y="150" width="380" height="80" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="950.0" y="186.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">'body { … }'</text>
<text x="950.0" y="212.0" fill="#686a61" font-size="17" text-anchor="middle">a theme: its CSS</text>
<line x1="646" y1="280" x2="752.46" y2="191.28" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760" y="250" width="380" height="80" rx="10" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="950.0" y="286.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">null</text>
<text x="950.0" y="312.0" fill="#686a61" font-size="17" text-anchor="middle">no theme: not applicable</text>
<line x1="646" y1="280" x2="752.01" y2="289.82" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="760" y="350" width="380" height="80" rx="10" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="950.0" y="386.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">throws</text>
<text x="950.0" y="412.0" fill="#686a61" font-size="17" text-anchor="middle">a broken theme: meaningless</text>
<line x1="646" y1="280" x2="752.6" y2="388.57" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="480" fill="#686a61" font-size="21">null and an exception are answers too: render never makes up content.</text>
</svg>
