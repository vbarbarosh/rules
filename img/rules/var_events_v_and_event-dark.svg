<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Events use v in arrows, event in regular functions</text>
<text x="48" y="108" fill="#92958c" font-size="22">an event is a value, even an error event; e stays for errors</text>
<rect x="60" y="160" width="260" height="70" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="190.0" y="201.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">an arrow</text>
<rect x="340" y="160" width="620" height="70" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="360" y="202" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">el.addEventListener('click', v =&gt; …);</text>
<rect x="990" y="160" width="150" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1065.0" y="202.7" fill="#d3d1c9" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">v</text>
<rect x="60" y="260" width="260" height="70" rx="12" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="190.0" y="301.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">an error event too</text>
<rect x="340" y="260" width="620" height="70" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="360" y="302" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">el.addEventListener('error', v =&gt; …);</text>
<rect x="990" y="260" width="150" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1065.0" y="302.7" fill="#d3d1c9" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">v</text>
<rect x="60" y="360" width="260" height="70" rx="12" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="190.0" y="401.7" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">a regular function</text>
<rect x="340" y="360" width="620" height="70" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="360" y="402" fill="#d3d1c9" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">el.addEventListener('error', function (event) {</text>
<rect x="990" y="360" width="150" height="70" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="1065.0" y="402.7" fill="#d3d1c9" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">event</text>
<text x="48" y="510" fill="#92958c" font-size="21">e names an error value in an arrow; an event is v or event, whatever its type.</text>
</svg>
