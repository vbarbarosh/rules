<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="380" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A layout and its gap share a class value</text>
<text x="48" y="108" fill="#92958c" font-size="22">the gap belongs to the layout: they come and go together</text>
<rect x="60" y="170" width="480" height="80" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="78" y="204" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[ready &amp;&amp; 'flex-row', 'gap5']</text>
<text x="78" y="232" fill="#ff937c" font-size="17">✗ the gap stays without its layout</text>
<rect x="620" y="170" width="520" height="80" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="638" y="204" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">[ready &amp;&amp; 'flex-row gap5']</text>
<text x="638" y="232" fill="#72d39c" font-size="17">✓ one value: both or neither</text>
<line x1="546" y1="210.0" x2="614" y2="210.0" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="320" fill="#92958c" font-size="21">gap closes the layout group: container, its flex-* modifiers, then the gap.</text>
</svg>
