<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="600" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Imports first: side effects, defaults, named</text>
<text x="48" y="108" fill="#686a61" font-size="22">one statement a line, in up to three blocks, at the top of the file</text>
<rect x="60" y="160" width="620" height="86" rx="10" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="78" y="194" fill="#b8650a" font-size="18" font-weight="700">1  side effects, in the order they run</text>
<text x="78.0" y="224" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">require('./polyfills');</text>
<rect x="60" y="262" width="620" height="116" rx="10" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="78" y="296" fill="#2743b8" font-size="18" font-weight="700">2  default imports, sorted</text>
<text x="78.0" y="326" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const fs = require('fs');</text>
<text x="78.0" y="356" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const path = require('path');</text>
<rect x="60" y="394" width="620" height="86" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78" y="428" fill="#1a7443" font-size="18" font-weight="700">3  named imports, sorted</text>
<text x="78.0" y="458" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const {foo, bar} = require('./x');</text>
<rect x="800" y="250" width="340" height="130" rx="12" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="970.0" y="298.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">one blank line</text>
<text x="970.0" y="323.0" fill="#686a61" font-size="18" text-anchor="middle">may separate</text>
<text x="970.0" y="348.0" fill="#686a61" font-size="18" text-anchor="middle">the blocks</text>
<text x="48" y="550" fill="#686a61" font-size="21">The side effects are not sorted: moving one may change what runs first.</text>
</svg>
