<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="34" font-weight="700">A glossary keeps the author's terms; the AI explains below them</text>
<text x="48" y="108" fill="#686a61" font-size="22">everything before the first ## section is the author's</text>
<rect x="60" y="170" width="620" height="150" rx="0" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="76" y="198" fill="#686a61" font-size="17" font-weight="700">the author's: never rewritten</text>
<text x="76" y="228" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"># Testing (TEST)</text>
<text x="76" y="256" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">- Flaky Test – passes, then fails</text>
<text x="76" y="284" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">- Safety net – what catches it</text>
<rect x="60" y="320" width="620" height="120" rx="0" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="76" y="348" fill="#686a61" font-size="17" font-weight="700">the AI's: one section a term</text>
<text x="76" y="378" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">## Flaky Test</text>
<text x="76" y="406" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">Regenerated from the author's line.</text>
<rect x="800" y="200" width="340" height="90" rx="12" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="970.0" y="240.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">title, note, groups</text>
<text x="970.0" y="265.0" fill="#686a61" font-size="18" text-anchor="middle">and the term list</text>
<rect x="800" y="335" width="340" height="90" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="970.0" y="375.0" fill="#191a17" font-size="20" text-anchor="middle" font-weight="700">each ## section</text>
<text x="970.0" y="400.0" fill="#686a61" font-size="18" text-anchor="middle">explains one term</text>
<line x1="794" y1="245" x2="686" y2="245" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="794" y1="380" x2="686" y2="380" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="510" fill="#686a61" font-size="21">The author's line for a term is the source of its section.</text>
</svg>
