<text x="90" y="229.0" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function items_index_by_uid(items)</text>
<text x="670" y="229.0" fill="#92958c" font-size="17" text-anchor="end">entry</text>
<rect x="74" y="256" width="612" height="46" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
