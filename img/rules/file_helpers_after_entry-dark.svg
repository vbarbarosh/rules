<text x="670" y="285.0" fill="#92958c" font-size="17" text-anchor="end">helper</text>
<rect x="74" y="312" width="612" height="46" rx="6" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="90" y="341.0" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function uid_normalize(uid)</text>
