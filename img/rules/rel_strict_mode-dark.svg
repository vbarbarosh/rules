<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">A release script runs under bash strict mode</text>
<text x="48" y="108" fill="#92958c" font-size="22">each flag stops the script at a fault instead of going on</text>
<rect x="60" y="170" width="340" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="230.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">nounset</text>
<text x="230.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">stops on an unset variable</text>
<rect x="430" y="170" width="340" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="600.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">errexit</text>
<text x="600.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">stops on a failing command</text>
<rect x="800" y="170" width="340" height="90" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="970.0" y="211.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">pipefail</text>
<text x="970.0" y="237.0" fill="#92958c" font-size="17" text-anchor="middle">stops on a failure in a pipe</text>
<rect x="60" y="300" width="1080" height="52.0" rx="10" fill="#0b0c0e" stroke="#2c3035" stroke-width="2"/>
<text x="80.0" y="336.0" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">set -o nounset -o errexit -o pipefail</text>
<text x="48" y="450" fill="#92958c" font-size="21">A release that half ran is worse than one that stopped.</text>
</svg>
