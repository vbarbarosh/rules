<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Select the first actionable item by default</text>
<text x="48" y="108" fill="#686a61" font-size="22">Enter acts on the first item shown, until the user picks another</text>
<rect x="60" y="160" width="420" height="200" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<rect x="76" y="176" width="388" height="48" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="96" y="207" fill="#191a17" font-size="19">SQLite</text>
<rect x="76" y="234" width="388" height="48" rx="6" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="96" y="265" fill="#191a17" font-size="19">LinkedIn</text>
<rect x="76" y="292" width="388" height="48" rx="6" fill="#e8e5d9" stroke="#d9d5c7" stroke-width="2"/>
<text x="96" y="323" fill="#191a17" font-size="19">Postgres</text>
<line x1="486" y1="200" x2="594" y2="200" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="600" y="165" width="300" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="750.0" y="206.65" fill="#191a17" font-size="19" text-anchor="middle">Enter opens SQLite</text>
<text x="600" y="300" fill="#686a61" font-size="18">filtered to "link": LinkedIn is first</text>
<text x="600" y="336" fill="#686a61" font-size="18">an empty list: no action</text>
<rect x="60" y="400" width="440" height="81" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="437" fill="#191a17" font-size="19">nothing selected</text>
<text x="80" y="467" fill="#b2341f" font-size="17">✗ Enter does nothing</text>
<rect x="580" y="400" width="560" height="81" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="600.0" y="437" fill="#191a17" font-size="19">the first item selected</text>
<text x="600" y="467" fill="#1a7443" font-size="17">✓ Enter opens it</text>
<line x1="506" y1="440.5" x2="574" y2="440.5" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
