<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="500" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Ship a prebuilt dist/</text>
<text x="48" y="108" fill="#92958c" font-size="22">the repository carries the built files; a user loads them as they are</text>
<rect x="60" y="170" width="320" height="84" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="220.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">dist/vue.js</text>
<text x="220.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">in the repository</text>
<rect x="440" y="170" width="320" height="84" rx="10" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="600.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">unpkg.com</text>
<text x="600.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">serves it</text>
<line x1="386" y1="212.0" x2="434" y2="212.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="820" y="170" width="320" height="84" rx="10" fill="#1d2024" stroke="#4a4f57" stroke-width="2"/>
<text x="980.0" y="208.0" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">&lt;script src&gt;</text>
<text x="980.0" y="234.0" fill="#92958c" font-size="17" text-anchor="middle">no build needed</text>
<line x1="766" y1="212.0" x2="814" y2="212.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="330" fill="#92958c" font-size="21">As Vue, jQuery, Bootstrap and Axios do: the release is ready to load.</text>
</svg>
