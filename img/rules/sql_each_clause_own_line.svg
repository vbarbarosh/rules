<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="418" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Each clause on its own line</text>
<text x="48" y="108" fill="#686a61" font-size="22">the clause on a line; what it takes on the next, four spaces in</text>
<rect x="60" y="160" width="470" height="162" rx="8" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="78.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">CREATE UNIQUE INDEX user_ids_unique</text>
<text x="78.0" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ON user_identities (primary_user_id)</text>
<text x="78" y="308" fill="#b2341f" font-size="17">✗ clauses run on</text>
<rect x="670" y="160" width="470" height="162" rx="8" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="688.0" y="189.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">CREATE UNIQUE INDEX</text>
<text x="728.8" y="215.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_ids_unique</text>
<text x="688.0" y="241.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">ON</text>
<text x="728.8" y="267.6" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">user_identities (primary_user_id)</text>
<text x="688" y="308" fill="#1a7443" font-size="17">✓ a clause, then its operand</text>
<line x1="536" y1="241.0" x2="664" y2="241.0" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="378" fill="#686a61" font-size="21">A keyword of several words, CREATE UNIQUE INDEX, stays on one line.</text>
</svg>
