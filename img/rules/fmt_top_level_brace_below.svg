<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="420" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Top-level function: brace on the next line</text>
<text x="48" y="108" fill="#686a61" font-size="22">the declaration, then the brace on a line of its own</text>
<text x="60" y="168" fill="#b2341f" font-size="18" font-weight="700">✗ brace on the declaration line</text>
<text x="640" y="168" fill="#1a7443" font-size="18" font-weight="700">✓ brace on the next line</text>
<rect x="60" y="180" width="500" height="158" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#fbeedb" stroke="#b8650a" stroke-width="2"/>
<text x="80.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function main() {</text>
<text x="123.2" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">report_print();</text>
<text x="80.0" y="284" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<rect x="640" y="180" width="500" height="158" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="660.0" y="216" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">function main()</text>
<rect x="650" y="229" width="480" height="32" rx="6" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="660.0" y="250" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">{</text>
<text x="703.2" y="284" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">report_print();</text>
<text x="660.0" y="318" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<line x1="566" y1="259.0" x2="632" y2="259" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="388" fill="#686a61" font-size="21">At the top level the brace stands alone, so each function starts the same way.</text>
</svg>
