<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="455" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Imports form one unbroken list</text>
<text x="48" y="108" fill="#686a61" font-size="22">no groups, no comments; blocks only for side effects and named imports</text>
<rect x="60" y="150" width="500" height="215.45" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="150" width="500" height="215.45" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="182.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// packages</text>
<text x="78.0" y="209.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import Vue from 'vue';</text>
<text x="78.0" y="263.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// local</text>
<text x="78.0" y="290.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import util from './util';</text>
<text x="78" y="349.45" fill="#b2341f" font-size="17">✗ groups and comments break the sort</text>
<text x="658.0" y="182.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import './sass/main.sass';</text>
<text x="658.0" y="236.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import Vue from 'vue';</text>
<text x="658.0" y="263.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import util from './util';</text>
<text x="658.0" y="317.4" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">import {mapState} from 'vuex';</text>
<text x="658" y="349.45" fill="#1a7443" font-size="17">✓ side effects, defaults, named</text>
<line x1="566" y1="257.725" x2="634" y2="257.725" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="419" fill="#686a61" font-size="21">Two exceptions, each its own block: side-effect imports first, named imports last.</text>
</svg>
