<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="481" viewBox="0 0 1200 481" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="481" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">No do...while</text>
<text x="48" y="108" fill="#686a61" font-size="22">the condition comes first, where the loop is read</text>
<rect x="60" y="160" width="500" height="135.3" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<rect x="640" y="160" width="500" height="135.3" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="78.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">do {</text>
<text x="121.2" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">page = page_fetch(page);</text>
<text x="78.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">} while (page.more);</text>
<text x="78" y="279.3" fill="#b2341f" font-size="17">✗ the condition at the bottom</text>
<text x="658.0" y="193.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">while (page.more) {</text>
<text x="701.2" y="220.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">page = page_fetch(page);</text>
<text x="658.0" y="247.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">}</text>
<text x="658" y="279.3" fill="#1a7443" font-size="17">✓ the condition first</text>
<line x1="566" y1="227.65" x2="632" y2="227.65" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60.0" y="335.3" width="228.0" height="56" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="174.0" y="369.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">body</text>
<rect x="332.0" y="335.3" width="228.0" height="56" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="446.0" y="369.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">more?</text>
<line x1="294.0" y1="363.3" x2="324" y2="363.3" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640.0" y="335.3" width="228.0" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="754.0" y="369.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">more?</text>
<rect x="912.0" y="335.3" width="228.0" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1026.0" y="369.6" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">body</text>
<line x1="874.0" y1="363.3" x2="904" y2="363.3" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="445" fill="#686a61" font-size="21">Use while or for: do...while does not exist.</text>
</svg>
