<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Return a literal directly</text>
<text x="48" y="108" fill="#686a61" font-size="22">a value made only to be returned needs no name</text>
<rect x="60" y="160" width="500" height="118" rx="10" fill="#fbe3df" stroke="#b2341f" stroke-width="2"/>
<text x="80.0" y="194" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">const out = {a, b};</text>
<text x="80.0" y="222" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return out;</text>
<text x="80" y="262" fill="#b2341f" font-size="17">✗ a name for one line</text>
<rect x="640" y="160" width="500" height="118" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="660.0" y="194" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">return {a, b};</text>
<text x="660" y="262" fill="#1a7443" font-size="17">✓ the literal, directly</text>
<line x1="566" y1="219.0" x2="632" y2="219" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="60" y="328" fill="#686a61" font-size="18">a guard may return these at once</text>
<rect x="60" y="344" width="250" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="185.0" y="378.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">return null;</text>
<rect x="330" y="344" width="250" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="455.0" y="378.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">return false;</text>
<rect x="600" y="344" width="250" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="725.0" y="378.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">return [];</text>
<rect x="870" y="344" width="250" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="995.0" y="378.3" fill="#191a17" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">return {};</text>
<text x="48" y="520" fill="#686a61" font-size="21">A name is for a value that is built; a literal is already what it is.</text>
</svg>
