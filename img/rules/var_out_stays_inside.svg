<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="520" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#2743b8" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">out never leaves the function</text>
<text x="48" y="108" fill="#686a61" font-size="22">inside it is out; the caller names the result by what it means</text>
<rect x="60" y="160" width="460" height="200" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="290" y="196" fill="#191a17" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">emails_from_users()</text>
<rect x="200" y="228" width="180" height="56" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="290.0" y="263.0" fill="#191a17" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">out</text>
<text x="290" y="336" fill="#686a61" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">return out;</text>
<line x1="526" y1="260" x2="632" y2="260" stroke="#2743b8" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640" y="210" width="500" height="100" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="890" y="252" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">const emails = emails_from_users(users);</text>
<text x="890" y="284" fill="#686a61" font-size="17" text-anchor="middle">the caller names it: emails</text>
<text x="48" y="470" fill="#686a61" font-size="21">out is the function's own word; the name changes at the return.</text>
</svg>
