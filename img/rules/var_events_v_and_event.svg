<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#fffefb"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2743b8"/></marker></defs>
<text x="48" y="70" fill="#191a17" font-size="40" font-weight="700">Events use v in arrows, event in regular functions</text>
<text x="48" y="108" fill="#686a61" font-size="22">an event is a value, even an error event; e stays for errors</text>
<rect x="60" y="160" width="260" height="70" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="190.0" y="201.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">an arrow</text>
<rect x="340" y="160" width="620" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="202" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">el.addEventListener('click', v =&gt; …);</text>
<rect x="990" y="160" width="150" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1065.0" y="202.7" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">v</text>
<rect x="60" y="260" width="260" height="70" rx="12" fill="#e2e7fb" stroke="#2743b8" stroke-width="2"/>
<text x="190.0" y="301.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">an error event too</text>
<rect x="340" y="260" width="620" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="302" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">el.addEventListener('error', v =&gt; …);</text>
<rect x="990" y="260" width="150" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1065.0" y="302.7" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">v</text>
<rect x="60" y="360" width="260" height="70" rx="12" fill="#efece2" stroke="#a19f93" stroke-width="2"/>
<text x="190.0" y="401.7" fill="#191a17" font-size="19" text-anchor="middle" font-weight="700">a regular function</text>
<rect x="340" y="360" width="620" height="70" rx="10" fill="#f2efe5" stroke="#d9d5c7" stroke-width="2"/>
<text x="360" y="402" fill="#191a17" font-size="17" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">el.addEventListener('error', function (event) {</text>
<rect x="990" y="360" width="150" height="70" rx="10" fill="#dcefe3" stroke="#1a7443" stroke-width="2"/>
<text x="1065.0" y="402.7" fill="#191a17" font-size="22" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">event</text>
<text x="48" y="510" fill="#686a61" font-size="21">e names an error value in an arrow; an event is v or event, whatever its type.</text>
</svg>
