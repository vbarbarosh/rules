<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="560" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="7" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Opposites from the established pairs</text>
<text x="48" y="108" fill="#92958c" font-size="22">a pair is picked from the list, never made up</text>
<text x="60" y="168" fill="#ff937c" font-size="19" font-weight="700">made up</text>
<text x="480" y="168" fill="#72d39c" font-size="19" font-weight="700">established</text>
<rect x="60" y="190" width="300" height="56" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="210" y="226" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">begin / finish</text>
<rect x="480" y="190" width="300" height="56" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="630" y="226" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">begin / end</text>
<line x1="366" y1="218" x2="472" y2="218" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="266" width="300" height="56" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="210" y="302" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">create / remove</text>
<rect x="480" y="266" width="300" height="56" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="630" y="302" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">create / destroy</text>
<line x1="366" y1="294" x2="472" y2="294" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="60" y="342" width="300" height="56" rx="8" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="210" y="378" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">open / shut</text>
<rect x="480" y="342" width="300" height="56" rx="8" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="630" y="378" fill="#d3d1c9" font-size="20" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">open / close</text>
<line x1="366" y1="370" x2="472" y2="370" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="860" y="170" width="300" height="250" rx="12" fill="#212428" stroke="#2c3035" stroke-width="2"/>
<text x="1010" y="208" fill="#d3d1c9" font-size="19" text-anchor="middle" font-weight="700">the narrow ones</text>
<text x="1010" y="250" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">req / res</text>
<text x="1010" y="274" fill="#92958c" font-size="17" text-anchor="middle">Express only</text>
<text x="1010" y="308" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">res / rej</text>
<text x="1010" y="332" fill="#92958c" font-size="17" text-anchor="middle">Promise executors</text>
<text x="1010" y="366" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="middle">resolve / reject</text>
<text x="1010" y="390" fill="#92958c" font-size="17" text-anchor="middle">anywhere</text>
<text x="48" y="500" fill="#92958c" font-size="21">The list is the rule: a new pair is never invented beside it.</text>
</svg>
