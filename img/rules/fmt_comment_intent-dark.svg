<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="386" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M2 2.5 L11 6 L2 9.5 L4 6 z" fill="#9db2ff" stroke-linejoin="round"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Comment intent, not mechanics</text>
<text x="48" y="108" fill="#92958c" font-size="22">say why, not what the line already says</text>
<text x="60" y="168" fill="#ff937c" font-size="18" font-weight="700">✗ says what the code says</text>
<text x="640" y="168" fill="#72d39c" font-size="18" font-weight="700">✓ says why it is so</text>
<rect x="60" y="180" width="500" height="124" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<rect x="70" y="195" width="480" height="32" rx="6" fill="#3a2a12" stroke="#ffb257" stroke-width="2"/>
<text x="80.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// call fetch with the url</text>
<text x="80.0" y="250" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await fetch(url);</text>
<rect x="640" y="180" width="500" height="124" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<rect x="650" y="195" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="216" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// The CDN drops the first request</text>
<rect x="650" y="229" width="480" height="32" rx="6" fill="#1b2346" stroke="#9db2ff" stroke-width="2"/>
<text x="660.0" y="250" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">// after a deploy: retry once.</text>
<text x="660.0" y="284" fill="#d3d1c9" font-size="18" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">await fetch_retry(url);</text>
<line x1="566" y1="242.0" x2="634" y2="242.0" stroke="#9db2ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="354" fill="#92958c" font-size="21">The code says what it does; a comment says what the code cannot.</text>
</svg>
