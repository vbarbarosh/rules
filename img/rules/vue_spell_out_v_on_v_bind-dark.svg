<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="351" viewBox="0 0 1200 351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="1200" height="351" fill="#16181b"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db2ff"/></marker></defs>
<text x="48" y="70" fill="#d3d1c9" font-size="40" font-weight="700">Spell out v-on and v-bind</text>
<text x="48" y="108" fill="#92958c" font-size="22">the full directive names, never the : and @ shorthands</text>
<rect x="60" y="170" width="440" height="81" rx="10" fill="#3b1f22" stroke="#ff937c" stroke-width="2"/>
<text x="80.0" y="207" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;img :src="url" @click="open" /&gt;</text>
<text x="80" y="237" fill="#ff937c" font-size="17">✗ the shorthands : and @</text>
<rect x="580" y="170" width="560" height="81" rx="10" fill="#16301f" stroke="#72d39c" stroke-width="2"/>
<text x="600.0" y="207" fill="#d3d1c9" font-size="19" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">&lt;img v-bind:src="url" v-on:click="open" /&gt;</text>
<text x="600" y="237" fill="#72d39c" font-size="17">✓ v-bind: and v-on: spelled out</text>
<line x1="506" y1="210.5" x2="574" y2="210.5" stroke="#9db2ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="48" y="311" fill="#92958c" font-size="21">The full names are searchable and read the same in every file.</text>
</svg>
