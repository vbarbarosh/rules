<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<style>
.a16-pop { animation: a16-pop 3.6s linear -3.6s infinite alternate; }
@keyframes a16-pop { 0%,49% { opacity: 0; } 50%,100% { opacity: 1; } }
.a16-fade { animation: a16-fade 3.6s ease-in-out -3.6s infinite alternate; }
@keyframes a16-fade { 0%,25% { opacity: 0; } 75%,100% { opacity: 1; } }

</style>
<rect width="720" height="300" fill="#fffefb"/>
<text x="20" y="32" fill="#b2341f" font-size="19" font-weight="700">✗ Pops in and out</text>
<rect x="16" y="46" width="336" height="238" rx="10" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<g transform="translate(16 46)"><rect x="20" y="20" width="110" height="34" rx="8" fill="#efece2" stroke="#d4cbbe"/><text x="75" y="42" text-anchor="middle" fill="#191a17" font-size="16" font-weight="700">⋯ Menu</text><rect x="150" y="31" width="166" height="8" rx="4" fill="#d4cbbe"/><rect x="150" y="47" width="120" height="8" rx="4" fill="#d4cbbe"/><g class="a16-pop"><rect x="20" y="62" width="180" height="106" rx="8" fill="#e2e7fb" stroke="#2743b8"/><text x="36" y="88" fill="#191a17" font-size="16">Rename</text><text x="36" y="120" fill="#191a17" font-size="16">Move</text><text x="36" y="152" fill="#191a17" font-size="16">Delete</text></g><g class="a16-pop"><rect x="120" y="184" width="196" height="38" rx="19" fill="#fff" stroke="#1a7443"/><text x="218" y="208" text-anchor="middle" fill="#1a7443" font-size="16" font-weight="700">✓ Saved</text></g></g>
<text x="380" y="32" fill="#1a7443" font-size="19" font-weight="700">✓ Fades in and out</text>
<rect x="368" y="46" width="336" height="238" rx="10" fill="#f6f3ec" stroke="#d4cbbe" stroke-width="1.5"/>
<g transform="translate(368 46)"><rect x="20" y="20" width="110" height="34" rx="8" fill="#efece2" stroke="#d4cbbe"/><text x="75" y="42" text-anchor="middle" fill="#191a17" font-size="16" font-weight="700">⋯ Menu</text><rect x="150" y="31" width="166" height="8" rx="4" fill="#d4cbbe"/><rect x="150" y="47" width="120" height="8" rx="4" fill="#d4cbbe"/><g class="a16-fade"><rect x="20" y="62" width="180" height="106" rx="8" fill="#e2e7fb" stroke="#2743b8"/><text x="36" y="88" fill="#191a17" font-size="16">Rename</text><text x="36" y="120" fill="#191a17" font-size="16">Move</text><text x="36" y="152" fill="#191a17" font-size="16">Delete</text></g><g class="a16-fade"><rect x="120" y="184" width="196" height="38" rx="19" fill="#fff" stroke="#1a7443"/><text x="218" y="208" text-anchor="middle" fill="#1a7443" font-size="16" font-weight="700">✓ Saved</text></g></g>
</svg>
